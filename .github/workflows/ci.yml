name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type and content checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build the site
        run: npm run build
      - name: No chapter lost text in migration
        run: npm run verify:migration
      - name: Links inside the site
        run: npm run verify:links
      - name: Install a browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (progress, review, planner, search, accessibility, Python runner)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 3

  examples:
    # Runs every code example in the chapters (see tests/examples/harness.py).
    # Package installs and the Docker example run here too; the PyTorch and
    # model-download examples run weekly in examples-heavy.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/examples/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # PGlite (for the postgres examples) comes from the project's npm packages.
      - run: npm ci
      - run: pip install -r tests/examples/requirements.txt
      - name: Chapter code examples
        run: python -m pytest tests/examples -q -rs
        env:
          EXAMPLES_NETWORK: "1"
          EXAMPLES_DOCKER: "1"
