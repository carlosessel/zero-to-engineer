  courses: [mastery]
- term: "Virtual size"
  definition: "All the address space a process has reserved, much of it possibly unused."
  courses: [mastery]
- term: "Virtual thread"
  aliases: ["virtual threads", "carrier thread"]
  definition: "A lightweight JVM-managed thread that is parked while it waits, so millions can exist."
  courses: [mastery]
- term: "Visitor"
  definition: "A pattern for adding operations to a fixed set of types, one method per type; largely replaced by pattern matching."
  courses: [mastery]
- term: "Visual hierarchy"
  definition: "The order in which the eye notices things on a page, set by size, weight, colour and space."
  courses: [web]
- term: "Vitest"
  definition: "A test runner for JavaScript and TypeScript, made by the Vite team."
  courses: [web]
- term: "Void element"
  definition: "An HTML element with no content and no closing tag, such as <img> or <input>."
  courses: [web]
- term: "VPC"
  aliases: ["VNet", "subnets", "public subnets", "private subnets"]
  definition: "A private cloud network divided into subnets."
  courses: [mastery]
- term: "Wall clock"
  aliases: ["monotonic clock"]
  definition: "The time-of-day clock, which can jump; the monotonic clock only moves forward and measures durations."
  courses: [mastery]
- term: "Warm-up"
  definition: "The period after start-up when a JIT-compiled program runs slower until hot code is optimised."
  courses: [mastery]
- term: "Watch mode"
  definition: "Running tests again automatically whenever a file is saved."
  courses: [web]
- term: "WCAG"
  aliases: ["Web Content Accessibility Guidelines"]
  definition: "The Web Content Accessibility Guidelines, the international accessibility standard published by the W3C; level AA is the usual target."
  courses: [web, mastery]
- term: "Weak reference"
  aliases: ["weak references"]
  definition: "A reference that does not keep its object alive, so the garbage collector may still free it."
  courses: [mastery]
- term: "Web application"
  definition: "A website you do things with, such as a shop, a booking form or a chat, rather than mainly read."
  courses: [web]
- term: "Web worker"
  definition: "A separate thread for heavy JavaScript, which cannot touch the page directly."
  courses: [web]
- term: "Webhook"
  definition: "An HTTP request a provider sends to a URL you registered when an event happens."
  courses: [mastery]
- term: "WebP"
  definition: "A modern image format, usually smaller than JPEG and PNG for the same quality."
  courses: [web]
- term: "Website"
  definition: "A set of web pages under one address, mainly for reading."
  courses: [web]
- term: "WebSocket"
  definition: "A two-way connection, upgraded from HTTP, where either side can send messages at any time."
  courses: [mastery]
- term: "Wide-column store"
  definition: "A database such as Cassandra built for huge write volumes across many machines, with one table per query."
  courses: [mastery]
- term: "WOFF2"
  definition: "The most compressed font file format, supported by every current browser."
  courses: [web]
- term: "Word"
  definition: "The natural unit of data a CPU works with; 64 bits on a 64-bit processor."
  courses: [mastery]
- term: "Worker pool"
  definition: "A fixed number of workers taking jobs from a shared queue, capping how much runs at once."
  courses: [mastery]
- term: "Worker thread"
  aliases: ["worker threads"]
  definition: "In Node.js, an extra thread for CPU-heavy work that would otherwise block the event loop."
  courses: [mastery]
- term: "Workflow"
  definition: "A system that runs model calls and tools along paths fixed in code, rather than letting the model choose its steps."
  courses: [claude, ai]
- term: "Working folder"
  definition: "In Git, your project's files as they are on disk right now, including changes not yet committed."
  courses: [web]
- term: "Worktrees"
  definition: "Extra working copies of one Git repository, each in its own folder on its own branch, so parallel sessions cannot overwrite each other."
  courses: [claude]
- term: "Worst case"
  definition: "The input of a given size that makes an algorithm do the most work."
  courses: [mastery]
- term: "Write skew"
  definition: "Two transactions each reading shared data and writing different rows, together breaking a rule."
  courses: [mastery]
- term: "Write-ahead log"
  aliases: ["WAL"]
  definition: "A log of changes written to disk before a commit is acknowledged, replayed after a crash."
  courses: [mastery]
- term: "XML tags"
  definition: "Labels in angle brackets, such as <document> and </document>, used in prompts to mark where each kind of content starts and ends."
  courses: [claude]
- term: "YAGNI"
  definition: "You aren't gonna need it: do not build something until it is actually needed."
  courses: [mastery]
- term: "Young generation"
  definition: "The part of a generational heap where new objects are allocated and collected often."
  courses: [mastery]
- term: "ZGC"
  definition: "A Java garbage collector designed for very short pauses, doing almost all its work concurrently."
  courses: [mastery]
- term: "Zombie process"
  aliases: ["zombie"]
  definition: "A finished child process whose parent has not yet collected its exit status."
  courses: [mastery]
