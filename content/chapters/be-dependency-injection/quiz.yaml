- question: What is dependency injection?
  options:
  - Giving a class its dependencies, usually through its constructor, instead of it creating them
  - A way to make classes run faster
  answer: 0
  explanation: A composition root or container builds the real objects.
- question: Which ASP.NET Core lifetime means one instance per request?
  options:
  - Scoped
  - Transient
  answer: 0
  explanation: Singleton is one per app; transient is new every time.
- question: What is a captive dependency?
  options:
  - A longer-lived service holding a shorter-lived one, such as a singleton holding a scoped repository
  - A dependency that cannot be mocked
  answer: 0
  explanation: .NET refuses it when scope validation is on.
- question: What does ValidateOnStart do for options?
  options:
  - Checks the configuration when the app starts, not when first used
  - Reloads configuration on change
  answer: 0
  explanation: Bad settings fail at deploy time.
- question: What is the default scope of a Spring bean?
  options:
  - Singleton
  - Prototype
  answer: 0
  explanation: So Spring services must be stateless or thread-safe.
