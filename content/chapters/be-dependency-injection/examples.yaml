- block: 6
  lang: java
  check: shell
  needs: network
  script: |
    GRADLE=$(command -v gradle || ls -d "$HOME"/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*/bin/gradle 2>/dev/null | tail -1)
    mkdir -p di/src/main/java/com/bakery di/src/main/resources && cd di
    echo 'rootProject.name = "di-demo"' > settings.gradle.kts
    cat > build.gradle.kts <<'SRC_EOF'
    plugins {
        java
        id("org.springframework.boot") version "4.1.2"
        id("io.spring.dependency-management") version "1.1.7"
    }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }
    dependencies {
        implementation("org.springframework.boot:spring-boot-starter")
        implementation("org.springframework.boot:spring-boot-starter-validation")
    }
    SRC_EOF
    printf 'delivery.free-from-pence=3000\ndelivery.charge-pence=350\nspring.main.banner-mode=off\nlogging.level.root=warn\n' > src/main/resources/application.properties
    cp "$BLOCK" src/main/java/com/bakery/BakeryApplication.java
    "$GRADLE" --no-daemon -q bootJar
    java -jar build/libs/di-demo.jar
    printf 'delivery.free-from-pence=3000\ndelivery.charge-pence=-5\nspring.main.banner-mode=off\nlogging.level.root=off\n' > bad.properties
    if java -jar build/libs/di-demo.jar --spring.config.location=file:bad.properties > bad.log 2>&1; then echo "should have failed"; exit 1; fi
    echo "refused to start with a negative charge"
  output_contains:
  - '350

    0

    2026-11-13T07:30:00Z

    refused to start with a negative charge'
