- id: fi-time-value-npv
  title: Discounting a course, year by year
  hint: Each later payment gets a smaller discount factor. Switch rates to see how the same payments are worth less at 25%.
  examples:
  - label: Discount rate 12%
    steps:
    - title: The cost
      text: Kofi pays GH₵ 5,000 now. Money today needs no discounting, so its factor is 1 and its present value is −5,000. His discount rate is 12%.
      vars:
        NPV so far: −5,000.00
      parts:
      - kind: tables
        id: t
        slots: 5
        tables:
        - id: s
          title: Kofi's course at 12%
          columns:
          - year
          - money
          - factor
          - today
          rows:
          - k: y0
            cells:
            - '0'
            - −5,000
            - '1.0000'
            - −5,000.00
            tone: active
    - title: Year 1
      text: The first 2,000 is one year away. Its factor is 1 ÷ 1.12 = 0.8929, so it is worth 1,785.71 today.
      vars:
        NPV so far: −3,214.29
