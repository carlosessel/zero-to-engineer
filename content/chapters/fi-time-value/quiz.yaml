- question: "At 10% a year, what is GH₵ 12,100 received in two years worth today?"
  options:
    - "GH₵ 10,000"
    - "GH₵ 9,680"
    - "GH₵ 12,100"
    - "GH₵ 14,641"
  answer: 0
  explanation: "PV = 12,100 ÷ 1.10² = 12,100 ÷ 1.21 = 10,000. Taking off 10% twice (9,680 after subtracting 20%) is not the same as dividing by 1.21."
- question: "What happens to the present value of a fixed future payment when the discount rate rises?"
  options:
    - "It falls"
    - "It rises"
    - "It stays the same"
    - "It depends on whether the payment is in cedis"
  answer: 0
  explanation: "PV = FV ÷ (1 + r)ⁿ. A larger r makes the divisor bigger, so the present value is smaller, and more so the further away the payment is."
- question: "A choice costs GH₵ 5,000 today and its future payments have a present value of GH₵ 4,723.20. What does that tell you?"
  options:
    - "Its NPV is −276.80, so at that discount rate it is worth less than it costs"
    - "It is worth doing, because the future payments add up to more than 5,000"
    - "Its NPV is 4,723.20"
    - "Nothing, until you know the payments in cedis"
  answer: 0
  explanation: "NPV = 4,723.20 − 5,000 = −276.80. The payments may add to more than 5,000, but their value today is less than the cost."
- question: "Why does a spreadsheet's FV(15%, 4, 0, 5000) give a negative answer?"
  options:
    - "Its sign convention treats the 5,000 as money received, so the future value comes out as money paid; enter money paid out as negative"
    - "Because 15% is too high"
    - "Because the payment argument is 0"
    - "Because future values are always negative"
  answer: 0
  explanation: "Spreadsheet finance functions treat money out and money in with opposite signs. Enter the deposit as −5000 and the result is a positive 8,745.03."
- question: "A loan's fixed monthly repayment is the payment that…"
  options:
    - "has a present value, at the loan's rate, equal to the amount borrowed"
    - "adds up to the amount borrowed"
    - "is the amount borrowed divided by the number of months"
    - "makes the interest the same every month"
  answer: 0
  explanation: "Discounting the payments at the loan rate gives the loan amount. Adding them up gives more than the loan, because the total includes interest."
- question: "Which is a sensible discount rate for valuing a future payment?"
  options:
    - "What you could earn elsewhere on money of similar risk, higher if the payment is uncertain"
    - "Always 0%, because money is money"
    - "The lowest rate you can find, so the payment looks valuable"
    - "The inflation rate in the year of payment only"
  answer: 0
  explanation: "The discount rate is an opportunity cost: what you give up by waiting. Riskier payments deserve a higher rate."
