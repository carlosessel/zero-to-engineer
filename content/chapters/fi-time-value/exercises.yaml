- title: Do this
  items:
    - key: x1
      text: "In a spreadsheet, rebuild Kofi's course table with the discount rate in its own cell. Change the rate until the NPV is zero and write down that rate."
    - key: x2
      text: "Find a real 'pay now or pay in instalments' offer (school fees, a phone, insurance). Work out the present value of the instalments at a rate you could earn, and say which is cheaper."
    - key: x3
      text: "Pick a saving goal and a date. Use PMT to find the monthly saving needed at two different rates, and check one answer with FV."
    - key: x4
      text: "Use PV to check the repayment on any loan offer you can find: does the present value of the repayments at the stated rate equal the amount borrowed?"
