- title: Do this
  items:
  - key: x1
    text: Run EXPLAIN ANALYZE with BUFFERS on three queries and note where the time goes
  - key: x2
    text: Find a query where the estimated and actual rows differ by ten times or more, and fix it with ANALYZE or extended statistics
  - key: x3
    text: Make the planner switch from a nested loop to a hash join by changing only the filter value
  - key: x4
    text: Paste a large plan into a visualiser and explain each node to someone else
