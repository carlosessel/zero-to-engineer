- question: "What is [1, 2, 3] · [4, 0, 2]?"
  options:
    - "10"
    - "9"
    - "[4, 0, 6]"
  answer: 0
  explanation: "1×4 + 2×0 + 3×2 = 10. A dot product gives a single number."
- question: "Two vectors are at right angles. Their dot product is…"
  options:
    - "1"
    - "0"
    - "−1"
  answer: 1
  explanation: "Perpendicular vectors have nothing in common, so the dot product is zero."
- question: "A matrix has 3 columns. To multiply it by a vector, the vector needs…"
  options:
    - "3 entries"
    - "any number of entries"
    - "as many entries as the matrix has rows"
  answer: 0
  explanation: "Columns of the matrix must match entries of the vector."
