- question: "Production is failing after a release. What comes first?"
  options:
    - "Find the root cause"
    - "Stop the harm: roll back or switch the feature off"
    - "Write the review"
  answer: 1
  explanation: "Restore service, then investigate."
- question: "Before optimising slow code you should…"
  options:
    - "rewrite it in another language"
    - "measure where the time actually goes"
    - "add more servers"
  answer: 1
  explanation: "The bottleneck is rarely where you guess."
