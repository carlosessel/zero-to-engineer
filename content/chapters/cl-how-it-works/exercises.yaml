- title: "Do this"
  items:
    - key: x1
      text: "Ask Claude a question about something very recent, then the same question with a pasted article about it, and compare the answers"
    - key: x2
      text: "Ask Claude for three references on a niche topic, then open each one and check whether it exists and says what Claude claimed"
    - key: x3
      text: "Ask the same open question in three new conversations and note what changes and what stays the same"
    - key: x4
      text: "Give Claude a short document and ask questions about it, telling it to quote the sentence each answer comes from and to say when the document does not cover something"
