- question: "Which layer of the box is always transparent?"
  options:
    - "Padding"
    - "Border"
    - "Margin"
  answer: 2
  explanation: "Padding takes the background colour; margin is the transparent space outside the border."
- question: "With default sizing, how wide on screen is width: 100px; padding: 10px; border: 1px solid?"
  options:
    - "100px"
    - "120px"
    - "122px"
  answer: 2
  explanation: "content-box adds padding and border to the width: 100 + 10 + 10 + 1 + 1 = 122."
- question: "What does box-sizing: border-box change?"
  options:
    - "width then includes padding and border, so the box is exactly the width you set"
    - "It adds a border to every box"
    - "It removes margins"
  answer: 0
  explanation: "The content shrinks to fit inside the width you asked for, which makes sizes match designs."
- question: "A heading has margin-bottom: 30px and the next paragraph margin-top: 10px. What is the gap?"
  options:
    - "40px"
    - "30px"
    - "10px"
  answer: 1
  explanation: "Vertical margins between neighbouring blocks collapse to the larger of the two."
- question: "Why does width: 150px have no effect on a <span>?"
  options:
    - "span is an inline element, and inline boxes ignore width"
    - "Widths must be in rem"
    - "span cannot be styled"
  answer: 0
  explanation: "Make it inline-block or block to give it a width."
- question: "An element with position: absolute is placed relative to what?"
  options:
    - "Its own normal position"
    - "The nearest ancestor with a position other than static"
    - "Always the browser window"
  answer: 1
  explanation: "That is why the parent usually gets position: relative. fixed, not absolute, is relative to the window."
