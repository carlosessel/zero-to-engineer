- title: Do this
  items:
    - key: x1
      text: "Draw up your own (or a made-up household's) balance sheet for today: every asset at what it would sell for, every liability, and the net worth. Mark the liquid assets."
    - key: x2
      text: "From your bookkeeping, draw up an income statement for last month. Leave loan repayments out of expenses except for the interest."
    - key: x3
      text: "Build Ama's three statements in a spreadsheet with formulas, and add check cells showing that the change in net worth equals the surplus and that cash ties to the balance sheet."
    - key: x4
      text: "Work out your savings rate, emergency months and debt to assets, and write them down to compare in a year."
