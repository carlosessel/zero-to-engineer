- question: "Kofi repays GH₵ 2,000 of a loan plus GH₵ 250 of interest. What goes on his income statement as an expense?"
  options:
    - "GH₵ 250, the interest"
    - "GH₵ 2,250, everything he paid"
    - "GH₵ 2,000, the repayment"
    - "Nothing"
  answer: 0
  explanation: "Interest is the cost of borrowing. The 2,000 repaid reduces a liability: it appears on the balance sheet and as financing cash flow, not as an expense."
- question: "Esi buys a fridge for GH₵ 3,500 in cash. What happens to her net worth that day?"
  options:
    - "It does not change: cash becomes a fridge of the same value"
    - "It falls by 3,500"
    - "It rises by 3,500"
    - "It falls by the fridge's yearly depreciation"
  answer: 0
  explanation: "One asset is swapped for another. The fall in the fridge's value over time will be an expense, recorded as it happens."
- question: "Which statement is a snapshot on one date rather than a summary of a period?"
  options:
    - "The balance sheet"
    - "The income statement"
    - "The cash flow statement"
    - "All three"
  answer: 0
  explanation: "A balance sheet shows what is owned and owed on a date. The income and cash flow statements cover what happened between two dates."
- question: "Yaw's surplus for the year was GH₵ 7,000, and nothing else changed in value. By how much did his net worth change?"
  options:
    - "It rose by GH₵ 7,000"
    - "It rose by however much his cash rose"
    - "It did not change"
    - "It cannot be known without the cash flow statement"
  answer: 0
  explanation: "With no other changes in value, the change in net worth equals the surplus. Cash may have changed by a different amount if he bought assets or repaid debt."
- question: "In a cash flow statement, buying a motorbike for work is:"
  options:
    - "Investing cash flow"
    - "Everyday (operating) cash flow"
    - "Financing cash flow"
    - "Not included, because it is not an expense"
  answer: 0
  explanation: "Buying a long-lasting asset is an investing cash flow. It is included because cash left; it is just not an expense."
- question: "Ama had a surplus of 10,480 but her cash rose by only 3,980. Which is the best explanation?"
  options:
    - "She used cash to buy a laptop and repay a loan, which are not expenses"
    - "Her income statement must be wrong"
    - "Cash always rises by less than the surplus"
    - "The phone's fall in value used 6,500 of cash"
  answer: 0
  explanation: "4,000 went on the laptop and 3,000 on the loan: 10,980 of everyday cash minus 7,000 is 3,980. Depreciation lowers the surplus but uses no cash."
