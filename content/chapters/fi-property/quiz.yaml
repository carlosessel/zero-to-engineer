- question: "Which part of a mortgage payment is a true cost of owning, comparable with rent?"
  options:
    - "The interest, not the part that repays the loan"
    - "The whole payment"
    - "Only the part that repays the loan"
    - "None of it"
  answer: 0
  explanation: "Repaying the loan builds equity you keep. Interest, like rent, is gone for good, along with maintenance, insurance and the opportunity cost of the deposit."
- question: "You buy a GH₵ 500,000 house with a GH₵ 100,000 deposit. Prices fall 10%. What happens to your equity?"
  options:
    - "It falls from 100,000 to 50,000: down 50%"
    - "It falls 10%, to 90,000"
    - "It stays at 100,000 until you sell"
    - "It becomes negative"
  answer: 0
  explanation: "The house is worth 450,000 and you still owe 400,000, so equity is 50,000. With 80% borrowed, price changes are multiplied by five."
- question: "What is negative equity?"
  options:
    - "Owing more on the mortgage than the property is worth"
    - "A mortgage with a negative interest rate"
    - "Renting instead of owning"
    - "A property that earns no rent"
  answer: 0
  explanation: "After a large price fall, the loan can exceed the property's value, so selling would not repay it."
- question: "A flat costs GH₵ 400,000 and rents for GH₵ 2,000 a month. Costs take 25% of the rent. What is its net yield?"
  options:
    - "4.5%"
    - "6%"
    - "0.5%"
    - "24%"
  answer: 0
  explanation: "Rent 24,000 a year; net 18,000; 18,000 ÷ 400,000 = 4.5%. The gross yield, before costs, is 6%."
- question: "Why does a high mortgage rate make buying a home look worse than renting in the early years?"
  options:
    - "Most of each early payment is interest, which is an unrecoverable cost like rent"
    - "Because the house cannot rise in value"
    - "Because rent is always higher than mortgage payments"
    - "Because high rates shorten the mortgage"
  answer: 0
  explanation: "In the chapter's example, 97% of the first year's payments were interest, making owning GH₵ 69,523.53 dearer than renting that year."
- question: "What is a main advantage of a listed REIT over buying a rental property yourself?"
  options:
    - "Diversification across many properties, and you can sell quickly in small amounts"
    - "It can never fall in value"
    - "It guarantees a fixed rent"
    - "It lets you live in the properties"
  answer: 0
  explanation: "A REIT spreads you across many buildings and tenants and trades on an exchange. Its price still falls when property markets fall."
