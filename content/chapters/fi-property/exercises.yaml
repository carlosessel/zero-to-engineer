- title: Do this
  items:
    - key: x1
      text: "In a spreadsheet, build Esi's rent-against-buy comparison with every figure in its own cell. Find the mortgage rate at which owning and renting cost the same in year one."
    - key: x2
      text: "Find a real mortgage offer available to you. Work out the monthly payment, the total interest, and how much of the first year's payments repays the loan."
    - key: x3
      text: "Find the asking price and rent for two similar homes near you. Work out the gross yield, estimate the costs, and compare the net yield with a Treasury bill."
    - key: x4
      text: "Write down the steps you would take to check the title to a plot of land before buying it, and who you would ask at each step."
