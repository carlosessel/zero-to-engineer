- question: What makes dynamic programming applicable?
  options:
  - Overlapping subproblems with an optimal substructure
  - Any recursive function
  answer: 0
  explanation: Store each subproblem's answer once.
- question: Why is plain recursive Fibonacci slow?
  options:
  - Recursion is always slow
  - It recomputes the same values exponentially many times
  answer: 1
  explanation: Memoise or tabulate.
- question: What are the three steps of backtracking?
  options:
  - Sort, search, merge
  - Choose, explore, un-choose
  answer: 1
  explanation: Plus pruning hopeless branches.
- question: Is 'take the largest coin that fits' always optimal?
  options:
  - 'Yes'
  - 'No: with 1, 4, 5 and 8p it gives 4 coins instead of 2'
  answer: 1
  explanation: Use DP unless greedy is proven.
- question: fib(80) computed with JavaScript numbers ends in ...684 instead of ...685. Why?
  options:
  - A bug in the algorithm
  - The value exceeds 2^53, so it is rounded
  answer: 1
  explanation: Use BigInt.
