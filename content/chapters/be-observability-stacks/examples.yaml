  lang: text
  check: illustration
  note: The output of the Node program, which block 5's check compares.
- block: 7
  lang: bash
  check: shell
  needs: network
  script: |
    GRADLE=$(command -v gradle || ls -d "$HOME"/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*/bin/gradle 2>/dev/null | tail -1)
    mkdir sp && cd sp
    echo 'rootProject.name = "bakery-api"' > settings.gradle.kts
    mkdir -p $(dirname build.gradle.kts)
    cat > build.gradle.kts <<'SRC_EOF'
    plugins {
        java
        id("org.springframework.boot") version "4.1.2"
        id("io.spring.dependency-management") version "1.1.7"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation("org.springframework.boot:spring-boot-starter-webmvc")
        implementation("org.springframework.boot:spring-boot-starter-actuator")
        runtimeOnly("io.micrometer:micrometer-registry-prometheus")
    }
    SRC_EOF
    mkdir -p $(dirname src/main/resources/application.properties)
    cat > src/main/resources/application.properties <<'SRC_EOF'
    spring.application.name=bakery-api
    spring.main.banner-mode=off
    logging.structured.format.console=ecs
    logging.level.root=warn
    logging.level.com.bakery=info
    management.endpoints.web.exposure.include=health,prometheus
    SRC_EOF
    mkdir -p $(dirname src/main/java/com/bakery/BakeryApplication.java)
    cat > src/main/java/com/bakery/BakeryApplication.java <<'SRC_EOF'
    package com.bakery;

    import io.micrometer.core.instrument.Counter;
    import io.micrometer.core.instrument.DistributionSummary;
    import io.micrometer.core.instrument.MeterRegistry;
    import java.net.URI;
    import org.slf4j.Logger;
    import org.slf4j.LoggerFactory;
    import org.slf4j.MDC;
    import org.springframework.boot.SpringApplication;
    import org.springframework.boot.autoconfigure.SpringBootApplication;
    import org.springframework.http.ResponseEntity;
    import org.springframework.web.bind.annotation.PostMapping;
    import org.springframework.web.bind.annotation.RequestParam;
    import org.springframework.web.bind.annotation.RestController;

    @SpringBootApplication
    public class BakeryApplication {
        public static void main(String[] args) {
            SpringApplication.run(BakeryApplication.class, args);
        }
    }

    @RestController
    class OrderController {
        private static final Logger log = LoggerFactory.getLogger(OrderController.class);
        private final Counter placed;
        private final DistributionSummary value;

        OrderController(MeterRegistry registry) {
            this.placed = Counter.builder("bakery.orders.placed").tag("channel", "web").register(registry);
            this.value = DistributionSummary.builder("bakery.order.value").baseUnit("pence").register(registry);
        }

        @PostMapping("/orders")
        ResponseEntity<Void> place(@RequestParam String orderId, @RequestParam int totalPence) {
            try (var ignored = MDC.putCloseable("orderId", orderId)) {
                if (totalPence <= 0) {
                    log.atWarn().addKeyValue("totalPence", totalPence).log("Rejected order: total is not positive");
                    return ResponseEntity.badRequest().build();
                }
                placed.increment();
                value.record(totalPence);
                log.atInfo().addKeyValue("totalPence", totalPence).log("Placed order");
                return ResponseEntity.created(URI.create("/orders/" + orderId)).build();
            }
        }
    }
    SRC_EOF
    "$GRADLE" --no-daemon -q bootJar
    SERVER_PORT=18080 java -jar build/libs/bakery-api.jar > app.log 2>&1 &
    PID=$!
    trap "kill $PID 2>/dev/null || true" EXIT
    for i in $(seq 1 90); do if grep -q "Started " app.log; then break; fi; sleep 1; done
    sed "s/localhost:8080/localhost:18080/g" "$BLOCK" > calls.sh
    bash calls.sh
    grep -o '"message":"Placed order","orderId":"o-1042","totalPence":1250' app.log
    grep -o '"message":"Rejected order: total is not positive","orderId":"o-1043","totalPence":-5' app.log
  output_contains:
  - 'bakery_order_value_pence_count 1

    bakery_order_value_pence_sum 1250.0

    bakery_order_value_pence_max 1250.0

    bakery_orders_placed_total{channel="web"} 1.0'
  - '"message":"Placed order","orderId":"o-1042","totalPence":1250'
  - '"message":"Rejected order: total is not positive","orderId":"o-1043","totalPence":-5'
