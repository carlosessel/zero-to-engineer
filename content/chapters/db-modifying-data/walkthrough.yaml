- id: db-modifying-data-upsert-merge
  title: One stock table, upserted and merged
  hint: Follow the stock table through an insert, an ON CONFLICT upsert and a MERGE, row by row.
  language: SQL
  code: |
    CREATE TABLE stock (
      sku      text PRIMARY KEY,
      quantity integer NOT NULL CHECK (quantity >= 0)
    );

    INSERT INTO stock (sku, quantity) VALUES ('RYE-400', 12), ('BAG-250', 30);

    INSERT INTO stock (sku, quantity)
    VALUES ('RYE-400', 5), ('CRO-090', 18)
    ON CONFLICT (sku) DO UPDATE SET quantity = stock.quantity + excluded.quantity
    RETURNING sku, quantity;

    MERGE INTO stock AS s
    USING (VALUES ('BAG-250', -30), ('CRO-090', 6), ('JAM-380', 24)) AS d (sku, change)
    ON s.sku = d.sku
    WHEN MATCHED AND s.quantity + d.change = 0 THEN DELETE
    WHEN MATCHED THEN UPDATE SET quantity = s.quantity + d.change
    WHEN NOT MATCHED THEN INSERT (sku, quantity) VALUES (d.sku, d.change);

    SELECT * FROM stock ORDER BY sku;
  steps:
    - title: An empty stock table
      text: sku is the primary key, so no two rows can have the same product code, and quantity can never go below zero.
      lines: [ 1, 2, 3, 4 ]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - { id: s, title: stock, columns: [ sku, quantity ], rows: [] }
    - title: A plain insert
      text: "Two products go in: 12 rye loaves and 30 bagels."
      lines: [ 6 ]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 12 ], tone: active }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: active }
    - title: An upsert is proposed
      text: Next, two rows are proposed for insertion. RYE-400 already exists, which would break the primary key. Instead of failing, ON CONFLICT (sku) says what to do.
      lines: [ 8, 9, 10 ]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 12 ], tone: compare }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: base }
            - id: x
              title: proposed rows
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 5 ], tone: compare }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: base }
    - title: "Conflict: update instead"
      text: "For the rye loaf, DO UPDATE adds the proposed quantity, called excluded.quantity, to the existing one: 12 + 5 = 17."
      lines: [ 10 ]
      vars: { stock.quantity + excluded.quantity: 12 + 5 = 17 }
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: active }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: base }
            - id: x
              title: proposed rows
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 5 ], tone: done }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: base }
    - title: "No conflict: insert"
      text: "CRO-090 did not exist, so it is simply inserted. RETURNING shows both changed rows: RYE-400 17 and CRO-090 18. It all happened in one atomic statement."
      lines: [ 9, 11 ]
      vars: {}
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: found }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: base }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: found }
            - id: x
              title: proposed rows
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 5 ], tone: done }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: done }
    - title: MERGE a delivery file
      text: Now MERGE compares a source, d, with the stock table, matching rows on sku. Each source row is handled by the first WHEN rule that fits.
      lines: [ 13, 14, 15 ]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: base }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: base }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: base }
            - id: x
              title: d (delivery)
              columns: [ sku, change ]
              rows:
                - { k: BAG-250, cells: [ BAG-250, -30 ], tone: base }
                - { k: CRO-090, cells: [ CRO-090, 6 ], tone: base }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: base }
    - title: "Bagels reach zero: DELETE"
      text: BAG-250 matches, and 30 + (-30) is 0, so the first rule applies and the row is deleted.
      lines: [ 16 ]
      vars: { s.quantity + d.change: 30 + -30 = 0 }
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: base }
                - { k: BAG-250, cells: [ BAG-250, 30 ], tone: bad }
                - { k: CRO-090, cells: [ CRO-090, 18 ], tone: base }
            - id: x
              title: d (delivery)
              columns: [ sku, change ]
              rows:
                - { k: BAG-250, cells: [ BAG-250, -30 ], tone: active }
                - { k: CRO-090, cells: [ CRO-090, 6 ], tone: base }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: base }
    - title: "Croissants topped up: UPDATE"
      text: "CRO-090 matches but does not reach zero, so the second rule updates it: 18 + 6 = 24."
      lines: [ 17 ]
      vars: { s.quantity + d.change: 18 + 6 = 24 }
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: base }
                - { k: CRO-090, cells: [ CRO-090, 24 ], tone: active }
            - id: x
              title: d (delivery)
              columns: [ sku, change ]
              rows:
                - { k: BAG-250, cells: [ BAG-250, -30 ], tone: done }
                - { k: CRO-090, cells: [ CRO-090, 6 ], tone: active }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: base }
    - title: "Jam is new: INSERT"
      text: JAM-380 has no matching row, so WHEN NOT MATCHED inserts it with 24. RYE-400 was not in the source, so it is left alone.
      lines: [ 18 ]
      vars: {}
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: base }
                - { k: CRO-090, cells: [ CRO-090, 24 ], tone: base }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: active }
            - id: x
              title: d (delivery)
              columns: [ sku, change ]
              rows:
                - { k: BAG-250, cells: [ BAG-250, -30 ], tone: done }
                - { k: CRO-090, cells: [ CRO-090, 6 ], tone: done }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: active }
    - title: The result
      text: Sorted by sku, the table holds exactly the chapter's three rows. Use ON CONFLICT for simple upserts on a key, MERGE for richer rules.
      lines: [ 20 ]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stock
              columns: [ sku, quantity ]
              rows:
                - { k: CRO-090, cells: [ CRO-090, 24 ], tone: found }
                - { k: JAM-380, cells: [ JAM-380, 24 ], tone: found }
                - { k: RYE-400, cells: [ RYE-400, 17 ], tone: found }
