- question: "Which command moves you into a folder called projects?"
  options:
    - "ls projects"
    - "cd projects"
    - "mkdir projects"
  answer: 1
  explanation: "cd changes directory. ls lists. mkdir creates."
- question: "A program is stuck in the terminal. What do you press?"
  options:
    - "Ctrl and C"
    - "Tab"
    - "The up arrow"
  answer: 0
  explanation: "Ctrl and C interrupts the running program."
