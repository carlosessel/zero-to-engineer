- title: Do this
  items:
    - key: x1
      text: "For the company whose accounts you downloaded in the previous chapter, calculate its margins, ROE, current and quick ratios, debt to equity and interest cover for two years."
    - key: x2
      text: "Break its ROE into net margin, asset turnover and equity multiplier, and say which explains most of any change."
    - key: x3
      text: "Using today's share price, calculate its P/E, earnings yield, dividend yield, price to book and EV to EBITDA. Compare the earnings yield with the Treasury bill rate."
    - key: x4
      text: "Find a second company in the same industry and put the two sets of ratios side by side. Write three sentences on what differs and why it might."
