- question: "A company's net margin is 5%, asset turnover 2.0 and equity multiplier 3.0. What is its return on equity?"
  options:
    - "30%"
    - "10%"
    - "15%"
    - "5%"
  answer: 0
  explanation: "DuPont: 5% × 2.0 × 3.0 = 30%. Much of it comes from leverage, which is worth noticing."
- question: "Why does the quick ratio leave out inventories?"
  options:
    - "Inventory may not turn into cash quickly"
    - "Inventory is not an asset"
    - "Inventory is counted twice otherwise"
    - "Because it is a long-term liability"
  answer: 0
  explanation: "The quick ratio asks whether a company could pay its short-term debts without having to sell its stock."
- question: "Operating profit is GH₵ 30 million and finance costs GH₵ 20 million. What is interest cover?"
  options:
    - "1.5 times, which leaves little room if profit falls"
    - "0.67 times"
    - "10 times"
    - "50 times"
  answer: 0
  explanation: "30 ÷ 20 = 1.5. A one-third fall in operating profit would leave nothing to cover the interest."
- question: "A share has EPS of GH₵ 0.40 and is priced at GH₵ 6.00. What is its earnings yield?"
  options:
    - "6.67%"
    - "15%"
    - "2.4%"
    - "40%"
  answer: 0
  explanation: "Earnings yield = EPS ÷ price = 0.40 ÷ 6.00 = 6.67%, the inverse of a P/E of 15."
- question: "Why is EV to EBITDA useful for comparing two companies with very different amounts of debt?"
  options:
    - "Enterprise value includes net debt and EBITDA is before interest, so borrowing does not distort the comparison"
    - "Because it ignores revenue"
    - "Because it is always lower than P/E"
    - "Because companies must report it"
  answer: 0
  explanation: "P/E is affected by how much interest a company pays. EV and EBITDA both look at the whole business, however it is financed."
- question: "Which comparison is most meaningful?"
  options:
    - "A food producer's margins with other food producers' and with its own past years"
    - "A supermarket's margin with a software company's"
    - "One year's P/E with nothing"
    - "A bank's current ratio with a mining company's"
  answer: 0
  explanation: "Ratios vary widely between industries. Compare within an industry and over time."
