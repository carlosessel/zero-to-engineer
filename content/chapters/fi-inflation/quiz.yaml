- question: "A basket of goods cost GH₵ 2,000 in the base year and GH₵ 2,300 this year. What is the price index this year?"
  options:
    - "115"
    - "300"
    - "2,300"
    - "15"
  answer: 0
  explanation: "The base year is 100, so the index is 2,300 ÷ 2,000 × 100 = 115: prices are 15% higher. The index is not the cost itself or the rise in cedis."
- question: "Your savings earn 10% a year and inflation is 15%. What happens to what your savings can buy?"
  options:
    - "It falls by about 4.3% a year, even though the balance grows"
    - "It grows by 10% a year"
    - "It falls by exactly 5% a year"
    - "It stays the same, because the balance is growing"
  answer: 0
  explanation: "Real return = 1.10 ÷ 1.15 − 1 = −4.35%. The balance grows, but prices grow faster. Subtracting gives −5%, which is only an approximation."
- question: "Inflation is 10% a year for 3 years. By how much have prices risen in total?"
  options:
    - "33.1%"
    - "30%"
    - "10%"
    - "27.1%"
  answer: 0
  explanation: "Prices compound: 1.10³ = 1.331, a rise of 33.1%. Adding the rates gives 30%, which ignores the rise on top of earlier rises."
- question: "A price index goes from 200 to 230. What was the inflation rate between the two dates?"
  options:
    - "15%"
    - "30%"
    - "130%"
    - "It cannot be worked out without the base year"
  answer: 0
  explanation: "230 ÷ 200 − 1 = 0.15. The 30-point rise is a percentage only when the starting value is 100."
- question: "Why might your own inflation rate differ from the published CPI rate?"
  options:
    - "The CPI uses an average household's basket, and you may spend a different share on items whose prices rose faster or slower"
    - "The CPI includes only food"
    - "The CPI is a forecast, not a measurement"
    - "Your own inflation is always lower"
  answer: 0
  explanation: "The CPI weights items by average spending. If you spend more than average on, say, transport, and transport prices jump, your personal inflation is higher."
- question: "What does a central bank usually do to bring high inflation down?"
  options:
    - "Raise its policy rate, so borrowing costs more and spending slows"
    - "Print more money"
    - "Lower its policy rate"
    - "Fix the price of every good"
  answer: 0
  explanation: "A higher policy rate pushes up loan and savings rates, which slows borrowing and spending and, over a year or two, inflation."
