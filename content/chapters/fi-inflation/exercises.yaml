- title: Do this
  items:
    - key: x1
      text: "Write down the prices of ten things you buy regularly. In three months, price them again, build your own small index with your own quantities, and compare your inflation rate with the published one."
    - key: x2
      text: "Look up the latest CPI inflation rate for your country from the statistics office, and the rate on a savings account and a Treasury bill. Work out the real return on each."
    - key: x3
      text: "Find what you were paid (or a typical wage) five years ago and the CPI then and now. Work out what that pay would need to be today to buy the same."
    - key: x4
      text: "In a spreadsheet, rebuild the table of savings at 10% with inflation at 15% for 10 years, and find the year in which the real value falls below half the starting amount."
