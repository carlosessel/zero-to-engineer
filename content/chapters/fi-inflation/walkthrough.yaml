          - 7,320.50
          - '1.7490'
          - 4,185.52
          tone: dim
        - k: y5
          cells:
          - '5'
          - 8,052.55
          - '2.0114'
          - 4,003.54
          tone: found
  - title: The result
    text: The account looked like a gain of 3,052.55. In real terms Ama lost about a fifth of her savings, because the interest rate was below inflation.
    parts:
    - kind: kv
      id: k
      label: After five years
      slots: 3
      rows:
      - name: nominal
        value: 5,000 → 8,052.55 (+61%)
      - name: prices
        value: × 2.0114 (+101%)
      - name: real
        value: 5,000 → 4,003.54 (−20%)
        tone: found
