# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    0 5,000.00 1.0000 5,000.00
    1 5,500.00 1.1500 4,782.61
    2 6,050.00 1.3225 4,574.67
    3 6,655.00 1.5209 4,375.77
    4 7,320.50 1.7490 4,185.52
    5 8,052.55 2.0114 4,003.54
  verify: |
    # The chapter's other figures, from the same formulas.
    assert round(1767 / 1600 * 100, 2) == 110.44
    assert round(1000 / 1.1 ** 5, 2) == 620.92
    assert round((1.1 ** 5 - 1) * 100, 2) == 61.05
    assert round((1.12 / 1.08 - 1) * 100, 2) == 3.70
    assert round((1.05 / 1.23 - 1) * 100, 2) == -14.63
    assert round((1.06 / 1.09 - 1) * 100, 2) == -2.75
    assert round(50 * 248 / 160, 2) == 77.50
    assert round(3000 * 248 / 160, 2) == 4650.00
    assert round(2000 / 1.2 ** 3, 2) == 1157.41
    assert round((1.25 / 1.20 - 1) * 100, 2) == 4.17
    assert round(1120 / 1.08, 2) == 1037.04
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    rows, b, p = [], 5000.0, 1.0
    for y in range(6):
        rows.append(f"{y} {b:,.2f} {p:.4f} {b / p:,.2f}")
        b *= 1.10; p *= 1.15
    assert block.strip().splitlines() == rows
