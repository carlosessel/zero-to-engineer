- title: Do this
  items:
  - key: x1
    text: Put Nginx or Caddy in front of two copies of a small app and watch it route around one you stop
  - key: x2
    text: Add liveness and readiness endpoints to a service and make shutdown graceful
  - key: x3
    text: Change the simulation's request-cost mix and see when round robin is good enough
  - key: x4
    text: Put a CDN in front of a static site and check the cache headers it sees
