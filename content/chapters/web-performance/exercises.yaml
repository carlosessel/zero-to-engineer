- title: "Do this"
  items:
    - key: x1
      text: "Open the Network panel on a site you use, disable the cache, throttle to Slow 4G and reload; find the largest file and how long the page took"
    - key: x2
      text: "Run Lighthouse on a page you built and fix the top two problems it lists, then run it again and compare the scores"
    - key: x3
      text: "Run a well-known site through PageSpeed Insights and note its LCP, INP and CLS from real visitors, and whether each is good"
    - key: x4
      text: "Make three sizes of one of your photos, convert them to WebP, and show them with srcset, sizes, width and height; check in the Network panel which one your browser downloads at different window widths"
    - key: x5
      text: "Split one page of your React app with lazy and Suspense, run npm run build, and find the new separate JavaScript file in the build report"
