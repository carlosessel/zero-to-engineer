# Resources linked from this chapter. Each was opened on the date shown.
- title: High Performance Browser Networking
  author: Ilya Grigorik
  url: https://hpbn.co/
  type: book
  covers: Latency, bandwidth, TCP, UDP, TLS, HTTP/1.x and HTTP/2.
  why: An O'Reilly book free online under CC BY-NC-ND 4.0; it predates HTTP/3.
  checked: 2026-11-12
- title: 'Computer Networks: A Systems Approach'
  author: Larry Peterson and Bruce Davie
  url: https://book.systemsapproach.org/
  type: book
  covers: Networking from links to applications, including congestion control.
  why: A long-established textbook, free online.
  checked: 2026-11-12
- title: Beej's Guide to Network Programming
  author: Beej
  url: https://beej.us/guide/bgnet/
  type: book
  covers: 'Sockets in practice: TCP and UDP clients and servers.'
  why: A free, much-recommended guide to the sockets interface.
  checked: 2026-11-12
- title: Evolution of HTTP
  author: MDN Web Docs
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP
  type: documentation
  covers: How HTTP grew from 1.0 to HTTP/3 over QUIC.
  why: MDN, updated March 2026.
  checked: 2026-11-12
- title: 'RFC 9293: Transmission Control Protocol'
  author: IETF
  url: https://www.rfc-editor.org/rfc/rfc9293
  type: documentation
  covers: The current TCP specification.
  why: The standard itself (2022).
  checked: 2026-11-12
