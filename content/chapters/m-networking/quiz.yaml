- question: Why is the first request to a new HTTPS server slower than later ones on the same connection?
  options:
  - Servers warm up
  - It needs DNS, a TCP handshake and a TLS handshake before the request
  answer: 1
  explanation: Reuse connections to pay that once.
- question: What problem does HTTP/3 solve that HTTP/2 does not?
  options:
  - Header compression
  - TCP head-of-line blocking across streams
  answer: 1
  explanation: QUIC handles each stream's order separately.
- question: A call to charge a card times out. What is true?
  options:
  - The charge failed
  - The charge may or may not have happened
  answer: 1
  explanation: Retry only with an idempotency key or after checking.
- question: Why does a TCP-based protocol need framing?
  options:
  - TCP is unencrypted
  - TCP is a byte stream with no message boundaries
  answer: 1
  explanation: Use delimiters or length prefixes.
- question: What limits the round-trip time between London and New York, whatever the servers?
  options:
  - Bandwidth
  - The speed of light in fibre over the distance
  answer: 1
  explanation: About 200 km per millisecond.
