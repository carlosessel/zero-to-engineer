# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |2+

  verify: |
    bs = ns['binary_search']
    items = [3, 8, 12, 17, 21, 26, 30]
    assert [bs(items, x) for x in items] == list(range(7))
    assert bs(items, 4) == -1 and bs([], 1) == -1 and bs([5], 5) == 0 and bs([5], 9) == -1
    # "A million sorted items take at most 20 steps": count the loop's passes for the worst case.
    import math
    assert math.floor(math.log2(1_000_000)) + 1 == 20
- block: 2
  lang: python
  check: python
  output: |2+

  verify: |
    folder = {"children": [{"size": 10}, {"children": [{"size": 5}, {"children": [{"size": 1}]}]}, {"size": 4}]}
    assert ns['total_size'](folder) == 20
    assert ns['total_size']({"children": []}) == 0
