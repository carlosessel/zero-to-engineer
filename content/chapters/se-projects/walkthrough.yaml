- id: se-projects-ladder
  title: Climbing the project ladder
  hint: Watch the projects light up in order. Each one reuses the last and adds the next part of the course.
  steps:
    - title: "Nine projects, one ladder"
      text: "Each project uses what the one before taught you, and each matches a part of the course. Every one has a public repository, small commits, a README, tests, and a note on what went wrong."
      parts:
        - kind: graph
          id: g
          height: 260
          nodes:
            - { k: p1, label: "1 CLI tool", x: 0.1, y: 0 }
            - { k: p2, label: "2 Done properly", x: 0.5, y: 0 }
            - { k: p3, label: "3 Algorithms", x: 0.9, y: 0 }
            - { k: p4, label: "4 Website", x: 0.9, y: 0.5 }
            - { k: p5, label: "5 Front end", x: 0.5, y: 0.5 }
            - { k: p6, label: "6 Full stack", x: 0.1, y: 0.5 }
            - { k: p7, label: "7 Ship it", x: 0.1, y: 1 }
            - { k: p8, label: "8 Team project", x: 0.5, y: 1 }
            - { k: p9, label: "9 Capstone", x: 0.9, y: 1 }
          edges:
            - { a: p1, b: p2, directed: true }
            - { a: p2, b: p3, directed: true }
            - { a: p3, b: p4, directed: true }
            - { a: p4, b: p5, directed: true }
            - { a: p5, b: p6, directed: true }
            - { a: p6, b: p7, directed: true }
            - { a: p7, b: p8, directed: true }
            - { a: p8, b: p9, directed: true }
    - title: "1. A command-line tool"
      text: "An expense tracker or quiz game in Python that saves to a file. Small, but complete."
      parts:
        - kind: graph
          id: g
          height: 260
          nodes:
            - { k: p1, label: "1 CLI tool", x: 0.1, y: 0, tone: active, note: "Programming" }
            - { k: p2, label: "2 Done properly", x: 0.5, y: 0 }
            - { k: p3, label: "3 Algorithms", x: 0.9, y: 0 }
            - { k: p4, label: "4 Website", x: 0.9, y: 0.5 }
            - { k: p5, label: "5 Front end", x: 0.5, y: 0.5 }
            - { k: p6, label: "6 Full stack", x: 0.1, y: 0.5 }
            - { k: p7, label: "7 Ship it", x: 0.1, y: 1 }
            - { k: p8, label: "8 Team project", x: 0.5, y: 1 }
            - { k: p9, label: "9 Capstone", x: 0.9, y: 1 }
          edges:
            - { a: p1, b: p2, directed: true }
            - { a: p2, b: p3, directed: true }
            - { a: p3, b: p4, directed: true }
            - { a: p4, b: p5, directed: true }
            - { a: p5, b: p6, directed: true }
            - { a: p6, b: p7, directed: true }
            - { a: p7, b: p8, directed: true }
            - { a: p8, b: p9, directed: true }
    - title: "2. The same tool, done properly"
      text: "Refactor it into classes, add tests, format it, and write a README. Same behaviour, better code."
      parts:
        - kind: graph
          id: g
          height: 260
          nodes:
            - { k: p1, label: "1 CLI tool", x: 0.1, y: 0, tone: done }
            - { k: p2, label: "2 Done properly", x: 0.5, y: 0, tone: active, note: "clean code, testing" }
            - { k: p3, label: "3 Algorithms", x: 0.9, y: 0 }
            - { k: p4, label: "4 Website", x: 0.9, y: 0.5 }
            - { k: p5, label: "5 Front end", x: 0.5, y: 0.5 }
            - { k: p6, label: "6 Full stack", x: 0.1, y: 0.5 }
            - { k: p7, label: "7 Ship it", x: 0.1, y: 1 }
            - { k: p8, label: "8 Team project", x: 0.5, y: 1 }
            - { k: p9, label: "9 Capstone", x: 0.9, y: 1 }
          edges:
            - { a: p1, b: p2, directed: true, tone: done }
            - { a: p2, b: p3, directed: true }
            - { a: p3, b: p4, directed: true }
            - { a: p4, b: p5, directed: true }
            - { a: p5, b: p6, directed: true }
            - { a: p6, b: p7, directed: true }
            - { a: p7, b: p8, directed: true }
            - { a: p8, b: p9, directed: true }
    - title: "3. Algorithm practice"
      text: "Fifty practice problems, and your own stack, queue, linked list and binary search tree."
      parts:
        - kind: graph
          id: g
          height: 260
          nodes:
