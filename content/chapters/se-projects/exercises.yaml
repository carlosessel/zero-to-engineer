- title: "Tick them off"
  items:
    - key: pj1
      text: "**1. Command-line tool.** An expense tracker or quiz game in Python that saves to a file. (Programming)"
    - key: pj2
      text: "**2. The same tool, done properly.** Refactor it into classes, add tests, format it, and write a README. (Clean code, testing)"
    - key: pj3
      text: "**3. Algorithm practice.** Solve 50 problems on a practice site and implement a stack, queue, linked list and binary search tree. (Computer science)"
    - key: pj4
      text: "**4. Personal website.** Hand-written HTML and CSS, responsive, accessible, published online. (The web)"
    - key: pj5
      text: "**5. Interactive front end.** A weather or film-search app that calls a public API, with loading and error states. (JavaScript, front end)"
    - key: pj6
      text: "**6. Full-stack application.** A task manager or small shop: front end, API, database, user accounts with correct access control. (Back end, authentication, data)"
    - key: pj7
      text: "**7. Ship it.** Put project 6 in a container, deploy it, add a CI pipeline, logging and an uptime monitor. (Shipping)"
    - key: pj8
      text: "**8. Team project.** Build something with one or two other people using branches, pull requests and code review; or land a real contribution in an open-source project. (The job)"
    - key: pj9
      text: "**9. Capstone.** Software that solves a real problem for a real person or organisation near you, used by them, maintained by you for at least a month. (Everything)"
