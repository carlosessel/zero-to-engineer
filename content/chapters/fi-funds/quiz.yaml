- question: "A fund holds investments worth GH₵ 30 million, owes GH₵ 0.5 million and has 10 million units. What is its NAV per unit?"
  options:
    - "GH₵ 2.95"
    - "GH₵ 3.00"
    - "GH₵ 3.05"
    - "GH₵ 29.5"
  answer: 0
  explanation: "(30,000,000 − 500,000) ÷ 10,000,000 = 2.95. What the fund owes is subtracted before dividing."
- question: "What is the main difference between an index fund and an active fund?"
  options:
    - "An index fund copies an index; an active fund's manager picks investments to try to beat one"
    - "Index funds hold only bonds"
    - "Active funds cannot lose money"
    - "Index funds are not regulated"
  answer: 0
  explanation: "Passive funds aim to match their index at low cost. Active funds charge more for the attempt to beat it."
- question: "Why must the average active fund trail the index after costs?"
  options:
    - "Before costs all investors together earn the market's return, and active funds charge more"
    - "Because regulators cap their returns"
    - "Because active managers are not qualified"
    - "It is not true; the average active fund beats the index"
  answer: 0
  explanation: "Investors as a group are the market. Higher fees then push the average active result below the index."
- question: "Two funds hold the same investments. One charges 0.2% a year and the other 2%. Over 30 years, the difference in what you end with is…"
  options:
    - "Very large, because the fee compounds year after year"
    - "1.8% of the final amount"
    - "1.8% of what you invested"
    - "Zero, because they hold the same investments"
  answer: 0
  explanation: "In the chapter's example, the gap reached GH₵ 69,138.66 on GH₵ 10,000, because each year's fee also loses all its future growth."
- question: "Which is true of an exchange-traded fund (ETF)?"
  options:
    - "Its units trade on a stock exchange through a broker, at a price close to its NAV"
    - "It is a bank deposit"
    - "It can only be bought from the fund manager at the end of the day"
    - "It guarantees a fixed return"
  answer: 0
  explanation: "ETFs are funds listed like shares. Unit trusts and mutual funds, by contrast, deal directly with the manager at NAV."
- question: "A fund's factsheet says it returned 12% last year. What else do you need to judge whether that was good?"
  options:
    - "Its benchmark's return over the same period, and its fees"
    - "Nothing; 12% is a good return"
    - "The manager's age"
    - "How many units were sold"
  answer: 0
  explanation: "A return only means something compared with what a suitable index did. If the benchmark returned 18%, 12% is poor."
