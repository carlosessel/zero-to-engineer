- title: Do this
  items:
    - key: x1
      text: "Find the factsheets for two funds available to you that invest in the same kind of asset. Compare their fees, largest holdings, and five-year return against their benchmark."
    - key: x2
      text: "In a spreadsheet, rebuild the fee table for 40 years, with the gross return and both fees in their own cells. Find the fee that would cost you half of the low-fee result."
    - key: x3
      text: "Check one fund and its manager on your regulator's register, and find who acts as its custodian or trustee."
    - key: x4
      text: "Read the summary of the latest SPIVA report for your region (or the nearest one) and write down the percentage of active equity funds that trailed their benchmark over 10 years."
