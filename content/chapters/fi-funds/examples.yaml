# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    10 25,423.32 21,192.76 4,230.56
    20 64,634.52 44,913.33 19,721.19
    30 164,322.41 95,183.75 69,138.66
  verify: |
    grow = ns["grow"]
    assert f"{grow(10000, 1, 0.10, 0.002):,.2f}" == "10,978.00"
    assert f"{grow(10000, 1, 0.10, 0.02):,.2f}" == "10,780.00"
    assert round((50_000_000 - 200_000) / 20_000_000, 2) == 2.49
    assert round(1000 / 2.49, 2) == 401.61
    assert round((12_000_000 - 50_000) / 8_000_000, 5) == 1.49375
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    assert block.strip().splitlines()[2] == "30 164,322.41 95,183.75 69,138.66"
