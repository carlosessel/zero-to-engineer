    - kind: tables
      id: t
      slots: 6
      tables:
      - id: s
        title: GH₵ 10,000 at 10% a year before fees
        columns:
        - year
        - 0.2% fee
        - 2% fee
        - gap
        rows:
        - k: y0
          cells:
          - '0'
          - 10,000.00
          - 10,000.00
          - '0.00'
          tone: active
