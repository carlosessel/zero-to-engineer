- title: Do this
  items:
  - key: x1
    text: Write a one-paragraph problem statement for the next feature you work on, including how success will be measured
  - key: x2
    text: Break a large task of yours into slices of a few days each, riskiest first
  - key: x3
    text: Send a written status update with the point first, a risk and a decision needed
  - key: x4
    text: Score your team's backlog with RICE and discuss where the scores disagree with intuition
