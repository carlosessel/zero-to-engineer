- block: 7
  lang: python
  check: illustration
  note: Needs a real PDF and the Files API, which the stand-in server does not imitate. The verify step checks the SDK has the upload call and accepts the document block's shape.
  verify: |
    import anthropic, inspect
    c = anthropic.Anthropic(api_key='x')
    assert 'file' in inspect.signature(c.files.upload).parameters
    assert '"citations": {"enabled": True}' in block and '"type": "file", "file_id"' in block
