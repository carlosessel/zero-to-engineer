# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API.'
  replies:
  - text: 'Yes: our seeded rye and the almond cake are made without gluten, though the kitchen handles wheat.'
  verify: |
    r = requests[-1]
    assert r['output_config'] == {'effort': 'low'} and r['stop_sequences'] == ['END']
    assert r['metadata'] == {'user_id': 'customer-7f3a'}
    assert 'without gluten' in out and 'end_turn' in out
- block: 2
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API.'
  replies:
  - text: A white sandwich loaf, Kofi.
  - text: Your name is Kofi.
  verify: |
    assert '4 messages in the history' in out
    assert len(requests[-1]['messages']) == 3
    assert requests[-1]['messages'][1]['role'] == 'assistant'
- block: 3
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API.'
  replies:
  - text: A starter is flour and water that wild yeast lives in.
  verify: |
    assert 'wild yeast' in out and 'stopped because: end_turn' in out
    assert requests[-1]['stream'] is True
- block: 4
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API. The stand-in reports the cached part as written on the first request and read on the second, as the real API does within the cache''s lifetime.'
  verify: |
    lines = out.strip().splitlines()
    import re
    first = [int(x) for x in re.findall(r'\d+', lines[0])]
    second = [int(x) for x in re.findall(r'\d+', lines[1])]
    assert first[0] > 0 and first[1] == 0
    assert second[0] == 0 and second[1] == first[0]
    assert requests[0]['system'][1]['cache_control'] == {'type': 'ephemeral'}
