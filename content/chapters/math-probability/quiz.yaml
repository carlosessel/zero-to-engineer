- question: "Two fair coins are flipped. Probability both are heads?"
  options:
    - "0.5"
    - "0.25"
    - "1"
  answer: 1
  explanation: "Independent events multiply: 0.5 × 0.5."
- question: "The data is 3, 4, 5, 6, 100. Which summary is least distorted by the 100?"
  options:
    - "The mean"
    - "The median"
    - "The total"
  answer: 1
  explanation: "The median is the middle value, so one extreme number does not move it."
- question: "Why is a score from 10 test cases unreliable?"
  options:
    - "Small samples swing a lot by chance"
    - "Ten is an unlucky number"
    - "Models dislike small tests"
  answer: 0
  explanation: "As the coin demo shows, small samples can be far from the true rate."
