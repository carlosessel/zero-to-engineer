- question: "How should passwords be stored?"
  options:
    - "As plain text"
    - "As salted hashes from a password-hashing function"
    - "Encrypted with a key kept in the code"
  answer: 1
  explanation: "A hash cannot be reversed, so a stolen database does not reveal passwords."
- question: "A page hides the “delete” button from normal users. Is the delete action protected?"
  options:
    - "Yes"
    - "No, the server must check permission on every request"
  answer: 1
  explanation: "Hiding a button is cosmetic. The API can be called directly."
