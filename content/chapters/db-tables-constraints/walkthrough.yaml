- id: db-tables-constraints-no-overlap
  title: No oven booked twice at once
  hint: Watch each booking arrive. The exclusion constraint compares it with every booking for the same oven and refuses any that overlap.
  language: SQL
  code: |
    CREATE EXTENSION IF NOT EXISTS btree_gist;

    CREATE TABLE oven_bookings (
      oven    integer NOT NULL,
      baker   text NOT NULL,
      during  tstzrange NOT NULL,
      EXCLUDE USING gist (oven WITH =, during WITH &&)
    );

    INSERT INTO oven_bookings VALUES (1, 'Yaw', '[2026-11-15 05:00+00, 2026-11-15 07:00+00)');
    INSERT INTO oven_bookings VALUES (2, 'Adwoa', '[2026-11-15 06:00+00, 2026-11-15 08:00+00)');
    INSERT INTO oven_bookings VALUES (1, 'Adwoa', '[2026-11-15 06:30+00, 2026-11-15 07:30+00)');
    INSERT INTO oven_bookings VALUES (1, 'Adwoa', '[2026-11-15 07:00+00, 2026-11-15 08:00+00)');

    SELECT oven, baker, during FROM oven_bookings ORDER BY oven, during;
  steps:
    - title: The rule
      text: "The constraint says: no two rows may have the same oven (oven WITH =) and overlapping times (during WITH &&). The boxes below are half hours on 15 November, from 05:00 to 08:00."
      lines: [7]
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          indices: false
          items: [{ k: a, v: "·" }, { k: b, v: "·" }, { k: c, v: "·" }, { k: d, v: "·" }, { k: e, v: "·" }, { k: f, v: "·" }]
        - kind: cells
          id: o2
          label: "oven 2, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: "·" }, { k: b, v: "·" }, { k: c, v: "·" }, { k: d, v: "·" }, { k: e, v: "·" }, { k: f, v: "·" }]
        - { kind: terminal, id: out, lines: [], slots: 2 }
    - title: Yaw books oven 1
      text: Yaw takes oven 1 from 05:00 to 07:00. The table is empty, so nothing can conflict and the row is stored.
      lines: [10]
      vars: { oven: "1", during: "[05:00, 07:00)" }
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw, tone: found }, { k: b, v: Yaw, tone: found }, { k: c, v: Yaw, tone: found }, { k: d, v: Yaw, tone: found }, { k: e, v: "·" }, { k: f, v: "·" }]
        - { kind: terminal, id: out, lines: ["INSERT 0 1"], slots: 2 }
    - title: Adwoa books oven 2
      text: Adwoa's 06:00 to 08:00 overlaps Yaw's time, but on a different oven. Both conditions must match for a conflict, so this row is stored too.
      lines: [11]
      vars: { oven: "2", during: "[06:00, 08:00)" }
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw }, { k: b, v: Yaw }, { k: c, v: Yaw }, { k: d, v: Yaw }, { k: e, v: "·" }, { k: f, v: "·" }]
        - kind: cells
          id: o2
          label: "oven 2, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: "·" }, { k: b, v: "·" }, { k: c, v: Adwoa, tone: found }, { k: d, v: Adwoa, tone: found }, { k: e, v: Adwoa, tone: found }, { k: f, v: Adwoa, tone: found }]
        - { kind: terminal, id: out, lines: ["INSERT 0 1", "INSERT 0 1"], slots: 2 }
    - title: An overlap on oven 1
      text: Adwoa now asks for oven 1 from 06:30 to 07:30. The half hour from 06:30 to 07:00 is already Yaw's, so the same oven and overlapping times means a conflict.
      lines: [12]
      vars: { oven: "1", during: "[06:30, 07:30)" }
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw }, { k: b, v: Yaw }, { k: c, v: Yaw }, { k: d, v: "clash", tone: bad }, { k: e, v: Adwoa, tone: compare }, { k: f, v: "·" }]
        - kind: cells
          id: o2
          label: "oven 2, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: "·" }, { k: b, v: "·" }, { k: c, v: Adwoa }, { k: d, v: Adwoa }, { k: e, v: Adwoa }, { k: f, v: Adwoa }]
    - title: The insert is refused
      text: The database refuses the whole row and names the constraint. Nothing about the booking is stored.
      lines: [12]
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw }, { k: b, v: Yaw }, { k: c, v: Yaw }, { k: d, v: Yaw }, { k: e, v: "·" }, { k: f, v: "·" }]
        - { kind: terminal, id: out, lines: ["ERROR:  conflicting key value violates exclusion constraint", "        \"oven_bookings_oven_during_excl\""], slots: 2 }
    - title: Touching is not overlapping
      text: "In a range, [ includes the start and ) excludes the end. Yaw's booking ends at 07:00 and this one starts at 07:00, so they do not overlap and the row is stored."
      lines: [13]
      vars: { oven: "1", during: "[07:00, 08:00)" }
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw }, { k: b, v: Yaw }, { k: c, v: Yaw }, { k: d, v: Yaw }, { k: e, v: Adwoa, tone: found }, { k: f, v: Adwoa, tone: found }]
        - { kind: terminal, id: out, lines: ["INSERT 0 1"], slots: 2 }
    - title: Three bookings, no clashes
      text: The table holds three rows. The database checked every insert, so this stays true however many people book at once.
      lines: [15]
      vars: {}
      parts:
        - kind: cells
          id: o1
          label: "oven 1, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: Yaw, tone: done }, { k: b, v: Yaw, tone: done }, { k: c, v: Yaw, tone: done }, { k: d, v: Yaw, tone: done }, { k: e, v: Adwoa, tone: done }, { k: f, v: Adwoa, tone: done }]
        - kind: cells
          id: o2
          label: "oven 2, half hours from 05:00"
          slots: 6
          items: [{ k: a, v: "·" }, { k: b, v: "·" }, { k: c, v: Adwoa, tone: done }, { k: d, v: Adwoa, tone: done }, { k: e, v: Adwoa, tone: done }, { k: f, v: Adwoa, tone: done }]
        - { kind: terminal, id: out, lines: ["(3 rows)"], slots: 2 }
