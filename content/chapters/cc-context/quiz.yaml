- question: What belongs in a project's CLAUDE.md?
  options:
  - A description of the folder structure
  - The commands to test, type-check and lint, and decisions Claude cannot see in the code
  - The whole architecture document
  answer: 1
  explanation: Claude reads the code itself; write only what it cannot find.
- question: Claude keeps ignoring a line in CLAUDE.md. What does the documentation suggest?
  options:
  - Write it in capitals with IMPORTANT
  - Shorten the file, or turn the rule into a hook or permission rule
  - Repeat the line three times
  answer: 1
  explanation: Emphasis rarely fixes it; enforcement or a shorter file does.
- question: You have corrected the same mistake twice and it is still wrong. Best next step?
  options:
  - A third, more forceful correction
  - /clear and one better prompt that includes what you learnt
  - Switch model
  answer: 1
  explanation: The conversation is full of failed attempts; a fresh, better prompt works better.
- question: Where do your personal preferences for one project go?
  options:
  - The shared CLAUDE.md
  - CLAUDE.local.md, ignored by Git
  answer: 1
  explanation: Keep the shared file for the team.
- question: 'A 30-line procedure for cutting a release: CLAUDE.md or a skill?'
  options:
  - CLAUDE.md, so it is always known
  - A skill, loaded only when a release is needed
  answer: 1
  explanation: Every CLAUDE.md line costs attention on every task.
