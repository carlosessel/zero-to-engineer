# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: markdown
  check: illustration
  verify: |
    assert block.startswith('# Commands')
    for section in ('# Commands', '# Conventions', '# Gotchas'):
        assert section in block
    assert len(block.splitlines()) < 200
- block: 2
  lang: markdown
  check: illustration
  verify: |
    lines = [l for l in block.splitlines() if l.strip()]
    assert len(lines) <= 12, len(lines)
