- question: Which structure fits an undo feature?
  options:
  - Queue
  - Stack
  answer: 1
  explanation: The last action is undone first.
- question: Why is queue.shift() in a loop a problem in JavaScript?
  options:
  - It is O(n), so processing becomes O(n²)
  - It removes the last item
  answer: 0
  explanation: Use an index or a real queue.
- question: When is a linked list a good choice?
  options:
  - When you need fast access by position
  - When you hold a node and must remove it in O(1), as in an LRU cache
  answer: 1
  explanation: Otherwise arrays usually win.
- question: What does a ring buffer of size 1,000 that overwrites when full keep?
  options:
  - The first 1,000 items
  - The most recent 1,000 items
  answer: 1
  explanation: Ideal for recent logs or metrics.
