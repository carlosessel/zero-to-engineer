- question: What is the main value of design patterns besides reuse?
  options:
  - A shared vocabulary for designs
  - They make code run faster
  answer: 0
  explanation: Naming a pattern communicates a whole design in a few words.
- question: When is a factory better than wiring one implementation in the DI container?
  options:
  - When the choice depends on run-time data, such as the customer's country
  - Always
  answer: 0
  explanation: The container decides at start-up; a factory decides per call.
- question: What problem does a builder solve?
  options:
  - Constructors with many unnamed optional arguments and cross-field rules
  - Objects that need to be copied
  answer: 0
  explanation: Each setting is named and build() validates the whole.
- question: Why is a globally reached singleton usually a mistake?
  options:
  - It is hidden global state that makes dependencies invisible and tests hard
  - It uses too much memory
  answer: 0
  explanation: Let the container give one shared instance through constructors instead.
- question: What does a shallow copy share with the original?
  options:
  - Nested objects and arrays
  - Nothing
  answer: 0
  explanation: Use a deep copy such as structuredClone, or immutable data.
- question: Which DI lifetime gives one instance per web request?
  options:
  - Scoped
  - Transient
  - Singleton
  answer: 0
  explanation: Transient is new each time; singleton is one for the whole application.
