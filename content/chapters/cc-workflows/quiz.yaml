- question: What does plan mode do?
  options:
  - Lets Claude investigate but not edit until you approve a plan
  - Makes Claude work faster
  - Turns off all tools
  answer: 0
  explanation: Enter it with Shift+Tab or /plan.
- question: Claude reports 'all tests pass'. What should you ask for?
  options:
  - Nothing more
  - The command it ran and its output, as evidence
  - A longer summary
  answer: 1
  explanation: Reading the output is quicker than rerunning it, and it is the only evidence for an unwatched session.
- question: In test-driven work with Claude, why say 'don't change the tests'?
  options:
  - Tests are slow to edit
  - So it solves the problem rather than editing the tests until they pass
  - Claude cannot edit tests
  answer: 1
  explanation: The tests define correctness.
- question: Why does /code-review use a fresh agent?
  options:
  - It is cheaper
  - It has not seen the reasoning that produced the code, so it judges independently
  - It has more tools
  answer: 1
  explanation: A fresh reviewer is not swayed by the original reasoning.
- question: When asking a subagent to review against a spec, why add 'skip style'?
  options:
  - Style does not matter
  - A reviewer asked to find problems always finds something; fixing every nitpick adds needless complexity
  answer: 1
  explanation: Focus the review on correctness gaps.
