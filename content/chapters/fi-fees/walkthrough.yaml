- id: fi-fees-stack
  title: Costs, layer by layer
  hint: Each cost is a percentage of the whole balance, not of the gain. Watch how much of the real return is left.
  steps:
  - title: Before costs
    text: Ama's investments return 10% in a year. On GH₵ 10,000 that is GH₵ 1,000, before anyone takes anything.
    parts:
    - kind: tables
      id: t
      slots: 4
      tables:
      - id: s
        title: What is left of a year's return
        columns:
        - after
        - return
        - on 10,000
        rows:
        - k: r0
          cells:
          - before costs
          - 10.00%
          - GH₵ 1,000
          tone: active
  - title: The fund charge
    text: 'The fund takes 1.5% of everything she has, not of the gain: 1.10 × 0.985 = 1.0835. Her return is now 8.35%.'
    parts:
    - kind: tables
      id: t
      slots: 4
      tables:
      - id: s
        title: What is left of a year's return
        columns:
        - after
        - return
        - on 10,000
        rows:
        - k: r0
          cells:
          - before costs
          - 10.00%
          - GH₵ 1,000
          tone: dim
        - k: r1
          cells:
          - fund charge 1.5%
          - 8.35%
          - '835'
          tone: active
  - title: The platform fee
    text: 'The app takes another 0.5% of her balance: 1.0835 × 0.995 = 1.0781. Her return is 7.81%: costs have taken 2.19 points.'
    parts:
    - kind: tables
      id: t
      slots: 4
      tables:
      - id: s
        title: What is left of a year's return
        columns:
        - after
        - return
        - on 10,000
        rows:
        - k: r0
          cells:
          - before costs
          - 10.00%
          - GH₵ 1,000
          tone: dim
        - k: r1
          cells:
          - fund charge 1.5%
          - 8.35%
          - '835'
          tone: dim
        - k: r2
          cells:
          - platform 0.5%
          - 7.81%
          - '781'
          tone: active
  - title: Inflation
    text: 'Prices rose 6%, so in real terms: 1.0781 ÷ 1.06 = 1.0171. She is only 1.71% richer, about GH₵ 171 in today''s money.'
    parts:
    - kind: tables
      id: t
      slots: 4
      tables:
      - id: s
        title: What is left of a year's return
        columns:
        - after
        - return
        - on 10,000
        rows:
        - k: r0
          cells:
          - before costs
          - 10.00%
          - GH₵ 1,000
          tone: dim
        - k: r1
          cells:
          - fund charge 1.5%
          - 8.35%
          - '835'
          tone: dim
        - k: r2
          cells:
          - platform 0.5%
          - 7.81%
          - '781'
          tone: dim
        - k: r3
          cells:
          - inflation 6%
          - 1.71%
          - '171'
          tone: found
  - title: Who got what
    text: Without costs, her real return would have been 3.77%. Costs of 2% a year took more than half of what actually made her richer.
    parts:
    - kind: kv
      id: k
      label: Real return
      slots: 3
      rows:
      - name: without costs
        value: 3.77%
      - name: with costs
        value: 1.71%
      - name: taken by costs
        value: more than half
        tone: found
