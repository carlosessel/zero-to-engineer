- title: Do this
  items:
    - key: x1
      text: "For any investment or pension you hold (or one you are considering), list every cost you can find: fund charge, platform fee, trading costs, entry and exit fees. Add them into one yearly figure in cedis."
    - key: x2
      text: "Write to a provider asking: what will I pay in total each year for GH₵ 10,000 invested, and what does it cost to leave? Note how clearly they answer."
    - key: x3
      text: "In a spreadsheet, show GH₵ 10,000 growing for 30 years at 10% with total costs of 0.2%, 1% and 2%, and the share of the gain each cost takes."
    - key: x4
      text: "Compare two platforms or brokers available to you, one with percentage fees and one with flat fees, and find the balance at which they cost the same."
