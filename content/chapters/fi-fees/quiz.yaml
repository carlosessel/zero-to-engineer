- question: "A fund charges 1.2% a year and the platform holding it charges 0.4%. What is the yearly cost on GH₵ 25,000?"
  options:
    - "GH₵ 400"
    - "GH₵ 300"
    - "GH₵ 100"
    - "GH₵ 160"
  answer: 0
  explanation: "Add both: 1.2% + 0.4% = 1.6%, and 1.6% of 25,000 is 400. Looking only at the fund charge would give 300."
- question: "Platform A charges 0.5% a year; Platform B charges a flat GH₵ 150. For which balance is B cheaper?"
  options:
    - "GH₵ 50,000"
    - "GH₵ 10,000"
    - "GH₵ 25,000"
    - "GH₵ 20,000"
  answer: 0
  explanation: "They cost the same at 150 ÷ 0.005 = 30,000. Above that, the flat fee is cheaper: at 50,000, A costs 250."
- question: "Investments return 10% and inflation is 6%. Fees of 2% a year take roughly what share of the real return?"
  options:
    - "More than half"
    - "A fifth"
    - "2%"
    - "None, because fees are paid from the nominal return"
  answer: 0
  explanation: "The real return falls from 3.77% to 1.70%, so fees take about 55% of it. Fees come out of the part that makes you richer."
- question: "A fund has a 5% entry fee. What must it gain before you are back to the amount you paid in?"
  options:
    - "About 5.26%"
    - "Exactly 5%"
    - "About 4.76%"
    - "Nothing; the fee is refunded later"
  answer: 0
  explanation: "Only 95% is invested, so it must grow by 1 ÷ 0.95 − 1 = 5.26% to return to 100%."
- question: "Which cost is often hidden rather than shown as a separate fee?"
  options:
    - "A margin built into the exchange rate when buying foreign investments"
    - "A broker's stated commission"
    - "A platform's published yearly fee"
    - "A fund's ongoing charge on its factsheet"
  answer: 0
  explanation: "Currency margins, spreads and trading costs inside funds are often not listed as fees, though they reduce your return."
- question: "Why does a flat per-trade fee make frequent small purchases expensive?"
  options:
    - "The same fee is a much larger percentage of a small amount"
    - "Small trades pay higher tax"
    - "Exchanges refuse small trades"
    - "Flat fees rise with the amount traded"
  answer: 0
  explanation: "GH₵ 20 is 2% of GH₵ 1,000 but 0.2% of GH₵ 10,000. With fixed charges, invest less often in larger amounts."
