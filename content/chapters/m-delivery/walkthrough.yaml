- id: m-delivery-canary
  title: Judging a canary step by step
  hint: The same baseline, four different canaries. Watch which check decides each verdict.
  language: TypeScript
  code: |
    type Stats = { requests: number; errors: number; p99Ms: number };

    function canaryVerdict(baseline: Stats, canary: Stats): string {
      const baselineErrorRate = baseline.errors / baseline.requests;
      const canaryErrorRate = canary.errors / canary.requests;
      if (canary.requests < 500) return "wait: not enough canary traffic yet";
      if (canaryErrorRate > baselineErrorRate * 1.5 + 0.001) return `roll back: error rate ${(canaryErrorRate * 100).toFixed(2)}% vs ${(baselineErrorRate * 100).toFixed(2)}%`;
      if (canary.p99Ms > baseline.p99Ms * 1.2) return `roll back: p99 ${canary.p99Ms} ms vs ${baseline.p99Ms} ms`;
      return "promote to the next step";
    }

    const baseline = { requests: 95_000, errors: 190, p99Ms: 240 };
    console.log(canaryVerdict(baseline, { requests: 300, errors: 0, p99Ms: 230 }));
    console.log(canaryVerdict(baseline, { requests: 5_000, errors: 11, p99Ms: 250 }));
    console.log(canaryVerdict(baseline, { requests: 5_000, errors: 60, p99Ms: 245 }));
    console.log(canaryVerdict(baseline, { requests: 5_000, errors: 9, p99Ms: 410 }));
  steps:
    - title: The baseline
      text: The current version has served 95,000 requests with 190 errors, an error rate of 0.20%, and a p99 latency of 240 ms. Each canary is compared with it, measured over the same time.
      lines: [12]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stats
              columns: ["", baseline, canary]
              rows: [[requests, "95,000", "–"], [errors, "190", "–"], [error rate, "0.20%", "–"], [p99, "240 ms", "–"]]
        - { kind: note, id: v, text: "verdict: not yet asked", tone: dim }
    - title: "Canary 1: too little traffic"
      text: Only 300 requests have reached the canary. With fewer than 500, any error rate would be mostly luck, so the answer is to wait.
      lines: [6, 13]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stats
              columns: ["", baseline, canary]
              rows: [[requests, "95,000", "300"], [errors, "190", "0"], [error rate, "0.20%", "0.00%"], [p99, "240 ms", "230 ms"]]
        - { kind: note, id: v, text: "wait: not enough canary traffic yet", tone: compare }
    - title: "Canary 2: within tolerance"
      text: 11 errors in 5,000 is 0.22%. The limit is 1.5 times the baseline plus 0.1 points, 0.40%, and 250 ms is under 1.2 × 240 = 288 ms. Both checks pass.
      lines: [7, 8, 9, 14]
      vars: { "error limit": "0.40%", "p99 limit": "288 ms" }
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stats
              columns: ["", baseline, canary]
              rows: [[requests, "95,000", "5,000"], [errors, "190", "11"], [error rate, "0.20%", "0.22%"], [p99, "240 ms", "250 ms"]]
        - { kind: note, id: v, text: "promote to the next step", tone: found }
    - title: "Canary 3: too many errors"
      text: 60 errors in 5,000 is 1.20%, far above the 0.40% limit. The error check fails first, so the canary is rolled back.
      lines: [7, 15]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stats
              columns: ["", baseline, canary]
              rows: [[requests, "95,000", "5,000"], [errors, "190", "60"], { cells: [error rate, "0.20%", "1.20%"], tone: bad }, [p99, "240 ms", "245 ms"]]
        - { kind: note, id: v, text: "roll back: error rate 1.20% vs 0.20%", tone: bad }
    - title: "Canary 4: too slow"
      text: 9 errors is only 0.18%, so the error check passes. But a p99 of 410 ms is above the 288 ms limit, so this canary is rolled back too.
      lines: [7, 8, 16]
      parts:
        - kind: tables
          id: t
          slots: 4
          tables:
            - id: s
              title: stats
              columns: ["", baseline, canary]
              rows: [[requests, "95,000", "5,000"], [errors, "190", "9"], [error rate, "0.20%", "0.18%"], { cells: [p99, "240 ms", "410 ms"], tone: bad }]
        - { kind: note, id: v, text: "roll back: p99 410 ms vs 240 ms", tone: bad }
    - title: Why compare with the baseline
      text: Each canary is judged against the current version at the same time, not a fixed number, which cancels out daily traffic patterns. Real tools use statistics over several metrics; the idea is the same.
      vars: {}
