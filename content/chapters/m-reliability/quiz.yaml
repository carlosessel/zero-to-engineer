- question: What is an error budget?
  options:
  - The share of failures the SLO allows, spent on risk and releases
  - Money set aside for outages
  answer: 0
  explanation: When it runs out, reliability work takes priority.
- question: How much full downtime does 99.9% allow in 30 days?
  options:
  - About 43 minutes
  - About 4 minutes
  answer: 0
  explanation: Each extra nine is ten times stricter.
- question: When should an SLO alert page someone?
  options:
  - On a fast burn rate confirmed over a short recent window
  - Whenever any request fails
  answer: 0
  explanation: Slow burns become tickets.
- question: What should responders do first in an outage?
  options:
  - 'Mitigate: roll back, switch off a flag, fail over'
  - Find the root cause
  answer: 0
  explanation: Restore service, then investigate.
- question: What makes a postmortem blameless?
  options:
  - It looks for weaknesses in systems that let reasonable actions cause harm
  - It names no one and changes nothing
  answer: 0
  explanation: Action items should change systems, not people.
- question: Why does replication not replace backups?
  options:
  - Mistakes such as a deleted table are replicated too
  - Replicas are slower
  answer: 0
  explanation: Keep protected backups and test restores.
