- title: "Do this"
  items:
    - key: x1
      text: "Make an array of five things you own and print them with for…of and with forEach"
    - key: x2
      text: "Make an array of at least five objects describing something you know (films, players, recipes) and answer three questions about it with map, filter, find or reduce"
    - key: x3
      text: "Show the reference trap to yourself: change an array through a second name, then fix it with the spread syntax"
    - key: x4
      text: "Turn your array of objects into JSON and back, and print one property of the result"
    - key: x5
      text: "Do all 30 practice problems before looking at the solutions"
