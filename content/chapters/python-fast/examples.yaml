# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    ('ama', 'esi', ['kofi', 'esi'])
    0 ama
    1 kofi
    2 esi
    ama 21
    kofi 19
  verify: |
    assert ns['upper'] == ['KOFI'] and ns['lengths'] == {'ama': 3, 'kofi': 4, 'esi': 3}
    assert ns['describe']([0.9, 0.8]) == 'good (0.85)' and ns['describe']([0.5]) == 'needs work (0.50)'
- block: 2
  lang: python
  check: python
  output: |
    no such doc: list index out of range
  verify: |
    assert ns['docs'][0].words() == 6
- block: 3
  lang: python
  check: python
  output: |
    ['A', 'B', 'C']
  before: |
    import time
    _started = time.time()
  verify: |
    import time
    elapsed = time.time() - ns['_started']
    assert elapsed < 2.5, f'took {elapsed:.1f}s; the chapter says about 1 second, not 3'
  note: The hidden setup only starts a clock, to check the claim that the three calls take about one second in total.
