- question: "Where does display: flex go?"
  options:
    - "On the container whose children you want to arrange"
    - "On each item"
    - "On the body only"
  answer: 0
  explanation: "The container becomes a flex container and its direct children become flex items."
- question: "In a default flex row, which property spreads items out left to right?"
  options:
    - "align-items"
    - "justify-content"
    - "flex-wrap"
  answer: 1
  explanation: "justify-content works along the main axis, which runs left to right in a row. align-items works across it."
- question: "A grid is 400px wide with grid-template-columns: 1fr 1fr and gap: 20px. How wide is each column?"
  options:
    - "200px"
    - "190px"
    - "180px"
  answer: 1
  explanation: "One gap of 20 leaves 380, shared equally: 190 each."
- question: "What does flex-wrap: wrap do?"
  options:
    - "Lets items move onto a new line when there is not enough room"
    - "Puts a border round the items"
    - "Hides items that do not fit"
  answer: 0
  explanation: "Without it, flex items stay on one line and shrink."
- question: "Which tool suits a layout where rows and columns must line up, such as a page with header, sidebar, content and footer?"
  options:
    - "Flexbox"
    - "Grid"
    - "position: absolute"
  answer: 1
  explanation: "Grid handles two dimensions at once. Flexbox handles one line at a time."
- question: "Why should the visual order on screen match the order in the HTML?"
  options:
    - "Keyboard and screen reader users follow the HTML order"
    - "Otherwise the CSS will not load"
    - "Search engines require it"
  answer: 0
  explanation: "If CSS rearranges things visually, Tab order and reading order no longer match what sighted users see."
