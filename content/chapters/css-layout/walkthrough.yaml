- id: css-layout-fr-columns
  title: How wide is each column?
  hint: Watch the grid take the gaps out first, then share what is left between the columns by their fr numbers.
  language: CSS
  examples:
    - label: 1fr 1fr 1fr
      code: |
        .grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 16px;
          width: 600px;
        }
      steps:
        - title: A 600-pixel grid
          text: The grid container is 600 pixels wide. That is all the room its columns and gaps can use.
          lines: [5]
          vars: { width: 600px }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: free, v: 600, tone: active }]
        - title: Gaps come out first
          text: Three columns have two gaps between them, never at the edges. 2 × 16 is 32 pixels of gaps.
          lines: [3, 4]
          vars: { width: 600px, gaps: "2 × 16 = 32px" }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: free, v: 600 }, { k: g1, v: 16, tone: compare }, { k: g2, v: 16, tone: compare }]
        - title: The free space
          text: fr means a fraction of the free space. What is free is 600 − 32, which is 568 pixels.
          vars: { width: 600px, gaps: 32px, free: "600 − 32 = 568px" }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: free, v: 568, tone: active }, { k: g1, v: 16, tone: dim }, { k: g2, v: 16, tone: dim }]
        - title: Three equal shares
          text: Three 1fr columns make three shares in all, so each gets 568 ÷ 3, about 189.3 pixels.
          lines: [3]
          vars: { free: 568px, shares: "1 + 1 + 1 = 3", "one share": "568 ÷ 3 ≈ 189.3px" }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: c1, v: 189.3, tone: found }, { k: g1, v: 16 }, { k: c2, v: 189.3, tone: found }, { k: g2, v: 16 }, { k: c3, v: 189.3, tone: found }]
        - title: It adds back up
          text: Three columns and two gaps fill the 600 pixels exactly (allowing for rounding). Change the width and the columns follow.
          parts:
            - { kind: note, id: n, text: "189.3 + 16 + 189.3 + 16 + 189.3 ≈ 600", tone: found }
    - label: 2fr 1fr 1fr
      code: |
        .grid {
          display: grid;
          grid-template-columns: 2fr 1fr 1fr;
          gap: 16px;
          width: 600px;
        }
      steps:
        - title: Same grid, same free space
          text: The width and gap have not changed, so the free space is still 600 − 32 = 568 pixels.
          lines: [4, 5]
          vars: { width: 600px, gaps: 32px, free: 568px }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: free, v: 568, tone: active }, { k: g1, v: 16, tone: dim }, { k: g2, v: 16, tone: dim }]
        - title: Count the shares
          text: 2fr 1fr 1fr is 2 + 1 + 1 = 4 shares. One share is 568 ÷ 4, which is 142 pixels.
          lines: [3]
          vars: { free: 568px, shares: "2 + 1 + 1 = 4", "one share": "568 ÷ 4 = 142px" }
        - title: The first column takes two
          text: The first column gets two shares, 284 pixels; the other two get one each, 142 pixels.
          lines: [3]
          vars: { free: 568px, "one share": 142px, first: "2 × 142 = 284px" }
          parts:
            - kind: cells
              id: c
              label: "across the grid, in pixels"
              bars: true
              slots: 5
              width: 70
              items: [{ k: c1, v: 284, tone: found }, { k: g1, v: 16 }, { k: c2, v: 142, tone: found }, { k: g2, v: 16 }, { k: c3, v: 142, tone: found }]
        - title: Gaps are never shared out
          text: The gaps stay 16 pixels whatever the fr numbers are. Only the free space after the gaps is divided.
          parts:
            - { kind: note, id: n, text: "284 + 16 + 142 + 16 + 142 = 600", tone: found }
