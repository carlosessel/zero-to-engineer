  lang: css
  check: browser
  expect:
  - (() => { document.body.innerHTML = '<div class="buttons" style="width:500px"><button>A</button><button>B</button><button>C</button></div>'; const c = document.querySelector('.buttons').getBoundingClientRect(); const b = [...document.querySelectorAll('button')].map(e => e.getBoundingClientRect()); return b[2].right === c.right && Math.round(b[1].left - b[0].right) === 8; })()
- block: 14
  lang: css
  check: browser
  expect:
  - (() => { document.body.innerHTML = '<div class="page" style="width:900px"><aside>s</aside><main>m</main></div>'; const a = document.querySelector('aside').getBoundingClientRect(), m = document.querySelector('main').getBoundingClientRect(); return a.width === 250 && Math.round(m.left - a.right) === 24 && Math.round(m.width) === 626; })()
  note: 'In a 900-pixel container: a 250 sidebar, a 24 gap, and 626 for the content.'
