# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: html
  check: browser
  combine:
  - 1
  - 2
  expect:
  - (() => { const r = [...document.querySelectorAll('.item')].map(e => e.getBoundingClientRect()); return r[0].top === r[2].top && Math.round(r[1].left - r[0].right) === 12; })()
  note: The three items sit in one row with exactly 12 pixels between them.
- block: 2
  lang: css
  check: web
- block: 3
  lang: html
  check: browser
  combine:
  - 3
  - 4
  expect:
  - Math.round(document.querySelector('.logo').getBoundingClientRect().left - document.querySelector('.bar').getBoundingClientRect().left) === 16
  - Math.round(document.querySelector('.bar').getBoundingClientRect().right - document.querySelector('.links li:last-child').getBoundingClientRect().right) === 16
  - Math.abs((document.querySelector('.logo').getBoundingClientRect().top + document.querySelector('.logo').getBoundingClientRect().bottom) / 2 - (document.querySelector('.links').getBoundingClientRect().top + document.querySelector('.links').getBoundingClientRect().bottom) / 2) < 1
  - (() => { const r = [...document.querySelectorAll('.links li')].map(e => e.getBoundingClientRect()); return r[0].top === r[2].top && Math.round(r[1].left - r[0].right) === 16; })()
  - getComputedStyle(document.querySelector('.links li')).listStyleType === 'none'
  note: The logo is at the left edge (inside 16 pixels of padding), the last link at the right, both vertically centred, and the links in a row 16 pixels apart with no bullets.
