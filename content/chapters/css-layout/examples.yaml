    width: 375
    height: 700
  expect:
  - (() => { document.body.innerHTML = '<div class="products">' + '<div class="product">x</div>'.repeat(4) + '</div>'; const r = [...document.querySelectorAll('.product')].map(e => e.getBoundingClientRect()); return new Set(r.map(x => x.top)).size === 4; })()
  note: At phone width (375 pixels) the four products wrap onto four rows, because two 200-pixel cards and a gap do not fit.
- block: 17
  lang: css
  check: browser
  expect:
  - (() => { document.body.innerHTML = '<div class="layout"><header style="grid-area:header">h</header><div style="grid-area:a">a</div><div style="grid-area:b">b</div><div style="grid-area:c">c</div><footer style="grid-area:footer">f</footer></div>'; const L = document.querySelector('.layout').getBoundingClientRect(); const h = document.querySelector('header').getBoundingClientRect(); const a = document.querySelector('[style*="area:a"]').getBoundingClientRect(), c = document.querySelector('[style*="area:c"]').getBoundingClientRect(); return h.width === L.width && a.top === c.top && a.top > h.top; })()
