- title: "Do this"
  items:
    - key: x1
      text: "Rebuild the navigation bar from this chapter for your own page, keeping it a list inside a nav"
    - key: x2
      text: "Make a grid of at least six cards that wraps as the window narrows"
    - key: x3
      text: "Lay out a whole page with grid-template-areas: header, sidebar, content and footer"
    - key: x4
      text: "Turn on the flex and grid overlays in the developer tools on your page and on a site you use"
    - key: x5
      text: "Finish the first 12 levels of Flexbox Froggy and Grid Garden"
