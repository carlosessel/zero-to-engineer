- title: "Do this"
  items:
    - key: x1
      text: "Submit the order form in this chapter empty, then filled in, and read what the message says it would send"
    - key: x2
      text: "Remove the `name` from one field in the order form (with Edit) and confirm it disappears from what is sent"
    - key: x3
      text: "Build a contact form with name, email, a subject drop-down, a message box and a checkbox, all labelled, and check it with the validator"
    - key: x4
      text: "Use only the keyboard to fill in and submit your form: Tab to move, Space to tick, arrow keys for radio buttons, Enter to submit"
    - key: x5
      text: "Make a table of your weekly timetable with a caption and row and column headings"
