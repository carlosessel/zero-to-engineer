- question: Which pattern is array.sort(compareFn)?
  options:
  - Strategy
  - Iterator
  answer: 0
  explanation: The comparison algorithm is passed in and swapped freely.
- question: What is the classic leak with observers?
  options:
  - Listeners that are never unsubscribed keep everything they reference alive
  - Events are too slow
  answer: 0
  explanation: Return and call an unsubscribe function.
- question: Which pattern makes undo possible?
  options:
  - Command
  - Facade
  answer: 0
  explanation: Each command can execute and reverse itself, kept in a history.
- question: What does the state pattern replace?
  options:
  - Status checks scattered through every method
  - Loops
  answer: 0
  explanation: One explicit state machine lists the allowed transitions.
- question: Web middleware such as authentication and logging is which pattern?
  options:
  - Chain of responsibility
  - Composite
  answer: 0
  explanation: Each handler deals with the request or passes it on.
- question: What usually replaces the visitor pattern in modern TypeScript, Java and C#?
  options:
  - Pattern matching over a sum type with exhaustive checks
  - Singletons
  answer: 0
  explanation: Adding an operation is one new function the compiler checks.
