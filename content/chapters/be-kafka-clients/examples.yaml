# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: csharp
  check: shell
  needs: network
  script: |
    mkdir b1 && cd b1
    cp "$BLOCK" app.cs
    dotnet build app.cs > build.log 2>&1 || { grep -E " error " build.log; exit 1; }
    echo compiled
  output_contains:
  - compiled
  note: Compiled against Confluent.Kafka; running it needs a Kafka broker.
- block: 2
  lang: csharp
  check: shell
  needs: network
  script: |
    mkdir b2 && cd b2
    cp "$BLOCK" app.cs
    dotnet build app.cs > build.log 2>&1 || { grep -E " error " build.log; exit 1; }
    echo compiled
  output_contains:
  - compiled
