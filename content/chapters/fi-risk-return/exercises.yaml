- title: Do this
  items:
    - key: x1
      text: "In a spreadsheet, enter the A and B returns from the chapter. Use AVERAGE and STDEV.S, and build a column showing GH₵ 1,000 growing year by year for each. Then change B's returns and see how the final value moves."
    - key: x2
      text: "Find the yearly values of a real fund or index over ten years (many fund factsheets give them). Work out its maximum drawdown and how long it took to recover."
    - key: x3
      text: "List each pot of money you have or plan to have, with when you will need it. Mark which could survive a 30% fall without harming your plans."
    - key: x4
      text: "Write down three investment adverts you have seen. For each, find what return is promised and what risk is mentioned, if any."
