- question: "A share bought for GH₵ 4.00 is worth GH₵ 4.20 a year later and paid a GH₵ 0.20 dividend. What was the return?"
  options:
    - "10%"
    - "5%"
    - "4.76%"
    - "20%"
  answer: 0
  explanation: "(4.20 − 4.00 + 0.20) ÷ 4.00 = 0.40 ÷ 4.00 = 10%. Ignoring the dividend gives only the 5% price rise."
- question: "Two investments both average 8% a year, but one swings between −10% and +30%. Over several years, the swinging one will usually…"
  options:
    - "grow to less, because volatility lowers the compound return"
    - "grow to exactly the same"
    - "grow to more, because of the big gains"
    - "lose money"
  answer: 0
  explanation: "Falls take away part of earlier gains and leave a smaller base to grow from, so the compound return is below the average. In the chapter, 8% average with high volatility gave 6.8% a year."
- question: "An investment falls 50%. What gain does it need to get back to where it started?"
  options:
    - "100%"
    - "50%"
    - "75%"
    - "150%"
  answer: 0
  explanation: "1,000 falls to 500; 500 must double to return to 1,000. The gain needed is 1 ÷ (1 − 0.5) − 1 = 100%."
- question: "What does a maximum drawdown of −35% tell you?"
  options:
    - "At its worst, the investment fell 35% from its highest value before recovering"
    - "It lost 35% over the whole period"
    - "It will fall 35% next year"
    - "Its average return was −35%"
  answer: 0
  explanation: "Drawdown measures falls from a previous peak. An investment can have a large drawdown and still end higher than it started."
- question: "Why do riskier investments tend to offer higher expected returns?"
  options:
    - "If they did not, investors would buy the safer option instead, so riskier ones must offer extra to attract buyers"
    - "Because regulators require it"
    - "Because risky investments always pay more in every year"
    - "Because risk and return are unrelated"
  answer: 0
  explanation: "That extra is the risk premium. It is an expected, average extra, not a promise: in any one year a risky investment can do much worse."
- question: "Which money is least suited to a volatile investment?"
  options:
    - "Rent due in six months"
    - "Retirement savings for 25 years from now"
    - "Money for a child's education in 15 years"
    - "A long-term fund you will not touch for a decade"
  answer: 0
  explanation: "With a short time horizon, a fall just before you need the money cannot wait to recover. Long horizons can ride out falls."
