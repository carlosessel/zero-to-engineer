- id: clean-code-refactor
  title: Refactoring in small steps
  hint: Each step changes one name, and the answer stays the same every time. That is what makes it refactoring.
  language: Python
  code: |
    # Hard to read
    def calc(l, t):
        r = 0
        for i in l:
            if i[1] > t:
                r += i[0] * i[1]
        return r

    # The same logic, readable
    def total_for_large_orders(orders, minimum_quantity):
        total = 0
        for price, quantity in orders:
            if quantity > minimum_quantity:
                total += price * quantity
        return total
  steps:
    - title: Correct, but a puzzle
      text: calc works, but what are l, t and i[1]? A reader has to run it in their head to find out. Suppose a test calls it with three orders and 2, and expects 62.
      lines: [2, 3, 4, 5, 6, 7]
      vars: { "orders used by the test": "(5, 10), (2, 1), (3, 4)" }
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: "?" }
            - { name: l, value: "?" }
            - { name: t, value: "?" }
            - { name: "i[0], i[1]", value: "?" }
            - { name: r, value: "?" }
        - { kind: note, id: n, text: "Test: calc(orders, 2) returns 62", tone: found }
    - title: Name the function for what it does
      text: A function name should say what it gives back. One rename, then run the test again.
      lines: [2, 10]
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: total_for_large_orders, tone: active }
            - { name: l, value: "?" }
            - { name: t, value: "?" }
            - { name: "i[0], i[1]", value: "?" }
            - { name: r, value: "?" }
        - { kind: note, id: n, text: "Test after renaming: still 62", tone: found }
    - title: Name the inputs
      text: l is the list of orders, and t is the smallest quantity that counts. The new names make the comparison read like a sentence.
      lines: [2, 10]
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: total_for_large_orders, tone: done }
            - { name: l, value: orders, tone: active }
            - { name: t, value: minimum_quantity, tone: active }
            - { name: "i[0], i[1]", value: "?" }
            - { name: r, value: "?" }
        - { kind: note, id: n, text: "Test after renaming: still 62", tone: found }
    - title: Unpack each order
      text: Each order is a pair, price then quantity. Unpacking it into two names replaces i[0] and i[1], which said nothing.
      lines: [4, 5, 6, 12, 13, 14]
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: total_for_large_orders, tone: done }
            - { name: l, value: orders, tone: done }
            - { name: t, value: minimum_quantity, tone: done }
            - { name: "i[0], i[1]", value: "price, quantity", tone: active }
            - { name: r, value: "?" }
        - { kind: note, id: n, text: "Test after renaming: still 62", tone: found }
    - title: Name the result
      text: r is the running total, so call it total. That is the last puzzle gone.
      lines: [3, 6, 7, 11, 14, 15]
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: total_for_large_orders, tone: done }
            - { name: l, value: orders, tone: done }
            - { name: t, value: minimum_quantity, tone: done }
            - { name: "i[0], i[1]", value: "price, quantity", tone: done }
            - { name: r, value: total, tone: active }
        - { kind: note, id: n, text: "Test after renaming: still 62", tone: found }
    - title: Same logic, now readable
      text: The structure improved and the behaviour did not change; the test said so after every small step. That is refactoring.
      lines: [10, 11, 12, 13, 14, 15]
      vars: { "5 × 10 + 3 × 4": "62", "(2, 1)": "skipped, 1 is not > 2" }
      parts:
        - kind: kv
          id: names
          label: "What each name means"
          slots: 5
          rows:
            - { name: calc, value: total_for_large_orders, tone: found }
            - { name: l, value: orders, tone: found }
            - { name: t, value: minimum_quantity, tone: found }
            - { name: "i[0], i[1]", value: "price, quantity", tone: found }
            - { name: r, value: total, tone: found }
        - { kind: note, id: n, text: "Test: total_for_large_orders(orders, 2) returns 62", tone: found }
