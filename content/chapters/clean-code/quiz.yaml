- question: "What should a comment explain?"
  options:
    - "What each line does"
    - "Why the code is the way it is"
    - "Who wrote it"
  answer: 1
  explanation: "Good names show what. Comments are for why."
- question: "The same ten lines appear in three files. What should you do?"
  options:
    - "Leave them"
    - "Move them into one function used by all three"
    - "Add a comment in each"
  answer: 1
  explanation: "Duplicated logic gets fixed in some copies and missed in others."
