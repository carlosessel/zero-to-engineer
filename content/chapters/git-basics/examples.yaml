    echo "<p>More.</p>" >> index.html && git commit -qam "Add a line"
    bash -e "$BLOCK"
    test "$(git rev-parse HEAD)" = "$(git --git-dir=../../origin.git rev-parse main)"
- block: 18
  lang: text
  check: illustration
  note: An excerpt of git status. Checked by setting up exactly that situation and confirming every line shown appears in Git's real output.
  verify: |
    import os, subprocess
    repo = tmp / "web-course" / "first-repo"
    env = {**os.environ, "GIT_CONFIG_GLOBAL": str(tmp / "gitconfig"), "GIT_AUTHOR_NAME": "Learner", "GIT_AUTHOR_EMAIL": "learner@example.com", "GIT_COMMITTER_NAME": "Learner", "GIT_COMMITTER_EMAIL": "learner@example.com"}
    def git(*args, cwd=repo):
        return subprocess.run(["git", *args], cwd=cwd, env=env, capture_output=True, text=True, check=True).stdout
    d = tmp / "practice4"
    d.mkdir()
    git("init", "-q", cwd=d)
    for f in ("index.html", "style.css"):
        (d / f).write_text("one\n")
    git("add", ".", cwd=d); git("commit", "-q", "-m", "Start", cwd=d)
    (d / "index.html").write_text("two\n"); (d / "style.css").write_text("two\n")
    git("add", "index.html", cwd=d)
    real = git("status", cwd=d).splitlines()
    for line in block.splitlines():
        if line.strip():
            assert line in real, (line, real)
- block: 19
  lang: text
  check: illustration
  note: A made-up history for the reader to interpret, not the output of a command run here.
- block: 20
  lang: bash
  check: shell
  note: 'Reproduces the situation: a stand-in for GitHub with a README commit, and a separate local repository whose first push is refused. Then the two commands run as written.'
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    git init -q --bare readme-origin.git
    git clone -q readme-origin.git on-github 2>/dev/null
    (cd on-github && echo "# first-repo" > README.md && git add . && git commit -qm "Initial commit" && git push -q origin main)
    mkdir local && cd local && git init -q && echo hi > index.html && git add . && git commit -qm "Add first page"
    git remote add origin ../readme-origin.git
    if git push -q -u origin main 2>/dev/null; then echo "the first push should have been refused"; exit 1; fi
    bash -e "$BLOCK"
    test -f README.md
    test -n "$(git log --oneline --grep="Add first page")"
    test "$(git rev-parse HEAD)" = "$(git --git-dir=../readme-origin.git rev-parse main)"
  output_contains:
  - README.md
- block: 21
  lang: bash
  check: shell
  note: Sets up three changed files, runs the two commands, and checks that contact.html is left out.
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    mkdir three && cd three && git init -q
    for f in index.html style.css contact.html; do echo one > $f; done
    git add . && git commit -qm "Start"
    for f in index.html style.css contact.html; do echo two > $f; done
    bash -e "$BLOCK"
    test "$(git status --porcelain)" = " M contact.html"
