# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  note: Run with Git pointed at a throwaway settings file, so the real settings on the test machine are never touched.
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    bash -e "$BLOCK"
    test "$(git config --global --get init.defaultBranch)" = main
    test "$(git config --global --get user.name)" = "Ama Mensah"
    git config --global --list
  output_contains:
  - user.email=ama@example.com
- block: 2
  lang: bash
  check: shell
  note: The check first creates web-course, which the setup chapter made.
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    mkdir -p web-course
    bash -e "$BLOCK"
    test -d web-course/first-repo/.git
  output_contains:
  - Initialized empty Git repository in
  - first-repo/.git/
- block: 3
  lang: bash
  check: shell
  script: |
