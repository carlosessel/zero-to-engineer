- block: 12
  lang: text
  check: illustration
  note: 'Compared in shape with the real history: hashes differ every time, so only their form is checked. Terminals show the (HEAD -> main) label; it is asked for explicitly here because tests do not run in a terminal.'
  verify: |
    import os, subprocess
    repo = tmp / "web-course" / "first-repo"
    env = {**os.environ, "GIT_CONFIG_GLOBAL": str(tmp / "gitconfig"), "GIT_AUTHOR_NAME": "Learner", "GIT_AUTHOR_EMAIL": "learner@example.com", "GIT_COMMITTER_NAME": "Learner", "GIT_COMMITTER_EMAIL": "learner@example.com"}
    def git(*args, cwd=repo):
        return subprocess.run(["git", *args], cwd=cwd, env=env, capture_output=True, text=True, check=True).stdout
    import re
    real = git('log', '--oneline', '--decorate').splitlines()
    shape = lambda l: re.sub(r'^[0-9a-f]{7} ', 'HASH ', l)
    assert [shape(l) for l in real] == [shape(l) for l in block.splitlines()], real
- block: 13
  lang: bash
  check: shell
  note: The check first deletes half of index.html, standing in for the accident in the text, then confirms the file is back to its committed contents.
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    cd web-course/first-repo
    cp index.html ../saved.html
    head -5 index.html > half && mv half index.html
    bash -e "$BLOCK"
    cmp index.html ../saved.html
  output_contains:
  - 'modified:   index.html'
  - nothing to commit, working tree clean
- block: 14
  lang: text
  check: illustration
  note: Checked by writing it as a real .gitignore beside the three kinds of file it names and asking Git what it would show.
  verify: |
    import os, subprocess
    repo = tmp / "web-course" / "first-repo"
    env = {**os.environ, "GIT_CONFIG_GLOBAL": str(tmp / "gitconfig"), "GIT_AUTHOR_NAME": "Learner", "GIT_AUTHOR_EMAIL": "learner@example.com", "GIT_COMMITTER_NAME": "Learner", "GIT_COMMITTER_EMAIL": "learner@example.com"}
    def git(*args, cwd=repo):
        return subprocess.run(["git", *args], cwd=cwd, env=env, capture_output=True, text=True, check=True).stdout
    (repo / ".gitignore").write_text(block + "\n")
    (repo / ".env").write_text("API_KEY=not-a-real-key\n")
    (repo / ".DS_Store").write_text("x")
    (repo / "node_modules" / "some-package").mkdir(parents=True)
    (repo / "node_modules" / "some-package" / "index.js").write_text("x")
    shown = git("status", "--porcelain", "--untracked-files=all").split()
    assert shown == ["??", ".gitignore"], shown
    git("add", ".gitignore"); git("commit", "-q", "-m", "Add .gitignore")
- block: 15
  lang: bash
  check: not-run
  reason: Signs in to a real GitHub account through a web browser, which an automatic test cannot do. The commands and what they do were checked against the GitHub CLI manual (gh auth login, gh auth setup-git) on 12 November 2026.
- block: 16
  lang: bash
  check: shell
  note: GitHub is replaced by a local stand-in repository, so the address in the first line is swapped for it. Everything else runs as written.
  script: |
    export GIT_CONFIG_GLOBAL="$PWD/gitconfig"
    git init -q --bare origin.git
    cd web-course/first-repo
    sed "s|https://github.com/YOUR-NAME/first-repo.git|$PWD/../../origin.git|" "$BLOCK" > ../push.sh
    grep -q "origin.git" ../push.sh
    bash -e ../push.sh
    test "$(git rev-parse HEAD)" = "$(git --git-dir=../../origin.git rev-parse main)"
  output_contains:
  - main -> main
