- title: "Do this"
  items:
    - key: x1
      text: "Set your Git name, email and default branch, and check them with `git config --global --list`"
    - key: x2
      text: "Create `first-repo` with an `index.html`, and make at least three commits with clear messages"
    - key: x3
      text: "Break `index.html` on purpose, save it, then rescue it with `git restore`"
    - key: x4
      text: "Add a `.gitignore` with `.env` in it, create an `.env` file, and confirm `git status` does not show it"
    - key: x5
      text: "Install GitHub CLI, sign in, and push `first-repo` to a new empty repository on GitHub"
    - key: x6
      text: "Clone your repository into a different folder and check the history is all there with `git log --oneline`"
