- question: "x has shape (2, 3). What is the shape of x.mean(axis=0)?"
  options:
    - "(2,)"
    - "(3,)"
    - "(2, 3)"
  answer: 1
  explanation: "axis=0 collapses the rows, leaving one mean per column."
- question: "Why prefer vectorised NumPy operations to Python loops?"
  options:
    - "They use less disk space"
    - "They run in fast compiled code and are far quicker"
    - "Loops are not allowed on arrays"
  answer: 1
  explanation: "Vectorised operations avoid slow per-element Python overhead."
