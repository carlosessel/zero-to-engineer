- title: Do this
  items:
    - key: x1
      text: "Pick three companies listed on your country's stock exchange. From their latest results and today's price, work out each one's EPS, P/E, dividend yield and payout ratio."
    - key: x2
      text: "For one of them, find the share price and dividends over the last five years and work out the total return, then compare it with the market index over the same period."
    - key: x3
      text: "In a spreadsheet, build the dividend growth model with the dividend, required return and growth in their own cells. Make a table of values for required returns from 12% to 20% and growth from 5% to 10%."
    - key: x4
      text: "Read one listed company's latest annual report summary and write three sentences on what could make its profits rise or fall."
