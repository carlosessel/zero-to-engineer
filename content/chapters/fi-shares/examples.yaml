# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    15% 10% 2.40
    16% 10% 2.00
    15% 11% 3.00
  verify: |
    v = ns["share_value"]
    assert round(v(0.20, 0.18, 0.08), 2) == 2.00
    assert round(24_000_000 / 120_000_000, 2) == 0.20
    assert round(4.05 / 0.20, 2) == 20.25
    assert round(0.12 / 4.05 * 100, 2) == 2.96
    assert round((2860 - 2000) / 2000 * 100) == 43
    assert round((1.43 ** (1 / 3) - 1) * 100, 1) == 12.7
    assert round(450 * 0.92, 2) == 414.00
    assert round((4.60 - 5.00 + 0.30) / 5.00 * 100, 2) == -2.00
    assert 100 + 120 + 140 == 360
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    assert block.strip().splitlines() == ["15% 10% 2.40", "16% 10% 2.00", "15% 11% 3.00"]
