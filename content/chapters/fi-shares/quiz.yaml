- question: "A company is wound up owing money to banks and bondholders. When are its shareholders paid?"
  options:
    - "Last, after everyone the company owes"
    - "First, because they own the company"
    - "At the same time as bondholders"
    - "Never, by law"
  answer: 0
  explanation: "Shareholders have a claim on what is left after all debts are paid, which is often nothing. That is why shares are riskier than the same company's bonds."
- question: "A share's price rose from GH₵ 3.00 to GH₵ 3.15 and it paid a GH₵ 0.15 dividend. What was its total return?"
  options:
    - "10%"
    - "5%"
    - "15%"
    - "0.30%"
  answer: 0
  explanation: "(3.15 − 3.00 + 0.15) ÷ 3.00 = 0.30 ÷ 3.00 = 10%: 5% from the price and 5% from the dividend."
- question: "A company has EPS of GH₵ 0.50 and a share price of GH₵ 7.50. What is its P/E ratio?"
  options:
    - "15"
    - "3.75"
    - "6.7%"
    - "0.067"
  answer: 0
  explanation: "P/E = price ÷ EPS = 7.50 ÷ 0.50 = 15. Investors pay 15 cedis for each cedi of yearly profit."
- question: "Why can a small change in interest rates move share prices a lot?"
  options:
    - "A share's value is the present value of many years of future cash, which is very sensitive to the required return"
    - "Companies must pay all their profits as interest"
    - "Share prices are set by the central bank"
    - "It cannot; share prices ignore interest rates"
  answer: 0
  explanation: "In the dividend growth model, raising the required return from 15% to 16% cut the value from 2.40 to 2.00, a fall of 17%."
- question: "After a 2-for-1 split, what happens to your holding?"
  options:
    - "You have twice as many shares at half the price, worth the same"
    - "Its value doubles"
    - "Its value halves"
    - "You must buy more shares"
  answer: 0
  explanation: "A split divides each share into more pieces. Nothing about the company or your share of it changes."
- question: "Which is the strongest reason for most people to avoid putting their savings in a few individual shares?"
  options:
    - "Any one company can fail, and beating the market by picking shares is hard even for professionals"
    - "Shares never pay dividends"
    - "Individual shares are illegal to buy"
    - "Share prices never change"
  answer: 0
  explanation: "A single share carries specific risk that diversification would remove, and prices already reflect what many investors know."
