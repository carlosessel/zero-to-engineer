- title: "Do this"
  items:
    - key: x1
      text: "Add the image rule and the border-box rule to the top of your stylesheet"
    - key: x2
      text: "Rebuild your page mobile first: one column by default, and a media query where your content needs a wider layout"
    - key: x3
      text: "Turn your card list into an auto-fit grid and check it at 375, 768 and 1200 pixels wide in the device toolbar"
    - key: x4
      text: "Open your page on a real phone and note anything that is hard to read or tap"
    - key: x5
      text: "Make your page follow dark mode with prefers-color-scheme, and check its contrast"
