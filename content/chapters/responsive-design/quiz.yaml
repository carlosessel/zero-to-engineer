- question: "What does the viewport meta tag do?"
  options:
    - "Makes the page's width match the phone's real width instead of a pretend wide screen"
    - "Makes images load faster"
    - "Hides the page on desktops"
  answer: 0
  explanation: "Without it, phones draw the page about 980 pixels wide and shrink it, so your small-screen CSS never applies."
- question: "In mobile-first CSS, what is outside the media queries?"
  options:
    - "The styles for the smallest screens"
    - "The styles for desktops"
    - "Nothing"
  answer: 0
  explanation: "The base CSS serves small screens; min-width queries add to it as the screen grows."
- question: "How should you choose breakpoints?"
  options:
    - "From a list of popular phone sizes"
    - "Where your own content starts to look wrong as the window widens"
    - "Always 768 and 1024 pixels"
  answer: 1
  explanation: "Screen sizes are endless and keep changing. Your layout's own breaking points are the ones that matter."
- question: "What does img { max-width: 100%; height: auto; } do?"
  options:
    - "Stops images being wider than their container while keeping their proportions"
    - "Makes every image fill the screen"
    - "Crops images to a square"
  answer: 0
  explanation: "max-width stops overflow; height: auto keeps the shape as the width shrinks."
- question: "What does grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) give you?"
  options:
    - "Exactly five columns"
    - "As many columns of at least 200 pixels as fit, sharing the spare space"
    - "One column of 200 pixels"
  answer: 1
  explanation: "The number of columns follows the container's width, with no media queries."
- question: "Why should important actions never depend on :hover?"
  options:
    - "Touch screens have no mouse pointer to hover with"
    - "Hover is slow"
    - "Hover only works in Chrome"
  answer: 0
  explanation: "Phones and tablets cannot hover, and keyboard users do not hover either."
