- title: "Do this"
  items:
    - key: hc1
      text: "Build a one-page personal site: heading, a paragraph about you, a list of projects, links"
    - key: hc2
      text: "Make it look good on a phone width"
    - key: hc3
      text: "Use the browser’s Inspect tool to change CSS on a live site and see what happens"
