- question: "What is each language responsible for?"
  options:
    - "HTML for looks, CSS for content"
    - "HTML for content and structure, CSS for appearance"
    - "Both do the same job"
  answer: 1
  explanation: "Structure and style are kept separate."
- question: "In CSS, what does .intro select?"
  options:
    - "An element with id intro"
    - "Elements with class intro"
    - "A tag called intro"
  answer: 1
  explanation: "A dot is a class. A hash is an id."
