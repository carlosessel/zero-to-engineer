# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python-fake-api
  before: |
    import anthropic
    MODEL = "claude-sonnet-5-5"
    client = anthropic.Anthropic()

    def reply_text(msg):
        return "".join(block.text for block in msg.content if block.type == "text")
  replies:
  - tool_use:
      name: get_order_status
      input:
        order_id: B42
  - text: Order B42 is being processed.
  output: |
    Order B42 is being processed.
  note: 'Run against a stand-in server on the test machine, not the live API: this proves the SDK calls are valid and the reply is handled correctly, not what a real model would answer. The hidden setup defines client, MODEL and reply_text exactly as the chapter ''Your first model call'' does; the code comment tells the reader they come from there.'
  verify: |
    assert len(requests) == 2
    first, second = requests
    assert first["tools"][0]["name"] == "get_order_status"
    # The second request must send the tool's result back, tied to the request that asked for it.
    result = second["messages"][-1]["content"][0]
    assert result["type"] == "tool_result" and result["content"] == "processing"
    asked = [b for b in second["messages"][-2]["content"] if b["type"] == "tool_use"][0]
    assert result["tool_use_id"] == asked["id"]
