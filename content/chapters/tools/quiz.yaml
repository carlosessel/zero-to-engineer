- question: "In tool use, who executes the tool?"
  options:
    - "The model"
    - "Your code"
    - "The provider"
  answer: 1
  explanation: "The model only requests a call. Your code runs it and returns the result."
- question: "A tool sends money. What should you add?"
  options:
    - "A higher temperature"
    - "Human confirmation before it runs"
    - "A longer description"
  answer: 1
  explanation: "Irreversible actions need a person in the loop."
