- question: "What is the cheapest reliable grader for a classification task?"
  options:
    - "A human reading every output"
    - "Code comparing to the expected label"
    - "Another model with a rubric"
  answer: 1
  explanation: "Use code graders wherever the answer can be checked exactly."
- question: "A user reports a bad answer. Good practice is to…"
  options:
    - "fix the prompt and move on"
    - "add it to the eval set, then fix it"
    - "ignore single reports"
  answer: 1
  explanation: "Each failure becomes a permanent regression test."
