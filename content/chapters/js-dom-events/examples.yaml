- block: 13
  lang: js
  check: js
  before: |
    globalThis.localStorage = (() => { const m = {}; return { getItem: (k) => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: (k) => { delete m[k]; } }; })();
  output: |
    ["Buy flour", "Call Kofi"]
  note: Run in Node with a small stand-in for localStorage, as in the chapter's previews.
