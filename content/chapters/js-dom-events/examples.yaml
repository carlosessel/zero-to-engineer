  - 12
  actions:
  - fill:
    - '#task'
    - Buy flour
  - click: '#todo-form button'
  - fill:
    - '#task'
    - Call Kofi
  - click: '#todo-form button'
  - click: '#todo-list li:first-child .toggle'
  expect:
  - document.querySelectorAll('#todo-list li').length === 2
  - document.querySelector('#summary').textContent === '1 of 2 done.'
  - document.querySelector('#todo-list li:first-child').classList.contains('done')
  - getComputedStyle(document.querySelector('.done span')).textDecorationLine === 'line-through'
  - (() => { document.querySelector('#todo-list li:last-child .delete').click(); return document.querySelectorAll('#todo-list li').length === 1 && document.querySelector('#summary').textContent === '1 of 1 done.'; })()
  - document.querySelector('#todo-list li').textContent.startsWith('Buy flour')
  note: Adds two tasks, ticks the first, deletes the second, and checks the list and summary after each.
