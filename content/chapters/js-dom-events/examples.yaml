# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: html
  check: browser
  combine:
  - 1
  - 2
  - 3
  actions:
  - click: '#close'
  expect:
  - document.querySelector('.status').textContent === 'Sorry, we are closed.'
  - document.querySelector('.status').classList.contains('closed')
  - getComputedStyle(document.querySelector('.status')).color === 'rgb(179, 38, 30)'
  - document.querySelector('#close').disabled === true
  note: Clicks the button and checks all three changes the chapter lists.
