- title: "Do this"
  items:
    - key: x1
      text: "Use every live example in this chapter, then edit each one to add a feature of your own"
    - key: x2
      text: "Build the to-do list in your own files (index.html, style.css, app.js with defer) and run it in your browser"
    - key: x3
      text: "Make the to-do list remember its tasks with localStorage (practice problem 12)"
    - key: x4
      text: "Use your to-do list with the keyboard only: add, tick and delete tasks without the mouse"
    - key: x5
      text: "Break a selector on purpose, read the null error in the Console, and fix it"
