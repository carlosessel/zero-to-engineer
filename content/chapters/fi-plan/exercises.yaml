- title: Do this
  items:
    - key: x1
      text: "Fill in your own numbers: take-home pay, spending, savings, each debt with its rate, insurance, and any employer pension match."
    - key: x2
      text: "Put your next steps in the order of priorities from this chapter, with the amount and target month for each."
    - key: x3
      text: "Write your one-page plan using the chapter's table as a template, and set up at least one automatic payday transfer."
    - key: x4
      text: "Put a review date in your calendar a year from now, and list the questions you will ask then."
