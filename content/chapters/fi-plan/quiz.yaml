- question: "Why does a starter emergency fund usually come before paying off debt or investing?"
  options:
    - "So a small shock does not force you into new, expensive borrowing"
    - "Because savings accounts pay the highest returns"
    - "Because debts never cost much"
    - "It doesn't; investing always comes first"
  answer: 0
  explanation: "Without a buffer, the next unexpected bill goes back on the card, undoing progress."
- question: "An employer matches pension contributions up to GH₵ 300 a month. What return does contributing GH₵ 300 give, immediately?"
  options:
    - "100%"
    - "3%"
    - "10%"
    - "Nothing until retirement"
  answer: 0
  explanation: "Your 300 brings another 300 from the employer at once. Few things beat that, so the match comes early in the order."
- question: "Where should money for school fees due in three years be kept?"
  options:
    - "Somewhere safe with a known value then, such as Treasury bills or a fixed deposit"
    - "In a share fund for higher returns"
    - "In crypto"
    - "Lent to a friend"
  answer: 0
  explanation: "A short time horizon means a fall just before the fees are due could not be waited out."
- question: "Kwesi and Abena's card is paid off in month 6. What happens to the GH₵ 160 minimum payment they were making?"
  options:
    - "It is freed and added to the next priority, so 1,510 a month goes there"
    - "It disappears"
    - "It is still paid to the card company"
    - "It goes into spending"
  answer: 0
  explanation: "Freed debt payments speed up the following steps; this is the same snowball effect as in the debt chapter."
- question: "What makes a written plan more useful than good intentions?"
  options:
    - "It fixes the order, automates the transfers and sets rules in advance for offers, pay rises and falls"
    - "It guarantees investment returns"
    - "It removes the need for an emergency fund"
    - "It means you never need to review it"
  answer: 0
  explanation: "Decisions made in advance, in calm conditions, protect you from the behavioural mistakes of the moment."
- question: "When should a financial plan be reviewed?"
  options:
    - "At least once a year, and after any big change in life"
    - "Never, once written"
    - "Only when markets fall"
    - "Every day"
  answer: 0
  explanation: "Regular, small adjustments keep a plan alive; daily checking invites emotional decisions."
