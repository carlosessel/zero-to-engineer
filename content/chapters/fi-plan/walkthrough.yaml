- id: fi-plan-route
  title: A household's route through the priorities
  hint: Each pot fills in turn. When one is full, the same monthly amount moves to the next.
  steps:
  - title: The start
    text: 2,000 saved, 4,000 on a card at 4% a month. From now on, 300 goes to Kwesi's matched pension and 150 to life cover each month, leaving 1,350.
