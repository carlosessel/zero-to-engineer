# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  verify: |
    acc = float(out.strip().splitlines()[-1])
    assert acc > 0.93, acc
    assert len(ns['X_test']) == 114  # one fifth of 569 rows held back
  note: The exact accuracy can differ slightly between scikit-learn versions, so only a floor is checked.
