- question: "Predicting a house price from its features is…"
  options:
    - "classification"
    - "regression"
    - "clustering"
  answer: 1
  explanation: "Predicting a number is regression. Predicting a category is classification."
- question: "Why keep a test set the model never trains on?"
  options:
    - "To make training faster"
    - "To estimate performance on new, unseen data"
    - "To use less memory"
  answer: 1
  explanation: "Scores on training data say nothing about new data."
