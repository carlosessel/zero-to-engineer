- title: Do this
  items:
  - key: x1
    text: Install Claude Code, run claude --version, and log in
  - key: x2
    text: In a small project, ask three questions about the code before changing anything, and watch which tools it uses
  - key: x3
    text: Ask for one small change with 'then run the tests', approve each step after reading it, and read the final diff
  - key: x4
    text: Try Esc mid-task and /rewind afterwards, then commit your work with Git
