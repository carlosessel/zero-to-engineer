- question: Why tag images with the commit hash rather than latest?
  options:
  - So you know exactly what is running and can roll back to it
  - Registries reject the latest tag
  answer: 0
  explanation: latest changes under you.
- question: What does workload identity federation replace in a deploy pipeline?
  options:
  - A long-lived cloud key stored as a CI secret
  - The container registry
  answer: 0
  explanation: CI exchanges a short-lived identity token for temporary credentials.
- question: Why give the service its own service account?
  options:
  - Least privilege, so a compromise gets only what the service needs
  - Cloud Run requires a new account per service
  answer: 0
  explanation: The default identity often has broad permissions.
- question: Why run migrations as a separate job instead of at start-up?
  options:
  - So many instances do not race to change the schema
  - Because Cloud Run cannot run migrations
  answer: 0
  explanation: And keep them backward compatible.
- question: What does --max-instances protect?
  options:
  - The bill and the database's connection limit
  - The container's memory
  answer: 0
  explanation: Spikes scale instances; each opens connections.
- question: What is the first thing to set up in a new cloud account?
  options:
  - A budget alert
  - A custom domain
  answer: 0
  explanation: Mistakes then cost little.
