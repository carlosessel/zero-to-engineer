- block: 8
  lang: yaml
  check: illustration
  note: A deploy workflow; it needs a Google Cloud project and a workload identity pool, so the check parses it and checks its structure. The action versions and inputs were checked against each action's action.yml on 14 November 2026.
  verify: |
    import yaml
    assert block.startswith("# .github/workflows/deploy.yml")
    doc = yaml.safe_load(block)
    triggers = doc.get("on", doc.get(True))
    assert triggers == {"push": {"branches": ["main"]}}
    assert doc["permissions"]["id-token"] == "write"
    steps = doc["jobs"]["deploy"]["steps"]
    uses = [s["uses"].split("@")[0] for s in steps if "uses" in s]
    assert uses == ["actions/checkout", "google-github-actions/auth", "docker/login-action", "google-github-actions/setup-gcloud", "google-github-actions/deploy-cloudrun"]
    assert "credentials_json" not in str(doc)
