- question: Can any tool detect every infinite loop in every program?
  options:
  - Yes, with enough compute
  - 'No: the halting problem is undecidable'
  answer: 1
  explanation: Timeouts and limits exist because prediction is impossible.
- question: What does NP mean?
  options:
  - Not polynomial
  - Answers can be checked in polynomial time
  answer: 1
  explanation: Finding them may be much harder.
- question: A feature asks for the optimal delivery route through 300 stops. What should you suspect?
  options:
  - It needs a bigger server
  - 'It is an NP-hard problem: use heuristics or a solver'
  answer: 1
  explanation: The travelling salesman problem in disguise.
- question: Why does faster hardware barely help exponential algorithms?
  options:
  - Hardware is not getting faster
  - Each extra item doubles the work, so 1,000 times faster handles only about 10 more items
  answer: 1
  explanation: 2^10 ≈ 1,000.
