# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API. Compaction was a beta feature when checked.'
  replies:
  - text: 'Summary so far: off-by-one in the discount loop; payment module next.'
    stop_reason: compaction
  verify: |
    assert requests[-1]['compaction'] == {'type': 'summarize'}
    assert 'compaction' in out
- block: 2
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API.'
  replies:
  - tool_use:
      name: memory
      input:
        command: view
        path: /memories
  verify: |
    assert requests[-1]['tools'] == [{'type': 'memory_20250818', 'name': 'memory'}]
    assert "memory {'command': 'view'" in out
