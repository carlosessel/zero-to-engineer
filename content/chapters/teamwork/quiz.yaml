- question: "A task will take longer than you estimated. When do you say so?"
  options:
    - "At the deadline"
    - "As soon as you know"
    - "Never"
  answer: 1
  explanation: "Early bad news lets the team adjust."
- question: "Which is a good code review comment?"
  options:
    - "This is bad."
    - "What happens here if the list is empty?"
    - "I would have done it differently."
  answer: 1
  explanation: "Specific, about the code, and phrased as a question."
