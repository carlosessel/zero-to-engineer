- question: "What is the single most effective way to make a page accessible?"
  options:
    - "Add ARIA attributes to every element"
    - "Use the right HTML element for each job"
    - "Use large fonts everywhere"
  answer: 1
  explanation: "Native elements such as button, label, headings and landmarks come with keyboard support and meaning that assistive technology understands."
- question: "Why is a <div> styled to look like a button a problem?"
  options:
    - "It cannot be reached with Tab, pressed with the keyboard, or announced as a button"
    - "It is slower to load"
    - "Browsers refuse to style divs"
  answer: 0
  explanation: "A real <button> has all of that built in."
- question: "What minimum contrast does WCAG level AA ask for normal-size text?"
  options:
    - "3:1"
    - "4.5:1"
    - "21:1"
  answer: 1
  explanation: "4.5:1 for normal text and 3:1 for large text. 21:1 is the maximum possible, black on white."
- question: "A designer removes the focus outline with CSS. Who is affected?"
  options:
    - "Nobody; it is only decoration"
    - "Keyboard users, who can no longer see where they are"
    - "Only screen reader users"
  answer: 1
  explanation: "The focus indicator shows keyboard users which element is selected. Restyle it if you must, but never remove it."
- question: "Which alt text is best for an envelope icon that opens an email form?"
  options:
    - "alt=\"Envelope\""
    - "alt=\"Email us\""
    - "alt=\"Image of an envelope icon\""
  answer: 1
  explanation: "For an image that is a link or button, describe what it does, not what it looks like."
- question: "Your page passes an automatic accessibility checker. What else should you do?"
  options:
    - "Nothing; it is accessible"
    - "Test with the keyboard and a screen reader"
  answer: 1
  explanation: "Automatic tools catch only certain problems. They cannot judge whether alt text is useful or whether the page makes sense when listened to."
- question: "What is the first rule of ARIA?"
  options:
    - "Use ARIA on every interactive element"
    - "If a native HTML element does the job, use it instead"
    - "ARIA replaces the need for labels"
  answer: 1
  explanation: "Native elements bring keyboard behaviour and meaning that ARIA attributes alone do not add."
