# Resources linked from this chapter, and sources of facts stated in it. Each was opened on the date shown.
- title: "Introduction to Web Accessibility"
  author: "W3C Web Accessibility Initiative (WAI)"
  url: https://www.w3.org/WAI/fundamentals/accessibility-intro/
  type: article
  covers: "What web accessibility is, who it affects, and why it matters."
  why: "From the W3C, which publishes WCAG."
  checked: 2026-11-12
- title: "WCAG 2 Overview"
  author: "W3C Web Accessibility Initiative (WAI)"
  url: https://www.w3.org/WAI/standards-guidelines/wcag/
  type: documentation
  covers: "What WCAG is; the page says WCAG 2.2 was published on 5 October 2023 and updated on 12 December 2024, and that WCAG 3 is an early draft."
  why: "The standard's own overview; source of the version stated in the chapter."
  checked: 2026-11-12
- title: "Checklist"
  author: "The A11Y Project"
  url: https://www.a11yproject.com/checklist/
  type: article
  covers: "A checklist based on WCAG, grouped into content, global code, keyboard, images, headings, lists, controls, tables, forms, media, appearance, animation, colour contrast, and mobile and touch."
  why: "States it is based on WCAG and targets many level A and AA concerns; a widely shared practical list."
  checked: 2026-11-12
- title: "Contrast Checker"
  author: "WebAIM (Utah State University)"
  url: https://webaim.org/resources/contrastchecker/
  type: tool
  covers: "Checks two colours against WCAG contrast ratios; lists AA as 4.5:1 for normal and 3:1 for large text."
  why: "Source of the contrast thresholds stated in the chapter; WebAIM is a long-running accessibility organisation."
  checked: 2026-11-12
- title: "Accessibility"
  author: "MDN Web Docs (Mozilla)"
  url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility
  type: course
  covers: "Accessibility in HTML, CSS and JavaScript, ARIA, and multimedia."
  why: "Mozilla's core learning module on accessibility."
  checked: 2026-11-12
- title: "Web Accessibility Tutorials"
  author: "W3C Web Accessibility Initiative (WAI)"
  url: https://www.w3.org/WAI/tutorials/
  type: article
  covers: "Step-by-step tutorials on page structure, menus, images, tables, forms and carousels."
  why: "From the W3C's accessibility initiative."
  checked: 2026-11-12
- title: "Colour Blindness"
  author: "Colour Blind Awareness"
  url: https://www.colourblindawareness.org/colour-blindness/
  type: article
  covers: "What colour blindness is and how common it is."
  why: "Source of the figure in the chapter: the page says it affects about 1 in 12 men and 1 in 200 women. Not linked from the chapter text."
  checked: 2026-11-12
