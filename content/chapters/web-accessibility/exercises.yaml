- title: "Do this"
  items:
    - key: x1
      text: "Use a site you know with the keyboard only for five minutes. Note anything you could not reach or could not see"
    - key: x2
      text: "Run the Lighthouse accessibility audit in Chrome's developer tools on your own page from the HTML chapter and fix what it finds"
    - key: x3
      text: "Check the contrast of the text colours on a site you like with the WebAIM contrast checker"
    - key: x4
      text: "Turn on your system's screen reader, listen to your own page from top to bottom, then turn it off"
    - key: x5
      text: "Zoom your page to 200% and check nothing is cut off or needs sideways scrolling"
