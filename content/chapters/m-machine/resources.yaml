# Resources linked from this chapter. Each was opened on the date shown.
- title: What every programmer should know about memory
  author: Ulrich Drepper
  url: https://lwn.net/Articles/250967/
  type: article
  covers: Memory, CPU caches, virtual memory and memory-aware optimisation, in depth.
  why: The classic deep reference, published on LWN.net in 2007; the hardware examples are dated but the principles hold.
  checked: 2026-11-12
- title: Algorithms for Modern Hardware
  author: Sergey Slotin
  url: https://en.algorithmica.org/hpc/
  type: book
  covers: Pipelining, caches, memory and SIMD from a performance point of view.
  why: A free web book; parts are marked as still being written.
  checked: 2026-11-12
- title: Latency Numbers Every Programmer Should Know (interactive)
  author: Colin Scott
  url: https://colin-scott.github.io/personal_website/research/interactive_latency.html
  type: tool
  covers: How the classic latency numbers change from 1990 to 2020.
  why: Shows the trend behind the table in this chapter; its values come from formulas, not measurements.
  checked: 2026-11-12
- title: Nand to Tetris
  author: Noam Nisan and Shimon Schocken
  url: https://www.nand2tetris.org/
  type: course
  covers: Building a computer from logic gates up through a CPU, assembler, virtual machine and compiler.
  why: Free materials used at hundreds of institutions; the lectures were not watched for this course.
  checked: 2026-11-12
