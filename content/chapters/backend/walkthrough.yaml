- id: backend-tasks-api
  title: Requests meet the tasks API
  hint: Watch each request find its function by method and path, and see the tasks dictionary change.
  language: Python
  code: |
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    app = FastAPI()
    tasks = {}            # stands in for a database for now
    next_id = 1

    class TaskIn(BaseModel):
        title: str
        done: bool = False

    @app.get("/tasks")
    def list_tasks():
        return list(tasks.values())

    @app.post("/tasks", status_code=201)
    def create_task(task: TaskIn):
        global next_id
        saved = {"id": next_id, **task.model_dump()}
        tasks[next_id] = saved
        next_id += 1
        return saved

    @app.get("/tasks/{task_id}")
    def get_task(task_id: int):
        if task_id not in tasks:
            raise HTTPException(status_code=404, detail="Task not found")
        return tasks[task_id]

    @app.delete("/tasks/{task_id}", status_code=204)
    def delete_task(task_id: int):
        tasks.pop(task_id, None)
  steps:
    - title: The server starts empty
      text: When uvicorn starts the app, tasks is an empty dictionary and the next id to hand out is 1. Nothing is stored on disk; this stands in for a database.
      lines: [4, 5, 6]
      vars: { next_id: 1 }
      parts:
        - { kind: seq, id: s, actors: [Client, "FastAPI app"], slots: 6, messages: [] }
        - { kind: kv, id: tasks, label: "tasks", rows: [], slots: 1 }
    - title: A POST arrives
      text: "The method and path, POST /tasks, choose the function: create_task. The body is JSON with a title."
      lines: [16, 17]
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"title": "Buy bread"}', tone: active }
    - title: Check the input
      text: Before create_task runs, the body is checked against TaskIn. title is text, as required, and done was left out, so it gets its default, False.
      lines: [8, 9, 10]
      vars: { next_id: 1, "task.title": '"Buy bread"', "task.done": "False" }
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"title": "Buy bread"}', tone: dim }
            - { from: "FastAPI app", to: "FastAPI app", label: "TaskIn check", tone: found }
    - title: Save it with an id
      text: The task gets id 1 and is stored under that key. next_id moves on to 2, ready for the next task.
      lines: [19, 20, 21]
      vars: { next_id: 2 }
      parts:
        - kind: kv
          id: tasks
          label: "tasks"
          slots: 1
          rows: [{ name: "1", value: "{'id':1,'title':'Buy bread','done':False}", tone: active }]
    - title: 201 Created
      text: The saved task goes back as JSON. The status is 201, the code for "something new was created".
      lines: [16, 22]
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"title": "Buy bread"}', tone: dim }
            - { from: "FastAPI app", to: "FastAPI app", label: "TaskIn check", tone: dim }
            - { from: "FastAPI app", to: Client, label: '201 {"id": 1, "title": "Buy bread", ...}', tone: found }
        - kind: kv
          id: tasks
          label: "tasks"
          slots: 1
          rows: [{ name: "1", value: "{'id':1,'title':'Buy bread','done':False}" }]
    - title: Read one task
      text: "In /tasks/{task_id} the part in braces is filled from the URL, so task_id is 1. It is in tasks, so it is returned."
      lines: [24, 25, 26, 28]
      vars: { next_id: 2, task_id: 1 }
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"title": "Buy bread"}', tone: dim }
            - { from: "FastAPI app", to: Client, label: '201 {"id": 1, "title": "Buy bread", ...}', tone: dim }
            - { from: Client, to: "FastAPI app", label: "GET /tasks/1", tone: active }
            - { from: "FastAPI app", to: Client, label: '200 {"id": 1, "title": "Buy bread", ...}', tone: found }
        - kind: kv
          id: tasks
          label: "tasks"
          slots: 1
          rows: [{ name: "1", value: "{'id':1,'title':'Buy bread','done':False}", tone: found }]
    - title: A task that does not exist
      text: There is no task 7, so the function raises HTTPException. The client gets a clear error with the right status code, 404.
      lines: [26, 27]
      vars: { next_id: 2, task_id: 7 }
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: "GET /tasks/1", tone: dim }
            - { from: "FastAPI app", to: Client, label: '200 {"id": 1, "title": "Buy bread", ...}', tone: dim }
            - { from: Client, to: "FastAPI app", label: "GET /tasks/7", tone: active }
            - { from: "FastAPI app", to: Client, label: "404 Task not found", tone: bad }
        - kind: kv
          id: tasks
          label: "tasks"
          slots: 1
          rows: [{ name: "1", value: "{'id':1,'title':'Buy bread','done':False}" }]
    - title: Bad input is turned away
      text: A body with no title fails the TaskIn check, so create_task never runs and nothing is stored. Never trust what a client sends.
      lines: [8, 9]
      vars: { next_id: 2 }
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: "GET /tasks/7", tone: dim }
            - { from: "FastAPI app", to: Client, label: "404 Task not found", tone: dim }
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"done": true}', tone: active }
            - { from: "FastAPI app", to: Client, label: "rejected: title is missing", tone: bad }
    - title: Delete
      text: DELETE /tasks/1 removes the task. 204 means it worked and there is no body to send back. The URL names the thing; the method says what to do with it.
      lines: [30, 31, 32]
      vars: { next_id: 2, task_id: 1 }
      parts:
        - kind: seq
          id: s
          actors: [Client, "FastAPI app"]
          slots: 6
          messages:
            - { from: Client, to: "FastAPI app", label: 'POST /tasks {"done": true}', tone: dim }
            - { from: "FastAPI app", to: Client, label: "rejected: title is missing", tone: dim }
            - { from: Client, to: "FastAPI app", label: "DELETE /tasks/1", tone: active }
            - { from: "FastAPI app", to: Client, label: "204 No Content", tone: found }
        - { kind: kv, id: tasks, label: "tasks", rows: [], slots: 1 }
