- question: "You installed Git a minute ago, but your open terminal says \"git: command not found\". What is the most likely fix?"
  options:
    - "Reinstall your operating system"
    - "Close the terminal and open a new one"
    - "Type the command in capitals"
  answer: 1
  explanation: "A terminal only finds programs that were installed before it started. A new terminal picks up the new program."
- question: "Why is a word processor such as Microsoft Word a bad place to write code?"
  options:
    - "It is too slow"
    - "It adds hidden formatting and changes straight quotes into curly ones, which breaks code"
    - "It cannot save files"
  answer: 1
  explanation: "Code must be plain text with exactly the characters you typed. A code editor keeps it that way and also colours it to help you read it."
- question: "What does Node.js let you do?"
  options:
    - "Run JavaScript outside a web page, in the terminal"
    - "Design web pages without code"
    - "Store files online"
  answer: 0
  explanation: "Node runs JavaScript on its own. Later in the course it runs your server, and before that it runs tools through npm."
- question: "Which developer tools panel shows the error messages from a page's JavaScript?"
  options:
    - "Elements"
    - "Network"
    - "Console"
  answer: 2
  explanation: "The Console shows messages and errors from JavaScript, and lets you type JavaScript and run it."
- question: "You edited index.html but the browser still shows the old text. What do you check first?"
  options:
    - "That the file is saved and the browser has been refreshed"
    - "That your computer is fast enough"
    - "That Node.js is installed"
  answer: 0
  explanation: "Edit, save, refresh, look. Turning on Auto Save in VS Code removes the most common cause."
- question: "Which Node.js version should a beginner install?"
  options:
    - "The newest test version"
    - "The one marked LTS (long-term support)"
    - "Any version from a download site"
  answer: 1
  explanation: "LTS versions are stable and supported for years. Download from nodejs.org or your system's package manager, never from sites that bundle other software."
