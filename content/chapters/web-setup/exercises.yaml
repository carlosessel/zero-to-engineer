- title: "Do this"
  items:
    - key: x1
      text: "Install VS Code, turn on Auto Save, and open a folder called `web-course`"
    - key: x2
      text: "Make `index.html` from this chapter, open it in two different browsers, change the sentence and see the change after refreshing"
    - key: x3
      text: "Install Node.js and run `hello.js`"
    - key: x4
      text: "Install Git, create a GitHub account, and get a version number from `node --version`, `npm --version` and `git --version`"
    - key: x5
      text: "Open the developer tools on a site you use, find a heading in the Elements panel, and run `2 + 3` in the Console"
