                - { k: "8", cells: [ 8, "16", 1 ], tone: compare }
    - title: HAVING filters groups
      text: HAVING runs after the counting, on whole groups. Only customers 1 and 6 have three or more. This condition could not go in WHERE, which runs before any count exists.
      lines: [ 5 ]
      parts:
        - kind: tables
          id: t
          slots: 20
          tables:
            - id: o
              title: orders
              columns: [ id, customer_id, status ]
              rows:
                - { k: "1", cells: [ 1, 1, delivered ], tone: base }
                - { k: "2", cells: [ 2, 2, delivered ], tone: base }
