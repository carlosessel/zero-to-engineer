                - { k: "19", cells: [ 19, 1, placed ], tone: active }
                - { k: "20", cells: [ 20, 6, placed ], tone: base }
            - id: g
              title: groups
              columns: [ customer_id, order ids, count(*) ]
              rows:
                - { k: "1", cells: [ 1, "1,3,9,14,19", "" ], tone: active }
                - { k: "2", cells: [ 2, "2,7", "" ], tone: base }
                - { k: "3", cells: [ 3, "11", "" ], tone: base }
                - { k: "4", cells: [ 4, "5,17", "" ], tone: base }
                - { k: "5", cells: [ 5, "6,12", "" ], tone: base }
                - { k: "6", cells: [ 6, "8,13,20", "" ], tone: base }
                - { k: "7", cells: [ 7, "10,18", "" ], tone: base }
                - { k: "8", cells: [ 8, "16", "" ], tone: base }
    - title: count(*) for each group
      text: "The aggregate is now computed once per group: how many rows each customer's group holds."
      lines: [ 1 ]
      parts:
        - kind: tables
          id: t
          slots: 20
          tables:
