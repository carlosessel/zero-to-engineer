      text: "The surviving groups become the output, sorted by the count, largest first: customer 1 with 5 orders, customer 6 with 3. That is the chapter's two-row result."
      lines: [ 1, 6 ]
      parts:
        - kind: tables
          id: t
          slots: 20
          tables:
