                - { k: "16", cells: [ 16, 8, delivered ], tone: base }
                - { k: "17", cells: [ 17, 4, paid ], tone: base }
                - { k: "18", cells: [ 18, 7, paid ], tone: base }
                - { k: "19", cells: [ 19, 1, placed ], tone: base }
                - { k: "20", cells: [ 20, 6, placed ], tone: base }
            - id: g
              title: groups
              columns: [ customer_id, order ids, count(*) ]
              rows:
                - { k: "1", cells: [ 1, "1,3,9,14,19", 5 ], tone: compare }
                - { k: "2", cells: [ 2, "2,7", 2 ], tone: compare }
                - { k: "3", cells: [ 3, "11", 1 ], tone: compare }
                - { k: "4", cells: [ 4, "5,17", 2 ], tone: compare }
                - { k: "5", cells: [ 5, "6,12", 2 ], tone: compare }
