# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: yaml
  check: illustration
  note: 'A GitHub Actions file. Checked for valid YAML and the expected structure; it has not been run on GitHub. Two things to know: the action versions shown (checkout v4, setup-python v5) still work but are no longer the newest, and ''ruff check .'' only works if ruff is listed in requirements.txt.'
  verify: |
    import yaml
    doc = yaml.safe_load(block.split("\n", 1)[1])      # skip the first line, a comment with the file's path
    assert block.startswith("# .github/workflows/ci.yml")
    triggers = doc.get("on", doc.get(True))             # YAML 1.1 reads the bare word "on" as true
    assert triggers == ["push", "pull_request"]
    steps = doc["jobs"]["test"]["steps"]
    assert doc["jobs"]["test"]["runs-on"] == "ubuntu-latest"
    assert [s.get("uses") or s.get("run") for s in steps] == ["actions/checkout@v4", "actions/setup-python@v5", "pip install -r requirements.txt", "ruff check .", "pytest"]
    assert steps[1]["with"] == {"python-version": "3.12"}
