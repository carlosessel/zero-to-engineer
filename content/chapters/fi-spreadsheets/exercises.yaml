- title: Do this
  items:
    - key: x1
      text: "Open Google Sheets, LibreOffice Calc or Excel and enter Esi's six months of spending. Add Total, Mean, Highest and Lowest with SUM, AVERAGE, MAX and MIN, and check you get 12100, 2016.67 (to two decimal places), 2320 and 1790."
    - key: x2
      text: "Build the growth table with the rate in F1, extend it to 10 years, and check that year 10 ends at 2,593.74 when F1 is 10%."
    - key: x3
      text: "Remove the dollar signs from the rate in your growth table, copy the formula down, and watch the growth disappear. Then put them back."
    - key: x4
      text: "Make a column chart of the six months of spending and a line chart of the growth table."
    - key: x5
      text: "Start a sheet of your own (or a made-up person's) monthly income and spending. You will build it into a budget later in the course."
