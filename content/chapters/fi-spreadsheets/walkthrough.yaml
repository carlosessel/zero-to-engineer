- id: fi-spreadsheets-copy-down
  title: Copying a formula down a growth table
  hint: Watch which addresses shift when the formula is copied, and which one the dollar signs hold still.
  language: Spreadsheet
  code: |
    F1:  10%
    C2:  =B2*(1+$F$1)
    B3:  =C2
    C3:  =B3*(1+$F$1)
    B4:  =C3
    C4:  =B4*(1+$F$1)
  steps:
    - title: The inputs
      text: The rate, 10%, sits in its own cell, F1. Year 1 starts with GH₵ 1,000 in B2. Nothing has been calculated yet.
      lines: [1]
      vars: { F1: "10% (holds 0.1)" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, ""], tone: active }
                - { k: r3, cells: [3, "", "", ""] }
                - { k: r4, cells: [4, "", "", ""] }
    - title: The first formula
      text: C2 multiplies the start by the multiplier, 1 + the rate. The dollar signs in $F$1 make it an absolute reference. 1000 × 1.1 = 1100.
      lines: [2]
      vars: { C2: "=B2*(1+$F$1) → 1100" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1100], tone: found }
                - { k: r3, cells: [3, "", "", ""] }
                - { k: r4, cells: [4, "", "", ""] }
    - title: Each year starts where the last ended
      text: B3 holds =C2, a relative reference to the cell above and to the right. Year 2 starts with 1100.
      lines: [3]
      vars: { B3: "=C2 → 1100" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1100], tone: dim }
                - { k: r3, cells: [3, 2, 1100, ""], tone: active }
                - { k: r4, cells: [4, "", "", ""] }
    - title: Copy C2 down to C3
      text: The relative B2 shifts down one row to B3. The absolute $F$1 does not move, so year 2 still uses the 10% rate. 1100 × 1.1 = 1210.
      lines: [4]
      vars: { C3: "=B3*(1+$F$1) → 1210" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1100], tone: dim }
                - { k: r3, cells: [3, 2, 1100, 1210], tone: found }
                - { k: r4, cells: [4, "", "", ""] }
    - title: Copy row 3 down to row 4
      text: Every reference in the row shifts down again except $F$1. Year 3 starts at 1210 and ends at 1210 × 1.1 = 1331.
      lines: [5, 6]
      vars: { B4: "=C3 → 1210", C4: "=B4*(1+$F$1) → 1331" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1100], tone: dim }
                - { k: r3, cells: [3, 2, 1100, 1210], tone: dim }
                - { k: r4, cells: [4, 3, 1210, 1331], tone: found }
    - title: Without the dollar signs
      text: Had C2 been =B2*(1+F1), copying it down would make C3 use F2, an empty cell that counts as 0. Year 2 would show no growth, with no error message to warn you.
      vars: { "C3 (wrong)": "=B3*(1+F2) → 1100" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1100], tone: dim }
                - { k: r3, cells: [3, 2, 1100, 1100], tone: bad }
                - { k: r4, cells: [4, 3, 1100, 1100], tone: bad }
    - title: Change one cell, everything updates
      text: With the correct formulas, typing 5% into F1 recalculates the whole table at once. That is why the rate lives in one cell.
      lines: [1]
      vars: { F1: "5% (holds 0.05)" }
      parts:
        - kind: tables
          id: t
          slots: 3
          tables:
            - id: s
              title: growth table
              columns: [row, "A: Year", "B: Start", "C: End"]
              rows:
                - { k: r2, cells: [2, 1, 1000, 1050], tone: found }
                - { k: r3, cells: [3, 2, 1050, 1102.5], tone: found }
                - { k: r4, cells: [4, 3, 1102.5, 1157.63], tone: found }
