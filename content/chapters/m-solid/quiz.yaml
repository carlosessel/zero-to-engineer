- question: What does the single responsibility principle say?
  options:
  - A class should have only one method
  - A module should have one reason to change, answering to one group of people
  answer: 1
  explanation: Split where parts change for different reasons, not by counting methods.
- question: A subclass overrides a method to throw "not supported". Which principle is likely broken?
  options:
  - Liskov substitution
  - Open-closed
  answer: 0
  explanation: Callers of the base type cannot rely on its promises any more.
- question: How does the open-closed principle usually show up in code?
  options:
  - New behaviour is added as a new class or rule behind an interface
  - Classes are never edited again
  answer: 0
  explanation: Existing, tested code stays as it is when you add a case.
- question: What does dependency injection give you?
  options:
  - Objects receive their dependencies, so tests can pass fakes
  - Faster code
  answer: 0
  explanation: It is the usual way to apply dependency inversion.
- question: Why prefer several small interfaces to one large one?
  options:
  - Implementers and callers depend only on what they use
  - Small interfaces compile faster
  answer: 0
  explanation: That is interface segregation; it also keeps test fakes small.
- question: When is adding an interface not worth it?
  options:
  - For pure logic with one implementation that never needs faking
  - For a database or email dependency
  answer: 0
  explanation: Abstractions belong at real boundaries.
