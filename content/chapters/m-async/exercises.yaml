- title: Do this
  items:
  - key: x1
    text: Find two independent awaits in a codebase and run them concurrently, measuring the difference
  - key: x2
    text: Add a timeout and cancellation to every outgoing HTTP call in a small service
  - key: x3
    text: Turn on the floating-promise lint rule (or the .NET analyzer for unawaited tasks) and fix what it finds
  - key: x4
    text: Switch a Spring Boot or plain Java service to virtual threads and load-test before and after
