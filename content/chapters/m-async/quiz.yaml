- question: 'What runs first after a script finishes: a promise reaction or a zero-delay timer?'
  options:
  - The promise reaction (a microtask)
  - The timer
  answer: 0
  explanation: All microtasks run before the next task.
- question: Three independent 300 ms calls are awaited one after another. How long does it take, and how to fix it?
  options:
  - About 900 ms; start them together and await Promise.all or Task.WhenAll
  - 300 ms; nothing to fix
  answer: 0
  explanation: Concurrent awaits take as long as the slowest.
