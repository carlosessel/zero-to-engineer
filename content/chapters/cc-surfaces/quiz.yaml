- question: Which surface keeps working on a task after you close your laptop?
  options:
  - The VS Code extension
  - A cloud session on claude.ai/code
  - The terminal
  answer: 1
  explanation: Cloud sessions run on Anthropic's machines.
- question: Why does the desktop app give each session its own Git worktree?
  options:
  - To save disk space
  - So parallel sessions cannot overwrite each other's files
  - Because Git requires it
  answer: 1
  explanation: Each worktree is a separate working copy on its own branch.
- question: A task works locally but fails in a cloud session because a database is missing. Why?
  options:
  - Cloud sessions are slower
  - The cloud session has only what is in the repository and its environment, not your laptop's services
  - Databases are not allowed
  answer: 1
  explanation: Set up the cloud environment, or run that task locally.
