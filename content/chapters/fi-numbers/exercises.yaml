- title: Do this
  items:
    - key: x1
      text: "Find three prices you paid a year ago and what they cost now (or ask someone). Work out the percentage change in each."
    - key: x2
      text: "Find a news story that reports a change in an interest rate or inflation rate. Decide whether it gave the change in percent or percentage points, and work out the other one."
    - key: x3
      text: "With your phone's calculator, work out what GH₵ 1,000 becomes after 10 years at 8% a year (1,000 × 1.08 to the power 10). You should get GH₵ 2,158.92."
    - key: x4
      text: "Look at a receipt or bill that shows a tax or service charge. Check its arithmetic, and work backwards from the total to the price before the charge."
