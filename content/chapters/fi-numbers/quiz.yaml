- question: "A GH₵ 600 price includes a 20% tax. What was the price before tax?"
  options:
    - "GH₵ 500"
    - "GH₵ 480"
    - "GH₵ 580"
    - "GH₵ 720"
  answer: 0
  explanation: "Undo the multiplier: 600 ÷ 1.20 = 500. Taking 20% off 600 (giving 480) is the classic mistake, because the tax was 20% of the original price, not of 600."
- question: "A bank raises its loan rate from 10% to 12%. Which statement is correct?"
  options:
    - "The rate rose by 2 percentage points, which is a 20% increase in the rate"
    - "The rate rose by 2%, which is the same as 2 percentage points"
    - "The rate rose by 20 percentage points"
    - "The rate rose by 12%"
  answer: 0
  explanation: "The plain difference is 12 − 10 = 2 percentage points. As a percentage change it is 2 ÷ 10 = 20%. Calling it a 2% rise mixes up the two."
- question: "Your savings rise by 10% one year and by 10% again the next. What is the total rise?"
  options:
    - "21%"
    - "20%"
    - "11%"
    - "100%"
  answer: 0
  explanation: "Multiply the multipliers: 1.1 × 1.1 = 1.21, a 21% rise. The second 10% is taken of a bigger amount than the first, so the total is more than 20%."
- question: "An investment falls by 20%. What rise does it need to get back to its starting value?"
  options:
    - "25%"
    - "20%"
    - "40%"
    - "16%"
  answer: 0
  explanation: "After the fall it is worth 0.8 of the start; 1 ÷ 0.8 = 1.25, so it needs a 25% rise. 20% is not enough because it is taken of the smaller, fallen value."
- question: "A lender charges 2% a month, added to the balance each month. Over a year this comes to:"
  options:
    - "about 26.8%, because each month's 2% is charged on a growing balance"
    - "exactly 24%, because 12 × 2 = 24"
    - "exactly 2%"
    - "about 20%, because some months are shorter"
  answer: 0
  explanation: "1.02 multiplied by itself 12 times is 1.2682, about 26.8%. Multiplying by 12 ignores compounding, so it understates the cost."
- question: "Rent goes from GH₵ 2,000 to GH₵ 2,500. What is the percentage change?"
  options:
    - "25% increase"
    - "20% increase"
    - "50% increase"
    - "500% increase"
  answer: 0
  explanation: "(2,500 − 2,000) ÷ 2,000 = 0.25, a 25% rise. Dividing by the new value (500 ÷ 2,500 = 20%) is the common mistake; always divide by the old value."
- question: "Which is the best practice when calculating with money?"
  options:
    - "Keep full figures during the calculation and round to two decimal places at the end"
    - "Round to whole cedis at every step to keep things simple"
    - "Round to two decimal places after every step"
    - "Never round"
  answer: 0
  explanation: "Rounding in the middle, especially before a power, changes the final answer. Money is shown to two decimal places, so you do round, but only at the end."
