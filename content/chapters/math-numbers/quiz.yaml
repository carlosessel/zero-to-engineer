- question: "What is 2 + 3 × 4?"
  options:
    - "20"
    - "14"
    - "24"
  answer: 1
  explanation: "Multiplication comes before addition."
- question: "A learning rate is written 1e-3. What number is that?"
  options:
    - "1000"
    - "0.001"
    - "3"
  answer: 1
  explanation: "1e-3 means 1 × 10⁻³."
- question: "In y = mx + b, what does m control?"
  options:
    - "Where the line crosses the vertical axis"
    - "How steep the line is"
    - "The colour of the line"
  answer: 1
  explanation: "m is the slope: the change in y for each step of 1 in x."
- question: "log₂(16) is…"
  options:
    - "4"
    - "8"
    - "32"
  answer: 0
  explanation: "2 to the power 4 is 16. A log asks which power is needed."
