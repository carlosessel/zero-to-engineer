- question: "Lamisi has GH₵ 3,000 in savings, a motorbike worth GH₵ 9,000, and owes GH₵ 7,500 on the loan she used to buy it. What is her net worth?"
  options:
    - "GH₵ 4,500"
    - "GH₵ 12,000"
    - "GH₵ 19,500"
    - "−GH₵ 4,500"
  answer: 0
  explanation: "Net worth is assets minus liabilities: 3,000 + 9,000 = 12,000 of assets, minus 7,500 owed, leaves 4,500. GH₵ 12,000 forgets the loan; GH₵ 19,500 adds the loan as if it were an asset."
- question: "What is the main difference between saving and investing?"
  options:
    - "Investing accepts the risk that the value falls, in exchange for expected (not promised) higher growth over long periods"
    - "Saving is for poor people and investing is for rich people"
    - "Investing always earns more than saving"
    - "Saving is done in a bank and investing is done online"
  answer: 0
  explanation: "The difference is risk. Savings in a sound bank hold their value and can be reached quickly; investments can fall and may be hard to sell quickly. Investing is expected to grow faster over long periods, but never guaranteed to, so “always earns more” is wrong."
- question: "A website from another country says a certain retirement account is tax-free. What should you do with that information?"
  options:
    - "Check what the tax rules are in your own country, from an official source, before relying on it"
    - "Open the same account, since tax rules are the same everywhere"
    - "Ignore all information from other countries"
    - "Ask a friend whether they have one"
  answer: 0
  explanation: "Ideas such as how interest works are universal, but tax, pensions and products vary by country. Foreign information can still teach you the idea, so ignoring it is unnecessary; just confirm the local rules officially."
- question: "Which of these is a liability?"
  options:
    - "A credit card balance you have not yet paid"
    - "A savings account"
    - "Money a friend owes you"
    - "A laptop you own outright"
  answer: 0
  explanation: "A liability is money you owe. The credit card balance is owed by you. Money a friend owes you is owed to you, so it is an asset, like the savings and the laptop."
- question: "Ebo saves GH₵ 150 a week. Ignoring interest, roughly how much does he save in a year of 52 weeks?"
  options:
    - "GH₵ 7,800"
    - "GH₵ 1,800"
    - "GH₵ 600"
    - "GH₵ 15,000"
  answer: 0
  explanation: "52 × 150 = 7,800. GH₵ 1,800 is what you get by wrongly treating 150 as a monthly amount (12 × 150)."
- question: "Which is the strongest warning sign that an offer may be a fraud?"
  options:
    - "It guarantees a high return with no risk and asks you to decide today"
    - "It says the value of your investment can go down as well as up"
    - "It lists its charges in a document before you invest"
    - "It tells you to check its licence on the regulator's register"
  answer: 0
  explanation: "High returns always come with risk, so a guaranteed high return with no risk is a contradiction, and pressure to decide quickly stops you checking. The other three are what honest, regulated firms do."
