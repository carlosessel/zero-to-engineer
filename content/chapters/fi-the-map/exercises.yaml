- title: Do this
  items:
    - key: x1
      text: "Write down your own (or a made-up person's) monthly money under the seven headings: earn, spend, save, borrow, protect, invest, give. Rough amounts are fine."
    - key: x2
      text: "List everything you own of value and everything you owe, and work out your net worth. Keep the figure: you will compare it in later chapters."
    - key: x3
      text: "Find the official websites of the regulators for banks, investments and pensions in your country, and bookmark the page where each lists the firms it licenses."
    - key: x4
      text: "Read the SEC Ghana frequently asked questions page and write one sentence in your own words saying what a collective investment scheme is."
