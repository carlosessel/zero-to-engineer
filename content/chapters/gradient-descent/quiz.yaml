- question: "Loss jumps around and then becomes nan. First suspect?"
  options:
    - "Learning rate too high"
    - "Too little data"
    - "Wrong random seed"
  answer: 0
  explanation: "Overshooting from a high learning rate makes each step land further away."
- question: "What is an epoch?"
  options:
    - "One weight update"
    - "One pass through the entire training set"
    - "One batch of examples"
  answer: 1
  explanation: "An epoch covers all training examples once, in many batches."
