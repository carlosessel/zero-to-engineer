- question: "Which usually improves output format most?"
  options:
    - "Writing the prompt in capital letters"
    - "Including a few examples of input and desired output"
    - "Making the prompt shorter"
  answer: 1
  explanation: "Examples show the pattern directly."
- question: "How should you judge a prompt change?"
  options:
    - "Try it on one input"
    - "Run it against a saved set of test cases"
    - "Ask the model if the prompt is good"
  answer: 1
  explanation: "One example hides regressions elsewhere."
