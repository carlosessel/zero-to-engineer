- block: 4
  lang: bash
  check: shell
  needs: network
  script: |
    npm create vite@latest my-ts-app -- --template react-ts --no-interactive
    cd my-ts-app
    npm install
    npm run build
    # The starter installs TypeScript 7 (checked 12 November 2026).
    npx tsc -v | grep -q "Version 7"
    # Its build refuses code with a type error, reporting the code the chapter shows.
    printf 'function formatPrice(price: number): string {\n  return "£" + price.toFixed(2);\n}\nformatPrice("3.80");\n' > src/check.ts
    if npx tsc -b > out.txt 2>&1; then echo "expected a type error"; exit 1; fi
    grep -q "TS2345" out.txt
  note: Creates the real TypeScript starter, builds it, and checks that its own TypeScript 7 compiler reports the chapter's first error.
