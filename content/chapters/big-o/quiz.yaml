- question: "A loop inside a loop over the same n items is usually…"
  options:
    - "O(1)"
    - "O(n)"
    - "O(n²)"
  answer: 2
  explanation: "n times n steps."
- question: "Why is checking membership in a set faster than in a list?"
  options:
    - "Sets are smaller"
    - "A set jumps straight to the item using a hash; a list checks each item"
    - "Lists are sorted"
  answer: 1
  explanation: "Constant time against linear time."
