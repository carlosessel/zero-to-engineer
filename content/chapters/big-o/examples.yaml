# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |2+

  verify: |
    slow, fast = ns['has_duplicate_slow'], ns['has_duplicate_fast']
    for items in ([], [1], [1, 2, 3], [1, 2, 1], ['a', 'b', 'b'], list(range(200)) + [7]):
        assert slow(items) == fast(items) == (len(set(items)) != len(items)), items
    # "With a million items, the first does around 500 billion comparisons"
    n = 1_000_000
    assert round(n * (n - 1) / 2 / 1e9) == 500
