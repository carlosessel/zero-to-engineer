- question: What goes wrong when a plain BST receives sorted input?
  options:
  - Nothing
  - It becomes a chain with O(n) operations
  answer: 1
  explanation: Use a balanced tree.
- question: Which structure answers 'the next booking after 11:00' efficiently?
  options:
  - Hash map
  - Sorted map (balanced tree)
  answer: 1
  explanation: O(log n) with floor and ceiling queries.
- question: Why are database indexes B-trees rather than binary trees?
  options:
  - Many keys per node mean few levels and few disk reads
  - B-trees use less disk
  answer: 0
  explanation: A billion keys in three or four levels.
- question: How do you find the 10 largest of a billion numbers efficiently?
  options:
  - Sort them all
  - Keep a min-heap of size 10
  answer: 1
  explanation: O(n log k) time, O(k) memory.
- question: What is a trie good for?
  options:
  - Finding all words with a prefix
  - Sorting numbers
  answer: 0
  explanation: Autocomplete and routing.
