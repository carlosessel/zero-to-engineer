- question: "Which of these is a web application rather than mostly a website to read?"
  options:
    - "A page listing a museum's opening hours"
    - "An online form where you book and pay for museum tickets"
    - "A news article"
  answer: 1
  explanation: "Booking and paying means the page takes your input, checks it and stores it. Reading opening hours or an article is mostly reading."
- question: "Where must the check that a password is correct happen?"
  options:
    - "In the browser, so it is fast"
    - "On the server"
    - "In the CSS"
  answer: 1
  explanation: "The correct password must never be sent to the browser, and anything in the browser can be changed by the person using it. Only the server can be trusted with the check."
- question: "Which language says how a page looks: colours, spacing and fonts?"
  options:
    - "HTML"
    - "CSS"
    - "JavaScript"
  answer: 1
  explanation: "HTML says what is on the page, CSS how it looks, JavaScript how it responds."
- question: "In the bookshop example, which step happens on the back end?"
  options:
    - "Drawing the list of books with pictures"
    - "Noticing that you typed in the search box"
    - "Looking up which books match \"gardening\" in the database"
  answer: 2
  explanation: "The database lives on the server. The browser asks, the server looks it up and sends back data, and the browser draws it."
- question: "Why does this course teach JavaScript for both the browser and the server?"
  options:
    - "Because it is the only language that can run on a server"
    - "Because learning one language well first is easier, and almost every web job uses JavaScript"
    - "Because other languages are out of date"
  answer: 1
  explanation: "Many languages run on servers. Using one language everywhere lets a beginner go deep before going wide."
- question: "A check in the browser stops people submitting an empty form. Does the server still need to check?"
  options:
    - "Yes, because browser checks can be bypassed"
    - "No, the browser has already checked"
    - "Only if the site is very large"
  answer: 0
  explanation: "Anyone can change what runs in their own browser or send requests without the page. Browser checks are for convenience; server checks are for safety."
