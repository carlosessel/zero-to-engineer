# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: pip
- block: 2
  lang: python
  check: python-fake-api
  before: |
    import anthropic
    MODEL = "claude-sonnet-5-5"
    client = anthropic.Anthropic()

    def reply_text(msg):
        return "".join(block.text for block in msg.content if block.type == "text")
  replies:
  - text: Paris is the capital of France.
  note: 'Run against a stand-in server on the test machine, not the live API: this proves the SDK calls are valid and the reply is handled correctly, not what a real model would answer. The hidden setup defines client, MODEL and reply_text exactly as the chapter ''Your first model call'' does; the code comment tells the reader they come from there. The endpoint is called through FastAPI''s test client rather than a running server.'
  verify: |
    from fastapi.testclient import TestClient
    web = TestClient(ns['app'])
    r = web.post("/ask", json={"question": "What is the capital of France?"})
    assert r.status_code == 200 and r.text == "Paris is the capital of France.", (r.status_code, r.text)
    assert requests[0]["messages"] == [{"role": "user", "content": "What is the capital of France?"}] and requests[0]["stream"] is True
    assert web.post("/ask", json={}).status_code == 422   # a request with no question is rejected
