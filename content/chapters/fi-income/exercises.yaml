- title: Do this
  items:
    - key: x1
      text: "Take a real payslip (yours or one a family member is happy to share with names covered), or Kwesi's from this chapter, and check its three totals: earnings, deductions, and gross minus deductions equals net."
    - key: x2
      text: "In a spreadsheet, put Ghana's monthly bands in cells and write formulas that work out the tax for any chargeable income typed into one cell. Check it gives 885.75 for 5,125 and 515.73 for 3,635."
    - key: x3
      text: "Find your own country's current income tax bands on the tax authority's website, write down the date they took effect, and work out the tax on a monthly income you choose."
    - key: x4
      text: "If your income varies, list the last six months, find the mean and the lowest month, and write down which one you will plan essentials on."
