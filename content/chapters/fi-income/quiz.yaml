- question: "Efia's chargeable income is GH₵ 4,000 a month. Under Ghana's 2026 monthly bands, what is her marginal tax rate?"
  options:
    - "25%"
    - "17.5%"
    - "35%"
    - "0%"
  answer: 0
  explanation: "The first four bands end at 588 + 80 + 100 + 2,900 = 3,668. Her income goes beyond that into the 25% band, so her next cedi is taxed at 25%. That does not mean all her income is taxed at 25%."
- question: "A pay rise moves part of your income into a higher tax band. What happens to your net pay?"
  options:
    - "It rises, because only the income above the band's start is taxed at the higher rate"
    - "It falls, because all your income is now taxed at the higher rate"
    - "It stays exactly the same"
    - "It rises by the full amount of the rise"
  answer: 0
  explanation: "Each rate applies only to the income in its own band, so you keep part of every rise. It does not rise by the full amount, because tax and contributions take some."
- question: "Kwame's payslip shows gross pay GH₵ 4,200, total deductions GH₵ 870 and net pay GH₵ 3,430. What should he conclude?"
  options:
    - "There is a GH₵ 100 error, because 4,200 − 870 = 3,330, not 3,430"
    - "The payslip is correct"
    - "His tax rate is 20%"
    - "His deductions are too high"
  answer: 0
  explanation: "Gross pay minus total deductions must equal net pay: 4,200 − 870 = 3,330. The payslip's net pay is GH₵ 100 different, so he should ask his employer."
- question: "A job pays GH₵ 1,200 a week. What is the best estimate of the monthly pay?"
  options:
    - "GH₵ 5,200, because 1,200 × 52 ÷ 12 = 5,200"
    - "GH₵ 4,800, because a month is four weeks"
    - "GH₵ 14,400"
    - "GH₵ 1,200"
  answer: 0
  explanation: "Convert through the year: 52 weeks, then divide by 12 months. A month is about 4.33 weeks, so multiplying by 4 understates it."
- question: "A freelancer's monthly income varies between GH₵ 1,500 and GH₵ 6,000, averaging GH₵ 3,500. On what should she base her essential spending?"
  options:
    - "Something close to a low month, around GH₵ 1,500"
    - "The average, GH₵ 3,500"
    - "The best month, GH₵ 6,000"
    - "Whatever she earned last month"
  answer: 0
  explanation: "Essentials must be paid every month, including the bad ones. Planning on the average leaves her short in every below-average month."
- question: "What is the difference between an allowance and a deduction on a payslip?"
  options:
    - "An allowance is added to pay; a deduction is taken off it"
    - "An allowance is tax; a deduction is a bonus"
    - "They are two names for the same thing"
    - "An allowance is paid by the government; a deduction by the employer"
  answer: 0
  explanation: "Allowances (such as transport or rent) are extra payments that increase gross pay. Deductions (tax, social security, loan repayments) are taken off gross pay to give net pay."
