- title: Do this
  items:
  - key: x1
    text: Profile one slow endpoint of your API with your stack's CPU profiler and fix the hottest function
  - key: x2
    text: Attach a debugger to your API running in a container and stop at a conditional breakpoint
  - key: x3
    text: Add a deliberate leak (an unbounded cache), find it with two heap dumps, then remove it
  - key: x4
    text: Take a thread dump of your service under load and describe what the request threads are doing
