- question: "Training error is near zero but validation error is high. This is…"
  options:
    - "underfitting"
    - "overfitting"
    - "data leakage"
  answer: 1
  explanation: "The model memorised the training data, including its noise."
- question: "Which is an example of data leakage?"
  options:
    - "Using a simpler model"
    - "Normalising with statistics computed on train and test together"
    - "Training for fewer epochs"
  answer: 1
  explanation: "Test information leaked into training. Split first, then compute anything."
