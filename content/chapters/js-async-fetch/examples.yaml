- block: 4
  lang: html
  check: browser
  combine:
  - 4
  - 5
  fetch_json:
    https://api.github.com/users/octocat:
      login: octocat
      name: The Octocat
      public_repos: 8
  actions:
  - click: '#lookup button'
  expect:
  - (async () => { await new Promise((r) => setTimeout(r, 300)); return document.querySelector('#profile-name').textContent === 'The Octocat' && document.querySelector('#profile-repos').textContent === '8 public repositories' && !document.querySelector('#profile').hidden && document.querySelector('#status').textContent === '' && !document.querySelector('#lookup button').disabled; })()
  - (async () => { document.querySelector('#username').value = 'nobody-zz9'; document.querySelector('#lookup').requestSubmit(); await new Promise((r) => setTimeout(r, 300)); return document.querySelector('#status').textContent === 'There is no GitHub user called nobody-zz9.' && document.querySelector('#profile').hidden; })()
  note: Run with saved replies (copied from the real services on 12 November 2026) instead of the internet, so the check does not depend on the network. Looks up octocat (success state), then an unknown name (the 404 message).
