- id: js-async-fetch-await
  title: What await waits for
  hint: Watch the order things happen in. showUser pauses at each await, but the rest of the code carries on.
  language: JavaScript
  code: |
    async function showUser() {
      const response = await fetch("https://api.github.com/users/octocat");
      const user = await response.json();
      console.log(user.name, "has", user.public_repos, "public repositories");
    }

    showUser();
    console.log("Asked GitHub. Waiting…");
  steps:
    - title: showUser is called
      text: Defining the function ran nothing. The call on this line starts it.
      lines: [7]
      parts:
        - kind: seq
          id: s
          actors: [Your code, GitHub]
          slots: 4
          messages: []
        - { kind: kv, id: mem, label: "Promises", slots: 2, rows: [] }
        - { kind: terminal, id: out, slots: 2, lines: [] }
    - title: fetch sends a request
      text: fetch sends a request to the address and straight away returns a promise, a stand-in for a response that has not arrived yet. It is pending.
      lines: [2]
      parts:
        - kind: seq
          id: s
          actors: [Your code, GitHub]
          slots: 4
          messages:
            - { from: Your code, to: GitHub, label: "GET /users/octocat", tone: active }
        - kind: kv
          id: mem
          label: "Promises"
          slots: 2
          rows: [{ name: "fetch(…)", value: pending, tone: compare }]
    - title: await pauses only showUser
      text: await pauses showUser until the promise settles. The rest of the code carries on, so the next line after the call runs now.
      lines: [2, 8]
      parts:
        - { kind: terminal, id: out, slots: 2, lines: ["Asked GitHub. Waiting…"] }
    - title: The response arrives
      text: GitHub replies and the promise is fulfilled. await hands back the response, which has the status, but its body is still to be read.
      lines: [2]
      vars: { response: "a response (body not read)" }
      parts:
        - kind: seq
          id: s
          actors: [Your code, GitHub]
          slots: 4
          messages:
            - { from: Your code, to: GitHub, label: "GET /users/octocat", tone: dim }
            - { from: GitHub, to: Your code, label: "response: status, then body", tone: found }
        - kind: kv
          id: mem
          label: "Promises"
          slots: 2
          rows: [{ name: "fetch(…)", value: fulfilled, tone: found }]
    - title: Reading the body takes time too
      text: response.json() reads the body and turns the JSON into an object. It also returns a promise, so showUser waits again.
      lines: [3]
      parts:
        - kind: kv
          id: mem
          label: "Promises"
          slots: 2
          rows: [{ name: "fetch(…)", value: fulfilled, tone: dim }, { name: "response.json()", value: pending, tone: compare }]
    - title: An ordinary object
      text: The second promise is fulfilled. Now user is a plain object, used like any other.
      lines: [3]
      vars: { response: "a response", user: "{ name: …, public_repos: … }" }
      parts:
        - kind: kv
          id: mem
          label: "Promises"
          slots: 2
          rows: [{ name: "fetch(…)", value: fulfilled, tone: dim }, { name: "response.json()", value: fulfilled, tone: found }]
    - title: The details print last
      text: The user's details print after the waiting message, even though their line comes first in the code. Code after an await runs only when the promise settles.
      lines: [4]
      parts:
        - { kind: terminal, id: out, slots: 2, lines: ["Asked GitHub. Waiting…", "(name) has (number) public repositories"] }
