- title: "Do this"
  items:
    - key: x1
      text: "Run each example, then turn off your Wi-Fi and run them again to see the error handling"
    - key: x2
      text: "Rebuild the GitHub look-up in your own files and add a picture of the user (the reply's avatar_url) with good alt text"
    - key: x3
      text: "Watch the Network panel in the developer tools while your page fetches, and find the request, its status and its reply"
    - key: x4
      text: "Pick a free API from the Public APIs list that needs no key, and build a small page that shows something from it with loading and error states"
