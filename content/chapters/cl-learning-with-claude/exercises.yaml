- title: "Do this"
  items:
    - key: x1
      text: "Set up a tutor project with the instructions from this chapter, and use it for one chapter of another course on this site"
    - key: x2
      text: "Explain a concept you think you know in your own words, and ask Claude to find what is missing or wrong"
