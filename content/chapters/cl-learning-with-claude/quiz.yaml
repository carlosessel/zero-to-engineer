- question: "Which request helps you learn most when stuck on an exercise?"
  options:
    - "Give me the answer"
    - "Here is my attempt: what is the first thing I have wrong? Give me a hint, not the fix"
    - "Rewrite my attempt correctly"
  answer: 1
  explanation: "Learning happens in working it out; a hint keeps the effort with you."
- question: "Claude explains a concept confidently. What should you do before relying on it?"
  options:
    - "Nothing: it sounded sure"
    - "Run any code, and check facts that matter against documentation"
  answer: 1
  explanation: "Confidence says nothing about accuracy. Code can be run; facts can be checked."
- question: "You want honest feedback on a design you favour. What should you ask?"
  options:
    - "Do you agree this is the best design?"
    - "Make the strongest case against this design, and for the main alternative"
  answer: 1
  explanation: "Claude can be led into agreeing; asking it to argue the other side tests your idea."
- question: "What is the risk of always asking Claude to 'make this better' on your writing?"
  options:
    - "None"
    - "Generic edits that lose your voice and points, and less improvement in your own writing"
  answer: 1
  explanation: "Ask for specific feedback on your draft instead, and keep the decisions yours."
