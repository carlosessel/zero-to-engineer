- question: "What does loss.backward() do?"
  options:
    - "Updates the weights"
    - "Computes gradients"
    - "Loads the next batch"
  answer: 1
  explanation: "backward() computes gradients. optimizer.step() applies them."
- question: "Why call opt.zero_grad() each step?"
  options:
    - "Gradients accumulate otherwise"
    - "It resets the weights"
    - "It frees GPU memory"
  answer: 0
  explanation: "PyTorch adds new gradients to existing ones unless you clear them."
