- title: Do this
  items:
    - key: x1
      text: "In a spreadsheet, build simple and compound interest side by side for GH₵ 1,000 at 10% for 30 years, and check year 30 gives 4,000 and 17,449.40. Then chart both columns."
    - key: x2
      text: "Find the AER on two savings accounts and the APR on two loans or credit cards from licensed providers, and write down which is best of each pair."
    - key: x3
      text: "Take any loan or mobile loan offer quoted per month and convert the rate to an effective yearly rate."
    - key: x4
      text: "Use the rule of 72 on three rates you see this week (a savings rate, a loan rate, an inflation rate) and check one with the formula."
