# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    0 1,000.00 1,000.00
    1 1,100.00 1,100.00
    2 1,200.00 1,210.00
    3 1,300.00 1,331.00
    4 1,400.00 1,464.10
    5 1,500.00 1,610.51
    6 1,600.00 1,771.56
  verify: |
    # The chapter's other figures, from the same formulas.
    assert round(2000 * 1.12 ** 3, 2) == 2809.86
    assert round(1000 * 1.1 ** 30, 2) == 17449.40
    assert round(2000 * 1.05 ** 12, 2) == 3591.71
    assert round((1.01 ** 12 - 1) * 100, 2) == 12.68
    assert round((1.03 ** 4 - 1) * 100, 2) == 12.55
    assert round(((1 + 0.12 / 365) ** 365 - 1) * 100, 2) == 12.75
    assert round((1.03 ** 12 - 1) * 100, 2) == 42.58
    assert round(500 * (1.01 ** 12 - 1) / 0.01, 2) == 6341.25
    assert round(100 * (1.01 ** 24 - 1) / 0.01, 2) == 2697.35
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    rows = [f"{y} {1000 + 100 * y:,.2f} {1000 * 1.1 ** y:,.2f}" for y in range(7)]
    assert block.strip().splitlines() == rows
