- question: "GH₵ 1,000 is saved at 10% a year for 2 years. Why does compound interest give GH₵ 1,210 but simple interest only GH₵ 1,200?"
  options:
    - "In year 2, compound interest is also paid on year 1's GH₵ 100 of interest"
    - "Compound interest uses a higher rate"
    - "Simple interest takes off a fee"
    - "Compound interest is paid twice a year"
  answer: 0
  explanation: "Both use 10%. Compound interest adds the first year's 100 to the balance, so year 2's interest is 10% of 1,100 = 110 rather than 100."
- question: "A lender advertises a loan at '5% a month'. What is the best description of its yearly cost before fees?"
  options:
    - "About 79.6% a year, because 1.05 to the power 12 is 1.796"
    - "60% a year, because 5 × 12 = 60"
    - "5% a year"
    - "It cannot be compared with yearly rates"
  answer: 0
  explanation: "Interest charged monthly on a growing balance compounds: 1.05¹² − 1 = 0.7959, about 79.6%. Multiplying by 12 understates it."
- question: "Which figure should you use to compare the cost of two loans of the same amount and term?"
  options:
    - "The APR, because it includes interest and compulsory fees"
    - "The nominal interest rate only"
    - "The monthly repayment only"
    - "The AER"
  answer: 0
  explanation: "The APR puts interest and fees into one yearly figure. A lower interest rate with a large fee can cost more; the AER is for comparing savings."
- question: "Account A pays 12% a year compounded yearly. Account B pays 12% a year compounded monthly. Which earns more?"
  options:
    - "B: its AER is about 12.68%"
    - "A: yearly compounding pays more"
    - "They earn exactly the same"
    - "It depends on the amount saved"
  answer: 0
  explanation: "More frequent compounding adds interest sooner, so it earns interest itself sooner: 1.01¹² = 1.1268, an AER of 12.68% against 12%."
- question: "Using the rule of 72, roughly how long does an unpaid debt at 24% a year take to double?"
  options:
    - "About 3 years"
    - "About 24 years"
    - "About 6 years"
    - "About 1 year"
  answer: 0
  explanation: "72 ÷ 24 = 3. The exact answer is about 3.2 years, but the rule is close enough to show how quickly high-rate debt grows."
- question: "Esi starts saving GH₵ 1,000 at age 25, and Kojo the same amount at age 35, both at 8% a year until 65. Who has more at 65, and why?"
  options:
    - "Esi, because her money compounds for 40 years instead of 30"
    - "Kojo, because he saved later when he earned more"
    - "Both the same, because the rate is the same"
    - "It depends on inflation only"
  answer: 0
  explanation: "1.08⁴⁰ is about 21.7 and 1.08³⁰ about 10.1, so Esi's single deposit grows to more than twice Kojo's. The extra years at the start add the most."
