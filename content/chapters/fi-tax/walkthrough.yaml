- id: fi-tax-after-tax
  title: Taxed against tax-free
  hint: Look at the kept column, not the interest column. That is what Esi actually has to spend or reinvest.
  steps:
  - title: The taxed account
    text: 'Esi has GH₵ 10,000. The taxed account pays 5%: 500 of interest. At her 40% rate, 200 goes in tax and she keeps 300, a 3% return.'
    vars:
      after-tax return: 3.0%
    parts:
    - kind: tables
      id: t
      slots: 3
      tables:
      - id: s
        title: A year's interest on 10,000, with tax at 40%
        columns:
        - account
        - interest
        - tax
        - kept
        rows:
        - k: r0
          cells:
          - taxed, 5%
          - '500.00'
          - '200.00'
          - '300.00'
          tone: active
  - title: The tax-free account
    text: 'The tax-free account pays only 4.2%: 420. But there is no tax, so she keeps all 420. The lower headline rate leaves her 120 more.'
    vars:
      after-tax return: 4.2%
    parts:
    - kind: tables
      id: t
      slots: 3
      tables:
      - id: s
        title: A year's interest on 10,000, with tax at 40%
        columns:
        - account
        - interest
        - tax
        - kept
        rows:
        - k: r0
          cells:
          - taxed, 5%
          - '500.00'
          - '200.00'
          - '300.00'
          tone: dim
        - k: r1
          cells:
          - tax-free, 4.2%
          - '420.00'
          - '0.00'
          - '420.00'
          tone: found
  - title: What would match it?
    text: To keep 420 after 40% tax, a taxed account must pay 420 ÷ 0.6 = 700, a rate of 7%. That is the tax-equivalent yield of 4.2%.
    vars:
      tax-equivalent yield: 4.2% ÷ 0.6 = 7%
    parts:
    - kind: tables
      id: t
      slots: 3
      tables:
      - id: s
        title: A year's interest on 10,000, with tax at 40%
        columns:
        - account
        - interest
        - tax
        - kept
        rows:
        - k: r0
          cells:
          - taxed, 5%
          - '500.00'
          - '200.00'
          - '300.00'
          tone: dim
        - k: r1
          cells:
          - tax-free, 4.2%
          - '420.00'
          - '0.00'
          - '420.00'
          tone: dim
        - k: r2
          cells:
          - taxed, 7%
          - '700.00'
          - '280.00'
          - '420.00'
          tone: found
  - title: The rule
    text: 'Compare after-tax returns: rate × (1 − tax rate). Or turn a tax-free rate into its taxed equivalent: rate ÷ (1 − tax rate).'
    parts:
    - kind: kv
      id: k
      label: At a 40% tax rate
      slots: 3
      rows:
      - name: 5% taxed
        value: 3.0% kept
      - name: 4.2% tax-free
        value: 4.2% kept
      - name: matches 4.2%
        value: 7% taxed
        tone: found
