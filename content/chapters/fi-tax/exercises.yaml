- title: Do this
  items:
    - key: x1
      text: "Find your marginal tax rate. For two savings or investment options available to you, work out the after-tax return and the tax-equivalent yield of any tax-free one."
    - key: x2
      text: "List each kind of investment income you receive or expect (interest, dividends, rent, gains) and find, on your tax authority's site, how each is taxed and whether any is exempt."
    - key: x3
      text: "Set up a simple record (a spreadsheet will do) of each investment: date bought, amount, costs, and later the sale date, proceeds and gain."
    - key: x4
      text: "Find the tax-advantaged accounts or pension tiers available in your country and their yearly limits. Write down which you use and which you could use."
