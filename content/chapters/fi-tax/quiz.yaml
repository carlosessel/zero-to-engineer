- question: "A taxed account pays 6% and you pay 40% tax on extra interest. A tax-free account pays 4%. Which leaves you more?"
  options:
    - "The tax-free account: 4% against 3.6% after tax"
    - "The taxed account, because 6% is higher"
    - "They are the same"
    - "It cannot be compared"
  answer: 0
  explanation: "6% × (1 − 0.40) = 3.6% after tax, less than the tax-free 4%."
- question: "What does a final withholding tax mean?"
  options:
    - "Tax is taken before you receive the income, and nothing more is due on it"
    - "Tax is paid at the end of the year on a return"
    - "The income is tax-free"
    - "Tax is due only when you sell"
  answer: 0
  explanation: "The payer deducts it at source and that settles the tax on that income, as with dividends in Ghana."
- question: "You hold shares that have risen in value but you have not sold them. In most systems, when is capital gains tax due?"
  options:
    - "Only when you sell and realise the gain"
    - "Every year on the rise in value"
    - "Never, because shares are exempt"
    - "When the company pays a dividend"
  answer: 0
  explanation: "Gains are usually taxed when realised. Until then the gain is unrealised, and the untaxed money keeps growing."
- question: "Interest is 20%, inflation 18% and tax on interest 30%. What happens to the real return after tax?"
  options:
    - "It becomes negative, about −3.4%"
    - "It stays positive at about 1.7%"
    - "It is exactly zero"
    - "Tax does not affect real returns"
  answer: 0
  explanation: "After tax: 14%. Real: 1.14 ÷ 1.18 − 1 = −3.4%. Tax on the part of interest that only made up for inflation turns the real return negative."
- question: "What is the difference between tax avoidance using allowances and tax evasion?"
  options:
    - "Using allowances the law provides is legal; hiding income or lying to the tax authority is a crime"
    - "There is no difference"
    - "Both are crimes"
    - "Evasion is legal if the amounts are small"
  answer: 0
  explanation: "Allowances and tax-advantaged accounts exist to be used. Evasion breaks the law."
- question: "For most people, what is a sensible order for long-term saving?"
  options:
    - "Take any employer contribution, then use tax-advantaged accounts, then ordinary accounts"
    - "Ordinary accounts first, because they are easier to reach"
    - "Only ordinary accounts, to avoid rules"
    - "Whatever pays the highest headline rate"
  answer: 0
  explanation: "Employer contributions are extra pay, and tax-advantaged accounts raise after-tax returns. Ordinary accounts come last, though some easy-access savings are needed for emergencies."
