- title: "Do this"
  items:
    - key: x1
      text: "Type the page skeleton from memory into a new `index.html`, then compare it with the chapter"
    - key: x2
      text: "Build a page about yourself or a place you know: an `h1`, two sections with `h2` headings, a list, a link to another site and an image with good alt text"
    - key: x3
      text: "Add a second page, `about.html`, and link the two pages to each other with relative links"
    - key: x4
      text: "Run your page through validator.w3.org and fix every error it reports"
    - key: x5
      text: "Open the Elements panel on a site you use and find its `header`, `nav`, `main` and `footer` (or notice that it has none)"
