- question: "What does HTML describe?"
  options:
    - "What each part of a page is: a heading, a paragraph, a link"
    - "How a page looks: colours and fonts"
    - "What happens when you click a button"
  answer: 0
  explanation: "HTML gives the page its structure and meaning. CSS controls the look and JavaScript the behaviour."
- question: "Which of these is a void element, with no closing tag?"
  options:
    - "<p>"
    - "<img>"
    - "<li>"
  answer: 1
  explanation: "An image has no text content, so <img> has no closing tag. Paragraphs and list items wrap content and must be closed."
- question: "Why should a page have only one <h1> and never skip heading levels?"
  options:
    - "Browsers refuse to show the page otherwise"
    - "Headings form an outline of the page that screen readers and search engines use"
    - "Because <h1> is the biggest text"
  answer: 1
  explanation: "Headings are an outline, like chapter and section titles. Size is a matter for CSS."
- question: "What alt text should a purely decorative image have?"
  options:
    - "None: leave the alt attribute out"
    - "alt=\"\", so screen readers skip it"
    - "alt=\"image\""
  answer: 1
  explanation: "An empty alt tells screen readers to skip the image. Leaving alt out makes many screen readers read the file name instead."
- question: "You are on blog/post.html. Where does the link href=\"../about.html\" go?"
  options:
    - "blog/about.html"
    - "about.html in the folder that contains blog"
    - "Another website called about.html"
  answer: 1
  explanation: ".. means one folder up, so from inside blog it reaches the folder above, where about.html is."
- question: "How does the browser show text that has several spaces and a line break in the HTML?"
  options:
    - "Exactly as typed"
    - "With the spaces and line break collapsed into one space"
    - "As an error"
  answer: 1
  explanation: "HTML collapses runs of whitespace into a single space. Use separate paragraphs, or <br> where a line break is part of the content."
- question: "Which is the better link text?"
  options:
    - "Click here"
    - "Read our delivery terms"
  answer: 1
  explanation: "Screen reader users often hear links on their own. \"Read our delivery terms\" says where the link goes; \"Click here\" does not."
