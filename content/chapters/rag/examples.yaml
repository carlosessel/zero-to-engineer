# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: heavy
  fake_api: true
  before: |
    import anthropic
    MODEL = "claude-sonnet-5-5"
    client = anthropic.Anthropic()

    def reply_text(msg):
        return "".join(block.text for block in msg.content if block.type == "text")
  replies:
  - text: Within 30 days, with your receipt [doc 0].
  note: Needs PyTorch or a model download, so it runs only in the weekly heavy job (EXAMPLES_HEAVY=1), not on every push. The embedding model is real; the model call goes to a stand-in server, not the live API. The hidden setup defines client, MODEL and reply_text as 'Your first model call' does.
  verify: |
    got = ns['answer']("Can I get my money back?")
    assert got == "Within 30 days, with your receipt [doc 0]."
    sent = requests[-1]["messages"][0]["content"]
    assert sent.startswith("<doc id='0'>Refunds are available"), sent[:80]   # the refund passage is ranked first
    assert sent.endswith("Question: Can I get my money back?")
