- question: You wrap a third-party library so it implements your own interface. Which pattern is it?
  options:
  - Adapter
  - Facade
  answer: 0
  explanation: An adapter makes an incompatible interface fit.
- question: Which pattern adds behaviour behind the same interface, and can be stacked?
  options:
  - Decorator
  - Composite
  answer: 0
  explanation: Logging, caching and retries are typical decorators.
- question: What is a facade for?
  options:
  - A simple entry point to a complicated subsystem
  - Sharing identical objects
  answer: 0
  explanation: It makes the common path easy without forbidding direct use.
- question: What lets a bundle of products and a single product both answer price()?
  options:
  - Composite
  - Bridge
  answer: 0
  explanation: Composites treat single items and groups the same way.
- question: Why can lazy-loading proxies make a page slow?
  options:
  - Each proxy can run its own query, giving N+1 queries
  - Proxies use more memory
  answer: 0
  explanation: Load related data together when you know you need it.
- question: Why does Integer c = 128, d = 128; c == d print false in Java?
  options:
  - == compares references, and only -128 to 127 are cached and shared
  - 128 overflows an Integer
  answer: 0
  explanation: Compare boxed values with equals.
