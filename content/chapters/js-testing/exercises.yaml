- title: "Do this"
  items:
    - key: x1
      text: "Add Vitest to one of your projects and write tests for three of your own functions, including the edge cases"
    - key: x2
      text: "Set up React Testing Library and test the to-do list from the state chapter: adding, ticking and deleting a task"
    - key: x3
      text: "Write a test for a bug: break a function in a small way, write the test that catches it, then fix the function and watch the test pass"
    - key: x4
      text: "Test a component that loads data, with one test for the data and one for the error state, mocking fetch"
    - key: x5
      text: "Run npx vitest --coverage (install the package it asks for) and find a line in your code that no test runs"
