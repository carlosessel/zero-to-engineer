# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  needs: network
  script: |
    npm init -y >/dev/null
    bash "$BLOCK"
    npx vitest --version | grep -q "vitest/5"
  note: Installs the current Vitest from npm (version 5 when checked).
- block: 2
  lang: json
  check: illustration
  verify: |
    import json
    scripts = json.loads(block)['scripts']
    assert scripts['test'] == 'vitest'
    assert scripts['dev'] == 'vite' and scripts['build'] == 'vite build'
