- question: What does { get; private set; } on a property allow?
  options:
  - Anyone can read it; only the class can change it
  - Nobody can change it after construction
  answer: 0
  explanation: Private set keeps changes inside the class's own methods.
- question: Two records with the same values are compared with ==. What is the result?
  options:
  - 'True'
  - 'False'
  answer: 0
  explanation: Records use value equality.
- question: Two ordinary class objects with the same values are compared with ==. What is the result, by default?
  options:
  - False, because classes compare by reference
  - 'True'
  answer: 0
  explanation: Classes compare whether they are the same object unless equality is overridden.
- question: What does the required keyword on a property do?
  options:
  - Makes setting it in an object initialiser mandatory
  - Makes it non-null at run time only
  answer: 0
  explanation: Leaving it out is a compile error.
- question: What does string? mean with nullable reference types on?
  options:
  - The variable may hold null
  - The variable is optional in the constructor
  answer: 0
  explanation: string means never null; string? means may be null.
- question: Why depend on an interface rather than a concrete class?
  options:
  - Implementations can be swapped, including fakes in tests
  - Interfaces run faster
  answer: 0
  explanation: Code depends on an ability, not on one implementation.
- question: What does the with expression do on a record?
  options:
  - Makes a copy with some values changed
  - Changes the original record in place
  answer: 0
  explanation: Records are copied non-destructively.
