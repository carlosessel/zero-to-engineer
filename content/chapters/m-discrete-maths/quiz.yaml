- question: Which is the same as !(a && b)?
  options:
  - '!a && !b'
  - '!a || !b'
  - a || b
  answer: 1
  explanation: De Morgan's first law.
- question: Roughly when do collisions become likely among random ids drawn from N possibilities?
  options:
  - After about N/2 ids
  - After about √N ids
  - Never, if N is big
  answer: 1
  explanation: The birthday problem.
- question: Ten services each 99.9% available, all needed for a request. Roughly how available is the request?
  options:
  - 99.9%
  - 99.0%
  - 90%
  answer: 1
  explanation: 0.999^10 ≈ 0.990.
- question: About how many steps does binary search take over a billion sorted items?
  options:
  - About 30
  - About 1,000
  - About a billion
  answer: 0
  explanation: log2 of a billion is about 30.
- question: What is a loop invariant?
  options:
  - A variable that never changes
  - A statement true before the loop and after every iteration
  answer: 1
  explanation: It lets you argue the loop is correct for every input.
