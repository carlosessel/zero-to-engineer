- title: Do this
  items:
    - key: x1
      text: "List every debt you (or a made-up person) have: lender, balance, rate, minimum. Work out the debt-to-income ratio."
    - key: x2
      text: "In a spreadsheet, put Ama's three debts in columns and work month by month (interest, then minimums, then the extra on one debt). Check the avalanche clears them in 14 months."
    - key: x3
      text: "Change your sheet to the snowball order and compare the months and total interest."
    - key: x4
      text: "Find the free debt advice service in your country and save its contact details where you would find them in a crisis."
