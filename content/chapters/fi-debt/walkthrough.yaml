- id: fi-debt-avalanche-snowball
  title: Avalanche or snowball?
  hint: Switch between the two methods and watch which debt each one attacks first, and how long it takes to be debt free.
  examples:
  - label: 'Avalanche: highest rate first'
    steps:
    - title: The debts
      text: 'Three debts, GH₵ 600 a month for all of them. Minimums take 315; the extra 285 goes to the debt with the highest rate first: the app loan at 5% a month.'
      vars:
        month: '0'
        total owed: 6,400.00
      parts:
      - kind: cells
        id: c
        label: 'balances: phone 1%, card 3.5%, app 5% a month (GH₵)'
        slots: 3
        width: 150
        bars: true
        items:
        - k: phone
          v: 900.0
          tone: base
        - k: card
          v: 3000.0
          tone: base
        - k: app
          v: 2500.0
          tone: active
    - title: Month 3
      text: The app loan is falling fast. The card's minimum, 105, only just covers its 3.5% interest on 3,000, so its balance has not moved at all.
      vars:
        month: '3'
        total owed: 5,268.19
      parts:
      - kind: cells
        id: c
        label: 'balances: phone 1%, card 3.5%, app 5% a month (GH₵)'
        slots: 3
