- question: "Ama has a card at 3.5% a month, an app loan at 5% a month and a phone loan at 1% a month. Using the avalanche method, which gets the extra payment first?"
  options:
    - "The app loan, because it has the highest rate"
    - "The phone loan, because it has the lowest rate"
    - "Whichever has the smallest balance"
    - "All three equally"
  answer: 0
  explanation: "The avalanche pays extra on the highest rate first, which minimises total interest. Smallest balance first is the snowball method."
- question: "Why can paying only the minimum on a credit card keep you in debt for years?"
  options:
    - "The minimum shrinks as the balance shrinks, and much of each payment is interest"
    - "Minimum payments are not counted against the balance"
    - "The card company adds the minimum back each month"
    - "It cannot; minimum payments always clear a card within a year"
  answer: 0
  explanation: "When the minimum is a percentage of the balance, payments fall as the balance falls, so the balance never drops quickly. In the chapter's example it takes 105 months."
- question: "A consolidation loan offers one lower monthly payment instead of three. When does it actually help?"
  options:
    - "When its total cost, including fees and its longer term, is lower, and the old debts are not run up again"
    - "Whenever the monthly payment is lower"
    - "Always, because one payment is simpler"
    - "Never"
  answer: 0
  explanation: "A lower payment over a longer term can cost more in total. Consolidation helps only if it lowers the total cost and spending habits change."
- question: "Which of these is a sign of predatory lending?"
  options:
    - "The cost is quoted per day, and late payment brings messages to your friends and family"
    - "The lender gives you the APR and total repayable in writing"
    - "The lender checks whether you can afford the repayments"
    - "The lender is listed on the central bank's register"
  answer: 0
  explanation: "Per-day pricing hides the yearly cost, and shaming collection is abusive. The other three are signs of a responsible, licensed lender."
- question: "Esi realises she cannot make next month's loan repayment. What is the best first step?"
  options:
    - "Contact the lender before the payment is missed and ask about a temporary plan"
    - "Take a mobile loan to cover it"
    - "Ignore it and hope the lender does not notice"
    - "Stop paying all her other debts too"
  answer: 0
  explanation: "Lenders have more options before arrears build up, and many prefer a plan to a default. Borrowing to repay borrowing usually makes things worse."
- question: "What is a debt-to-income ratio of 25%?"
  options:
    - "A quarter of monthly income goes to debt repayments"
    - "A quarter of all debt is repaid each month"
    - "Debts are 25 times monthly income"
    - "The interest rate on debts is 25%"
  answer: 0
  explanation: "The ratio is monthly debt repayments divided by monthly income."
