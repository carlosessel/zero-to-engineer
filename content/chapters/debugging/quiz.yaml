- question: "What is the first step in fixing a bug?"
  options:
    - "Rewrite the function"
    - "Reproduce it reliably"
    - "Add more features"
  answer: 1
  explanation: "If you cannot make it happen on demand, you cannot confirm a fix."
- question: "What does a breakpoint do?"
  options:
    - "Deletes a line"
    - "Pauses the program so you can inspect values"
    - "Speeds up the code"
  answer: 1
  explanation: "Then you step line by line and watch what actually happens."
