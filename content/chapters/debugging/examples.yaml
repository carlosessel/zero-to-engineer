# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |2+

  verify: |
    import contextlib, io
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf):
        result = ns['average']([2, 4, 6])
    assert result == 4 and buf.getvalue() == 'DEBUG numbers = [2, 4, 6]\n'
