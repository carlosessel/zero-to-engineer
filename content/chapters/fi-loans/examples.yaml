# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: text
  check: illustration
  note: Spreadsheet loan functions. PMT is recomputed from the annuity formula and RATE by bisection, and compared with the values the block says each gives (rounded as displayed).
  verify: |
    import re
    def pmt(rate, n, pv):
        return -pv * rate / (1 - (1 + rate) ** -n)
    def rate_for(n, payment, pv):
        lo, hi = 1e-6, 0.5
        for _ in range(200):
            mid = (lo + hi) / 2
            if pmt(mid, n, -pv) > -payment:
                hi = mid
            else:
                lo = mid
        return mid
    lines = block.strip().splitlines()
    assert "gives 945.60" in lines[0] and f"{pmt(0.02, 12, -10000):.2f}" == "945.60"
    assert "gives 528.71" in lines[1] and f"{pmt(0.02, 24, -10000):.2f}" == "528.71"
    assert "gives 3.48%" in lines[2] and f"{rate_for(12, -1033.33, 10000) * 100:.2f}" == "3.48"
    assert "gives 2.50%" in lines[3] and f"{rate_for(12, -945.60, 9700) * 100:.2f}" == "2.50"
    # The chapter's other figures: the flat-rate loan's effective yearly rate, and the fee case.
    assert round(((1 + rate_for(12, -1033.33, 10000)) ** 12 - 1) * 100, 1) == 50.7
    assert round(((1 + rate_for(12, -945.60, 9700)) ** 12 - 1) * 100, 1) == 34.5
    assert f"{rate_for(6, -590, 3000) * 100:.2f}" == "4.94"
