- question: "On a reducing-balance loan with a fixed monthly payment, what happens to the interest part of each payment over time?"
  options:
    - "It shrinks, because interest is charged on a balance that keeps falling"
    - "It stays the same every month"
    - "It grows, because interest compounds"
    - "It is all paid in the first month"
  answer: 0
  explanation: "Each month's interest is the rate times what is still owed. As the balance falls, the interest falls, and more of the same payment repays the loan."
- question: "The same GH₵ 10,000 loan at 2% a month can be taken over 12 or 24 months. Which is true?"
  options:
    - "24 months has a lower monthly payment but costs about twice as much interest"
    - "24 months costs less in total because each payment is smaller"
    - "Both cost the same in total"
    - "12 months has the lower monthly payment"
  answer: 0
  explanation: "The longer loan keeps a bigger balance outstanding for longer: 528.71 a month but 2,689.07 of interest, against 945.60 a month and 1,347.15 of interest."
- question: "A lender quotes '2% a month flat' on a 12-month loan. Compared with 2% a month on the reducing balance, it is:"
  options:
    - "Much more expensive, because interest is charged on the original amount all year"
    - "Exactly the same"
    - "Cheaper, because 'flat' means no compounding"
    - "Cheaper, because the payments are equal"
  answer: 0
  explanation: "Flat interest is charged on the full principal even as you repay it. On GH₵ 10,000 it costs 2,400 against 1,347.15, a true rate of about 3.48% a month."
- question: "A GH₵ 5,000 loan has a GH₵ 250 fee taken from it at the start. What does this do to the true cost?"
  options:
    - "Raises it, because you repay as if you had GH₵ 5,000 but only received GH₵ 4,750"
    - "Nothing, because the interest rate is unchanged"
    - "Lowers it, because the fee is paid early"
    - "Only matters if you repay early"
  answer: 0
  explanation: "You pay interest and repayments on money you never received, which raises the effective rate. The APR includes such fees."
- question: "Kwame pays an extra GH₵ 200 a month on his reducing-balance loan. Why does this save interest?"
  options:
    - "The extra goes straight to the balance, and interest is charged on the balance"
    - "Lenders give a discount for paying more"
    - "It does not save interest; it only shortens the loan"
    - "Interest is fixed at the start, so nothing changes"
  answer: 0
  explanation: "A smaller balance means smaller interest every remaining month. On a flat-rate loan, where interest is fixed at the start, paying extra may save nothing unless the lender recalculates."
- question: "What is collateral?"
  options:
    - "Something of value the lender can take if the loan is not repaid"
    - "The monthly repayment"
    - "The fee for setting up a loan"
    - "A person who promises to repay if you do not"
  answer: 0
  explanation: "Collateral secures the loan, as a home secures a mortgage. A person who promises to pay is a guarantor."
