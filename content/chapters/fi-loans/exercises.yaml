- title: Do this
  items:
    - key: x1
      text: "Build Kwame's repayment schedule in a spreadsheet with PMT and copied-down formulas. Check that month 1 interest is 200.00 and the balance after month 12 is zero (to within a few pesewas)."
    - key: x2
      text: "Change the term in your sheet to 24 months, then add a column for extra payments, and find how much interest GH₵ 200 extra a month saves."
    - key: x3
      text: "Find a real loan offer (bank, microfinance or mobile lender). Write down whether the rate is flat or reducing-balance, every fee, the APR if given, and the total repayable. Ask the lender for anything missing."
    - key: x4
      text: "For any flat-rate offer, use RATE to find its true monthly rate and convert it to an effective yearly rate."
