  - title: The total cost
    text: Twelve payments add up to 11,347.15. Take away the 10,000 borrowed, and the loan cost 1,347.15 in interest.
    parts:
    - kind: kv
      id: k
      label: Kwame's loan in total
      slots: 3
      rows:
      - name: borrowed
        value: 10,000.00
      - name: repaid
        value: 11 × 945.60 + 945.55 = 11,347.15
      - name: interest
        value: 1,347.15
        tone: found
