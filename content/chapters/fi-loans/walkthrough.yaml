  - title: The last two months
    text: Month 11 is nearly all repayment. Month 12 is 5 pesewas smaller, so the balance ends at exactly zero after the rounding in earlier months.
    vars:
      balance: '0.00'
    parts:
    - kind: tables
      id: t
      slots: 7
      tables:
      - id: s
        title: 'Kwame''s loan: GH₵ 10,000 at 2% a month'
