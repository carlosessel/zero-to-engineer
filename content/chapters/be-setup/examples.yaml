# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  script: |
    dotnet --version
    java --version
    node --version
    git --version
  note: Runs the version commands for the toolchains this repository's checks use (Docker is left out because it may not be running); the numbers depend on what is installed.
  verify: |
    import re
    assert re.search(r'^\d+\.\d+\.\d+', out, re.M) and 'openjdk' in out.lower() and re.search(r'^v\d+\.', out, re.M) and 'git version' in out, out
- block: 2
  lang: csharp
  check: csharp
  note: The version printed is the one installed; .NET 10 prints 10.
  verify: |
    import re
    assert re.fullmatch(r'Hello, back-end engineer! \.NET \d+ is working\.\s*', out.split('warning')[-1].strip().splitlines()[-1] + '\n'), out
- block: 3
  lang: java
  check: java
  note: The version printed is the one installed (Java 25 in CI); the check accepts any.
  verify: |
    import re
    assert re.search(r'^Hello, back-end engineer! Java \d+ is working\.$', out, re.M), out
- block: 4
  lang: ts
  check: shell
  script: |
    cp "$BLOCK" hello.ts
    node hello.ts
  note: Runs the file with the installed Node.js, which strips the types (Node.js 23.6 and later); the version printed is the one installed.
  verify: |
    import re
    assert re.search(r'^Hello, back-end engineer! Node\.js \d+ is working\.$', out, re.M), out
- block: 5
  lang: bash
  check: docker
  script: |
    docker run --rm hello-world | grep -q 'Hello from Docker!'
  note: Runs only where Docker checks are switched on; the PostgreSQL commands are the same as the data chapters use.
- block: 6
  lang: text
  check: illustration
  note: An HTTP request in the .http file format used by editors; the same request is made with curl in the text.
