- question: Why describe latency with percentiles rather than the mean?
  options:
  - The mean hides the slow tail that users notice
  - Percentiles are easier to compute
  answer: 0
  explanation: Report p50, p95 and p99.
- question: A part takes 10% of the time. Making it infinitely fast gives at most what overall speed-up?
  options:
  - About 11%
  - 10 times
  answer: 0
  explanation: That is Amdahl's law.
- question: What does Little's law relate?
  options:
  - Requests in progress, throughput and latency
  - Memory and CPU
  answer: 0
  explanation: L = throughput times average latency.
- question: In a flame graph, what should you look for first?
  options:
  - 'Wide boxes near the top: functions using a lot of time themselves'
  - The tallest stack
  answer: 0
  explanation: Width is share of samples.
- question: Why can a micro-benchmark measure nothing at all?
  options:
  - The compiler may remove work whose result is unused
  - Benchmarks never work
  answer: 0
  explanation: Harnesses consume results to prevent this.
- question: What is coordinated omission?
  options:
  - A closed-model load test sending less traffic when the system slows, hiding the slowdown
  - Forgetting to load test
  answer: 0
  explanation: Use a constant arrival rate.
