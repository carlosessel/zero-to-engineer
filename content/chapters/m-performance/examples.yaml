- block: 3
  lang: java
  check: java
  note: Timings vary between machines; the check asserts the relationship the chapter describes, not exact numbers.
  verify: |
    import re
    rows = [tuple(map(int, m)) for m in re.findall(r'n=(\d+): \+= (\d+) ms, StringBuilder (\d+) ms, same result: true', out)]
    assert [r[0] for r in rows] == [10000, 20000, 40000], out
    plus_10k, plus_40k = rows[0][1], rows[2][1]
    assert plus_40k >= 2 * max(plus_10k, 1), rows
    assert all(r[1] >= 10 * max(r[2], 1) for r in rows[1:]), rows
