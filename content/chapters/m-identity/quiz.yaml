- question: What does authorisation decide?
  options:
  - What an authenticated identity may do
  - Who the user is
  answer: 0
  explanation: Authentication proves identity first.
- question: Which cookie attribute stops JavaScript reading a session cookie?
  options:
  - HttpOnly
  - Secure
  answer: 0
  explanation: Secure limits it to HTTPS; SameSite blocks most cross-site sends.
- question: Is a JWT's payload secret?
  options:
  - No; it is signed but readable by anyone holding it
  - Yes; it is encrypted
  answer: 0
  explanation: Never put secrets in it.
- question: Which OAuth flow should a web or mobile app use for users?
  options:
  - Authorisation code with PKCE
  - Implicit
  answer: 0
  explanation: Implicit and password grants are deprecated.
- question: What does OpenID Connect add to OAuth 2.0?
  options:
  - An ID token saying who the user is
  - Faster tokens
  answer: 0
  explanation: Use ID tokens for identity and access tokens for APIs.
- question: Why are passkeys resistant to phishing?
  options:
  - The login is bound to the real site and no shared secret is sent
  - They are longer passwords
  answer: 0
  explanation: The private key never leaves the device.
