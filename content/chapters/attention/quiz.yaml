- question: "What is a language model trained to do during pretraining?"
  options:
    - "Answer questions correctly"
    - "Predict the next token"
    - "Search the web"
  answer: 1
  explanation: "Everything else emerges from next-token prediction at scale."
- question: "Why does a chat model “forget” between API calls?"
  options:
    - "It has no memory; only what is in the context you send"
    - "Its weights reset"
    - "It is rate limited"
  answer: 0
  explanation: "Your code must resend any history the model should know."
