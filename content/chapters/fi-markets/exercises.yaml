- title: Do this
  items:
    - key: x1
      text: "Find today's prices for three shares on your country's stock exchange. For each, note the last price, the best bid and ask if shown, and how many shares traded. Which looks most liquid?"
    - key: x2
      text: "Choose one licensed broker from the regulator's register and find its fees: commission, other charges and any minimum. Work out the price rise needed to break even on a GH₵ 1,000 purchase."
    - key: x3
      text: "Look up your country's main stock market index and how it has changed over the last year. Then find the inflation rate over the same year and compare."
    - key: x4
      text: "Take one investment offer you have seen advertised (on social media, by message or from a friend) and check the firm against the regulator's register and its warnings list. Write down what you found."
