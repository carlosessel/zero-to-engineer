- question: "You buy 100 shares of a listed company on the stock exchange. Who receives your money?"
  options:
    - "The investor who sold the shares to you"
    - "The company"
    - "The stock exchange"
    - "The regulator"
  answer: 0
  explanation: "Trading on an exchange is the secondary market: shares pass between investors. The company received money only when it first sold the shares, in the primary market."
- question: "The best bid is GH₵ 3.95 and the best ask GH₵ 4.00. You place a market order to buy 100 shares, and the seller at 4.00 has 300. What do you pay per share, before fees?"
  options:
    - "GH₵ 4.00"
    - "GH₵ 3.95"
    - "GH₵ 3.975"
    - "The last traded price, whatever it was"
  answer: 0
  explanation: "A buy order takes the cheapest seller's price, the ask. You buy at the ask and sell at the bid; the midpoint and last price are not prices you can trade at."
- question: "What is the main difference between a market order and a limit order?"
  options:
    - "A market order is sure to trade but its price is not; a limit order fixes the price but may not trade"
    - "A market order is for shares and a limit order for bonds"
    - "A limit order always gets a better price"
    - "A market order can only be placed when the market opens"
  answer: 0
  explanation: "A market order takes whatever is on the other side now. A limit order sets a worst acceptable price, so it may wait in the order book or never trade."
- question: "A company has 80 million shares priced at GH₵ 1.50. What is its market capitalisation?"
  options:
    - "GH₵ 120 million"
    - "GH₵ 81.5 million"
    - "GH₵ 53.3 million"
    - "GH₵ 1.50"
  answer: 0
  explanation: "Market cap = price × number of shares = 1.50 × 80,000,000 = 120,000,000."
- question: "A licensed broker sells you shares that then lose half their value. What will the regulator or compensation scheme do?"
  options:
    - "Nothing about the loss itself: falling prices are investment risk, not misconduct"
    - "Refund the loss in full"
    - "Refund half the loss"
    - "Suspend trading until the price recovers"
  answer: 0
  explanation: "Regulators and compensation schemes deal with misconduct and firms failing. A fall in price is the risk every investor takes."
- question: "Why does a rarely traded share usually have a wide bid-ask spread?"
  options:
    - "There are few orders near the current price, so the best buyer and seller are far apart"
    - "The exchange charges more for small companies"
    - "Regulators require it"
    - "Brokers add the spread as a fee"
  answer: 0
  explanation: "Spreads reflect liquidity. With few buyers and sellers, the best bid and best ask are far apart, which costs anyone who needs to trade quickly."
