- question: What is the most common serious web vulnerability in the OWASP Top 10 (2025)?
  options:
  - Broken access control
  - Injection
  answer: 0
  explanation: Check authorisation on every request for the specific object.
- question: How do you prevent SQL injection?
  options:
  - Parameterised queries, never concatenating input
  - Escaping quotes by hand
  answer: 0
  explanation: Values are then never parsed as SQL.
- question: What does SSRF trick a server into doing?
  options:
  - Requesting internal addresses such as the cloud metadata service
  - Running SQL
  answer: 0
  explanation: Refuse private and link-local addresses after resolving.
- question: Which category covers a malicious update to an npm package you depend on?
  options:
  - Software supply chain failures
  - Security misconfiguration
  answer: 0
  explanation: Lock, scan and verify dependencies.
- question: What does 'fail closed' mean for a permission check whose service is down?
