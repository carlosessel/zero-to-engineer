- question: "What is transfer learning?"
  options:
    - "Moving a model between servers"
    - "Starting from a pretrained model and adapting it to your task"
    - "Converting PyTorch to TensorFlow"
  answer: 1
  explanation: "Reusing learned features means you need far less data."
- question: "A good first debugging step for a new training setup is to…"
  options:
    - "train for a week"
    - "check the model can overfit one small batch"
    - "add more layers"
  answer: 1
  explanation: "If it cannot memorise 32 examples, there is a bug in the pipeline."
