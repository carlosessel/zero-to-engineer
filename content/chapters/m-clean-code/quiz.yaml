- question: Why is readability worth so much effort?
  options:
  - Code is read many more times than it is written, usually by someone without the author's context
  - Compilers run readable code faster
  answer: 0
  explanation: Readability does not change speed; it changes how fast people can safely change the code.
- question: Which name is best for a boolean that says whether an order has shipped?
  options:
  - shipFlag
  - isShipped
  - status
  answer: 1
  explanation: Booleans read best as a yes/no question; status could hold anything.
- question: What should a comment explain?
  options:
  - What each line does
  - Why the code does something that is not obvious from the code itself
  answer: 1
  explanation: Good names explain what; comments explain why, such as a business rule or a workaround.
- question: What does "one level of abstraction per function" mean?
  options:
  - A function should either describe the steps at a high level or do low-level detail, not mix both
  - A function should have only one line
  answer: 0
  explanation: Mixing levels forces the reader to switch between the big picture and the detail.
- question: What does an early return (guard clause) improve?
  options:
  - It removes nesting, so the main path reads straight down
  - It makes the function run faster
  answer: 0
  explanation: Handle the special cases first and return; the normal case is then unindented.
- question: When is an abstraction premature?
  options:
  - When it is built for variations that do not exist yet, making today's code harder to read
  - When it has fewer than three methods
  answer: 0
  explanation: Wait until you have two or three real cases (the rule of three) before abstracting.
