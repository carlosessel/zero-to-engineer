- title: Do this
  items:
  - key: x1
    text: Pick a function you wrote recently and rename every unclear variable; ask a friend whether it reads better
  - key: x2
    text: Split one long function into a short top-level function that calls well-named helpers
  - key: x3
    text: Replace nested ifs in one function with guard clauses
  - key: x4
    text: Delete every comment in one file that only repeats the code, and add one that explains a non-obvious why
