            - { label: subtotal, x: 0.85, y: 0, tone: active }
            - { label: applyBulkDiscount, x: 0.85, y: 0.33 }
            - { label: roundToPence, x: 0.85, y: 0.67 }
            - { label: sendConfirmation, x: 0.85, y: 1 }
          edges:
            - { a: processOrder, b: subtotal, directed: true, label: "60", tone: active }
            - { a: processOrder, b: applyBulkDiscount, directed: true }
            - { a: processOrder, b: roundToPence, directed: true }
            - { a: processOrder, b: sendConfirmation, directed: true }
    - title: The discount rule has a name
      text: "60 is more than BULK_DISCOUNT_THRESHOLD, so 10% comes off: 60 × 0.9 is 54. The old magic numbers 50 and 0.9 are now named constants that say what they mean."
