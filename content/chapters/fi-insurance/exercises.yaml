- title: Do this
  items:
    - key: x1
      text: "List every insurance policy your household has, with its premium, sum insured and excess. Mark each as protecting against a ruinous loss or a small one."
    - key: x2
      text: "Read the exclusions section of one policy you hold and write down three things it does not cover."
    - key: x3
      text: "Check that the sum insured on your home or contents covers the full cost of rebuilding or replacing, at today's prices."
    - key: x4
      text: "Estimate the life cover your household would need, using the present value method, and compare it with any cover you have."
