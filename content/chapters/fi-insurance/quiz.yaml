- question: "Why does insurance, on average, cost the buyer more than it pays out?"
  options:
    - "Premiums must also cover the insurer's costs and profit"
    - "Insurers never pay claims"
    - "Claims are taxed"
    - "It does not; insurance always pays back more than it costs"
  answer: 0
  explanation: "Across all customers, premiums exceed payouts. You accept that cost to turn a small chance of a ruinous loss into a certain, affordable one."
- question: "Which loss is most worth insuring for a household with a GH₵ 20,000 emergency fund?"
  options:
    - "The house burning down"
    - "A broken GH₵ 1,200 phone"
    - "A GH₵ 500 repair to a cooker"
    - "A cancelled GH₵ 300 bus trip"
  answer: 0
  explanation: "Insure what you could not replace from savings. Small losses are cheaper to pay yourself."
- question: "A house that would cost GH₵ 200,000 to rebuild is insured for GH₵ 150,000. Damage of GH₵ 40,000 occurs. With an average clause, what is paid before the excess?"
  options:
    - "GH₵ 30,000"
    - "GH₵ 40,000"
    - "GH₵ 10,000"
    - "GH₵ 150,000"
  answer: 0
  explanation: "It is insured for three-quarters of its value, so three-quarters of the claim is paid: 40,000 × 150,000 ÷ 200,000 = 30,000."
- question: "When does choosing a higher excess make most sense?"
  options:
    - "When you have savings to cover it and rarely claim"
    - "When you expect to claim every year"
    - "When you have no savings"
    - "Never; a lower excess is always better"
  answer: 0
  explanation: "A higher excess lowers the premium. If claims are rare and you can afford the excess, you save overall."
- question: "Who most needs life insurance?"
  options:
    - "Someone whose income others depend on"
    - "A single person with no dependants"
    - "A child"
    - "Everyone, in the largest amount possible"
  answer: 0
  explanation: "Life insurance replaces income for dependants. Without dependants, there is usually little need."
- question: "What can happen if you hide a health condition when applying for life insurance?"
  options:
    - "The insurer may refuse to pay a claim later"
    - "Nothing, once the policy is issued"
    - "The premium is automatically reduced"
    - "The cover is doubled"
  answer: 0
  explanation: "You must answer truthfully. Non-disclosure can void the policy, often discovered only when a claim is made."
