- question: "What two questions decide how much checking a piece of Claude's work needs?"
  options:
    - "How long it is, and which model wrote it"
    - "How bad it is if it is wrong, and how easily you can check it"
    - "Whether it sounds confident, and whether it has citations"
  answer: 1
  explanation: "Tone tells you nothing; stakes and checkability decide the checking."
- question: "Which is the strongest defence against prompt injection?"
  options:
    - "Telling the model to ignore instructions in documents"
    - "Not giving a session that reads untrusted content powerful actions"
    - "Using the largest model"
  answer: 1
  explanation: "Separating untrusted input from powerful actions removes the danger; prompt wording only reduces it."
- question: "Generated code builds a SQL query with an f-string containing user input. What is the problem?"
  options:
    - "It is slow"
    - "SQL injection: use a parameterised query"
    - "f-strings are deprecated"
  answer: 1
  explanation: "Input joined into SQL can change the query; parameters keep data as data."
- question: "When should you not use Claude to produce the answer?"
  options:
    - "When you are practising the skill yourself, or the work must be your own"
    - "Never: it is always faster"
  answer: 0
  explanation: "Use it as a tutor while learning, and not where the work must be yours or cannot be checked."
- question: "Claude suggests installing a package you have never heard of. What should you check?"
  options:
    - "Nothing"
    - "That it exists, is the package you meant, is maintained, and is needed"
  answer: 1
  explanation: "Invented or look-alike package names are a real supply-chain risk."
