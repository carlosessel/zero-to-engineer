- question: "A 91-day Treasury bill has a discount rate of 4.4688% and an interest rate of 4.5193%. Which should you compare with a savings account's rate?"
  options:
    - "The interest rate, because it is the return on what you actually pay"
    - "The discount rate, because it is lower"
    - "Either; they always mean the same"
    - "Neither; bills cannot be compared with savings"
  answer: 0
  explanation: "The discount is a share of face value, but you pay less than face value. The interest rate measures the return on your actual outlay."
- question: "Interest rates rise after you buy a fixed-coupon bond. What happens to its market price?"
  options:
    - "It falls, so its yield matches the new, higher rates"
    - "It rises"
    - "It stays at face value until maturity"
    - "The coupon rises to match"
  answer: 0
  explanation: "Its fixed payments are now discounted at a higher rate, so their present value, the price, falls."
- question: "Which bond's price is most sensitive to a rise in interest rates?"
  options:
    - "A 20-year bond"
    - "A 91-day Treasury bill"
    - "A 1-year bond"
    - "They all move equally"
  answer: 0
  explanation: "The further away the payments, the more a change in the discount rate reduces their present value."
- question: "A company bond yields 30% when government bonds of the same maturity yield 20%. What is the most likely reason?"
  options:
    - "Investors see a real risk the company will not pay in full"
    - "The company is safer than the government"
    - "Company bonds are always paid first"
    - "The coupon is fixed by law"
  answer: 0
  explanation: "The 10-point credit spread is compensation for credit risk. A high yield usually signals high risk."
- question: "In Ghana's 2023 debt exchange, most domestic bonds kept their face value but got lower coupons and later maturities. What did that do to their value?"
  options:
    - "Reduced their present value, even though the principal was not cut"
    - "Nothing, because the face value was the same"
    - "Increased their value, because they lasted longer"
    - "Made them worthless"
  answer: 0
  explanation: "Less interest, paid later, is worth less today. Present value, not face value, measures what bondholders are owed."
- question: "You will need money in six months. Which is the best fit?"
  options:
    - "A savings account or a 182-day Treasury bill"
    - "A 10-year bond"
    - "A long-dated bond fund"
    - "A single company's bond with a high yield"
  answer: 0
  explanation: "Short-term money needs low risk and a known value on the date you need it; long bonds can fall in price before then."
