- title: Do this
  items:
    - key: x1
      text: "Look up this week's Treasury bill results. For each tenor, check the published interest rate from the discount rate with the formula, then work out the real return against the latest inflation rate."
    - key: x2
      text: "In a spreadsheet, price a bond with yearly coupons for yields from 10% to 30% in steps of 5, for a 2-year and a 10-year version. Chart price against yield for both."
    - key: x3
      text: "Find a fixed deposit, a money market fund and a Treasury bill available to you. Compare their rates, access and risks in a short table."
    - key: x4
      text: "Find a government or company bond's details (coupon, maturity, price) on an exchange or broker website and work out its current yield and, with RATE, its yield to maturity."
