- question: "Why do networks need non-linear activation functions?"
  options:
    - "To use less memory"
    - "Without them, stacked layers collapse into one linear function"
    - "To make training random"
  answer: 1
  explanation: "A chain of linear steps is still linear. The bend is what adds power."
- question: "What does backpropagation compute?"
  options:
    - "The predictions"
    - "The gradient of the loss for every weight"
    - "The size of the dataset"
  answer: 1
  explanation: "It passes the error backwards using the chain rule."
