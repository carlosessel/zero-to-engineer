- title: Do this
  items:
    - key: x1
      text: "Take your last bank or mobile money statement (or the one in the walkthrough) and check every line: does each running balance follow from the one before, and do you recognise every payment?"
    - key: x2
      text: "Add up every fee on one month's statements, multiply by 12, and write down what your accounts cost you a year."
    - key: x3
      text: "Find the published fee schedule of your mobile money provider or bank, and work out what your typical month would cost with one other provider."
    - key: x4
      text: "Look up the current deposit protection limit in your country on the official scheme's website, and check whether all your savings are within it."
