- question: "Why are banks licensed and supervised by a central bank or regulator?"
  options:
    - "Because they lend out most of the money deposited with them, so depositors depend on them lending and managing it soundly"
    - "Because they keep every depositor's money in a vault"
    - "Because they are owned by the government"
    - "Because they set the country's tax rates"
  answer: 0
  explanation: "A deposit is money the bank owes you, and it has lent most of it on. Rules on how much it must keep safe, and on whom it lends to, protect depositors."
- question: "Under the Ghanaian limits announced for 1 January 2027, Kofi has GH₵ 20,000 at one bank. How much is covered by deposit protection?"
  options:
    - "GH₵ 12,500"
    - "GH₵ 20,000"
    - "GH₵ 6,250"
    - "Nothing, because the amount is over the limit"
  answer: 0
  explanation: "Cover is up to the limit per depositor per bank: GH₵ 12,500 from 2027. The remaining 7,500 is not covered by the scheme. Being over the limit does not remove the cover up to it."
- question: "Two providers send £100 to Ghana. A charges £1 and gives GH₵ 15.00 per pound. B charges £4 and gives GH₵ 15.50 per pound. Which delivers more cedis?"
  options:
    - "B: 100 × 15.50 = GH₵ 1,550, against A's 100 × 15.00 = GH₵ 1,500"
    - "A, because its fee is lower"
    - "They deliver the same"
    - "It cannot be worked out"
  answer: 0
  explanation: "Compare what arrives. The fees are paid on top here, so the recipient gets 1,550 from B and 1,500 from A. B costs £3 more in fees but delivers GH₵ 50 more."
- question: "A statement shows an opening balance of GH₵ 800, a credit of GH₵ 1,500 and debits of GH₵ 600 and GH₵ 250. What is the closing balance?"
  options:
    - "GH₵ 1,450"
    - "GH₵ 3,150"
    - "GH₵ 650"
    - "GH₵ 2,300"
  answer: 0
  explanation: "800 + 1,500 − 600 − 250 = 1,450. Credits are money in and debits money out."
- question: "A text message says GH₵ 500 was sent to your mobile money wallet by mistake and asks you to send it back. Your balance has not changed. What is most likely?"
  options:
    - "It is a fraud: the message is fake, and sending 'back' would send your own money to the fraudster"
    - "Someone made a genuine mistake and you should send the money at once"
    - "The balance will update later, so send it now"
    - "Your provider sent the message and needs your PIN"
  answer: 0
  explanation: "Check your actual balance in the app or by your provider's official code, not the message. If no money arrived, there is nothing to return. This is a common mobile money fraud."
- question: "Which is the main difference between a debit card and a credit card?"
  options:
    - "A debit card spends money already in your account; a credit card borrows money you repay later"
    - "A debit card can only be used at ATMs"
    - "A credit card pays you interest"
    - "There is no difference"
  answer: 0
  explanation: "A credit card is a loan. If the balance is not repaid in full each month, interest is charged on it."
