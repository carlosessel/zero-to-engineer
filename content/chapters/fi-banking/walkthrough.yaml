- id: fi-banking-statement
  title: Reading a bank statement
  hint: Follow the running balance line by line from the opening balance, and watch for the line that does not belong.
  steps:
  - title: Opening balance
    text: 'The statement starts from what was in the account at the end of last month: GH₵ 2,150.00. Every later balance is built from this one.'
    vars:
      balance: 2,150.00
    parts:
    - kind: tables
      id: t
      slots: 10
      tables:
      - id: s
        title: Ama's current account, November (GH₵)
        columns:
        - date
        - description
        - in / out
        - balance
        rows:
        - k: open
          cells:
          - 31 Oct
          - Opening balance
          - ''
          - 2,150.00
          tone: active
  - title: Pay day
    text: Salary comes in (a credit) and rent goes out (a debit). The running balance after each line is the balance before it, plus or minus the amount.
    vars:
      balance: 4,950.00
      check: 2,150 + 4,000 − 1,200
    parts:
    - kind: tables
      id: t
      slots: 10
      tables:
      - id: s
        title: Ama's current account, November (GH₵)
        columns:
        - date
        - description
        - in / out
        - balance
        rows:
        - k: open
          cells:
          - 31 Oct
          - Opening balance
          - ''
          - 2,150.00
          tone: dim
        - k: l0
          cells:
          - 01 Nov
          - Salary
          - +4,000.00
          - 6,150.00
          tone: found
        - k: l1
          cells:
          - 01 Nov
          - Rent
          - −1,200.00
          - 4,950.00
          tone: active
  - title: Pay yourself first
    text: The standing order moves 400 to savings the next day, before the spending starts.
    vars:
      balance: 4,550.00
    parts:
