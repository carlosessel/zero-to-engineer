          tone: dim
        - k: l0
          cells:
          - 01 Nov
          - Salary
          - +4,000.00
          - 6,150.00
          tone: dim
        - k: l1
          cells:
          - 01 Nov
          - Rent
          - −1,200.00
          - 4,950.00
          tone: dim
        - k: l2
          cells:
          - 02 Nov
          - To savings
          - −400.00
          - 4,550.00
          tone: active
  - title: Fees appear as their own lines
    text: Sending 300 to her mother by mobile money costs a 1.50 fee, shown as a separate debit. Small fees like this add up over a year.
    vars:
      balance: 4,248.50
    parts:
