- title: "Do this"
  items:
    - key: x1
      text: "Build the React to-do list in your own Vite project, then add a Clear finished button that removes every ticked task"
    - key: x2
      text: "Add an Edit button to each task that turns its text into an input you can change and save"
    - key: x3
      text: "Build a tip calculator: a bill amount, a choice of 10, 12.5 or 15 per cent, and the number of people, showing each person's share as you type"
    - key: x4
      text: "Build a sign-up form with name, email and password fields, messages under each field that appear after the person leaves it, and a submit button that shows a summary"
    - key: x5
      text: "Install React Developer Tools for your browser and watch a component's state change as you click and type"
