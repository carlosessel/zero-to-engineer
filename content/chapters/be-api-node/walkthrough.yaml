- id: be-api-node-zod-validation
  title: Checking a request body with Zod
  hint: Watch two POST /orders bodies meet the same schema; one becomes an order, the other a list of problems.
  language: TypeScript
  code: |
    const OrderLine = z.object({
      sku: z.string().regex(/^[A-Z]{3,4}-\d{2,4}$/, "must be a product code such as RYE-400"),
      quantity: z.number().int().min(1).max(99),
    });

    const PlaceOrder = z.object({
      customer: z.string().trim().min(1).max(100),
      lines: z.array(OrderLine).min(1).max(50),
      note: z.string().max(500).optional(),
    });

    app.use(express.json({ limit: "100kb" }));

    app.post("/orders", (req: Request, res: Response) => {
      const parsed = PlaceOrder.safeParse(req.body);
      if (!parsed.success) {
        res.status(400).type("application/problem+json").json({ ... });
        return;
      }
      const order: PlaceOrder = parsed.data;
      const id = `o-${++nextId}`;
      res.status(201).location(`/orders/${id}`).json({ id, customer: order.customer, lineCount: order.lines.length });
    });
  steps:
    - title: The schema describes what is allowed
      text: The schemas say what a valid order looks like. Zod will check real data against them while the server runs.
      lines: [1, 2, 3, 4, 6, 7, 8, 9, 10]
      parts:
        - { kind: kv, id: body, label: "req.body (what the client sent)", slots: 4, rows: [] }
        - { kind: note, id: result, text: "nothing checked yet", tone: dim }
    - title: express.json reads the body
      text: "A good request arrives. The express.json middleware turns the JSON text into req.body, which TypeScript types as any: it could be anything."
      lines: [12]
      parts:
        - kind: kv
          id: body
          label: "req.body (what the client sent)"
          slots: 4
          rows:
            - { name: customer, value: '" Ama "', tone: active }
            - { name: lines.0.sku, value: RYE-400, tone: active }
            - { name: lines.0.quantity, value: "2", tone: active }
    - title: safeParse succeeds
      text: Every field passes its rule. safeParse returns success, and .trim() has already cleaned " Ama " to "Ama" in parsed.data.
      lines: [15]
      vars: { "parsed.success": "true", "parsed.data.customer": "Ama" }
      parts:
        - kind: kv
          id: body
          label: "req.body (what the client sent)"
          slots: 4
          rows:
            - { name: customer, value: '" Ama " → "Ama"', tone: found }
            - { name: lines.0.sku, value: RYE-400, tone: found }
            - { name: lines.0.quantity, value: "2", tone: found }
        - { kind: note, id: result, text: "valid: the handler may use parsed.data", tone: found }
    - title: 201 Created
      text: The handler now works with data it knows is valid, makes an id and answers 201 with a Location header.
      lines: [20, 21, 22]
      vars: { "parsed.success": "true", id: o-1001 }
      parts:
        - { kind: note, id: result, text: '201 /orders/o-1001 {"id":"o-1001","customer":"Ama","lineCount":1}', tone: found }
    - title: A bad request arrives
      text: The second body has an empty customer, a lower-case sku, a quantity of 120 and an extra admin field.
      lines: [12]
      vars: {}
      parts:
        - kind: kv
          id: body
          label: "req.body (what the client sent)"
          slots: 4
          rows:
            - { name: customer, value: '""', tone: active }
            - { name: lines.0.sku, value: rye, tone: active }
            - { name: lines.0.quantity, value: "120", tone: active }
            - { name: admin, value: "true", tone: active }
        - { kind: note, id: result, text: "checking…", tone: compare }
    - title: safeParse collects every issue
      text: "safeParse does not stop at the first problem: it returns success false and one issue per broken rule, each with its path. The unknown admin key is not an issue; Zod strips it."
      lines: [15, 16]
      vars: { "parsed.success": "false", issues: 3 }
      parts:
        - kind: kv
          id: body
          label: "req.body (what the client sent)"
          slots: 4
          rows:
            - { name: customer, value: "too short", tone: bad }
            - { name: lines.0.sku, value: "not a product code", tone: bad }
            - { name: lines.0.quantity, value: "too big", tone: bad }
            - { name: admin, value: "stripped, never reaches you", tone: dim }
    - title: 400 with the list of problems
      text: The handler answers 400 as application/problem+json, listing each field and message, and returns. The code that makes an order never sees bad data.
      lines: [17, 18]
      parts:
        - { kind: note, id: result, text: "400 application/problem+json: customer, lines.0.sku, lines.0.quantity", tone: bad }
