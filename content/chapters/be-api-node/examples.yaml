# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  needs: network
  script: |
    bash -e "$BLOCK" >/dev/null 2>&1
    cd bakery-api
    node -p "require('./package.json').type"
    node -e "import('express').then(() => import('zod')).then(() => console.log('both load'))"
    test -d node_modules/@types/express && echo "types installed"
  output_contains:
  - 'module

    both load

    types installed'
- block: 2
  lang: ts
  check: shell
  needs: network
  script: |
    mkdir b2 && cd b2
    npm init -y >/dev/null
    npm pkg set type=module
    npm install --silent --no-audit --no-fund express@5.3.0 zod@4.6.7
    cp "$BLOCK" x.ts
    node x.ts
  output_contains:
  - 'Bakery API

    [{"sku":"RYE-400","name":"Rye loaf","pricePence":450},{"sku":"BAG-250","name":"Bagel","pricePence":120}]

    404'
