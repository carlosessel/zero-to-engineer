- title: Do this
  items:
  - key: x1
    text: Run ps and find your shell's PID and its parent
  - key: x2
    text: Start a long-running process and stop it with kill, then check its exit status
  - key: x3
    text: Write a small server that handles SIGTERM by finishing in-progress work before exiting
  - key: x4
    text: Check the open-file limit on your machine with ulimit -n
