- question: When does a stream's filter run?
  options:
  - When a terminal operation such as toList runs
  - As soon as filter is called
  answer: 0
  explanation: Streams are lazy.
- question: What happens if you use a stream twice?
  options:
  - It throws IllegalStateException
  - It runs again
  answer: 0
  explanation: Streams are single-use; keep the collection instead.
