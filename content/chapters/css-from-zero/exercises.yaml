- title: "Do this"
  items:
    - key: x1
      text: "Give the page you built in the HTML chapter a `style.css` file, linked from the head, that sets a font, colours and line height"
    - key: x2
      text: "Predict the colours in the cascade example before showing the result, then edit it to make the first paragraph purple without using an id or !important"
    - key: x3
      text: "Inspect a heading on a site you use, find its rules in the Styles pane, and change its colour and font size there"
    - key: x4
      text: "Check your page's text colours with a contrast checker and fix any that fail"
