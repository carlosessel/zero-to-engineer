- question: "In the rule h1 { color: navy; }, what is \"h1\"?"
  options:
    - "The property"
    - "The selector"
    - "The value"
  answer: 1
  explanation: "The selector chooses which elements the rule applies to. color is the property and navy the value."
- question: "Which selector chooses every element with class=\"card\"?"
  options:
    - "card"
    - ".card"
    - "#card"
  answer: 1
  explanation: "A dot selects by class, a hash by id, and a bare name by element type."
- question: "#intro { color: green; } comes first and .lead { color: red; } comes later. An element has both. What colour is it?"
  options:
    - "Red, because it comes later"
    - "Green, because an id is more specific than a class"
  answer: 1
  explanation: "Specificity is checked before order. Order only decides between equally specific selectors."
- question: "Why use rem rather than px for font sizes?"
  options:
    - "rem sizes grow when someone sets a larger default text size in their browser"
    - "rem is faster to load"
    - "px does not work on phones"
  answer: 0
  explanation: "People with low vision often raise the default text size. rem respects that; px ignores it."
- question: "You set color on body. Why do paragraphs inside change colour?"
  options:
    - "Because text properties such as color are inherited"
    - "Because every property applies to all elements"
  answer: 0
  explanation: "Text properties inherit from parent elements. Box properties such as border and padding do not."
- question: "A declaration in the Styles pane of the developer tools is crossed out. What does that mean?"
  options:
    - "It has a typing mistake"
    - "Another rule won the cascade for that property"
    - "It will apply after the page loads"
  answer: 1
  explanation: "Crossed out means overridden by a more specific or later rule. Invalid declarations are shown differently, usually with a warning sign."
