                - { k: 2026-10-03, cells: [ 2026-10-03, 720, "", "" ], tone: dim }
                - { k: 2026-10-06, cells: [ 2026-10-06, 2850, "", "" ], tone: dim }
                - { k: 2026-10-08, cells: [ 2026-10-08, 1380, "", "" ], tone: dim }
                - { k: 2026-10-11, cells: [ 2026-10-11, 1040, "", "" ], tone: dim }
                - { k: 2026-10-12, cells: [ 2026-10-12, 1780, "", "" ], tone: dim }
                - { k: 2026-10-15, cells: [ 2026-10-15, 930, "", "" ], tone: dim }
                - { k: 2026-10-18, cells: [ 2026-10-18, 3160, "", "" ], tone: dim }
    - title: The second row
      text: "The running total adds 720 to make 3070. The moving average has only two rows so far: (2350 + 720) / 2 = 1535."
      lines: [ 9, 10 ]
