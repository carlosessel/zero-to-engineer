- id: db-window-functions-running-total
  title: A running total and a moving frame
  hint: Watch each day's row get its running total from all earlier rows, and its moving average from a three-row frame that slides.
  language: SQL
  code: |
    WITH daily AS (
      SELECT o.placed_at::date AS day, sum(l.quantity * l.unit_price_pence) AS revenue
      FROM orders AS o
      JOIN order_lines AS l ON l.order_id = o.id
      WHERE o.status <> 'cancelled'
      GROUP BY day
    )
    SELECT day, revenue,
           sum(revenue) OVER (ORDER BY day) AS running_total,
           round(avg(revenue) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS moving_avg_3
    FROM daily
    WHERE day < '2026-10-20'
    ORDER BY day;
  steps:
    - title: One row per day
      text: The CTE daily adds up each day's revenue from orders that went ahead. Unlike GROUP BY, the window functions that follow keep all eight rows.
      lines: [ 1, 2, 3, 4, 5, 6, 7 ]
      parts:
        - kind: tables
          id: t
          slots: 8
          tables:
            - id: d
              title: daily, ordered by day
              columns: [ day, revenue, running_total, moving_avg_3 ]
              rows:
                - { k: 2026-10-01, cells: [ 2026-10-01, 2350, "", "" ], tone: base }
                - { k: 2026-10-03, cells: [ 2026-10-03, 720, "", "" ], tone: base }
                - { k: 2026-10-06, cells: [ 2026-10-06, 2850, "", "" ], tone: base }
                - { k: 2026-10-08, cells: [ 2026-10-08, 1380, "", "" ], tone: base }
                - { k: 2026-10-11, cells: [ 2026-10-11, 1040, "", "" ], tone: base }
                - { k: 2026-10-12, cells: [ 2026-10-12, 1780, "", "" ], tone: base }
                - { k: 2026-10-15, cells: [ 2026-10-15, 930, "", "" ], tone: base }
                - { k: 2026-10-18, cells: [ 2026-10-18, 3160, "", "" ], tone: base }
    - title: The first row
      text: "ORDER BY day inside OVER makes the sum cumulative: each row sees the rows from the start up to itself. For the first day that is just 2350, and the average of one row is 2350."
      lines: [ 9, 10 ]
      vars: { running_total: "2350", moving_avg_3: 2350 / 1 }
      parts:
        - kind: tables
          id: t
