- title: Do this
  items:
    - key: x1
      text: "Print or copy the ten questions and keep them where you will see them when someone offers you an investment."
    - key: x2
      text: "Apply the ten questions to one investment you hold or are considering, in writing, and give it a verdict."
    - key: x3
      text: "Find a real fund's factsheet and answer questions 4, 6 and 7 from it: its return against its benchmark, its total costs, and how you would get your money out."
    - key: x4
      text: "Ask a friend or relative about an investment they were offered recently and go through the questions with them."
