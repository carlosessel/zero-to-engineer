- question: "What should be the first question about any investment offer?"
  options:
    - "What exactly is it, and what do I own?"
    - "How much will I make?"
    - "Who else has invested?"
    - "How quickly can I double my money?"
  answer: 0
  explanation: "Starting from the return invites wishful thinking. If you cannot describe what you would own, stop there."
- question: "An offer pays 30% every six months, 'guaranteed'. Roughly what yearly return is that?"
  options:
    - "69%"
    - "30%"
    - "60%"
    - "15%"
  answer: 0
  explanation: "1.30² − 1 = 69%, over seven times the Treasury bill rate. A guaranteed return that high is a contradiction."
- question: "A licensed share fund returned 14% a year when its benchmark returned 17%. What does that tell you?"
  options:
    - "It trailed its benchmark by 3 points a year, probably partly because of its fees"
    - "It did well, because 14% is a good return"
    - "It is a fraud"
    - "Nothing, because benchmarks don't matter"
  answer: 0
  explanation: "A fund's return should be judged against what its market did. Trailing by 3 points a year compounds into a large gap."
- question: "Which investment is hardest to get out of quickly?"
  options:
    - "A plot of land bought in instalments"
    - "A unit trust that deals daily"
    - "A savings account"
    - "A listed ETF"
  answer: 0
  explanation: "Land is slow to sell, cannot be sold in parts, and before full payment may not be sellable at all."
- question: "Esi owes money at 3% a month and has no emergency fund. Is a Treasury bill the right first use of her savings?"
  options:
    - "No; paying off the loan and building an emergency fund come first"
    - "Yes; Treasury bills are always the right choice"
    - "Yes, because it is tax-free"
    - "No; she should buy shares instead"
  answer: 0
  explanation: "The loan costs about 42.6% a year, far more than any safe return. Fit with your plan is part of evaluating any investment."
- question: "A company is registered with the Registrar of Companies. Does that mean it is licensed to take investments?"
  options:
    - "No; company registration is not a licence from the financial regulator"
    - "Yes, all registered companies may take investments"
    - "Yes, if it has a website"
    - "Only if it has paid investors on time"
  answer: 0
  explanation: "Taking investments from the public needs a licence from the securities regulator, which you should check on its register."
