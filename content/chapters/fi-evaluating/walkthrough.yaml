- id: fi-evaluating-checklist
  title: Four offers through the checklist
  hint: Read down each column. A single 'no' on licensing or source of return is enough to walk away.
  steps:
  - title: Licensed?
    text: Is the provider licensed for what it offers? The bill and the fund pass. GreenHarvest is not on the SEC register. Land sales are not licensed, so the title is what matters.
    parts:
    - kind: tables
      id: t
      slots: 7
      tables:
      - id: s
        title: Four offers, checked
        columns:
        - question
        - bill
        - fund
        - agro
        - land
        rows:
        - k: q0
          cells:
          - licensed?
          - 'yes'
          - 'yes'
          - 'no'
          - n/a
          tone: active
  - title: Source of return
    text: Where does the return come from? Interest, and company profits. GreenHarvest's 'maize farms' cannot explain 69% a year, and it pays for recruits.
