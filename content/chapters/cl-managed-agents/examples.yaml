# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: illustration
  note: Managed Agents was beta when checked and the stand-in server does not imitate it. The verify step checks that the installed SDK (anthropic 2.8.0) has every call used, with these parameter names.
  verify: |
    import anthropic, inspect
    c = anthropic.Anthropic(api_key='x')
    for path, params in [('beta.agents.create', ['name', 'model', 'system', 'tools']), ('beta.environments.create', ['name', 'config']), ('beta.sessions.create', ['agent', 'environment_id', 'title']), ('beta.sessions.events.send', ['events'])]:
        obj = c
        for part in path.split('.'):
            obj = getattr(obj, part)
        names = inspect.signature(obj).parameters
        assert all(p in names for p in params), (path, params)
    assert callable(c.beta.sessions.events.stream)
- block: 2
  lang: python
  check: python-fake-api
  note: 'Run against the stand-in server: proves the SDK call is valid and the reply is handled; it is not the live API.'
  replies:
  - text: Here is the spreadsheet.
  verify: |
    r = requests[-1]
    assert r['container'] == {'skills': [{'type': 'anthropic', 'skill_id': 'xlsx', 'version': 'latest'}]}
    assert r['tools'] == [{'type': 'code_execution_20250825', 'name': 'code_execution'}]
    assert 'end_turn' in out
