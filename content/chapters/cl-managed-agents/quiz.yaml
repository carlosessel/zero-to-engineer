- question: When is Managed Agents a good choice?
  options:
  - For full control over every step
  - For long-running, asynchronous work without running the infrastructure yourself
  answer: 1
  explanation: It was a beta feature when checked.
- question: What does a request need to use a skill through the API?
  options:
  - The skill in container, and the code execution tool
  - Only a system prompt mentioning the skill
  answer: 0
  explanation: Skills often run scripts, so they need code execution.
- question: Why plan for change when using a beta feature?
  options:
  - Beta features never change
  - Its names and shapes may change
  answer: 1
  explanation: Isolate the code, pin versions and watch release notes.
- question: Which part of Managed Agents is one stateful run of an agent?
  options:
  - The environment
  - The session
  answer: 1
  explanation: Sessions persist until you delete them.
