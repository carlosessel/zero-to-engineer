- id: cl-managed-agents-quickstart
  title: Agent, environment, session, events
  hint: Watch the four pieces of a Managed Agent come together, then a task go in and events come back.
  language: Python
  code: |
    import anthropic

    client = anthropic.Anthropic()

    agent = client.beta.agents.create(
        name="Docs assistant",
        model="claude-opus-5-5",
        system="You keep this team's documentation accurate. Ask before deleting anything.",
        tools=[{"type": "agent_toolset_20260401", "configs": [{"name": "web_search", "enabled": False}]}],
    )

    environment = client.beta.environments.create(
        name="docs-env",
        config={"type": "cloud", "networking": {"type": "limited", "allow_package_managers": True}},
    )

    session = client.beta.sessions.create(agent=agent.id, environment_id=environment.id, title="Weekly docs check")

    with client.beta.sessions.events.stream(session.id) as stream:
        client.beta.sessions.events.send(
            session.id,
            events=[{"type": "user.message", "content": [{"type": "text", "text": "Find broken links in the docs folder and fix them."}]}],
        )
        for event in stream:
            print(event.type)
            if event.type == "session.status_idle":
                break
  steps:
    - title: Define the agent
      text: "The agent is a configuration: model, system prompt and tools. Here it gets the built-in tool set with web search switched off. You create it once and use it for many sessions."
      lines: [ 5, 6, 7, 8, 9, 10 ]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { k: a, label: agent, x: 0.1, y: 0.2, tone: active, note: Docs assistant }
          edges: []
    - title: Define an environment
      text: "The environment is where the agent's work runs: here a cloud sandbox with limited networking, allowed to reach package managers."
      lines: [ 12, 13, 14, 15 ]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { k: a, label: agent, x: 0.1, y: 0.2, tone: base, note: Docs assistant }
            - { k: e, label: environment, x: 0.1, y: 0.8, tone: active, note: "docs-env, cloud sandbox" }
          edges: []
    - title: Start a session
      text: A session is one run of the agent in the environment, with its own history and files. Sessions persist until you delete them.
      lines: [ 17 ]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { k: a, label: agent, x: 0.1, y: 0.2, tone: base, note: Docs assistant }
            - { k: e, label: environment, x: 0.1, y: 0.8, tone: base, note: "docs-env, cloud sandbox" }
            - { k: s, label: session, x: 0.6, y: 0.5, tone: active, note: Weekly docs check }
          edges:
            - { a: a, b: s, directed: true, tone: active }
            - { a: e, b: s, directed: true, tone: active }
    - title: Send the task as an event
      text: "Your code opens the event stream and sends the task as a user.message event. You wrote no loop: Anthropic runs it."
      lines: [ 19, 20, 21, 22, 23 ]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { k: a, label: agent, x: 0.1, y: 0.2, tone: base, note: Docs assistant }
            - { k: e, label: environment, x: 0.1, y: 0.8, tone: base, note: "docs-env, cloud sandbox" }
            - { k: s, label: session, x: 0.6, y: 0.5, tone: active, note: working }
            - { k: y, label: your code, x: 1, y: 0.5, tone: active }
          edges:
            - { a: a, b: s, directed: true }
            - { a: e, b: s, directed: true }
            - { a: y, b: s, directed: true, tone: active, label: events }
        - kind: seq
          id: q
          actors: [ Your code, Session ]
          slots: 4
          messages:
            - { from: Your code, to: Session, label: "user.message: fix broken links", tone: active }
    - title: Events stream back
      text: As the agent works in its sandbox, its messages, tool uses and status changes stream back as events. Your code prints each event's type.
      lines: [ 24, 25 ]
      parts:
        - kind: seq
          id: q
          actors: [ Your code, Session ]
          slots: 4
          messages:
            - { from: Your code, to: Session, label: "user.message: fix broken links", tone: dim }
            - { from: Session, to: Session, label: "works in sandbox", tone: active }
            - { from: Session, to: Your code, label: "agent messages, tool uses", tone: compare }
    - title: Idle means finished
      text: When an event says the session has gone idle, the agent has finished this task and the loop stops reading. The session and its transcript still exist until you delete them.
      lines: [ 26, 27 ]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { k: a, label: agent, x: 0.1, y: 0.2, tone: base, note: Docs assistant }
            - { k: e, label: environment, x: 0.1, y: 0.8, tone: base, note: "docs-env, cloud sandbox" }
            - { k: s, label: session, x: 0.6, y: 0.5, tone: done, note: "idle, kept until deleted" }
            - { k: y, label: your code, x: 1, y: 0.5, tone: found }
          edges:
            - { a: a, b: s, directed: true }
            - { a: e, b: s, directed: true }
            - { a: y, b: s, directed: true, label: events }
        - kind: seq
          id: q
          actors: [ Your code, Session ]
          slots: 4
          messages:
            - { from: Your code, to: Session, label: "user.message: fix broken links", tone: dim }
            - { from: Session, to: Session, label: "works in sandbox", tone: dim }
            - { from: Session, to: Your code, label: "agent messages, tool uses", tone: dim }
            - { from: Session, to: Your code, label: session.status_idle, tone: found }
