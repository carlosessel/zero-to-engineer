- question: "What does print(\"5\" + \"5\") show?"
  options:
    - "10"
    - "55"
    - "An error"
  answer: 1
  explanation: "Both are text, so + joins them. Use int(\"5\") to get numbers."
- question: "What does the line  total = 3 * 4  do?"
  options:
    - "Asks whether total equals 12"
    - "Stores 12 under the name total"
    - "Prints 12"
  answer: 1
  explanation: "A single = stores a value. Nothing is shown until you print it."
- question: "name = \"Kofi\". What is name[0]?"
  options:
    - "K"
    - "o"
    - "Kofi"
  answer: 0
  explanation: "Counting positions starts at 0."
