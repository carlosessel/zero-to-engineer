- question: What makes something an anti-pattern rather than just a mistake?
  options:
  - It is common, seems reasonable at the time, and has a known better alternative
  - It causes a compile error
  answer: 0
  explanation: Naming it helps teams discuss it.
- question: Which is premature abstraction?
  options:
  - A plugin system built for the one plugin that exists
  - Extracting a function used in three places
  answer: 0
  explanation: Abstract when real cases show what varies.
- question: What is an anaemic domain model?
  options:
  - Domain objects with data but no rules, which services must enforce
  - A model with too few tables
  answer: 0
  explanation: Rich models protect their own invariants.
- question: What does createUser('Ama', true, false, true) suffer from?
  options:
  - Boolean blindness
  - A god object
  answer: 0
  explanation: Use named options or types instead of bare flags.
- question: What did Knuth say about optimisation?
  options:
  - Premature optimisation is the root of all evil, but do not pass up the critical 3%
  - Always optimise first
  answer: 0
  explanation: Measure, then optimise where it matters.
- question: What is a lava flow?
  options:
  - Dead or mysterious code nobody dares delete
  - Code that runs too hot
  answer: 0
  explanation: Delete it; version control remembers.
