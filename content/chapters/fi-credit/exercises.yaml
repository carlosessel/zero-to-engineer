- title: Do this
  items:
    - key: x1
      text: "Find the credit bureaus in your country from the regulator's official list, and find out how to request your own report from each."
    - key: x2
      text: "If you have credit, request your report and check every account, balance and payment. Write down anything you do not recognise and how you would dispute it."
    - key: x3
      text: "Work out your credit utilisation for each card and overall, and how much you would need to repay to bring it under 30%."
    - key: x4
      text: "Set up an automatic payment of at least the minimum on every credit account you have."
