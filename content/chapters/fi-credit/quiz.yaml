- question: "What is usually in a credit report?"
  options:
    - "Your credit accounts, payment history, defaults and lenders' searches"
    - "Your income and savings balances"
    - "Your religion and health records"
    - "A single official score used by every lender"
  answer: 0
  explanation: "A report records how you have handled credit. Income is asked for separately, sensitive personal details are not held, and scores differ between bureaus and lenders."
- question: "Kojo's cards have limits of GH₵ 4,000 and GH₵ 6,000 and balances of GH₵ 3,600 and GH₵ 400. What is his overall credit utilisation?"
  options:
    - "40%"
    - "90%"
    - "6.7%"
    - "50%"
  answer: 0
  explanation: "(3,600 + 400) ÷ (4,000 + 6,000) = 4,000 ÷ 10,000 = 40%. One card is at 90%, which some lenders also notice."
- question: "Does checking your own credit report lower your score?"
  options:
    - "No; checking your own report does not harm it"
    - "Yes, every check lowers it"
    - "Only if you check more than once a year"
    - "Only in Ghana"
  answer: 0
  explanation: "Searches that matter are lenders' searches when you apply for credit. Checking your own report is encouraged."
- question: "Which single habit matters most for a strong credit record?"
  options:
    - "Paying every bill and repayment on time"
    - "Applying for lots of credit cards"
    - "Keeping a high balance on your cards"
    - "Closing your bank account"
  answer: 0
  explanation: "Payment history weighs most in almost every scoring system. Many applications and high balances count against you."
- question: "A company offers, for a fee, to remove a correct record of a missed payment from your report. What should you do?"
  options:
    - "Decline: accurate information cannot be removed, and you can dispute real errors yourself for free"
    - "Pay, because it will raise your score"
    - "Pay only if the fee is small"
    - "Ask the lender to pay the fee"
  answer: 0
  explanation: "Only inaccurate information can be corrected, and bureaus handle disputes free. Paid 'credit repair' promises are a common scam."
- question: "A lender refuses Esi a loan. What is a sensible next step?"
  options:
    - "Find out why, and check her credit reports for errors, before applying again"
    - "Apply to as many lenders as possible the same day"
    - "Take a loan from an unlicensed lender instead"
    - "Assume every lender will refuse her"
  answer: 0
  explanation: "Each lender decides differently, but many applications in a row add searches. Understanding the reason and fixing errors comes first."
