- title: Do this
  items:
  - key: x1
    text: Solve ten sliding-window and hashing problems in your interview language, timed, explaining aloud
  - key: x2
    text: Do a mock 45-minute system design interview with a friend on a ticket booking service
  - key: x3
    text: Write six STAR stories covering conflict, failure, an incident, leadership, a hard problem and changing your mind
  - key: x4
    text: Complete a three-hour take-home (an API with a database) and ask someone to review it against the checklist
