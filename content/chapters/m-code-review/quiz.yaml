- question: When should a reviewer approve a change?
  options:
  - When it definitely improves the overall health of the code, even if not perfect
  - Only when there is nothing left to improve
  answer: 0
  explanation: Holding changes back for polish slows the whole team.
- question: What is the single most useful thing an author can do for a good review?
  options:
  - Keep the change small and about one thing
  - Add many comments to the code
  answer: 0
  explanation: Small, single-purpose changes get careful, fast reviews.
- question: What should a reviewer check first?
  options:
  - Correctness, including edge cases and failures
  - Whether they would have named things the same way
  answer: 0
  explanation: Then design, tests and readability.
- question: What does a "nit:" prefix on a comment tell the author?
  options:
  - A small preference that does not block approval
  - A serious bug
  answer: 0
  explanation: Labelling severity makes clear what must change.
- question: A reviewer misunderstood your code. What is the best response?
  options:
  - Explain it in the pull request and change nothing
  - Make the code clearer, since the next reader may misunderstand it too
  answer: 1
  explanation: The explanation in the PR is lost; the code stays.
- question: How should comments from an AI review tool be treated?
  options:
  - As a useful first pass, with each comment checked by a person
  - As final, because tools do not make mistakes
  answer: 0
  explanation: They can be confidently wrong and lack the team's context.
