- title: Do this
  items:
  - key: x1
    text: Write a pull request description for your last change using what, why, how tested and what to look at
  - key: x2
    text: Review an open pull request in an open-source project you use, using the checklist in this chapter
  - key: x3
    text: Rewrite three review comments you have received or written using Conventional Comments labels
  - key: x4
    text: Split a large change of your own into a series of small pull requests
