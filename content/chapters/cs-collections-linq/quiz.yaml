- question: Which collection gives fast lookup by a key?
  options:
  - Dictionary<TKey, TValue>
  - List<T>
  answer: 0
  explanation: A dictionary is a hash table keyed by TKey.
- question: What happens when you read a missing key with stock["X"]?
  options:
  - It throws KeyNotFoundException
  - It returns null
  answer: 0
  explanation: Use TryGetValue or GetValueOrDefault when the key may be missing.
- question: Why put one list into a HashSet before checking membership in a loop?
  options:
  - Each lookup becomes roughly constant time instead of scanning the list
  - HashSet keeps items in order
  answer: 0
  explanation: List.Contains checks every item.
- question: When does a LINQ Where query run?
  options:
  - When it is enumerated, for example by foreach or ToList
  - Immediately when Where is called
  answer: 0
  explanation: LINQ queries are deferred.
- question: 'What does where T : IComparable<T> on a generic method do?'
  options:
  - Limits T to types that can be compared
  - Makes T nullable
  answer: 0
  explanation: It is a constraint.
- question: Which delegate type fits a lambda that takes an int and returns a bool?
  options:
  - Func<int, bool>
  - Action<int, bool>
  answer: 0
  explanation: Func's last type parameter is the return type; Action returns nothing.
