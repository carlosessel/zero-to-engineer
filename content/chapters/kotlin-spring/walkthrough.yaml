- id: kotlin-spring-orders-api
  title: Five requests to the Kotlin orders API
  hint: Follow each curl request through the controller and service, and see which status code comes back and why.
  language: Kotlin
  code: |
    data class PlaceOrder(
        @NotBlank val customer: String,
        @Min(1) @Max(1_000_000) val totalPence: Int,
        val note: String? = null,
    )

    // OrderService
    fun place(request: PlaceOrder): Order {
        val order = Order("o-${next.incrementAndGet()}", request.customer, request.totalPence, request.note)
        orders[order.id] = order
        return order
    }

    // OrderController
    @PostMapping
    fun place(@Valid @RequestBody request: PlaceOrder): ResponseEntity<Order> {
        val order = service.place(request)
        return ResponseEntity.created(URI.create("/orders/${order.id}")).body(order)
    }

    @GetMapping("/{id}")
    fun get(@PathVariable id: String): ResponseEntity<Order> =
        service.find(id)?.let { ResponseEntity.ok(it) } ?: ResponseEntity.notFound().build()
  steps:
    - title: A POST arrives
      text: "curl sends {\"customer\":\"Ama\",\"totalPence\":1250}. Spring turns the JSON into a PlaceOrder data class, and @Valid checks its rules: a customer that is not blank, a total of at least 1."
      lines: [1, 2, 3, 4, 5, 16]
      vars: { customer: Ama, totalPence: 1250 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "POST /orders (Ama, 1250)", tone: active }
        - { kind: kv, id: store, label: "orders map in OrderService", slots: 1, rows: [] }
    - title: The service stores the order
      text: The controller hands the request to OrderService, which makes an Order with the next id, o-1, and puts it in its map.
      lines: [8, 9, 10, 11, 17]
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "POST /orders (Ama, 1250)", tone: dim }
            - { from: OrderController, to: OrderService, label: "place(request)", tone: active }
            - { from: OrderService, to: OrderController, label: "Order o-1", tone: found }
        - kind: kv
          id: store
          label: "orders map in OrderService"
          slots: 1
          rows: [{ name: o-1, value: "Ama, 1250, note null", tone: active }]
    - title: 201 Created
      text: ResponseEntity.created sets the status to 201 and a Location header pointing at /orders/o-1, with the order as the body.
      lines: [18]
      vars: { status: "201", Location: /orders/o-1 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "POST /orders (Ama, 1250)", tone: dim }
            - { from: OrderController, to: OrderService, label: "place(request)", tone: dim }
            - { from: OrderService, to: OrderController, label: "Order o-1", tone: dim }
            - { from: OrderController, to: curl, label: "201 Created", tone: found }
        - kind: kv
          id: store
          label: "orders map in OrderService"
          slots: 1
          rows: [{ name: o-1, value: "Ama, 1250, note null" }]
    - title: GET finds it
      text: service.find("o-1") returns an Order, not null. ?.let runs and wraps it in ResponseEntity.ok, so the answer is 200 with the order.
      lines: [21, 22, 23]
      vars: { id: o-1 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "GET /orders/o-1", tone: active }
            - { from: OrderController, to: OrderService, label: "find(\"o-1\")", tone: active }
            - { from: OrderService, to: OrderController, label: "Order o-1", tone: found }
            - { from: OrderController, to: curl, label: "200 OK", tone: found }
        - kind: kv
          id: store
          label: "orders map in OrderService"
          slots: 1
          rows: [{ name: o-1, value: "Ama, 1250, note null", tone: compare }]
    - title: Invalid values are refused
      text: "A body with customer \"\" and totalPence 0 breaks @NotBlank and @Min(1). Validation rejects it with 400 Bad Request, and no order is stored."
      lines: [2, 3, 16]
      vars: { customer: '""', totalPence: 0 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "POST /orders (\"\", 0)", tone: active }
            - { from: OrderController, to: curl, label: "400 Bad Request", tone: bad }
        - kind: kv
          id: store
          label: "orders map in OrderService"
          slots: 1
          rows: [{ name: o-1, value: "Ama, 1250, note null" }]
    - title: A missing customer is refused too
      text: "A body with only totalPence has no customer. customer is a String, not a String?, so it cannot be null, and the answer is 400 again. note can be left out because it is String? with a default."
      lines: [2, 4]
      vars: { totalPence: 500 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "POST /orders (no customer)", tone: active }
            - { from: OrderController, to: curl, label: "400 Bad Request", tone: bad }
    - title: An unknown id gives 404
      text: "service.find(\"o-9\") returns null. ?. skips the let, so the Elvis operator ?: supplies ResponseEntity.notFound() and the answer is 404."
      lines: [21, 22, 23]
      vars: { id: o-9 }
      parts:
        - kind: seq
          id: s
          actors: [curl, OrderController, OrderService]
          slots: 6
          messages:
            - { from: curl, to: OrderController, label: "GET /orders/o-9", tone: active }
            - { from: OrderController, to: OrderService, label: "find(\"o-9\")", tone: active }
            - { from: OrderService, to: OrderController, label: "null", tone: compare }
            - { from: OrderController, to: curl, label: "404 Not Found", tone: bad }
