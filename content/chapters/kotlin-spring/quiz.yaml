- question: What does String? mean in Kotlin?
  options:
  - A String that may be null, which the compiler makes you handle
  - An optional String parameter with a default
  answer: 0
  explanation: Plain String can never be null.
- question: 'What does the Elvis operator ?: do?'
  options:
  - Supplies a value when the left side is null
  - Throws if the value is null
  answer: 0
  explanation: '!! is the one that throws.'
- question: Why does a Kotlin Spring project need the plugin.spring compiler plugin?
  options:
  - Kotlin classes are final by default and Spring must subclass them for proxies
  - Spring cannot read Kotlin annotations without it
  answer: 0
  explanation: The plugin opens Spring-annotated classes.
- question: What does a data class's copy function do?
  options:
  - Makes a new object with some properties changed
  - Copies the object to another thread
  answer: 0
  explanation: Data classes are immutable-friendly records.
- question: What does async return in a coroutine scope?
