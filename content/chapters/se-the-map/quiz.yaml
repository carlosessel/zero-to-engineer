- question: "What separates engineering from just coding?"
  options:
    - "Typing faster"
    - "Making software dependable: design, testing, teamwork, safe releases"
    - "Knowing more languages"
  answer: 1
  explanation: "Code is one part. Reliability over time is the job."
- question: "What is the most important part of this course?"
  options:
    - "Reading every chapter twice"
    - "Building the projects"
    - "Memorising the glossary"
  answer: 1
  explanation: "Skill comes from building, not from reading."
