- question: "What does console.log(\"4\" + 4) print?"
  options:
    - "8"
    - "44"
    - "An error"
  answer: 1
  explanation: "When either side of + is a string, + joins the two as text. Convert with Number(\"4\") first to add."
- question: "Which keyword should you use for a variable whose value never changes?"
  options:
    - "let"
    - "const"
    - "var"
  answer: 1
  explanation: "const cannot be given a new value, which also tells readers it never changes. Use let only when it must change; avoid var."
- question: "What is \"bread\"[0]?"
  options:
    - "\"b\""
    - "\"r\""
    - "undefined"
  answer: 0
  explanation: "Positions start at 0, so the first character is at position 0."
- question: "What is 14 % 4?"
  options:
    - "3.5"
    - "2"
    - "3"
  answer: 1
  explanation: "% gives the remainder: 4 goes into 14 three times (12), leaving 2."
- question: "What does Number(\"ten\") give?"
  options:
    - "10"
    - "0"
    - "NaN"
  answer: 2
  explanation: "NaN means Not a Number: the conversion made no sense."
- question: "Your code says total = 50 where total was created with const. What happens?"
  options:
    - "total becomes 50"
    - "TypeError: Assignment to constant variable."
    - "Nothing happens"
  answer: 1
  explanation: "A const cannot be given a new value. Use let, or a new variable."
- question: "What is the type of (2.456).toFixed(2)?"
  options:
    - "number"
    - "string"
  answer: 1
  explanation: "toFixed returns text, ready for showing to people. Adding to it with + would join, not add."
- question: "Which line builds the text \"Total: 30\" from const total = 30 most clearly?"
  options:
    - "\"Total: \" + total"
    - "`Total: ${total}`"
    - "Both work; the second is easier to read with many values"
  answer: 2
  explanation: "Both produce the same text. Template literals stay readable as the number of values grows."
