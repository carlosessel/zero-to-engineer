- title: "Do this"
  items:
    - key: x1
      text: "Run every example in this chapter, then change one thing in each and predict the new output before running it"
    - key: x2
      text: "Create a file `values.js` in your `web-course` folder with five variables describing yourself, print a sentence about you with a template literal, and run it with `node values.js`"
    - key: x3
      text: "Make each of the three errors in the chapter on purpose in the browser's Console and read the message"
    - key: x4
      text: "Write a program that converts a price in pesewas to a cedi amount with two decimal places"
    - key: x5
      text: "Do all 30 practice problems before looking at the solutions, and note which ones you got wrong"
