- title: "Do this"
  items:
    - key: x1
      text: "Cause each error in the chapter's table on purpose in the Console and read its message"
    - key: x2
      text: "Set a breakpoint in your own to-do list, step through adding a task, and watch the values change"
    - key: x3
      text: "Use a conditional breakpoint inside a loop to pause on one particular iteration"
    - key: x4
      text: "Follow the debugging walk-through on Chrome's Debug JavaScript page"
    - key: x5
      text: "Next time you are stuck, explain the code aloud line by line before searching for help, and note whether it helped"
