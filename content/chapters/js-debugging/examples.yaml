- block: 1
  lang: js
  check: js
  throws: TypeError
  stack_contains:
  - Cannot read properties of undefined (reading 'price')
  - at lineTotal (example.js:2:15)
  - at basketTotal (example.js:8:14)
  - example.js:13:13
  note: 'Checks the error and its stack trace: the functions, in order, with the line and column numbers the chapter shows (Node runs the same JavaScript engine as Chrome; the file is called example.js here and app.js in the chapter).'
- block: 2
  lang: text
  check: illustration
  note: The stack trace for the code above, as Chrome's Console shows it. The functions, lines and columns are checked by running that code (see block 1); Chrome also adds 'Uncaught' at the start.
