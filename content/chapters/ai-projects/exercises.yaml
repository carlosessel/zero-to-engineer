- title: "Tick them off"
  items:
    - key: pj1
      text: "**1. Tabular predictor.** Train and compare three classic models on a real dataset. Report the right metric and explain your choice. (Chapters [[n:ml-idea]] to [[n:metrics-models]])"
    - key: pj2
      text: "**2. Image classifier.** Fine-tune a pretrained network on photos you took. Deploy a page where anyone can upload an image. (Chapters [[n:neural-nets]] to [[n:architectures]])"
    - key: pj3
      text: "**3. Tiny GPT.** Train a small transformer from scratch on text you choose and generate from it. (Chapters [[n:tokens-embeddings]] to [[n:sampling]])"
    - key: pj4
      text: "**4. Document extractor.** Turn messy receipts, invoices or CVs into validated structured data, with accuracy per field. (Chapters [[n:first-call]] to [[n:structured-output]], [[n:multimodal]])"
    - key: pj5
      text: "**5. Ask-my-documents.** A full RAG application with citations, hybrid search, streaming and a retrieval eval. (Chapters [[n:rag]], [[n:evals]], [[n:app-architecture]])"
    - key: pj6
      text: "**6. An agent that does a real job.** For example, one that answers questions about a database by writing and running safe read-only SQL, with step limits and traces. (Chapters [[n:tools]], [[n:agents]], [[n:safety-security]])"
    - key: pj7
      text: "**7. Fine-tuned small model.** Distil a narrow task from a large model into a small open one and show the cost and quality trade-off. (Chapters [[n:open-models]], [[n:fine-tuning]])"
    - key: pj8
      text: "**8. Capstone.** A product someone else actually uses: deployed, monitored, with evals in CI. Add AI to something you have already built, or solve a problem for a real person or business near you. (Everything)"
