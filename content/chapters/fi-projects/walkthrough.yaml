- id: fi-projects-route
  title: Five projects that build on each other
  hint: Each project reuses the work of the one before. Follow the route from your own accounts to a real company.
  steps:
  - title: Five projects
    text: Each project has a specification, a checklist of what done means, and chapters to revisit. Each one builds on the numbers or skills of the one before.
    parts:
    - kind: graph
      id: g
      height: 260
      nodes:
      - k: p1
        label: 1 Accounts
        x: 0.05
        y: 0.2
      - k: p2
        label: 2 Budget plan
        x: 0.05
        y: 0.85
      - k: p3
        label: 3 Model
        x: 0.5
        y: 0.5
      - k: p4
        label: 4 Portfolio
        x: 0.95
        y: 0.2
      - k: p5
        label: 5 Company
        x: 0.95
        y: 0.85
      edges:
      - a: p1
        b: p2
        directed: true
      - a: p2
        b: p3
        directed: true
      - a: p3
        b: p4
        directed: true
      - a: p4
        b: p5
        directed: true
  - title: 1. Household accounts
    text: Record every transaction across all your accounts, reconcile each month, and produce a year's income statement, balance sheet and cash flow.
    vars:
      revisit: bookkeeping, household statements
    parts:
    - kind: graph
      id: g
      height: 260
      nodes:
      - k: p1
        label: 1 Accounts
        x: 0.05
        y: 0.2
        tone: active
        note: your real numbers
      - k: p2
        label: 2 Budget plan
        x: 0.05
        y: 0.85
      - k: p3
        label: 3 Model
        x: 0.5
        y: 0.5
      - k: p4
        label: 4 Portfolio
        x: 0.95
        y: 0.2
      - k: p5
        label: 5 Company
        x: 0.95
        y: 0.85
      edges:
      - a: p1
        b: p2
        directed: true
      - a: p2
        b: p3
        directed: true
      - a: p3
        b: p4
        directed: true
      - a: p4
        b: p5
        directed: true
  - title: 2. Budget and debt-free plan
    text: 'From project 1''s numbers: a zero-based budget, avalanche and snowball schedules for every debt, an emergency fund date and a one-page plan.'
    vars:
      revisit: budgeting, debt, the plan
    parts:
    - kind: graph
      id: g
      height: 260
      nodes:
      - k: p1
        label: 1 Accounts
        x: 0.05
        y: 0.2
      - k: p2
        label: 2 Budget plan
        x: 0.05
        y: 0.85
        tone: active
        note: the order of priorities
      - k: p3
        label: 3 Model
        x: 0.5
        y: 0.5
      - k: p4
        label: 4 Portfolio
        x: 0.95
        y: 0.2
      - k: p5
        label: 5 Company
        x: 0.95
        y: 0.85
      edges:
      - a: p1
        b: p2
        directed: true
      - a: p2
        b: p3
        directed: true
      - a: p3
        b: p4
        directed: true
      - a: p4
        b: p5
        directed: true
  - title: 3. Savings and retirement model
    text: Project one long-term goal year by year in today's money, with contributions, fees, tax and a sensitivity table.
    vars:
      revisit: time value, inflation, fees, retirement
    parts:
    - kind: graph
      id: g
      height: 260
      nodes:
      - k: p1
        label: 1 Accounts
        x: 0.05
        y: 0.2
      - k: p2
        label: 2 Budget plan
        x: 0.05
        y: 0.85
      - k: p3
        label: 3 Model
        x: 0.5
        y: 0.5
        tone: active
        note: assumptions in cells
      - k: p4
        label: 4 Portfolio
        x: 0.95
        y: 0.2
      - k: p5
        label: 5 Company
        x: 0.95
        y: 0.85
      edges:
      - a: p1
        b: p2
        directed: true
      - a: p2
        b: p3
        directed: true
      - a: p3
        b: p4
        directed: true
      - a: p4
        b: p5
        directed: true
  - title: 4. Model portfolio
    text: Design a portfolio for a goal and track it monthly for a year without real money, rebalancing by rule and noting your own reactions.
    vars:
      revisit: risk, diversification, funds, behaviour
    parts:
    - kind: graph
      id: g
      height: 260
      nodes:
      - k: p1
        label: 1 Accounts
        x: 0.05
        y: 0.2
      - k: p2
        label: 2 Budget plan
        x: 0.05
        y: 0.85
      - k: p3
        label: 3 Model
        x: 0.5
        y: 0.5
      - k: p4
        label: 4 Portfolio
        x: 0.95
        y: 0.2
        tone: active
        note: a year, by rule
      - k: p5
        label: 5 Company
        x: 0.95
        y: 0.85
      edges:
      - a: p1
        b: p2
        directed: true
      - a: p2
        b: p3
        directed: true
      - a: p3
        b: p4
        directed: true
      - a: p4
        b: p5
        directed: true
  - title: 5. A real company
    text: 'Analyse a listed company''s annual report: statements, ratios against a competitor, warning signs, and a valuation range.'
    vars:
      revisit: statements, ratios, valuation
    parts:
