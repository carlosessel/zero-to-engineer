- id: fi-scams-ponzi
  title: How a Ponzi scheme collapses
  hint: Watch the new money column. As soon as it falls below what is paid out, the cash left starts to run down.
  steps:
  - title: Month 1
    text: 10,000 comes in. The organisers keep 2,000, and 1,000 is paid out as the first month's '10%'. Investors are delighted.
    parts:
    - kind: tables
      id: t
      slots: 8
      tables:
      - id: s
        title: A scheme promising 10% a month (GH₵)
        columns:
        - month
        - new money
        - paid out
        - cash left
        rows:
        - k: m0
          cells:
          - '1'
          - 10,000
          - 1,000
          - 7,000
          tone: active
  - title: Month 2
    text: 15,000 more arrives as early investors tell friends. Payouts are now 2,500 a month, all paid from deposits.
