- title: Do this
  items:
    - key: x1
      text: "Find your regulator's register and its list of warnings or unlicensed firms. Look up one investment firm you have heard of and one you have seen advertised."
    - key: x2
      text: "Collect three scam messages or adverts (from your phone, email or social media) and list the warning signs in each."
    - key: x3
      text: "Write down your bank's and mobile money provider's official fraud numbers and keep them where you can find them fast."
    - key: x4
      text: "Explain to a friend or family member how a Ponzi scheme works, using the table in this chapter."
