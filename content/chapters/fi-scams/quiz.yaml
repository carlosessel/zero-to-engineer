- question: "How does a Ponzi scheme pay its investors?"
  options:
    - "With money from newer investors, not from any real business"
    - "From profits on trading"
    - "From government guarantees"
    - "From interest on bank deposits"
  answer: 0
  explanation: "Early payouts come from later deposits. When new money slows, the scheme cannot pay and collapses."
- question: "Why must every pyramid scheme collapse?"
  options:
    - "It needs ever more recruits, and the numbers soon exceed the population"
    - "Because regulators always close them on day one"
    - "Because products go out of date"
    - "They don't; some last for ever"
  answer: 0
  explanation: "With 6 recruits each, level 10 needs over 60 million new members. Recruitment stalls long before, leaving most members with losses."
- question: "A caller from 'your bank' says your account is at risk and asks you to move your money to a safe account. What is this?"
  options:
    - "A common impersonation scam; hang up and call your bank on the number on your card"
    - "A normal security procedure"
    - "A legitimate request if they know your name"
    - "A way to earn extra interest"
  answer: 0
  explanation: "Banks never ask you to move money to a 'safe account' or to read out codes. Check using contact details you already have."
- question: "A website shows the name and licence number of a real licensed firm. What else must you check?"
  options:
    - "That its website, phone, email and address match the regulator's register, to rule out a clone firm"
    - "Nothing; the licence number proves it is genuine"
    - "Only that the website looks professional"
    - "That it has good reviews on its own site"
  answer: 0
  explanation: "Clone firms copy real firms' details. Contact the firm using the register's details."
- question: "Which is NOT usually a warning sign of a scam?"
  options:
    - "The provider is on the regulator's register, contacted through the register's details, and explains its risks"
    - "Guaranteed high returns"
    - "Pressure to decide today"
    - "A request to pay in crypto to start"
  answer: 0
  explanation: "Checking the register yourself and getting a clear account of risks is what a legitimate provider allows."
- question: "You have been scammed. What should you do first?"
  options:
    - "Stop paying, contact your bank or mobile money provider at once, then report it"
    - "Pay the release fee to get your money back"
    - "Wait to see if the money returns"
    - "Use a recovery service that contacts you"
  answer: 0
  explanation: "Speed matters for stopping payments. Release fees and recovery services are usually more fraud."
