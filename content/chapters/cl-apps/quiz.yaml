- question: "You study the same course for weeks and keep re-explaining your background in each chat. What fixes this?"
  options:
    - "A project with instructions and the course material as knowledge"
    - "A longer first message every time"
    - "One very long chat"
  answer: 0
  explanation: "A project's instructions and knowledge apply to every chat in it."
- question: "Is Claude's memory feature the model remembering you?"
  options:
    - "Yes, the model learns from your chats"
    - "No: the app saves topics about you and adds relevant ones to new conversations' context"
  answer: 1
  explanation: "The model still starts fresh; memory is saved notes put into the context, which you can view and edit."
- question: "Which is the safest connector set-up?"
  options:
    - "Connect every available service in case it is useful"
    - "Connect only services you need and trust, and review what access each grants"
  answer: 1
  explanation: "Each connector gives access to data and often actions; untrusted content can try to manipulate Claude."
- question: "Why does a skill load only its short description until it is needed?"
  options:
    - "To save disk space"
    - "To keep the context small and relevant while Claude still knows the skill exists"
    - "Because skills are slow"
  answer: 1
  explanation: "Full instructions are loaded only when a task matches, so many skills do not crowd the context."
- question: "You need the exact week with the most returns from a sales CSV. What should you make sure of?"
  options:
    - "That code execution is on, so Claude computes the answer from the file"
    - "That you use the longest model name"
  answer: 0
  explanation: "Computed answers come from the data, and you can read the code that produced them."
