- title: "Do this"
  items:
    - key: x1
      text: "In your Vite project, load the people from JSONPlaceholder with a loading message, an error message (test it by turning off your connection) and the list"
    - key: x2
      text: "Watch your fetch in the developer tools' Network panel while developing, and find the second request StrictMode causes"
    - key: x3
      text: "Install React Router and build the bakery shop with BrowserRouter, with each page in its own file"
    - key: x4
      text: "Add a page /people/:id to your app that loads one person from JSONPlaceholder, with Previous and Next links"
    - key: x5
      text: "Add a search box to the people list that filters the names as you type, without any extra fetch and without an effect"
