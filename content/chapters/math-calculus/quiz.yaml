- question: "What does a derivative tell you?"
  options:
    - "The area under a curve"
    - "The slope of a curve at one point"
    - "The highest point of a curve"
  answer: 1
  explanation: "It is the steepness at that exact point."
- question: "What is the derivative of x²?"
  options:
    - "x"
    - "2x"
    - "2"
  answer: 1
  explanation: "Bring the power down and reduce it by one."
- question: "The slope of the loss is zero at some point. That point is…"
  options:
    - "flat: possibly the bottom of a valley"
    - "the steepest place"
    - "always the wrong answer"
  answer: 0
  explanation: "Flat spots are peaks or valleys. Training looks for the valley."
