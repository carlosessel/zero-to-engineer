- question: "What does  for i in range(3): print(i)  print?"
  options:
    - "1 2 3"
    - "0 1 2"
    - "0 1 2 3"
  answer: 1
  explanation: "range(3) starts at 0 and stops before 3."
- question: "What is the difference between print and return in a function?"
  options:
    - "They are the same"
    - "print shows a value on screen; return hands it back to the calling code"
    - "return shows a value; print saves it"
  answer: 1
  explanation: "A returned value can be stored and used. A printed one is only displayed."
- question: "Why does indentation matter in Python?"
  options:
    - "It only makes code prettier"
    - "It tells Python which lines belong inside an if, loop or function"
    - "It makes code faster"
  answer: 1
  explanation: "Indentation is how Python marks blocks."
