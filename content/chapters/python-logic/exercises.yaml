- title: "Do this"
  items:
    - key: pl1
      text: "Write a program that prints the numbers 1 to 20, but prints “Fizz” for multiples of 3 and “Buzz” for multiples of 5"
    - key: pl2
      text: "Write a function `is_even(n)` that returns True or False"
    - key: pl3
      text: "Build a guessing game: the program picks a number (look up `random.randint`) and tells the player “higher” or “lower” until they get it"
