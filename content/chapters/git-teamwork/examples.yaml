# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  note: Run in a prepared repository with a local stand-in for GitHub. The 'edit' comment is replaced by a real edit.
  script: |
    mkdir work && cd work
    git init -q -b main && echo 'x = 1' > app.py && git add . && git commit -q -m "Start"
    git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q -u origin main
    sed 's|^# ... edit, then ...$|echo "login = True" >> app.py|' "$BLOCK" > steps.sh
    grep -q 'login = True' steps.sh
    bash -e steps.sh
    git --git-dir=../origin.git rev-parse --verify -q add-login      # the branch reached the remote
    git --git-dir=../origin.git log --oneline add-login
  output_contains:
  - Add login form
- block: 2
  lang: bash
  check: shell
  note: Continues in the repository from the block above.
  script: |
    cd work
    bash -e "$BLOCK"
    test "$(git branch --show-current)" = next-feature
- block: 3
  lang: text
  check: illustration
  note: 'Reproduced for real: two branches change the same line, a merge is attempted, and the file Git leaves behind is compared with the one shown.'
  verify: |
    import os, subprocess
    d = tmp / "conflict"
    d.mkdir()
    env = {**os.environ, "GIT_CONFIG_GLOBAL": os.devnull, "GIT_AUTHOR_NAME": "L", "GIT_AUTHOR_EMAIL": "l@example.com", "GIT_COMMITTER_NAME": "L", "GIT_COMMITTER_EMAIL": "l@example.com"}
    def git(*args, ok=True):
        r = subprocess.run(["git", *args], cwd=d, env=env, capture_output=True, text=True)
        assert not ok or r.returncode == 0, r.stderr
        return r
    f = d / "price.py"
    git("init", "-q", "-b", "main"); f.write_text("price = 40\n"); git("add", "."); git("commit", "-q", "-m", "start")
    git("switch", "-q", "-c", "add-discount"); f.write_text("price = 55\n"); git("commit", "-q", "-am", "discount")
    git("switch", "-q", "main"); f.write_text("price = 50\n"); git("commit", "-q", "-am", "main change")
    assert git("merge", "add-discount", ok=False).returncode != 0
    assert f.read_text().strip() == block.strip(), f.read_text()
