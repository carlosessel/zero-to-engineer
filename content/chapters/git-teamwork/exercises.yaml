- title: "Do this"
  items:
    - key: gt1
      text: "Make a branch, change something, push it, open a pull request on your own repository and merge it"
    - key: gt2
      text: "Create a conflict on purpose with two branches editing the same line, and resolve it"
    - key: gt3
      text: "Find a small open-source project, read three merged pull requests, and note what reviewers asked for"
