- question: "Students take many courses and courses have many students. How is this modelled?"
  options:
    - "A list column on the student"
    - "A third table linking students to courses"
    - "Two copies of each row"
  answer: 1
  explanation: "Many-to-many needs a linking table."
- question: "What is a migration?"
  options:
    - "Moving to another city"
    - "A versioned script that changes the database structure"
    - "A backup"
  answer: 1
  explanation: "Migrations keep every copy of the database in the same shape."
