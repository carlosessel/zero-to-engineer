- question: Why is building a string with += in a loop slow?
  options:
  - Strings are encrypted
  - Each += copies the whole string so far, giving O(n²)
  answer: 1
  explanation: Use a builder or join.
- question: A Java class used as a HashMap key has no equals or hashCode. What happens?
  options:
  - Lookups with an equal new object fail
  - It works the same
  answer: 0
  explanation: Identity is compared; use a record or define both methods.
- question: What is hash flooding?
  options:
  - Too many hash maps
  - Sending keys crafted to collide, making lookups slow
  answer: 1
  explanation: Defend with randomised hashing, tree bins and limits.
- question: When is a hash map the wrong choice?
  options:
  - When you need keys in order or range queries
  - When keys are strings
  answer: 0
  explanation: Use a sorted structure.
- question: Why should hash keys be immutable?
  options:
  - Changing a key changes its hash, so the entry can no longer be found
  - Immutable keys use less memory
  answer: 0
  explanation: Use strings, numbers or records.
