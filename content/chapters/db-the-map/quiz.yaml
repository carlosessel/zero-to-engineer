- question: What does it mean that SQL is declarative?
  options:
  - You describe the result you want and the database decides how to get it
  - You list the steps the database must follow
  answer: 0
  explanation: The same query keeps working as data grows and the database finds faster ways.
- question: Why does an order store a customer_id instead of a copy of the customer's details?
  options:
  - So each fact lives in one place and cannot disagree with itself
  - Because SQL cannot store text twice
  answer: 0
  explanation: This is the idea behind normalisation.
- question: What is a foreign key?
  options:
  - A column whose values must match a key in another table
  - A key from another database
  answer: 0
  explanation: It keeps references between tables valid.
- question: Which database is a whole database in one file, embedded in apps?
  options:
  - SQLite
  - Oracle
  answer: 0
  explanation: It runs inside phones, browsers and tests.
- question: Which kind of database fits sessions and counters best?
  options:
  - A key-value store such as Redis
  - A graph database
  answer: 0
  explanation: Fast lookups by key.
