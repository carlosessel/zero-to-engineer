- title: Do this
  items:
  - key: x1
    text: Run the race example several times and on a busier machine, and watch the unsafe count change
  - key: x2
    text: Play The Deadlock Empire until you can explain each level's bug
  - key: x3
    text: Take a thread dump of a running Java or .NET service and identify what each thread is doing
  - key: x4
    text: Find a singleton or static field in a web project and check whether it is safe for concurrent requests
