- question: "Two investments have a correlation close to +1. What happens if you combine them?"
  options:
    - "Very little reduction in risk, because they rise and fall together"
    - "All risk disappears"
    - "Risk doubles"
    - "Their returns cancel out"
  answer: 0
  explanation: "Diversification works when investments move differently. With correlation near +1 they move in step, so combining them barely smooths the ride."
- question: "Which risk can diversification across many companies remove?"
  options:
    - "The risk that one company has a fraud or a factory fire"
    - "A recession that hits the whole economy"
    - "A sharp rise in interest rates"
    - "A fall in the national currency"
  answer: 0
  explanation: "Events that affect one company are specific risk, which spreading across many companies removes. Economy-wide events are market risk and remain."
- question: "A portfolio is 40% in an asset expected to return 10% and 60% in one expected to return 15%. What is its expected return?"
  options:
    - "13%"
    - "12.5%"
    - "25%"
    - "11%"
  answer: 0
  explanation: "Weighted average: 0.4 × 10% + 0.6 × 15% = 4% + 9% = 13%. The simple average, 12.5%, ignores the weights."
- question: "A 60:40 portfolio has drifted to 70:30 after shares rose. What does rebalancing do?"
  options:
    - "Sells some shares and buys bonds to return to 60:40"
    - "Buys more shares because they are doing well"
    - "Sells everything and starts again"
    - "Changes the target to 70:30"
  answer: 0
  explanation: "Rebalancing restores the mix you chose, which keeps risk where you intended and sells what has grown."
- question: "Why is keeping most of your savings in your employer's shares risky?"
  options:
    - "A problem at the company could hit your job and your savings at the same time"
    - "Employers' shares always fall"
    - "It is illegal"
    - "Employees cannot sell their shares"
  answer: 0
  explanation: "This is concentration risk made worse by your income depending on the same company."
- question: "What explains most of a diversified portfolio's ups and downs?"
  options:
    - "Its asset allocation: how it is split between cash, bonds, shares and property"
    - "Which individual shares were picked"
    - "The day of the week trades were made"
    - "How many funds it holds"
  answer: 0
  explanation: "Asset classes behave very differently, so the split between them drives most of the portfolio's behaviour."
