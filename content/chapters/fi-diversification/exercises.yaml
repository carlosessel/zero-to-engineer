- title: Do this
  items:
    - key: x1
      text: "In a spreadsheet, put the X and Y returns in two columns, use CORREL on them, and build the value of X alone, Y alone, a rebalanced 50:50 mix and an unrebalanced 50:50 mix. Then change Y so it moves with X, and watch the benefit disappear."
    - key: x2
      text: "List everything you own or are owed (savings, property, pension, business, employer shares) by asset class and currency. Note any concentration."
    - key: x3
      text: "Write a target asset allocation for one long-term goal, with your reasons, and a rule for when you would rebalance."
    - key: x4
      text: "Find a balanced fund's factsheet and write down its asset allocation and how often it rebalances."
