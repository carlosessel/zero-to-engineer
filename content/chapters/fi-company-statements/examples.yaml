# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    2025 223.0 223.0
    2026 229.6 229.6
    31.0 -25 -19.4 4.6
  verify: |
    # The income statement and other figures in the chapter.
    gp, op, pbt = 300 - 195, 300 - 195 - 60, 300 - 195 - 60 - 13
    assert (gp, op, pbt) == (105, 45, 32) and pbt * 0.75 == 24
    assert (260 - 172 - 52 - 12) * 0.75 == 18
    assert round(40 + 24 - 0.12 * 120, 1) == 49.6
    assert 140 + 25 - 15 == 150
    assert round(31 - 25, 1) == 6
    assert round((300 / 260 - 1) * 100, 1) == 15.4 and round((24 / 18 - 1) * 100, 1) == 33.3
    assert round(88 / 260 * 100, 1) == 33.8
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    assert block.strip().splitlines() == ["2025 223.0 223.0", "2026 229.6 229.6", "31.0 -25 -19.4 4.6"]
