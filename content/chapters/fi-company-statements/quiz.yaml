- question: "A company's revenue is GH₵ 200 million and cost of sales GH₵ 130 million. What is its gross profit?"
  options:
    - "GH₵ 70 million"
    - "GH₵ 330 million"
    - "GH₵ 130 million"
    - "It cannot be worked out without operating expenses"
  answer: 0
  explanation: "Gross profit = revenue − cost of sales = 200 − 130 = 70. Operating expenses come after gross profit."
- question: "Why is depreciation added back in the operating section of the cash flow statement?"
  options:
    - "It reduced profit, but no cash left the company for it this year"
    - "Because it is a source of new cash"
    - "Because depreciation is paid to shareholders"
    - "Because it is a tax refund"
  answer: 0
  explanation: "Cash left when the equipment was bought (an investing cash flow). Depreciation spreads that cost over later years without further cash."
- question: "Last year's retained earnings were 40, this year's profit is 24 and dividends paid were 14.4. What are retained earnings now?"
  options:
    - "49.6"
    - "64.0"
    - "78.4"
    - "24.0"
  answer: 0
  explanation: "40 + 24 − 14.4 = 49.6. Retained earnings link the income statement to the balance sheet."
- question: "A company's profit rises every year, but its operating cash flow stays flat while receivables grow fast. What should you suspect?"
  options:
    - "Customers are not paying, or sales are being recorded too early"
    - "The company is very healthy"
    - "Depreciation is too high"
    - "Nothing; profit and cash always differ"
  answer: 0
  explanation: "Profit that never turns into cash is a classic warning sign. Rising receivables mean sales recorded but not collected."
- question: "What is free cash flow?"
  options:
    - "Operating cash flow minus spending on property, plant and equipment"
    - "Profit plus depreciation"
    - "Cash at the end of the year"
    - "Dividends paid"
  answer: 0
  explanation: "It is the cash left after keeping and growing the business, available for dividends, debt repayment or saving."
- question: "Where would you usually find the details of a company's borrowings and accounting choices?"
  options:
    - "In the notes to the financial statements"
    - "In the chair's review"
    - "Only on the share price chart"
    - "Nowhere; companies do not publish them"
  answer: 0
  explanation: "The notes explain the figures. The SEC's guide puts it simply: read the footnotes."
