- title: Do this
  items:
    - key: x1
      text: "Download the latest annual report of a company listed on your country's exchange. Find its revenue, operating profit, profit, total assets, borrowings, equity and operating cash flow for two years."
    - key: x2
      text: "For that company, check that profit less dividends explains the change in retained earnings, and that the cash flow statement explains the change in cash."
    - key: x3
      text: "Read its auditor's report and write down, in one sentence, what the auditor concluded and whether anything was emphasised."
    - key: x4
      text: "Compare its profit with its operating cash flow over three years, and work out free cash flow and whether dividends were covered by it."
