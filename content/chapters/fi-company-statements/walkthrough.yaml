- id: fi-company-statements-cash
  title: From profit to cash
  hint: Each line either adds cash or uses it. The running total ends at the change in cash on the balance sheet.
  steps:
  - title: Start from profit
    text: Volta made a profit of 24.0. The cash flow statement starts here and adjusts for everything that was not cash.
    vars:
      section: operating
    parts:
    - kind: tables
      id: t
      slots: 8
      tables:
      - id: s
        title: Volta Foods, 2026 (GH₵ million)
        columns:
        - item
        - cash
        - running
        rows:
        - k: r0
          cells:
          - profit
          - '+24.0'
          - '24.0'
          tone: active
  - title: Depreciation
    text: Depreciation of 15.0 reduced profit, but no cash left for it this year, so it is added back.
    vars:
      section: operating
    parts:
    - kind: tables
      id: t
      slots: 8
      tables:
