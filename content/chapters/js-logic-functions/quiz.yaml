- question: "What does 5 === \"5\" give?"
  options:
    - "true"
    - "false"
  answer: 1
  explanation: "=== compares without converting types, so a number and a string are never equal. That is why you use === rather than ==."
- question: "score is 85. Which line prints?\n\nif (score >= 50) { console.log(\"Pass\"); } else if (score >= 80) { console.log(\"Excellent\"); }"
  options:
    - "Pass"
    - "Excellent"
    - "Both"
  answer: 0
  explanation: "Only the first true branch runs, and score >= 50 is checked first. Put the narrower condition (>= 80) first."
- question: "How many times does for (let i = 0; i < 4; i++) run?"
  options:
    - "3"
    - "4"
    - "5"
  answer: 1
  explanation: "i is 0, 1, 2 and 3. When i becomes 4, the condition is false and the loop stops."
- question: "Which value is truthy?"
  options:
    - "0"
    - "\"\""
    - "\"0\""
  answer: 2
  explanation: "\"0\" is a non-empty string, so it is truthy. 0 and the empty string are falsy."
- question: "A function prints its result with console.log but has no return. What does const r = myFunction(); store in r?"
  options:
    - "The printed value"
    - "undefined"
    - "An error"
  answer: 1
  explanation: "A function with no return gives back undefined. Printing shows a value to a person; return hands it to the program."
- question: "What does const half = (n) => n / 2; half(9) return?"
  options:
    - "4"
    - "4.5"
    - "undefined"
  answer: 1
  explanation: "An arrow function with a single expression returns it automatically: 9 / 2 = 4.5."
- question: "A variable is created with let inside a function. Can code outside the function use it?"
  options:
    - "Yes"
    - "No; it exists only inside the function's block"
  answer: 1
  explanation: "That is its scope. Keeping variables inside the function that needs them stops different parts of a program interfering."
- question: "What is wrong with while (count < 10) { console.log(count); } if count starts at 0?"
  options:
    - "Nothing"
    - "count never changes, so the loop never ends"
    - "while cannot print"
  answer: 1
  explanation: "Something inside the loop must eventually make the condition false, such as count++."
