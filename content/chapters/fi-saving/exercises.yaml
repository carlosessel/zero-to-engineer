- title: Do this
  items:
    - key: x1
      text: "Write down one savings goal with an amount and a date, and work out the monthly amount. If it does not fit your budget, adjust the amount, the date or the budget until it does."
    - key: x2
      text: "Work out your (or a made-up person's) essential spending per month, then the starter, three-month and six-month emergency fund targets."
    - key: x3
      text: "Compare the interest rates on a savings account and a fixed deposit at two licensed banks, and note how long each fixed deposit locks the money."
    - key: x4
      text: "Set up a standing order or automatic transfer for your savings on pay day, even a small one."
