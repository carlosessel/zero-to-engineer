- question: "Kweku's essential spending is GH₵ 2,500 a month and his job is secure with no dependants. Which emergency fund target fits the rule of thumb in this chapter?"
  options:
    - "About GH₵ 7,500, three months of essentials"
    - "GH₵ 2,500 a month for ever"
    - "Three months of his whole net pay, including wants"
    - "No fund, because his job is secure"
  answer: 0
  explanation: "The fund is measured in months of essential spending. With a secure job and no dependants, the lower end, three months (3 × 2,500), is reasonable. Even secure jobs end, and emergencies are not only about jobs."
- question: "Why is a one-year fixed deposit a poor place for an emergency fund?"
  options:
    - "It is not liquid: the money is locked, and taking it early may cost the interest"
    - "It is not safe"
    - "It pays no interest"
    - "Fixed deposits are illegal for emergencies"
  answer: 0
  explanation: "Fixed deposits at licensed banks are safe and pay more, but emergencies do not wait for the deposit to mature. Emergency money must be both safe and quickly available."
- question: "Mensah wants GH₵ 4,800 in 12 months but can only save GH₵ 300 a month. Which of these does not help?"
  options:
    - "Ignoring the gap and hoping"
    - "Choosing a later date, 16 months"
    - "Choosing a smaller goal, GH₵ 3,600"
    - "Cutting a want to save GH₵ 400 a month"
  answer: 0
  explanation: "4,800 ÷ 12 = 400 a month is needed. A later date (16 × 300 = 4,800), a smaller goal (12 × 300 = 3,600) or a bigger monthly amount all close the gap."
- question: "A company you have never heard of offers 8% a month on savings, far above any bank. What should you do first?"
  options:
    - "Check whether it is licensed by the regulator, and treat the rate as a warning sign"
    - "Deposit your emergency fund to earn more"
    - "Deposit a small amount to test it"
    - "Ask the company if it is safe"
  answer: 0
  explanation: "Rates far above what licensed banks pay are a classic sign of fraud. Check the regulator's list first; a small test deposit proves nothing, since early depositors are often paid to build trust."
- question: "In a rotating savings group, who carries the most risk?"
  options:
    - "Members late in the order, who pay in for months before receiving the pot"
    - "The first member to receive the pot"
    - "Everyone carries exactly the same risk"
    - "Nobody, because the money is protected by the government"
  answer: 0
  explanation: "Late members have paid in most before receiving anything, so they lose most if others stop paying. Informal groups are not covered by deposit protection."
- question: "Ama used GH₵ 900 of her emergency fund for a medical bill. What should come next?"
  options:
    - "Rebuild the fund before going back to other goals"
    - "Stop saving, since the fund has proved it is not enough"
    - "Borrow GH₵ 900 to put it back at once"
    - "Spend the rest before the next emergency"
  answer: 0
  explanation: "Using the fund is what it is for. Rebuilding it, steadily from the budget, keeps her ready for the next one. Borrowing to refill it just turns the emergency into debt."
