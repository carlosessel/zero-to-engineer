    package com.bakery;

    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import java.net.URI;
    import java.net.http.HttpClient;
    import java.net.http.HttpRequest;
    import java.net.http.HttpResponse;
    import java.time.Clock;
    import java.time.Instant;
    import java.time.ZoneOffset;
    import org.junit.jupiter.api.Test;
    import org.junit.jupiter.params.ParameterizedTest;
    import org.junit.jupiter.params.provider.CsvSource;
    import org.springframework.boot.test.context.SpringBootTest;
    import org.springframework.boot.test.context.TestConfiguration;
    import org.springframework.boot.test.web.server.LocalServerPort;
    import org.springframework.context.annotation.Bean;
    import org.springframework.context.annotation.Primary;
    import org.springframework.test.annotation.DirtiesContext;

    @SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)
    @DirtiesContext(classMode = DirtiesContext.ClassMode.AFTER_EACH_TEST_METHOD)
    class OrdersApiTest {
        @TestConfiguration
        static class FixedClock {
            @Bean
            @Primary
            Clock testClock() {
                return Clock.fixed(Instant.parse("2026-11-13T07:30:00Z"), ZoneOffset.UTC);
            }
        }

        @LocalServerPort
        int port;

        private final HttpClient http = HttpClient.newHttpClient();

        private HttpResponse<String> post(String json) throws Exception {
            var request = HttpRequest.newBuilder(URI.create("http://localhost:" + port + "/orders"))
                .header("Content-Type", "application/json")
                .POST(HttpRequest.BodyPublishers.ofString(json))
                .build();
            return http.send(request, HttpResponse.BodyHandlers.ofString());
        }

        private HttpResponse<String> get(String path) throws Exception {
            return http.send(HttpRequest.newBuilder(URI.create("http://localhost:" + port + path)).build(), HttpResponse.BodyHandlers.ofString());
        }

        @Test
        void placingAnOrderReturns201WithItsLocation() throws Exception {
            var response = post("{\"customer\":\"Ama\",\"totalPence\":1250}");

            assertEquals(201, response.statusCode());
            assertEquals("/orders/o-1", response.headers().firstValue("Location").orElseThrow());
            assertEquals("{\"id\":\"o-1\",\"customer\":\"Ama\",\"totalPence\":1250,\"placedAt\":\"2026-11-13T07:30:00Z\"}", response.body());
        }

        @Test
        void aPlacedOrderCanBeReadBack() throws Exception {
            var location = post("{\"customer\":\"Kofi\",\"totalPence\":450}").headers().firstValue("Location").orElseThrow();

            var response = get(location);

            assertEquals(200, response.statusCode());
            assertTrue(response.body().contains("\"customer\":\"Kofi\""));
        }

        @ParameterizedTest
        @CsvSource({ "'', 1250", "Ama, 0" })
        void invalidOrdersAreRefused(String customer, int totalPence) throws Exception {
            var response = post("{\"customer\":\"" + customer + "\",\"totalPence\":" + totalPence + "}");

            assertEquals(400, response.statusCode());
        }

        @Test
        void anUnknownOrderIs404() throws Exception {
            assertEquals(404, get("/orders/o-999").statusCode());
        }
    }
