- question: What does the test pyramid recommend?
  options:
  - Many unit tests, fewer integration tests, few end-to-end tests
  - Mostly end-to-end tests
  answer: 0
  explanation: Cost and flakiness rise towards the top.
- question: Which test double records how it was called for later checking?
  options:
  - A spy
  - A dummy
  answer: 0
  explanation: A stub returns canned answers; a fake is a working simplified implementation.
- question: Why are heavily mocked tests of internal calls a problem?
  options:
  - They break on every refactoring and miss real integration bugs
  - They run too slowly
  answer: 0
  explanation: Check outcomes at boundaries instead.
- question: Why use Testcontainers rather than an in-memory database substitute?
  options:
  - Substitutes behave differently from the real database
  - In-memory databases are slower
  answer: 0
  explanation: Test SQL, constraints and drivers against the real thing.
- question: What does mutation testing measure?
  options:
  - Whether the tests notice small changes to the code
  - How much of the code the tests run
  answer: 0
  explanation: Surviving mutants show what no test checks.
- question: What does a property-based testing library do when it finds a failing input?
  options:
  - Shrinks it to the smallest input that still fails
  - Retries until it passes
  answer: 0
  explanation: Small counterexamples are easy to understand.
