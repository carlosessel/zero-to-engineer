- question: "Which model does Anthropic suggest starting with for most work (November 2026)?"
  options:
    - "Claude Haiku 5.5"
    - "Claude Opus 5.5"
    - "Claude Fable 5.2"
  answer: 1
  explanation: "The models overview suggests Opus 5.5 for most workloads, Fable 5.2 for the hardest, and Sonnet or Haiku where speed and cost matter more."
- question: "A request on Opus 5.5 ($4 in, $20 out per million tokens) sends 10,000 tokens and gets 1,000 back. What does it cost?"
  options:
    - "$0.06"
    - "$0.24"
    - "$0.04"
  answer: 0
  explanation: "10,000 × 4 ÷ 1,000,000 = $0.04, plus 1,000 × 20 ÷ 1,000,000 = $0.02."
- question: "You want shorter replies. What should you change?"
  options:
    - "Lower the effort"
    - "Ask for shorter replies in the prompt"
    - "Switch to a larger model"
  answer: 1
  explanation: "Effort controls how thoroughly the model works, and barely changes visible length. Ask for the length you want."
- question: "Which is usually the cheapest way to cut the cost of a job that can wait a few hours for its results?"
  options:
    - "Send it as a batch, at half price"
    - "Use max effort so it finishes faster"
    - "Split each request in two"
  answer: 0
  explanation: "Batch requests are 50% off. Check batching and prompt caching before downgrading the model."
- question: "In Claude Code, how do you change the model during a session?"
  options:
    - "/model"
    - "Restart the computer"
    - "Edit the system prompt"
  answer: 0
  explanation: "/model opens a picker, and /model opus (or sonnet, haiku, fable) switches directly. /effort sets the effort level."
- question: "Why should you measure on real examples before switching a product to a cheaper model?"
  options:
    - "Prices change daily"
    - "A cheaper model may get more answers wrong, and that can cost more than it saves"
    - "Cheaper models have smaller context windows"
  answer: 1
  explanation: "Quality differences only show on your own tasks. Compare quality, speed and cost together."
