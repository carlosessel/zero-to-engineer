# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: bash
  check: shell
  needs: network
  script: |
    npm create vite@latest my-react-app -- --template react --no-interactive
    cd my-react-app
    npm install
    # `npm run dev` runs until stopped, so the check builds the project instead, which compiles the same files.
    npm run build
    test -f dist/index.html
  note: Creates the real starter project from the internet, installs it and builds it.
- block: 2
  lang: jsx
  check: shell
  needs: network
  script: |
    npm create vite@latest my-react-app -- --template react --no-interactive
    diff my-react-app/src/main.jsx "$BLOCK"
  note: The block must match the main.jsx that Vite's React starter creates, line for line.
