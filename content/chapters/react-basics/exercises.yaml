- title: "Do this"
  items:
    - key: x1
      text: "Create a React project with npm create vite@latest, start it with npm run dev, and change the text in src/App.jsx to see the page update"
    - key: x2
      text: "Build the bakery menu from this chapter in your own project, with each component in its own file, exported and imported"
    - key: x3
      text: "Remove a key from a list and find React's warning in the browser's developer tools console, then put it back"
    - key: x4
      text: "Make a profile page for yourself or a made-up person from components: a header, a list of skills from an array, and a section of links, each a component with props"
    - key: x5
      text: "Rebuild one page you made in the HTML and CSS part of the course as React components, keeping the same HTML elements and accessibility"
