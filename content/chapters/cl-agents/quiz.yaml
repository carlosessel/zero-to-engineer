- question: What distinguishes an agent from a workflow?
  options:
  - An agent uses a bigger model
  - An agent decides its own next steps; a workflow follows paths fixed in code
  answer: 1
  explanation: Start with the simplest that works.
- question: 'Which pattern fits: classify support emails, then send each kind to a specialised prompt?'
  options:
  - Routing
  - Evaluator–optimiser
  - Orchestrator–workers
  answer: 0
  explanation: Routing sends distinct kinds of input to specialised handling.
- question: Why does an agent loop need a step limit?
  options:
  - To save memory
  - So a confused agent cannot loop, and spend, for ever
  answer: 1
  explanation: Also cap cost, and report when the limit is hit.
- question: The model asks to place an order for more items than exist. Where should that be prevented?
  options:
  - In the tool's code
  - In the system prompt only
  answer: 0
  explanation: The model proposes; your code decides what actually happens.
- question: Roughly how many more tokens did Anthropic's multi-agent research system use than chat?
  options:
  - About twice
  - About fifteen times
  answer: 1
  explanation: Use multi-agent designs for valuable, parallel tasks.
