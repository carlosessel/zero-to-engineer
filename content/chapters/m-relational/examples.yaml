# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  note: Timings vary; the check asserts the plans, the answer, and that the index is at least 100 times faster.
  verify: |
    import re
    assert "plan: ['SCAN orders']" in out
    assert "plan: ['SEARCH orders USING INDEX idx_orders_customer (customer_id=?)']" in out
    assert 'same answer: True (15, 56660)' in out
    m = re.search(r'without index: ([\d.]+) ms per query, with index: ([\d.]+) ms', out)
    assert float(m.group(1)) >= 100 * max(float(m.group(2)), 0.001), m.groups()
