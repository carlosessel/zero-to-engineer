- title: Do this
  items:
  - key: x1
    text: Run EXPLAIN (or EXPLAIN ANALYZE) on the five most frequent queries of an application and add or remove indexes
  - key: x2
    text: Reproduce a lost update with two database sessions, then fix it three ways
  - key: x3
    text: Find out your production database's default isolation level and whether your code depends on it
  - key: x4
    text: Check how many connections your application opens and size its pool with Little's law
