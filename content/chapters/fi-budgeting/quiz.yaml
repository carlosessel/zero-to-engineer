- question: "Kofi's net pay is GH₵ 5,000 and his needs cost GH₵ 3,900 a month. What does the 50/30/20 rule tell him?"
  options:
    - "His needs are 78% of pay, far above 50%; the rule is a direction to move towards, not something he can meet this month"
    - "He must cut his needs to GH₵ 2,500 this month"
    - "He should spend GH₵ 1,500 on wants anyway"
    - "The rule does not apply to anyone earning GH₵ 5,000"
  answer: 0
  explanation: "3,900 ÷ 5,000 = 78%. Where needs are that high, the rule cannot be met by cutting wants; it is useful as a check and a long-term direction."
- question: "What makes a budget zero-based?"
  options:
    - "Every unit of income is assigned a job, including saving, until nothing is unassigned"
    - "You spend nothing on wants"
    - "You aim to have zero money in your account at the end of the month by spending it all"
    - "You start each year with zero savings"
  answer: 0
  explanation: "Zero refers to the unassigned amount: income minus everything assigned equals zero. Savings is one of the assignments, so a zero-based budget is not about spending everything."
- question: "School fees of GH₵ 3,000 are due once a term, three terms a year. What is the sensible monthly amount to set aside?"
  options:
    - "GH₵ 750"
    - "GH₵ 1,000"
    - "GH₵ 3,000"
    - "GH₵ 250"
  answer: 0
  explanation: "3 × 3,000 = 9,000 a year; 9,000 ÷ 12 = 750 a month. GH₵ 1,000 is one term's fees spread over three months, which only works if the terms are evenly spaced and you start on time."
- question: "Halfway through the month, Esi's eating-out envelope is empty but she has a dinner planned. What does the envelope method suggest?"
  options:
    - "Move money from another variable category, and spend less there"
    - "Pay with a credit card and sort it out next month"
    - "Take it from the rent money"
    - "Abandon the budget for this month"
  answer: 0
  explanation: "Moving money between wants keeps total spending within income. Borrowing starts next month in a hole, and rent is a need that must be paid."
- question: "Why move savings out on pay day rather than saving what is left at the end of the month?"
  options:
    - "Money left in a spending account tends to get spent, so planned saving happens only if it is moved first"
    - "Banks pay more interest on money moved on pay day"
    - "It is a legal requirement"
    - "There is no difference"
  answer: 0
  explanation: "Leftovers vanish into small purchases, as Ama's GH₵ 120 did. Paying yourself first makes saving a fixed cost rather than an afterthought."
- question: "Transport was budgeted at GH₵ 400 and GH₵ 460 was spent, for the third month in a row. What is the best response?"
  options:
    - "Raise the transport budget and take the difference from another category"
    - "Keep the budget at 400 and try harder"
    - "Stop tracking transport"
    - "Borrow GH₵ 60 each month"
  answer: 0
  explanation: "A category that overruns every month shows the plan is unrealistic. A budget should describe what you will really do, rebalanced so the total still fits."
