- title: Do this
  items:
    - key: x1
      text: "Track every payment you (or a made-up person) make for one week, including cash and mobile money, and sort them into categories, needs and wants."
    - key: x2
      text: "List every cost that does not come monthly (fees, insurance, festivals, licences) and work out the monthly amount for each sinking fund."
    - key: x3
      text: "Build a zero-based budget in a spreadsheet for one month, with a check cell that shows income minus everything assigned, and make it reach zero."
    - key: x4
      text: "Add Actual and Difference columns to your budget sheet, fill them in at the end of the month, and write one change you will make next month."
    - key: x5
      text: "Work out your needs, wants and savings as percentages of net pay and compare them with 50/30/20."
