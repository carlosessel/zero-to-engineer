# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  verify: |
    import re
    lines = out.splitlines()
    assert lines[0] == '57fac0e236f3903a9be09f2adc66cf1aef1d264805aeffb83819fcc885c72025', lines[0]
    bits = int(re.search(r'bits that differ: (\d+) of 256', out).group(1))
    assert 100 <= bits <= 156, bits
    assert 'same input, same digest: True' in out
- block: 2
  lang: python
  check: python
  note: Hashes are salted and timings vary; the check asserts the settings, the behaviour and that Argon2id is at least 1,000 times slower than SHA-256.
  verify: |
    import re
    assert 'stored: argon2id m=65536,t=3,p=4' in out and 'same password hashed twice differs: True' in out
    assert 'wrong password -> rejected' in out and 'right password -> True' in out
    ratio = int(re.search(r'about ([\d,]+) times', out).group(1).replace(',', ''))
    assert ratio >= 1000, ratio
- block: 3
  lang: python
  check: python
  output: |
    ciphertext bytes: 47 (31 of data + 16 of authentication tag)
    decrypted: card ending 4242, expires 09/29
    tampered ciphertext -> rejected
    wrong customer -> rejected
- block: 4
  lang: python
  check: python
  output: |
    signature bytes: 64 - verified with the public key
    changed release -> signature invalid
- block: 5
  lang: python
  check: python
  output: |
    True True False
