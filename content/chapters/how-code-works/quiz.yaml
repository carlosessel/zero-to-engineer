- question: "What is a program?"
  options:
    - "A text file of step-by-step instructions the computer follows"
    - "A kind of computer chip"
    - "A website"
  answer: 0
  explanation: "Code is text. The computer follows it exactly, one step at a time."
- question: "In AI, what is a “model”?"
  options:
    - "A robot"
    - "A file of learned numbers plus a recipe for using them"
    - "A programming language"
  answer: 1
  explanation: "Training finds good numbers. Using the model applies them to new input."
- question: "Your code shows an error. What does that mean?"
  options:
    - "You have damaged the computer"
    - "Something normal happened: read the message, fix, run again"
    - "You should start over"
  answer: 1
  explanation: "Errors are everyday feedback, not disasters."
