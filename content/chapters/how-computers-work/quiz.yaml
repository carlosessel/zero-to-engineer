- question: "What happens to data in memory (RAM) when the power goes off?"
  options:
    - "It is saved automatically"
    - "It is lost"
    - "It moves to the processor"
  answer: 1
  explanation: "RAM is working space. Storage is what persists."
- question: "What does an interpreter do?"
  options:
    - "Runs source code line by line"
    - "Stores files"
    - "Connects to the internet"
  answer: 0
  explanation: "Python is interpreted. A compiler translates the whole program ahead of time."
- question: "How many bits are in a byte?"
  options:
    - "2"
    - "8"
    - "1,000"
  answer: 1
  explanation: "Eight bits, giving 256 possible values."
