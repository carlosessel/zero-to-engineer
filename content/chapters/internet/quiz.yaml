- question: "What does DNS do?"
  options:
    - "Encrypts traffic"
    - "Turns a domain name into an IP address"
    - "Stores web pages"
  answer: 1
  explanation: "It is the phone book of the internet."
- question: "A response has status 404. What does that mean?"
  options:
    - "Success"
    - "Not found"
    - "The server crashed"
  answer: 1
  explanation: "Codes in the 400s mean the request was wrong. 500s mean the server failed."
