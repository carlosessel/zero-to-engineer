- question: "Why is there nothing to anchor the price of an unbacked cryptocurrency like Bitcoin?"
  options:
    - "It pays no dividends, interest or rent, so there are no cash flows to value; its price is whatever buyers will pay"
    - "Its supply changes every day"
    - "It is illegal to sell"
    - "Its price is set by central banks"
  answer: 0
  explanation: "Shares, bonds and property can be valued as the present value of their cash flows. Without cash flows, value rests only on demand."
- question: "With 5 times leverage, what price fall wipes out your own money?"
  options:
    - "20%"
    - "5%"
    - "50%"
    - "100%"
  answer: 0
  explanation: "Your money is one fifth of the position, so a 20% fall in the position's value loses all of it."
- question: "A company's support agent asks for your wallet's seed phrase to fix a problem. What is true?"
  options:
    - "No genuine support team ever asks for it; anyone with it can take all your coins"
    - "You should give it, because they need it to help"
    - "It is safe to share as long as it is by email"
    - "It only reveals your balance"
  answer: 0
  explanation: "The seed phrase is the master key to a self-custody wallet. Requests for it are always attempts at theft."
- question: "What happened to customers when the exchange FTX collapsed in 2022?"
  options:
    - "Many could not withdraw their money, because the exchange held it and had used it"
    - "Their coins were automatically returned by the blockchain"
    - "A deposit protection scheme repaid them in full"
    - "Nothing, because exchanges cannot fail"
  answer: 0
  explanation: "On a custodial exchange, you depend on the firm. When it fails, there is usually no protection scheme to repay you."
- question: "Which is a risk of holding a dollar stablecoin for someone who spends in cedis?"
  options:
    - "If the cedi strengthens against the dollar, the holding loses value in cedis"
    - "Stablecoins pay high interest that is taxed"
    - "Its value in dollars rises every day"
    - "There is no risk; stablecoins are guaranteed"
  answer: 0
  explanation: "Even if the coin stays at one dollar, its cedi value moves with the exchange rate. Stablecoins can also lose their link to the dollar."
- question: "After losing money to a fake crypto platform, you are contacted by someone offering to recover it for a fee. What is this most likely to be?"
  options:
    - "A recovery scam"
    - "A government compensation scheme"
    - "A normal service from your bank"
    - "The platform refunding you"
  answer: 0
  explanation: "Fraudsters target people who have already lost money. Report the original fraud to the police and the regulator instead."
