- title: Do this
  items:
    - key: x1
      text: "Find the price history of one large cryptocurrency over five years. Work out its maximum drawdown and compare it with a share index's over the same period."
    - key: x2
      text: "Check your country's regulator for its list of registered or licensed crypto providers, and look up whether a platform you have heard of is on it."
    - key: x3
      text: "Find three crypto adverts or messages (social media, chat groups). For each, list the red flags from this chapter."
    - key: x4
      text: "Write down, in your own words, what you would do differently with custodial and self-custody holdings, and where you would keep a seed phrase."
