- question: Where should a team's Claude Code permission rules live?
  options:
  - In each person's head
  - In .claude/settings.json, committed and reviewed like code
  answer: 1
  explanation: Shared, versioned set-up spreads good practice.
- question: What do managed settings add?
  options:
  - Nothing
  - Organisation-wide rules that projects and individuals cannot override
  answer: 1
  explanation: Use them for the few rules that must hold everywhere.
- question: In a review, the author says 'Claude wrote it' about a confusing function. What should happen?
  options:
  - Approve it
  - The author should understand and be able to explain every line before it merges
  answer: 1
  explanation: AI-written code is still the team's code.
- question: Which session set-up is most exposed to prompt injection?
  options:
  - One that reads only your own code
  - One that reads public issues and can push code and run any command
  answer: 1
  explanation: Separate untrusted input from powerful actions.
- question: What should a team measure to judge whether Claude Code helps?
  options:
  - Lines of code generated
  - Outcomes such as lead time, incidents and reverted changes
  answer: 1
  explanation: Usage is not value.
