- question: Which search finds the fewest hops in an unweighted graph?
  options:
  - DFS
  - BFS
  answer: 1
  explanation: It visits vertices in order of distance.
- question: What does a topological sort give?
  options:
  - The shortest path
  - An order in which every task comes after its dependencies
  answer: 1
  explanation: Only possible for DAGs.
- question: Why does Dijkstra fail with negative weights?
  options:
  - It is too slow
  - It treats a settled distance as final, which a later negative edge could improve
  answer: 1
  explanation: Use Bellman–Ford.
- question: Which structure answers 'are these two accounts in the same group?' as links are added?
  options:
  - Union-find
  - A heap
  answer: 0
  explanation: Almost constant time per operation.
- question: What must every graph search keep to avoid looping forever?
  options:
  - A visited set
  - A sorted list
  answer: 0
  explanation: Cycles otherwise trap the search.
