# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    'page2'
    'job1'
  verify: |
    assert ns['stack'] == ['page1'] and list(ns['queue']) == ['job2']
    g = ns['graph']
    assert all(a in g[b] for a in g for b in g[a]), 'every road should go both ways'
