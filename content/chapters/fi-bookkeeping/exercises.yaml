- title: Do this
  items:
    - key: x1
      text: "Set up a sheet with columns Date, Account, Description, Category and Amount, and record one full week of your (or a made-up person's) money across bank, mobile money and cash."
    - key: x2
      text: "Add SUMIF totals for each category and each account, and check that your transfers sum to zero."
    - key: x3
      text: "Reconcile one month of one account against its statement. List each difference and its kind: unrecorded item, timing, error or suspicious."
    - key: x4
      text: "Make a dated folder for receipts and photograph this month's important ones into it."
