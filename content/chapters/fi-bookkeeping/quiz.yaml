- question: "Ama takes GH₵ 300 out of her bank account as cash and later spends it on food. How should her books show this?"
  options:
    - "A transfer of 300 from bank to cash, then food spending of 300 from cash"
    - "Spending of 300 from the bank and spending of 300 from cash"
    - "Only the food spending, nothing for the withdrawal"
    - "Only the withdrawal, as food"
  answer: 0
  explanation: "The withdrawal moves money between her own accounts, so it is a transfer that nets to zero. Only the food is spending. Recording both as spending counts the same 300 twice."
- question: "Her record shows GH₵ 1,500 and her statement GH₵ 1,480. The statement includes a GH₵ 20 monthly fee she did not record. What should she do?"
  options:
    - "Add the 20 fee to her record; the two then agree"
    - "Change her record to 1,480 without finding out why"
    - "Ignore the difference, as it is small"
    - "Ask the bank to remove 20 from the statement"
  answer: 0
  explanation: "The fee explains the difference exactly. Recording it is the reconciliation. Changing figures without an explanation hides errors."
- question: "Kweku deposits GH₵ 400 on 31 March; it appears on his bank statement on 2 April. On his March reconciliation, this is:"
  options:
    - "A timing difference: in his record but not yet on the March statement"
    - "An error by the bank"
    - "A fee"
    - "Fraud"
  answer: 0
  explanation: "Real transactions near the end of a period often reach the statement a day or two later. Note them and check they appear next month."
- question: "In a sheet with categories in column D and amounts in column E (rows 2 to 50), which formula totals transport spending?"
  options:
    - "=SUMIF(D2:D50, \"Transport\", E2:E50)"
    - "=SUM(D2:D50)"
    - "=SUMIF(E2:E50, \"Transport\", D2:D50)"
    - "=COUNT(\"Transport\")"
  answer: 0
  explanation: "SUMIF checks the first range for the match and adds the matching rows of the third range. Swapping them checks the amounts for the word, which never matches."
- question: "A difference of GH₵ 90 between record and statement may be caused by swapping two digits. Which pair could it be?"
  options:
    - "120 recorded as 210"
    - "150 recorded as 105"
    - "47 recorded as 74"
    - "36 recorded as 63"
  answer: 0
  explanation: "210 − 120 = 90. The others differ by 45, 27 and 27. Swapped digits always give a difference divisible by 9, which is why that is a useful clue."
- question: "Why should a self-employed tailor keep business money in a separate account?"
  options:
    - "So she can see what the business really earns and spends, and keep reliable tax records"
    - "Because mixing them is always illegal"
    - "Because banks charge less for business accounts"
    - "So that she pays no tax"
  answer: 0
  explanation: "Mixed money makes the business's profit invisible and tax returns unreliable. A separate account fixes both."
