- question: What should you write first for an unfamiliar problem?
  options:
  - The optimal solution
  - A correct brute force
  answer: 1
  explanation: It proves understanding and gives a test oracle.
- question: A problem has n up to 10^6. Which complexity is acceptable?
  options:
  - O(n²)
  - O(n log n)
  answer: 1
  explanation: About 10^8 simple steps a second.
- question: The problem mentions dependencies between tasks. Which pattern?
  options:
  - Sliding window
  - Topological sort
  answer: 1
  explanation: Dependencies form a graph.
- question: What do interviewers assess besides a correct answer?
  options:
  - Communication, testing and complexity
  - Typing speed
  answer: 0
  explanation: Think aloud and test your code.
