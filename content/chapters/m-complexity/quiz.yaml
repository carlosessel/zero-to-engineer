- question: Doubling the input quadruples the running time. What is the complexity?
  options:
  - O(n)
  - O(n²)
  - O(log n)
  answer: 1
  explanation: (2n)² = 4n².
- question: Why can a loop containing array.includes() be O(n²)?
  options:
  - includes is O(1)
  - includes scans the array, so it is O(n) inside an O(n) loop
  answer: 1
  explanation: Build a set first.
- question: Appending to a dynamic array is O(1) amortised. What does that mean?
  options:
  - Every append is O(1)
  - Any sequence of k appends costs O(k), though a single one may cost O(n)
  answer: 1
  explanation: Occasional resizes are spread over many cheap appends.
- question: When should you trust Big O alone to choose between two implementations?
  options:
  - Always
  - To spot disasters and pick an approach; measure to choose between good options at your sizes
  answer: 1
  explanation: Constants, caches and real inputs matter.
- question: What is the space complexity of recursion n calls deep?
  options:
  - O(1)
  - O(n), for the stack frames
  answer: 1
  explanation: Each pending call keeps a frame.
