- question: What does a solution file do?
  options:
  - Groups several projects so they build, test and open together
  - Replaces the project files
  answer: 0
  explanation: Each project still has its own .csproj.
- question: Which project should reference which?
  options:
  - The test project references the library
  - The library references the test project
  answer: 0
  explanation: Dependencies point from tests and the API towards the core.
- question: What is the difference between [Fact] and [Theory]?
  options:
  - A theory runs once for each [InlineData] row
  - A fact can only test exceptions
  answer: 0
  explanation: Use theories for many inputs, especially boundaries.
- question: Why watch a new test fail before making it pass?
  options:
  - To prove it actually tests the behaviour
  - Because xUnit requires it
  answer: 0
  explanation: A test that never fails tells you nothing.
- question: Which command adds a NuGet package to a project?
  options:
  - dotnet add package NAME
  - dotnet new package NAME
  answer: 0
  explanation: It adds a PackageReference to the project file.
- question: What does a Directory.Build.props file do?
  options:
  - Applies shared settings to every project in the folders below it
  - Lists the files to compile
  answer: 0
  explanation: Teams use it, for example, to treat warnings as errors.
