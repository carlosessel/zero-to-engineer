- question: Why use structured (JSON) logs?
  options:
  - Tools can filter and aggregate by any field
  - They are shorter
  answer: 0
  explanation: Add a correlation id to every line.
- question: What does RED stand for?
  options:
  - Rate, errors, duration
  - Requests, events, data
  answer: 0
  explanation: Use it for every service; USE for resources.
- question: Why is a user id a bad metric label?
  options:
  - Each distinct value creates a new time series
  - Labels cannot contain numbers
  answer: 0
  explanation: Keep cardinality low; put ids in logs and traces.
- question: What links spans across services into one trace?
  options:
  - Context propagation, such as the W3C traceparent header
  - Matching timestamps
  answer: 0
  explanation: Propagate it through message headers too.
- question: What is OpenTelemetry?
  options:
  - A vendor-neutral standard for producing traces, metrics and logs
  - A monitoring vendor
  answer: 0
  explanation: Instrument once, export anywhere.
- question: What should page an on-call engineer?
  options:
  - Symptoms users feel, such as fast SLO burn
  - CPU above 80%
  answer: 0
  explanation: Causes belong on dashboards.
