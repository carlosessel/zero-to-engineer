# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: text
  check: illustration
  note: The output all three implementations print; each one's check looks for these lines.
- block: 2
  lang: csharp
  check: csharp
  output_contains: &id001
  - 'request for o-1 answered at once; receipt queued

    request for o-2 answered at once; receipt queued

    request for o-3 answered at once; receipt queued'
  - '  receipt for o-1 sent (attempt 1)'
  - '  receipt for o-2 failed: email service timed out; retrying in 100 ms'
  - '  receipt for o-2 failed: email service timed out; retrying in 200 ms'
  - '  receipt for o-2 sent (attempt 3)'
  - '  receipt for o-3 sent (attempt 1)'
  - '  report run 1'
  - '  report run 2'
  - stopped cleanly
- block: 3
  lang: java
  check: shell
  needs: network
  script: |
    GRADLE=$(command -v gradle || ls -d "$HOME"/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*/bin/gradle 2>/dev/null | tail -1)
    mkdir sp && cd sp
    echo 'rootProject.name = "bakery-jobs"' > settings.gradle.kts
    mkdir -p $(dirname build.gradle.kts)
    cat > build.gradle.kts <<'SRC_EOF'
    plugins {
        java
        id("org.springframework.boot") version "4.1.2"
        id("io.spring.dependency-management") version "1.1.7"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation("org.springframework.boot:spring-boot-starter")
    }
    SRC_EOF
    mkdir -p $(dirname src/main/resources/application.properties)
    cat > src/main/resources/application.properties <<'SRC_EOF'
    spring.main.banner-mode=off
    logging.level.root=warn
    spring.threads.virtual.enabled=true
    SRC_EOF
    mkdir -p src/main/java/com/bakery
    cp "$BLOCK" src/main/java/com/bakery/BakeryJobs.java
    "$GRADLE" --no-daemon -q bootJar
    java -jar build/libs/bakery-jobs.jar
  output_contains: *id001
- block: 4
  lang: ts
  check: shell
  script: |
    cp "$BLOCK" worker.ts
    node worker.ts
  output_contains: *id001
- block: 5
  lang: ts
  check: not-run
  reason: BullMQ needs a Redis server, and the snippet needs a sendReceipt function; the options are from BullMQ's documentation on retries and job ids.
