- question: "What does a JOIN do?"
  options:
    - "Deletes duplicate rows"
    - "Combines matching rows from two tables"
    - "Creates a table"
  answer: 1
  explanation: "Joins follow foreign keys to bring related data together."
- question: "How do you prevent SQL injection?"
  options:
    - "Pass values as parameters, never glue user text into the query"
    - "Use longer table names"
    - "Hide the database"
  answer: 0
  explanation: "Parameters are treated as data, never as SQL."
