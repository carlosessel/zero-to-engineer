- question: "Why create a virtual environment per project?"
  options:
    - "It makes Python run faster"
    - "It keeps each project’s packages separate so versions do not clash"
    - "It is required to use a GPU"
  answer: 1
  explanation: "Isolation avoids version conflicts between projects."
- question: "Where should an API key live?"
  options:
    - "In the source code"
    - "In a .env file or secrets manager, kept out of Git"
    - "In the README"
  answer: 1
  explanation: "Keys committed to Git get stolen. Keep them in environment variables."
