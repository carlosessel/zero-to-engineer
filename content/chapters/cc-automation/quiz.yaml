- question: What is the first question before leaving a task unattended?
  options:
  - Which model is cheapest
  - Does it know what done looks like?
  answer: 1
  explanation: 'Then: can it check itself, what may it touch, what stops it, who signs off.'
- question: Which flags make a script run safe when nobody can answer prompts?
  options:
  - --permission-mode dontAsk with --allowedTools
  - --dangerously-skip-permissions on your laptop
  answer: 0
  explanation: Pre-approve exactly what is needed and refuse the rest.
- question: Where does the API key for the GitHub Action go?
  options:
  - In the workflow file
  - In a repository secret
  answer: 1
  explanation: Never commit keys.
- question: Should automation be allowed to merge its own pull requests?
  options:
  - Yes, if tests pass
  - 'No: keep a person approving; auto mode itself blocks merging unapproved pull requests'
  answer: 1
  explanation: Tests passing is not proof of correctness or safety.
