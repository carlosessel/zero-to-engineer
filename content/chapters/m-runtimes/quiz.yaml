- question: Why is a Java service slower in its first minute?
  options:
  - The disk is cold
  - 'Warm-up: the JIT is still compiling and optimising hot code'
  - Garbage collection is off
  answer: 1
  explanation: Runtimes interpret first, then compile hot methods.
- question: What does javac produce?
  options:
  - Machine code
  - Java bytecode in .class files
  answer: 1
  explanation: The JVM runs and JIT-compiles the bytecode.
- question: Which helps a short-lived .NET function start fastest?
  options:
  - Tiered compilation
  - Native AOT
  - More warm-up
  answer: 1
  explanation: No JIT at run time, at the cost of some restrictions.
- question: Do TypeScript types check data at run time?
  options:
  - 'Yes'
  - 'No: they are erased when compiled to JavaScript'
  answer: 1
  explanation: Validate external data yourself.
- question: What is deoptimisation?
  options:
  - Turning off the JIT
  - Discarding optimised code when its assumptions turn out false
  answer: 1
  explanation: For example when an unexpected type appears.
