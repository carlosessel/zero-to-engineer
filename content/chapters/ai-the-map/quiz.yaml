- question: "Which best describes an AI engineer’s main work?"
  options:
    - "Inventing new neural network architectures"
    - "Building working products on top of existing models"
    - "Labelling training data"
  answer: 1
  explanation: "Researchers invent architectures. AI engineers turn existing models into reliable features."
- question: "Where is most of the difficulty in an AI product?"
  options:
    - "The single line that calls the model"
    - "Getting the right data in, checking output, handling failures"
    - "Choosing a programming language"
  answer: 1
  explanation: "The call is easy. Context, evaluation and failure handling are the job."
