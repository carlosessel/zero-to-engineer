- title: Do this
  items:
  - key: x1
    text: Write characterisation tests for one untested function, then refactor it in small steps, running them after each
  - key: x2
    text: Use your editor's automated extract function, rename and inline on real code
  - key: x3
    text: Find two smells from the table in a codebase you know and apply the matching refactoring
  - key: x4
    text: Make one refactoring commit and one behaviour-change commit for the same task, and compare how easy each is to review
