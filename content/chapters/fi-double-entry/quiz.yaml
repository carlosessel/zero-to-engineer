- question: "A business pays GH₵ 1,200 of rent from its bank account. Which entry is right?"
  options:
    - "Debit Rent 1,200; credit Bank 1,200"
    - "Debit Bank 1,200; credit Rent 1,200"
    - "Credit Rent 1,200 only"
    - "Debit Rent 1,200; debit Bank 1,200"
  answer: 0
  explanation: "An expense increases with a debit, and an asset (bank) decreases with a credit. Every entry needs equal debits and credits."
- question: "Why does your bank statement show a deposit as a credit, when your own books record it as a debit?"
  options:
    - "The statement is written from the bank's side, where your deposit is money it owes you, a liability that increases with a credit"
    - "Banks use a different system from businesses"
    - "One of them is a mistake"
    - "Credits always mean money in, everywhere"
  answer: 0
  explanation: "Both follow the same rules. To the bank your money is a liability; to you it is an asset. The same event is a credit in one set of books and a debit in the other."
- question: "Akosua finishes a GH₵ 900 order in March; the customer pays in April. Under accrual accounting, when is the sale recorded?"
  options:
    - "March, when the work was done, with a receivable until the cash arrives"
    - "April, when the cash arrives"
    - "Half in March and half in April"
    - "Never, because it was on credit"
  answer: 0
  explanation: "Accrual accounting records income when it is earned. Cash accounting would wait for April."
- question: "A trial balance agrees. Which error could it still contain?"
  options:
    - "A transaction that was never recorded at all"
    - "A debit of 500 posted with a credit of 50"
    - "A transaction recorded on the debit side only"
    - "A balance copied as 4,100 in one column and 1,400 in the other"
  answer: 0
  explanation: "A missing transaction changes neither column, so the totals still agree. The other errors make the debits and credits differ."
- question: "Which of these increases with a credit?"
  options:
    - "Sales"
    - "Equipment"
    - "Rent expense"
    - "Receivables"
  answer: 0
  explanation: "Income, liabilities and equity increase with credits. Equipment and receivables are assets, and rent is an expense; all three increase with debits."
- question: "Akosua's business made a profit of GH₵ 2,300 in its first month, but its bank balance is GH₵ 900 below the GH₵ 5,000 she put in. Which is NOT part of the explanation?"
  options:
    - "Rent is not counted in profit"
    - "GH₵ 3,200 of cash went into equipment"
    - "Customers still owe GH₵ 300"
    - "She still owes the supplier GH₵ 300, which helps cash"
  answer: 0
  explanation: "Rent is counted in profit, as an expense. The equipment, the unpaid receivables and the unpaid supplier together explain the gap: 2,300 − 3,200 − 300 + 300 = −900."
