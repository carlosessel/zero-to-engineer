- title: Do this
  items:
    - key: x1
      text: "Write the journal for a made-up week of a small business you know (a kiosk, a phone repairer, a caterer): at least eight transactions, each with a debit, a credit and an amount."
    - key: x2
      text: "Post your journal to T-accounts on paper or in a spreadsheet, and draw up a trial balance. Make the totals agree."
    - key: x3
      text: "From your trial balance, write the income statement and balance sheet, and check that assets = liabilities + equity."
    - key: x4
      text: "Take one deposit and one payment from your bank statement and write how each would appear in the bank's books and in yours."
