- id: fi-double-entry-ledger
  title: Eight transactions into the ledger
  hint: Watch each transaction add a debit to one account and an equal credit to another, so the two totals stay equal all the way through.
  steps:
  - title: 1. Akosua puts in her savings
    text: Bank (an asset) goes up, so it is debited. Owner's capital (equity) goes up, so it is credited. Debits 5,000 = credits 5,000.
    vars:
      debit: Bank 5,000
      credit: Owner's capital 5,000
    parts:
    - kind: note
      id: n
      text: Dr Bank 5,000   /   Cr Owner's capital 5,000
      tone: active
    - kind: tables
      id: t
      slots: 9
      tables:
      - id: l
        title: ledger balances (GH₵)
        columns:
        - account
        - debit
        - credit
        rows:
        - k: Bank
          cells:
          - Bank
          - 5,000
          - ''
          tone: active
        - k: Owner's capital
          cells:
          - Owner's capital
          - ''
          - 5,000
          tone: active
        - k: tot
          cells:
          - Total
          - 5,000
          - 5,000
          tone: found
  - title: 2. Buys a sewing machine
    text: One asset up (equipment, debit), one asset down (bank, credit). The bank's debit balance falls to 1,800. Totals still agree.
