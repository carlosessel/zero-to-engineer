- id: be-auth-stacks-middleware-checks
  title: Seven calls through the checks
  hint: Each call passes through the route's middleware in order; watch which check stops it, and with which status code.
  language: TypeScript
  code: |
    async function authenticate(req: AuthedRequest, res: Response, next: NextFunction) {
      const header = req.headers.authorization ?? "";
      if (!header.startsWith("Bearer ")) {
        res.status(401).json({ title: "Sign in required", status: 401 });
        return;
      }
      try {
        const { payload } = await jwtVerify(header.slice(7), key, { issuer, audience, algorithms: ["HS256"] });
        req.user = payload as Claims;
        next();
      } catch {
        res.status(401).json({ title: "Invalid or expired token", status: 401 });
      }
    }

    function requireRole(role: string) {
      return (req: AuthedRequest, res: Response, next: NextFunction) => {
        if (req.user?.role !== role) {
          res.status(403).json({ title: "Forbidden", status: 403 });
          return;
        }
        next();
      };
    }

    app.get("/orders/:id", authenticate, (req: AuthedRequest, res: Response) => {
      const owner = orderOwners.get(String(req.params.id));
      if (!owner || (owner !== req.user!.sub && req.user!.role !== "staff")) {
        res.status(404).json({ title: "Not Found", status: 404 });
        return;
      }
      res.json({ id: req.params.id, owner });
    });

    app.get("/reports/sales", authenticate, requireRole("staff"), (_req: Request, res: Response) => {
      res.send("today: 42 orders");
    });
  steps:
    - title: Two routes, two chains
      text: Each route lists the functions a request passes through, in order. Orders need authenticate, then the handler. The sales report needs authenticate, then requireRole("staff"), then the handler.
      lines: [26, 35]
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { label: request, x: 0, y: 0.5 }
            - { label: authenticate, x: 0.3, y: 0.5 }
            - { label: requireRole, x: 0.62, y: 0.1 }
            - { label: sales handler, x: 0.88, y: 0.1 }
            - { label: orders handler, x: 0.88, y: 0.9 }
          edges:
            - { a: request, b: authenticate, directed: true }
            - { a: authenticate, b: requireRole, directed: true }
            - { a: requireRole, b: sales handler, directed: true }
            - { a: authenticate, b: orders handler, directed: true }
        - { kind: terminal, id: out, lines: [], slots: 7 }
    - title: No token
      text: "GET /orders/o-1 arrives with no Authorization header. authenticate stops it at once with 401: sign in first. The handler never runs."
      lines: [2, 3, 4, 5]
      vars: { call: "GET /orders/o-1", token: none }
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { label: request, x: 0, y: 0.5, tone: active }
            - { label: authenticate, x: 0.3, y: 0.5, tone: bad, note: "401" }
            - { label: requireRole, x: 0.62, y: 0.1, tone: dim }
            - { label: sales handler, x: 0.88, y: 0.1, tone: dim }
            - { label: orders handler, x: 0.88, y: 0.9, tone: dim }
          edges:
            - { a: request, b: authenticate, directed: true, tone: active }
            - { a: authenticate, b: requireRole, directed: true, tone: dim }
            - { a: requireRole, b: sales handler, directed: true, tone: dim }
            - { a: authenticate, b: orders handler, directed: true, tone: dim }
        - { kind: terminal, id: out, lines: ["  GET /orders/o-1 -> 401"], slots: 7 }
    - title: Ama's token is checked
      text: Now Ama sends her token. jwtVerify checks the signature, issuer, audience, expiry and that the algorithm is HS256. It passes, so her claims go on req.user and next() moves on.
      lines: [8, 9, 10]
      vars: { call: "GET /orders/o-1", "req.user.sub": ama@example.com, "req.user.role": customer }
      parts:
        - kind: graph
          id: g
          height: 220
          nodes:
            - { label: request, x: 0, y: 0.5, tone: done }
            - { label: authenticate, x: 0.3, y: 0.5, tone: found }
            - { label: requireRole, x: 0.62, y: 0.1, tone: dim }
            - { label: sales handler, x: 0.88, y: 0.1, tone: dim }
            - { label: orders handler, x: 0.88, y: 0.9, tone: active }
          edges:
            - { a: request, b: authenticate, directed: true, tone: done }
            - { a: authenticate, b: requireRole, directed: true, tone: dim }
            - { a: requireRole, b: sales handler, directed: true, tone: dim }
            - { a: authenticate, b: orders handler, directed: true, tone: active }
    - title: Her own order
      text: The handler looks up o-1's owner, ama@example.com, and compares it with the sub claim from the validated token. They match, so she gets 200 and the order.
      lines: [27, 28, 32]
      vars: { call: "GET /orders/o-1", "req.user.sub": ama@example.com, "req.user.role": customer, owner: ama@example.com }
      parts:
