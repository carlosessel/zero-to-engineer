            - { a: authenticate, b: requireRole, directed: true, tone: dim }
            - { a: requireRole, b: sales handler, directed: true, tone: dim }
            - { a: authenticate, b: orders handler, directed: true, tone: done }
        - { kind: terminal, id: out, lines: ["  GET /orders/o-1 -> 401", "  GET /orders/o-1 -> 200"], slots: 7 }
    - title: Someone else's order
      text: Ama asks for o-2, which belongs to Kofi. Her token is valid, but she is not the owner and not staff, so the answer is 404, as if the order did not exist. Checking only "signed in?" here would be an IDOR flaw.
      lines: [28, 29]
