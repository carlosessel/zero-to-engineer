    First line
    Second line
  verify: |
    assert ns['loaded'] == ns['student']
    assert (tmp / 'notes.txt').read_text() == 'First line\nSecond line\n'
- block: 6
  lang: text
  check: illustration
  note: 'Reproduced for real: a seven-line shop.py is run and Python''s own traceback is compared with the one shown.'
  verify: |
    import re, subprocess, sys
    (tmp / "shop.py").write_text("prices = {}\n" + "# filler\n" * 5 + 'print(prices["bread"])\n')
    real = subprocess.run([sys.executable, "shop.py"], cwd=tmp, capture_output=True, text=True).stderr
    strip = lambda t: [l.rstrip() for l in t.strip().splitlines()]
    real_lines = [re.sub(r'File ".*shop\.py"', 'File "shop.py"', l) for l in strip(real)]
    assert real_lines == strip(block), "\n".join(real_lines)
