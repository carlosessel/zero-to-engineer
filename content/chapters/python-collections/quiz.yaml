- question: "fruits = [\"mango\", \"banana\", \"orange\"]. What is fruits[-1]?"
  options:
    - "mango"
    - "orange"
    - "An error"
  answer: 1
  explanation: "Negative positions count from the end."
- question: "student = {\"name\": \"Ama\"}. How do you get Ama?"
  options:
    - "student[0]"
    - "student[\"name\"]"
    - "student.Ama"
  answer: 1
  explanation: "Dictionary values are looked up by key."
- question: "When reading a traceback, where do you look first?"
  options:
    - "The top line"
    - "The last line, which names the error"
    - "The middle"
  answer: 1
  explanation: "The last line says what went wrong; the lines above say where."
