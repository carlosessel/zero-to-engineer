- question: What is an invariant?
  options:
  - A rule about an object's state that must always hold, such as a balance never going below zero
  - A variable that never changes
  answer: 0
  explanation: Encapsulation exists to protect invariants.
- question: Why is a setter for every field a weak design?
  options:
  - Callers must each remember the rules, so nothing enforces them
  - Setters are slow
  answer: 0
  explanation: Expose behaviour such as withdraw, which checks the rules, rather than setBalance.
- question: Which is a value object?
  options:
  - A customer
  - An amount of money
  answer: 1
  explanation: Money is defined by its amount and currency; a customer keeps an identity while their details change.
- question: What does polymorphism replace?
  options:
  - Switches on a type field scattered through the code
  - Loops
  answer: 0
  explanation: Each class carries its own behaviour, so adding a type means adding a class.
- question: When is inheritance the right tool?
  options:
  - For a genuine "is a" relationship where the subclass can stand in anywhere for the base class
  - Whenever two classes share some code
  answer: 0
  explanation: For sharing code, composition is usually better.
- question: What should you default to, an interface or an abstract class?
  options:
  - An interface
  - An abstract class
  answer: 0
  explanation: Use an abstract class when related classes share real state and a common skeleton.
