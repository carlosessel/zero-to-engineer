- question: "Every element on a page is bold and a different bright colour. What is the problem?"
  options:
    - "Nothing stands out, because everything competes for attention"
    - "The page will load slowly"
    - "Bold text is not accessible"
  answer: 0
  explanation: "Hierarchy needs differences. When everything is emphasised, nothing is."
- question: "Why use a spacing scale such as 4, 8, 16, 24, 32?"
  options:
    - "It gives the page a consistent rhythm and saves deciding each value"
    - "Browsers only accept multiples of 8"
    - "It makes pages load faster"
  answer: 0
  explanation: "A few repeated values look deliberate; dozens of slightly different values look careless."
- question: "Roughly how long should lines of body text be for comfortable reading?"
  options:
    - "About 50 to 75 characters"
    - "As wide as the screen"
    - "About 15 characters"
  answer: 0
  explanation: "Long lines make it hard to find the start of the next line. max-width: 65ch keeps them in range."
- question: "How do you use a CSS variable named --color-accent?"
  options:
    - "color: --color-accent;"
    - "color: var(--color-accent);"
    - "color: $color-accent;"
  answer: 1
  explanation: "Custom properties are read with var(). They are usually defined on :root."
- question: "What does proximity tell the reader?"
  options:
    - "Things placed close together are related"
    - "Things placed close together are unimportant"
    - "Nothing; spacing is decoration"
  answer: 0
  explanation: "That is why a heading should sit closer to its own text than to the section above."
- question: "Which text should usually be centred?"
  options:
    - "Several paragraphs of body text"
    - "Short items such as a hero heading or a button label"
    - "Everything, for balance"
  answer: 1
  explanation: "Centred paragraphs make every line start somewhere different, which is hard to read."
