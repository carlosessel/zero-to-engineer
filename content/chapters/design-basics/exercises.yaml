- title: "Do this"
  items:
    - key: x1
      text: "Define colour and spacing variables on :root for your page and replace every hard-coded colour and spacing value with them"
    - key: x2
      text: "Limit your page's text to a readable line length with max-width in ch"
    - key: x3
      text: "Reduce your page to at most two typefaces, five font sizes and one accent colour"
    - key: x4
      text: "Inspect a site you admire and write down its font sizes, colours and spacing values"
