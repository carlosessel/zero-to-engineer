# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |2+

  verify: |
    assert abs(ns['cos'] - 1.0) < 0.001, ns['cos']
- block: 2
  lang: python
  check: python
  output: |2+

  verify: |
    p = ns['probs']
    assert [round(float(v), 2) for v in p] == [0.66, 0.24, 0.10], p
    assert abs(float(p.sum()) - 1) < 1e-9
    assert round(float(ns['loss']), 2) == 0.42, ns['loss']
