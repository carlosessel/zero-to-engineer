- question: "Two vectors have cosine similarity close to 1. They…"
  options:
    - "point in nearly the same direction"
    - "are perpendicular"
    - "have the same length"
  answer: 0
  explanation: "Cosine similarity measures direction, not length."
- question: "What does the gradient tell you during training?"
  options:
    - "How many layers to use"
    - "Which way to change each weight to change the loss"
    - "How much data you need"
  answer: 1
  explanation: "It is the slope of the loss with respect to every weight."
