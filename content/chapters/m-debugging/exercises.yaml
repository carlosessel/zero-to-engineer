- title: Do this
  items:
  - key: x1
    text: Set a breakpoint, a conditional breakpoint and a watch expression in your editor's debugger on a small program
  - key: x2
    text: Use git bisect run on a practice repository where you introduced a bug a few commits ago
  - key: x3
    text: Take one real bug and shrink it to a minimal reproduction, then turn that into a test
  - key: x4
    text: Write a short blameless postmortem for a bug you fixed recently
