- question: "A fund returns +30%, +25%, −30%, +20%, +15%. One investor holds throughout; another buys after the two good years and sells after the fall. Why does the second do so much worse?"
  options:
    - "They bought after the rises and sold after the fall, missing the recovery"
    - "They paid higher fees"
    - "They chose a different fund"
    - "They were taxed more"
  answer: 0
  explanation: "Same fund, different timing. Chasing returns and panic selling create the behaviour gap."
- question: "Loss aversion means…"
  options:
    - "a loss feels much worse than a gain of the same size feels good"
    - "people never take any risk"
    - "losses are taxed more than gains"
    - "investors always sell their losers"
  answer: 0
  explanation: "Losses weigh roughly twice as heavily, which leads to panic selling and holding losers to avoid admitting the loss."
- question: "Someone makes 10 round-trip trades a year, each costing 1%. Roughly what share of their money goes in costs each year?"
  options:
    - "About 9.6%"
    - "1%"
    - "0.1%"
    - "100%"
  answer: 0
  explanation: "1 − 0.99¹⁰ = 9.6%. Overconfidence leads to trading that costs far more than it seems."
- question: "Everyone you know is buying an asset whose price has tripled in a month. What is the most useful reaction?"
  options:
    - "Treat the excitement as a warning and ask what the asset actually produces"
    - "Buy quickly before it rises further"
    - "Borrow to buy more"
    - "Assume your friends know something you don't"
  answer: 0
  explanation: "Herding and hype drive bubbles. Value comes from what an asset produces, not from how fast its price rose."
- question: "Keeping GH₵ 5,000 in savings at 10% while owing GH₵ 5,000 on a card at 60% a year is an example of…"
  options:
    - "Mental accounting"
    - "Diversification"
    - "Rebalancing"
    - "Market timing"
  answer: 0
  explanation: "Treating the two pots separately costs about 50% a year on that money. Paying down the card is the better use of most of it."
- question: "Which is the most effective protection against behavioural mistakes?"
  options:
    - "A written plan made in calm conditions, with saving and rebalancing automated"
    - "Checking your investments every day"
    - "Following expert tips on social media"
    - "Moving to cash whenever news is bad"
  answer: 0
  explanation: "Knowing about biases helps a little; deciding in advance and making the right action automatic helps far more."
