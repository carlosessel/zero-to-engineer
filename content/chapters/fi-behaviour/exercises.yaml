- title: Do this
  items:
    - key: x1
      text: "Write a one-page investment plan: your allocation, what you buy, how often you invest and rebalance, and exactly what you will do if your investments fall 30%."
    - key: x2
      text: "Set up an automatic payday transfer for saving or investing, however small."
    - key: x3
      text: "Look back at one money decision you regret. Which bias from this chapter played a part, and what rule would have prevented it?"
    - key: x4
      text: "For a fund you know, compare its five-year return with what an investor who bought after its best year and sold after its worst would have earned."
