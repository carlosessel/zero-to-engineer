- id: fi-behaviour-chasing
  title: Holding against chasing
  hint: Esi and Kojo own the same fund. Only the timing of their decisions differs.
  steps:
  - title: The start
    text: Both have GH₵ 10,000. Esi invests in the fund at once. Kojo waits to see how it does.
    parts:
    - kind: tables
      id: t
      slots: 6
      tables:
      - id: s
        title: GH₵ 10,000, same fund
        columns:
        - year
        - fund
        - Esi
        - Kojo
        rows:
        - k: y0
          cells:
          - '0'
          - ''
          - 10,000.00
          - 10,000.00 cash
          tone: active
  - title: Year 1
    text: The fund rises 30%. Esi has 13,000. Kojo, still in cash, starts to feel he is missing out.
    vars:
      Esi: 13,000.00
    parts:
    - kind: tables
      id: t
      slots: 6
      tables:
