# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: ts
  check: docker
  needs: network
  script: |
    NAME=zte-redis-check-$$
    docker run -d --rm --name $NAME -p 127.0.0.1::6379 redis:8 >/dev/null
    trap "docker rm -f $NAME >/dev/null 2>&1 || true" EXIT
    PORT=$(docker port $NAME 6379/tcp | head -1 | sed "s/.*://")
    for i in $(seq 1 30); do if docker exec $NAME redis-cli ping 2>/dev/null | grep -q PONG; then break; fi; sleep 1; done
    mkdir w && cd w
    npm init -y >/dev/null
    npm pkg set type=module
    npm install --silent --no-audit --no-fund redis@6.3.1
    cp "$BLOCK" x.ts
    REDIS_URL=$(printf '%s://127.0.0.1:%s' redis "$PORT") node x.ts
  output_contains:
  - 'fresh bread 60

    visits 5

    { name: ''Rye loaf'', price_pence: ''450'', stock: ''10'' }

    [ ''/menu'', ''/basket'', ''/checkout'' ]

    [ { value: ''Croissant'', score: 15 }, { value: ''Bagel'', score: 13 } ]'
