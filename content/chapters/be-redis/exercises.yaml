- title: Do this
  items:
  - key: x1
    text: Add a Redis cache with expiry and invalidation to one endpoint of your API, and measure the difference
  - key: x2
    text: Rate-limit sign-in attempts per email with a fixed window and return 429 with Retry-After
  - key: x3
    text: Make a scheduled job run on only one of three instances with a Redis lock
  - key: x4
    text: Stop Redis while your service runs and make sure requests still succeed, more slowly
