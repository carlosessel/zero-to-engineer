- question: What does chmod 600 secrets.env do?
  options:
  - Lets only the owner read and write the file
  - Lets everyone read it
  answer: 0
  explanation: 6 = rw- for the owner, 0 for group and others.
- question: Which signal asks a process to stop and lets it clean up?
  options:
  - SIGTERM
  - SIGKILL
  answer: 0
  explanation: SIGKILL cannot be caught.
- question: A process exits with status 137. What happened?
  options:
  - It was killed with SIGKILL, often by the out-of-memory killer
  - It finished successfully
  answer: 0
  explanation: 137 is 128 + 9.
- question: Which command shows which file systems are full?
  options:
  - df -h
  - ps aux
  answer: 0
  explanation: Also check inodes with df -i.
- question: Why run services as their own unprivileged user?
  options:
  - A compromised service can then touch only that user's files
  - It is faster
  answer: 0
  explanation: That is least privilege.
- question: Which tool follows a systemd service's logs?
  options:
  - journalctl -u <service> -f
  - chmod
  answer: 0
  explanation: --since narrows the time range.
