- title: Do this
  items:
    - key: x1
      text: "Build Volta's DCF in a spreadsheet with the forecast, discount rate, growth rate, net debt and share count in their own cells. Recreate the sensitivity table with a data table or by copying formulas."
    - key: x2
      text: "In your spreadsheet, use Goal Seek (or trial and error) to find the growth rate that makes Volta worth GH₵ 4.05 at a 15% discount rate."
    - key: x3
      text: "For the listed company you studied in earlier chapters, value it by P/E and EV to EBITDA against two peers, and write down why it might deserve a higher or lower multiple."
    - key: x4
      text: "Write down three assumptions that, if wrong, would most change your valuation of that company, and what evidence you would look for on each."
