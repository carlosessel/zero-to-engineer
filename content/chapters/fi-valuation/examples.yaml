# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    14% [2.19, 2.47, 2.82]
    15% [1.89, 2.1, 2.37]
    16% [1.64, 1.81, 2.02]
  verify: |
    v = ns["dcf_per_share"]
    flows = [24, 28, 32, 36, 40]
    pv = [round(cf / 1.15 ** t, 2) for t, cf in enumerate(flows, 1)]
    assert pv == [20.87, 21.17, 21.04, 20.58, 19.89]
    assert round(sum(cf / 1.15 ** t for t, cf in enumerate(flows, 1)), 2) == 103.55
    tv = 40 * 1.06 / 0.09
    assert round(tv, 2) == 471.11 and round(tv / 1.15 ** 5, 2) == 234.23
    ev = sum(cf / 1.15 ** t for t, cf in enumerate(flows, 1)) + tv / 1.15 ** 5
    assert round(ev, 2) == 337.78 and round(ev - 85.4, 2) == 252.38
    assert round((tv / 1.15 ** 5) / ev * 100) == 69
    assert round(16 * 0.20, 2) == 3.20 and round((8 * 60 - 85.4) / 120, 2) == 3.29
    lo, hi = 0.06, 0.149
    for _ in range(80):
        m = (lo + hi) / 2
        lo, hi = (m, hi) if v(flows, 0.15, m, 85.4, 120) < 4.05 else (lo, m)
    assert round(m * 100, 1) == 10.3
    lo, hi = 0.07, 0.15
    for _ in range(80):
        m = (lo + hi) / 2
        lo, hi = (m, hi) if v(flows, m, 0.06, 85.4, 120) > 4.05 else (lo, m)
    assert round(m * 100, 1) == 11.4
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    assert block.strip().splitlines()[1] == "15% [1.89, 2.1, 2.37]"
