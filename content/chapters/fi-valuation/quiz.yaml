- question: "Similar companies trade on a P/E of 15. A company's EPS is GH₵ 0.30. What does that suggest it is worth per share?"
  options:
    - "GH₵ 4.50"
    - "GH₵ 0.02"
    - "GH₵ 15.30"
    - "GH₵ 50.00"
  answer: 0
  explanation: "15 × 0.30 = 4.50. It is a value relative to peers, which may themselves be mispriced."
- question: "In a DCF, why is net debt subtracted from the enterprise value?"
  options:
    - "Enterprise value belongs to lenders and shareholders together; the lenders' share must come off to leave the shareholders' value"
    - "To make the answer smaller and safer"
    - "Because debt is an expense"
    - "It is not; net debt is added"
  answer: 0
  explanation: "Discounting free cash flow before interest values the whole business. Shareholders own what is left after the debt."
- question: "In many DCF valuations, what makes up most of the value?"
  options:
    - "The terminal value, for the years after the forecast"
    - "The first year's cash flow"
    - "The company's cash at the bank"
    - "The dividend just paid"
  answer: 0
  explanation: "In the chapter it was 69% of enterprise value, which is why the long-run growth and discount rates matter so much."
- question: "What happens to a DCF value if the discount rate rises from 14% to 16%, all else equal?"
  options:
    - "It falls, because future cash is worth less today"
    - "It rises"
    - "It stays the same"
    - "It becomes negative"
  answer: 0
  explanation: "For Volta at 6% growth, the value fell from GH₵ 2.47 to GH₵ 1.81 a share."
- question: "What does a reverse DCF tell you?"
  options:
    - "What growth or required return today's price assumes"
    - "The exact value of the share"
    - "What the share will be worth next year"
    - "How much the company owes"
  answer: 0
  explanation: "It works backwards from the price. For Volta, GH₵ 4.05 needed about 10.3% growth for ever at a 15% discount rate."
- question: "Why do careful investors want a margin of safety?"
  options:
    - "Every valuation is uncertain, so buying well below estimated value leaves room for mistakes"
    - "It guarantees a profit"
    - "Regulators require it"
    - "It makes the DCF more accurate"
  answer: 0
  explanation: "A margin of safety protects against errors in forecasts and assumptions, which are certain to exist."
