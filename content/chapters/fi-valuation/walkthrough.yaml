      sum so far: '20.87'
    parts:
    - kind: tables
      id: t
      slots: 5
      tables:
      - id: s
        title: Volta's free cash flow at 15% (GH₵ million)
        columns:
        - year
        - cash
        - factor
        - today
        rows:
        - k: y0
          cells:
          - '1'
          - '24'
          - '0.8696'
          - '20.87'
          tone: active
