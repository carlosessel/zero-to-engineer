- question: "What does a unit test check?"
  options:
    - "The whole application through the browser"
    - "One function or small piece on its own"
    - "The server’s speed"
  answer: 1
  explanation: "Small, fast and numerous."
- question: "You find a bug. What is the best practice?"
  options:
    - "Fix it quickly"
    - "Write a test that fails because of it, then fix it"
    - "Tell nobody"
  answer: 1
  explanation: "The test stops the bug from ever returning unnoticed."
