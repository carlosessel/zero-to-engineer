- title: Do this
  items:
    - key: x1
      text: "Get your contribution record from your social security or state pension scheme (in Ghana, SSNIT; in the UK, your State Pension forecast). Estimate your pension with the formula or forecast."
    - key: x2
      text: "In a spreadsheet, work out the pot you would need for the retirement income you want, and the monthly saving needed from now, at real returns of 2%, 3% and 4%."
    - key: x3
      text: "Find out whether your employer offers a pension or provident fund with matching contributions, and what you would need to pay in to get the full match."
    - key: x4
      text: "List every pension pot or scheme you have ever been in, with who runs it and the latest value. Note any you have lost track of."
