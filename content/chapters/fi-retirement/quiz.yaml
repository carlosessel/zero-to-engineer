- question: "What is the main difference between a defined benefit and a defined contribution pension?"
  options:
    - "Defined benefit pays by a formula; defined contribution depends on what is paid in and how the investments do"
    - "Defined contribution pensions are always larger"
    - "Defined benefit pensions are voluntary"
    - "There is no difference"
  answer: 0
  explanation: "In a DB scheme such as SSNIT, the scheme bears the investment risk. In a DC pot, you do."
- question: "Under SSNIT's formula, what pension right does 360 months of contributions give at 60?"
  options:
    - "54.375%"
    - "60%"
    - "37.5%"
    - "45%"
  answer: 0
  explanation: "(360 − 180) ÷ 12 = 15 extra years; 37.5% + 15 × 1.125% = 54.375%."
- question: "Your employer will match pension contributions up to 5% of salary. What happens if you opt out?"
  options:
    - "You give up the employer's contributions, which are part of your pay"
    - "You get the employer's contribution as cash instead"
    - "Nothing changes"
    - "Your salary rises by 5%"
  answer: 0
  explanation: "Employer contributions are usually only paid into the pension. Opting out loses them and the tax relief."
- question: "What is sequence risk in retirement?"
  options:
    - "A market fall early in retirement does more damage than the same fall later, because you sell investments at low prices to live on"
    - "The risk of paying contributions in the wrong order"
    - "The risk that pension rules change"
    - "The risk of choosing the wrong annuity provider"
  answer: 0
  explanation: "Selling at low prices early leaves a smaller pot for all the remaining years."
- question: "What does an annuity offer that drawdown does not?"
  options:
    - "An income for life, removing the risk of running out of money"
    - "The ability to change your mind later"
    - "Higher returns from shares"
    - "Freedom to leave the money to your heirs in all cases"
  answer: 0
  explanation: "An annuity swaps the pot for a guaranteed income for life. Drawdown keeps flexibility but leaves you with market and longevity risk."
