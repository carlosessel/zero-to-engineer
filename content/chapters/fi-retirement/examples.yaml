# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    427,413.09 138,612.27
    925.05
  verify: |
    saved = ns["saved"]
    assert round(37.5 + 1.125 * (300 - 180) / 12, 3) == 48.75
    assert round(60000 * 0.4875 / 12, 2) == 2437.50
    r = 0.0025
    pot = 3000 * (1 - (1 + r) ** -300) / r
    assert round(pot, 2) == 632629.36
    assert round(pot * r / ((1 + r) ** 420 - 1), 2) == 853.10
    assert round(pot * r / ((1 + r) ** 240 - 1), 2) == 1926.97
    pot2 = 2000 * (1 - (1 + r) ** -240) / r
    assert round(pot2, 2) == 360621.83
    assert round(pot2 * r / ((1 + r) ** 360 - 1), 2) == 618.84
    assert round(23760 * 0.08, 2) == 1900.80 and round(23760 * 0.05 * 0.8, 2) == 950.40
    assert round(241.30 * 52, 2) == 12547.60
    assert round(48000 * (0.375 + 15 * 0.01125) / 12, 2) == 2175.00
- block: 2
  lang: text
  check: illustration
  note: The output of the Python block above, which that block's check compares exactly.
  verify: |
    assert block.strip().splitlines() == ["427,413.09 138,612.27", "925.05"]
