# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python-fake-api
  replies:
  - text: Overfitting is when a model memorises its training data.
  output_contains:
  - Overfitting is when a model memorises its training data.
  - input_tokens=25
  - output_tokens=40
  note: 'Run against a stand-in server on the test machine, not the live API: this proves the SDK calls are valid and the reply is handled correctly, not what a real model would answer. The stand-in reply starts with a thinking block, as real replies can.'
  verify: |
    r = requests[0]
    assert r["model"] == "claude-sonnet-5-5" and r["max_tokens"] == 1000
    assert r["system"].startswith("You are a patient tutor")
    assert r["messages"] == [{"role": "user", "content": "What is overfitting?"}]
- block: 2
  lang: python
  check: python-fake-api
  stdin:
  - Hello
  - What did I just say?
  ends_waiting_for_input: true
  replies:
  - text: Hi there.
  - text: You said Hello.
  output: |
    > Hello
    Hi there.
    > What did I just say?
    You said Hello.
  note: 'Run against a stand-in server on the test machine, not the live API: this proves the SDK calls are valid and the reply is handled correctly, not what a real model would answer. Two turns are typed; the loop then waits for a third, which is where the check stops.'
  verify: |
    # The second request must carry the whole conversation so far: that is the chapter's point.
    assert requests[1]["messages"] == [
        {"role": "user", "content": "Hello"},
        {"role": "assistant", "content": "Hi there."},
        {"role": "user", "content": "What did I just say?"},
    ]
- block: 3
  lang: python
  check: python-fake-api
  replies:
  - text: Attention lets each word look at the others.
  output: |
    Attention lets each word look at the others.
  note: 'Run against a stand-in server on the test machine, not the live API: this proves the SDK calls are valid and the reply is handled correctly, not what a real model would answer.'
  verify: |
    assert requests[0]['stream'] is True
