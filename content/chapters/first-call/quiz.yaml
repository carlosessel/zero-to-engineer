- question: "How does a chatbot keep a conversation going?"
  options:
    - "The provider stores it automatically"
    - "Your code resends the message history with each call"
    - "The model remembers users"
  answer: 1
  explanation: "Calls are stateless. You manage the history."
- question: "Why stream responses?"
  options:
    - "It is cheaper"
    - "Users see output immediately instead of waiting"
    - "It improves accuracy"
  answer: 1
  explanation: "Streaming cuts perceived waiting time."
