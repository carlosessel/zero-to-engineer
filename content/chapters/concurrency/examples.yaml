# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |2+

  note: Run one after another, the function behaves correctly. The race itself needs two threads to interleave at exactly the wrong moment, which a test cannot force reliably, so only the arithmetic of the claim (100 - 80 - 80 = -60) is checked. The chapter's exercise has the learner produce a real race with a counter.
  verify: |
    ns['withdraw'](80)
    assert ns['balance'] == 20
    ns['withdraw'](80)          # refused: only 20 left
    assert ns['balance'] == 20
    assert 100 - 80 - 80 == -60
