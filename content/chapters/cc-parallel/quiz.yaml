- question: Which is a good reason for a subagent?
  options:
  - To get a better answer to the same task
  - An independent review by an agent that has not seen your reasoning
  - To save tokens
  answer: 1
  explanation: Subagents help with parallel work, noisy output and independent review, and cost extra tokens.
- question: Two sessions edit the same folder at once. What prevents them overwriting each other?
  options:
  - Nothing is needed
  - Running each in its own Git worktree
  answer: 1
  explanation: claude --worktree name, or the desktop app.
- question: Why make a reviewer subagent read-only?
  options:
  - It is faster
  - A reviewer should judge, not change, the code
  answer: 1
  explanation: 'tools: Read, Glob, Grep.'
- question: What limits how many parallel sessions are useful?
  options:
  - Your screen size
  - How many results you can review properly
  answer: 1
  explanation: Unreviewed changes are risks, not wins.
