- title: "Do this"
  items:
    - key: x1
      text: "Take three prompts you used this week and rewrite each with the reader, the goal, the output form and the reasons; compare the results"
    - key: x2
      text: "Write a few-shot prompt for a classification you care about, with four varied examples, and test it on ten new inputs"
    - key: x3
      text: "Give Claude two long documents in tagged sections with the question at the end, asking for quotations, and check every quotation"
    - key: x4
      text: "Ask Claude to critique one of your prompts and explain what in it caused a weak answer"
    - key: x5
      text: "Work through the first chapters of Anthropic's interactive prompt engineering tutorial"
