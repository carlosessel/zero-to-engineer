- block: 6
  lang: python
  check: python
  output: |
    <documents>
    <document index="1">
    <source>q3-report.pdf</source>
    <document_content>
    Revenue rose 8%. Costs rose 12%, mostly flour and energy...
    </document_content>
    </document>
    <document index="2">
    <source>q3-survey.csv</source>
    <document_content>
    satisfaction,comment
    4,Great bread
    2,Queue too long
    ...
    </document_content>
    </document>
    </documents>
    Using only the documents above, list the three biggest problems for the business. After each one, quote the sentence or row it comes from. If the documents do not support a point, leave it out.
  verify: |
    assert ns['prompt'].index('<documents>') < ns['prompt'].index('Using only the documents above')
    assert ns['prompt'].count('<document index=') == 2
    assert '<source>q3-survey.csv</source>' in ns['prompt']
    assert ns['prompt'].rstrip().endswith('leave it out.')
