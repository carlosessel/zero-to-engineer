- question: What does [10, 9, 1].sort() give in JavaScript?
  options:
  - '[1, 9, 10]'
  - '[1, 10, 9]'
  answer: 1
  explanation: Without a comparator it compares strings.
- question: Which sort does Java use for List.sort on objects?
  options:
  - TimSort, which is stable
  - Quicksort, which is unstable
  answer: 0
  explanation: Primitives use dual-pivot quicksort.
- question: Why write lo + (hi - lo) / 2 instead of (lo + hi) / 2?
  options:
  - It is faster
  - It avoids integer overflow
  answer: 1
  explanation: A real bug in widely used libraries.
- question: Which technique answers many range-sum questions in O(1) each?
  options:
  - Prefix sums
  - Binary search
  answer: 0
  explanation: prefix[b] − prefix[a].
- question: A problem asks for the best total over any 7 consecutive days. Which technique?
  options:
  - Sliding window
  - Dynamic programming
  answer: 0
  explanation: Add the day entering, subtract the day leaving.
