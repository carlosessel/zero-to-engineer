- question: "What is the relationship between a class and an object?"
  options:
    - "They are the same thing"
    - "A class is the blueprint; an object is one thing built from it"
    - "An object contains many classes"
  answer: 1
  explanation: "One class can produce many objects, each with its own data."
- question: "Why route changes to balance through a deposit method?"
  options:
    - "It runs faster"
    - "The method can enforce the rules every time"
    - "Python requires it"
  answer: 1
  explanation: "That is encapsulation: the object guards its own data."
