# How each code block in index.mdx is checked. See tests/examples/harness.py.
- block: 1
  lang: python
  check: python
  output: |
    150
  verify: |
    A = ns['BankAccount']
    acct = A('Kofi')
    assert acct.balance == 0
    for bad in (lambda: acct.deposit(0), lambda: acct.deposit(-5), lambda: acct.withdraw(1)):
        try:
            bad()
        except ValueError:
            pass
        else:
            raise AssertionError('expected ValueError')
    acct.deposit(30); acct.withdraw(30)
    assert acct.balance == 0
