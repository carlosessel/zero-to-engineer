- title: Do this
  items:
  - key: x1
    text: Play with the visualisation on the Raft website, killing leaders and splitting the network
  - key: x2
    text: Find out which consistency level your database client uses for reads by default
  - key: x3
    text: Run a three-node etcd cluster locally, stop one node, then two, and see what still works
  - key: x4
    text: Make a job that must run once per night safe to run twice, using an idempotency key in the database
