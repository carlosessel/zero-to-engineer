- question: Does an ordinary view store data?
  options:
  - No; each query runs its definition
  - Yes; it is a copy of the table
  answer: 0
  explanation: A materialised view stores its result.
- question: What does REFRESH MATERIALIZED VIEW CONCURRENTLY allow?
  options:
  - Readers keep using the old contents during the refresh
  - Refreshing several views at once
  answer: 0
  explanation: It needs a unique index.
- question: When may a function be labelled IMMUTABLE?
  options:
  - When it always gives the same result for the same arguments and reads no tables
  - Whenever it does not write data
  answer: 0
  explanation: Wrong labels give wrong answers.
- question: In a row trigger, what are NEW and OLD?
  options:
  - The row after and before the change
  - The new and old versions of the trigger
  answer: 0
  explanation: TG_OP says which operation fired it.
- question: Which logic belongs in the database?
  options:
  - Constraints and integrity that must hold whatever writes the data
  - Business workflows that call other systems
  answer: 0
  explanation: Keep fast-changing workflows in the application.
