# Outline approved 23 November 2026 ("Approve as proposed"): spreadsheets for the learner, numbers computed in Python,
# Ghana and UK country notes in <Note> boxes, examples in Ghana cedis, insurance chapter kept. Not financial advice.
# Created so far: parts 1 to 4 (Start here; Your money day to day; Interest, debt and credit; Personal accounting).
course: finance
title: "Zero to Money and Investing"
tagline: "Run your own money well, read the numbers, and judge any investment for yourself."
description: "From percentages and a first budget to interest, debt, household accounts, company financial statements, every major asset class, fees, tax, retirement, scams and how to evaluate an investment. Educational, not financial advice."
order: 8
parts:
  - name: "Start here"
    blurb: "What this course covers, and the maths and tools money needs"
    chapters:
      - id: fi-the-map
        title: "What personal finance is and what this course covers"
        summary: "Money, accounts, investing and the map of the course; why this is not financial advice and why rules differ by country."
        minutes: 40
      - id: fi-numbers
        title: "The maths of money: percentages, rates and growth"
        summary: "Percentages, percentage points, rates per month and per year, repeated growth and rounding, with many worked problems."
        minutes: 150
      - id: fi-spreadsheets
        title: "Spreadsheets for money"
        summary: "Cells, formulas, totals and simple charts in a free spreadsheet, so you can do every calculation in this course yourself."
        minutes: 120
  - name: "Your money day to day"
    blurb: "Income, budgets, saving and payments"
    chapters:
      - id: fi-income
        title: "Income and payslips"
        summary: "Gross and net pay, deductions, irregular income, and reading a payslip line by line."
        minutes: 75
      - id: fi-budgeting
        title: "Budgeting"
        summary: "Tracking spending, needs and wants, and three budgeting methods compared on one household."
        minutes: 120
      - id: fi-saving
        title: "Saving and emergency funds"
        summary: "Goals, paying yourself first, emergency funds, and choosing where savings are kept."
        minutes: 90
      - id: fi-banking
        title: "Banks, mobile money and payments"
        summary: "Current and savings accounts, mobile money, cards and transfers, deposit protection and what each costs."
        minutes: 60
  - name: "Interest, debt and credit"
    blurb: "What borrowing really costs"
    chapters:
      - id: fi-interest
        title: "Simple and compound interest"
        summary: "Interest from zero, compounding year by year, compounding frequency, APR and AER, and the rule of 72."
        minutes: 150
      - id: fi-loans
        title: "How loans work"
        summary: "Repayment schedules, how much of each payment is interest, total cost, and the trade-off of a longer term."
        minutes: 120
      - id: fi-debt
        title: "Getting out of debt"
        summary: "Good and bad debt, predatory lending, the avalanche and snowball methods, and where to get free help."
        minutes: 90
      - id: fi-credit
        title: "Credit scores and credit reports"
        summary: "What lenders look at, what a credit report holds, and how to build and protect your record."
        minutes: 60
  - name: "Personal accounting"
    blurb: "Keeping your own books"
    chapters:
      - id: fi-bookkeeping
        title: "Personal bookkeeping"
        summary: "Accounts, transactions and categories; recording a month of money and reconciling it with your statements."
        minutes: 120
      - id: fi-household-statements
        title: "Household accounts: income statement, balance sheet and cash flow"
        summary: "The three statements for a household, net worth, and why profit and cash are not the same thing."
        minutes: 150
      - id: fi-double-entry
        title: "Double-entry bookkeeping"
        summary: "The accounting equation, debits and credits, and a trial balance: the system every business uses."
        minutes: 120
  - name: "How money changes over time"
    blurb: "Inflation, the time value of money and markets"
    chapters:
      - id: fi-inflation
        title: "Inflation and real returns"
        summary: "Price indices, what inflation does to savings, and real against nominal returns."
        minutes: 90
      - id: fi-time-value
        title: "The time value of money"
        summary: "Future and present value, discounting, and regular payments, the tool behind loans, pensions and valuation."
        minutes: 120
      - id: fi-markets
        title: "How financial markets work"
        summary: "Exchanges, brokers, primary and secondary markets, prices, and what regulators do."
        minutes: 75
  - name: "Investing fundamentals"
    blurb: "Risk, return and every major asset class"
    chapters:
      - id: fi-risk-return
        title: "Risk and return"
        summary: "Volatility, losses and drawdowns, time horizon, and why higher expected return comes with higher risk."
        minutes: 120
      - id: fi-diversification
        title: "Diversification and asset allocation"
        summary: "Spreading risk, correlation, choosing a mix of assets, and rebalancing."
        minutes: 120
      - id: fi-cash-bonds
        title: "Cash, treasury bills and bonds"
        summary: "Lending as an investment: yields, why bond prices fall when rates rise, credit risk and maturity."
        minutes: 150
      - id: fi-shares
        title: "Shares"
        summary: "Owning part of a company: dividends, capital gains, how prices are set, and what an index is."
        minutes: 120
      - id: fi-funds
        title: "Funds and index funds"
        summary: "Unit trusts, mutual funds and ETFs; active and passive investing; what the evidence says about each."
        minutes: 120
      - id: fi-property
        title: "Property"
        summary: "Renting or buying a home, mortgages, buying to let, property funds, and the effect of borrowing."
        minutes: 120
      - id: fi-crypto
        title: "Crypto, honestly"
        summary: "What cryptocurrencies are and are not, volatility, stablecoins, custody, and why so many scams use them."
        minutes: 90
  - name: "Costs, tax, protection and retirement"
    blurb: "What you keep, and the long view"
    chapters:
      - id: fi-fees
        title: "Fees and costs"
        summary: "Annual charges, platform fees, spreads and commissions, and how small fees grow over decades."
        minutes: 90
      - id: fi-tax
        title: "Tax basics"
        summary: "Income tax bands, tax on interest, dividends and gains, and tax-advantaged accounts, with country notes."
        minutes: 120
      - id: fi-insurance
        title: "Insurance and protection"
        summary: "What insurance is for, the main kinds, excesses and premiums, and what not to insure."
        minutes: 75
      - id: fi-retirement
        title: "Saving for retirement"
        summary: "Pensions and their tiers, how much to save, employer contributions, and drawing an income later."
        minutes: 120
  - name: "Reading company accounts"
    blurb: "Understanding the businesses you might own"
    chapters:
      - id: fi-company-statements
        title: "Reading company financial statements"
        summary: "The income statement, balance sheet and cash flow statement of a company, line by line, in an annual report."
        minutes: 180
      - id: fi-ratios
        title: "Financial ratios"
        summary: "Margins, return on equity, debt and liquidity ratios, earnings per share, price to earnings and dividend yield."
        minutes: 150
      - id: fi-valuation
        title: "Valuing a share"
        summary: "Earnings and cash flow, a first discounted cash flow, and why valuations are uncertain."
        minutes: 120
  - name: "Judgement"
    blurb: "Avoiding mistakes and frauds, and deciding for yourself"
    chapters:
      - id: fi-behaviour
        title: "Behavioural mistakes"
        summary: "Loss aversion, chasing past returns, overconfidence, herding and market timing, with what to do instead."
        minutes: 90
      - id: fi-scams
        title: "Scams and fraud"
        summary: "Ponzi and pyramid schemes, impersonation and investment fraud, the warning signs, and checking a licence."
        minutes: 90
      - id: fi-evaluating
        title: "How to evaluate an investment"
        summary: "A checklist: what it is, who regulates it, costs, risk, liquidity, tax and fit, applied to four offers."
        minutes: 120
      - id: fi-plan
        title: "Putting it together: a financial plan"
        summary: "The order of priorities, written down as a one-page plan for a fictional household."
        minutes: 90
  - name: "Practice and reference"
    blurb: "Projects, checked materials and a glossary"
    chapters:
      - id: fi-projects
        title: "Money projects"
        summary: "Five projects from a year of household accounts to analysing a real company's annual report."
        minutes: 60
      - id: fi-library
        title: "The library: checked free materials"
        summary: "The best free courses, regulators' guides and books on personal finance and investing, each opened and checked."
        minutes: 30
      - id: fi-glossary
        title: "Glossary"
        summary: "Every term in this course, one sentence each."
        minutes: 15
