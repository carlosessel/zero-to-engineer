# Outline approved 12 November 2026. Written in the order: claude, then mastery, then backend.
# Mastery code examples: TypeScript, with Java and C# side by side where the languages differ.
# Parts are created one at a time with the add-course skill. Created so far: part 1.
course: mastery
title: Software Engineering Mastery
tagline: The fundamentals the best engineers know cold, taught properly.
description: 'From how the machine really works to clean code, design patterns, data, distributed systems, Kafka, containers, observability and security: the deep fundamentals behind great software.'
order: 4
parts:
- name: How the machine really works
  blurb: CPUs, memory, operating systems, networks and runtimes
  chapters:
  - id: m-machine
    title: 'Inside the machine: CPU, memory and caches'
    summary: Binary, the CPU, the memory hierarchy, cache lines and the latency numbers every engineer should know.
    minutes: 180
  - id: m-data-representation
    title: Numbers, text and time
    summary: Integers, floating point, Unicode and UTF-8, dates, time zones, and the bugs each one causes.
    minutes: 180
  - id: m-operating-systems
    title: Operating systems for engineers
    summary: Processes, threads, scheduling, virtual memory, system calls and files.
    minutes: 210
  - id: m-runtimes
    title: 'How code runs: compilers, interpreters and virtual machines'
    summary: Compilation, bytecode, the JVM, the .NET runtime, V8 and JIT compilation.
    minutes: 150
  - id: m-memory-gc
    title: Memory management and garbage collection
    summary: Stack and heap, manual memory, reference counting, tracing and generational GC in the JVM, .NET and V8, and memory leaks in GC languages.
    minutes: 240
  - id: m-networking
    title: Networking in depth
    summary: TCP, UDP, IP, DNS, TLS, HTTP/1.1, HTTP/2 and HTTP/3, sockets, and where latency comes from.
    minutes: 240
  - id: m-discrete-maths
    title: The maths engineers use
    summary: Logic, sets, counting, probability, and proof by induction, applied to code.
    minutes: 210
  - id: m-computability
    title: What computers cannot do
    summary: Computability, P and NP, and recognising problems with no fast solution.
    minutes: 120
- name: Data structures and algorithms
  blurb: Complexity, the structures behind everything, and how to solve problems
  chapters:
  - id: m-complexity
    title: 'Complexity: Big O, properly'
    summary: Time and space complexity, best, worst and average cases, amortised cost, and measuring in practice.
    minutes: 180
  - id: m-arrays-hashing
    title: Arrays, strings and hash tables
    summary: Dynamic arrays, string building, hashing, collisions and when hash tables are slow.
    minutes: 210
  - id: m-lists-stacks-queues
    title: Linked lists, stacks, queues and deques
    summary: Pointer-based structures and the problems they solve.
    minutes: 150
  - id: m-trees-heaps
    title: Trees, heaps and tries
    summary: Binary search trees, balanced trees, B-trees, heaps and priority queues, tries.
    minutes: 240
  - id: m-graphs
    title: Graphs
    summary: Representations, BFS, DFS, Dijkstra and A*, minimum spanning trees, topological sort and union-find.
    minutes: 240
  - id: m-sorting-searching
    title: Sorting, searching and core techniques
    summary: The main sorts, binary search, two pointers, sliding windows, prefix sums and string search.
    minutes: 210
  - id: m-recursion-dp
    title: Recursion, backtracking and dynamic programming
    summary: Thinking recursively, exploring choices, and turning slow recursion into fast tables; greedy algorithms.
    minutes: 270
  - id: m-problem-solving
    title: Solving problems you have not seen before
    summary: A method for unfamiliar problems, the common patterns, and preparing for coding interviews.
    minutes: 180
- name: Writing excellent code
  blurb: Clean code, principles, refactoring and types
  chapters:
  - id: m-clean-code
    title: 'Clean code: names, functions and structure'
    summary: 'Code people can read and change: naming, small functions, comments that help, formatting.'
    minutes: 210
  - id: m-oop
    title: Object-oriented programming in depth
    summary: Encapsulation, abstraction, inheritance and polymorphism done well; interfaces versus abstract classes.
    minutes: 210
  - id: m-errors
    title: Handling errors well
    summary: Exceptions versus result values, failing fast, validation at the edges, and never hiding failures.
    minutes: 180
  - id: m-debugging
    title: Debugging like an expert
    summary: A scientific method for bugs, debuggers, logging, bisecting, and reading stack traces and dumps.
    minutes: 180
  - id: m-solid
    title: The SOLID principles
    summary: Single responsibility, open-closed, Liskov substitution, interface segregation and dependency inversion, with before-and-after code.
    minutes: 240
  - id: m-design-principles
    title: Coupling, cohesion and other design principles
    summary: DRY, KISS, YAGNI, composition over inheritance, the Law of Demeter, tell-don't-ask, and when each one is wrong.
    minutes: 180
  - id: m-types
    title: Types as a design tool
    summary: Static typing, generics, null safety, and making illegal states impossible to represent.
    minutes: 180
  - id: m-functional
    title: Functional ideas for every language
    summary: Pure functions, immutability, higher-order functions and composition in object-oriented code.
    minutes: 180
  - id: m-refactoring
    title: Refactoring and code smells
    summary: Recognising smells, refactoring safely in small steps, and working with legacy code.
    minutes: 240
  - id: m-code-review
    title: Reading and reviewing code
    summary: Reading unfamiliar codebases, reviewing well, and receiving review.
    minutes: 120
- name: Design patterns and software design
  blurb: Patterns, domain-driven design, architecture and APIs
  chapters:
  - id: m-patterns-creational
    title: 'Design patterns: creating objects'
    summary: Factory method, abstract factory, builder, singleton (and why to avoid it), prototype, and dependency injection.
    minutes: 210
  - id: m-patterns-structural
    title: 'Design patterns: structure'
    summary: Adapter, decorator, facade, composite, proxy, bridge and flyweight.
    minutes: 210
  - id: m-patterns-behavioural
    title: 'Design patterns: behaviour'
    summary: Strategy, observer, command, state, template method, iterator, chain of responsibility, mediator and visitor.
    minutes: 270
  - id: m-anti-patterns
    title: Anti-patterns and over-engineering
    summary: God objects, anaemic models, premature abstraction, pattern overuse, and the dos and don'ts that come from them.
    minutes: 150
  - id: m-enterprise-patterns
    title: Patterns for business applications
    summary: Repository, unit of work, data mapper, DTOs, service layers and transaction scripts.
    minutes: 180
  - id: m-ddd
    title: Domain-driven design
    summary: Ubiquitous language, entities, value objects, aggregates, domain events and bounded contexts.
    minutes: 240
  - id: m-architecture
    title: Architecture styles
    summary: Layered, hexagonal and clean architecture, modular monoliths, microservices, event-driven systems, CQRS and event sourcing.
    minutes: 270
  - id: m-api-design
    title: Designing APIs
    summary: REST done well, errors, pagination, versioning, idempotency, gRPC, GraphQL and webhooks.
    minutes: 240
  - id: m-realtime
    title: Real-time communication
    summary: Polling, long polling, server-sent events and WebSockets, and when to use each.
    minutes: 150
  - id: m-design-docs
    title: Design documents and trade-offs
    summary: Design docs and decision records, diagrams (C4, UML sequence and class diagrams), comparing options, and estimating.
    minutes: 150
- name: Testing and quality
  blurb: Tests that catch bugs, and tools that prevent them
  chapters:
  - id: m-testing
    title: Testing in depth
    summary: The test pyramid, test doubles, test-driven development, integration tests with real databases, contract, property-based and mutation testing.
    minutes: 270
  - id: m-static-quality
    title: Linters, formatters and static analysis
    summary: Automated code quality, and gates that stop problems reaching production.
    minutes: 120
  - id: m-performance
    title: 'Performance: profiling, benchmarking and load testing'
    summary: Measuring before optimising, CPU and memory profilers, benchmarks, load tests, and common performance anti-patterns.
    minutes: 210
- name: Concurrency
  blurb: Doing many things at once, correctly
  chapters:
  - id: m-threads-locks
    title: Threads, races and locks
    summary: Race conditions, mutexes, deadlocks, memory visibility and thread-safe design.
    minutes: 240
  - id: m-async
    title: Asynchronous programming
    summary: Event loops, futures and promises, async and await, thread pools, Java virtual threads and .NET tasks.
    minutes: 240
  - id: m-concurrency-patterns
    title: Concurrency patterns
    summary: Producer-consumer, worker pools, actors, immutability, and lock-free ideas.
    minutes: 180
- name: Data
  blurb: Databases in depth, caching, and data at scale
  chapters:
  - id: m-relational
    title: Relational databases in depth
    summary: Indexes and B-trees, query plans, transactions, ACID, isolation levels and their anomalies, locking and MVCC.
    minutes: 270
  - id: m-schema-design
    title: Schema design and migrations
    summary: Normalisation, when to denormalise, constraints, and changing schemas without downtime.
    minutes: 180
  - id: m-nosql
    title: 'Beyond relational: NoSQL and search'
    summary: Key-value, document, wide-column and graph databases, search engines, and choosing between them.
    minutes: 180
  - id: m-caching
    title: Caching
    summary: Cache-aside, write-through, expiry, invalidation, Redis, CDNs and the problems caches cause.
    minutes: 180
  - id: m-replication-partitioning
    title: Replication and partitioning
    summary: Leaders and followers, replication lag, sharding and rebalancing.
    minutes: 210
- name: Distributed systems and messaging
  blurb: Many machines, partial failure, queues, logs and Kafka
  chapters:
  - id: m-distributed-basics
    title: Distributed systems fundamentals
    summary: Partial failure, timeouts, retries, idempotency, clocks and ordering.
    minutes: 240
  - id: m-load-balancing
    title: Load balancers, proxies and CDNs
    summary: Layer 4 and layer 7 load balancing, reverse proxies such as Nginx, API gateways and CDNs.
    minutes: 180
  - id: m-consistency-consensus
    title: Consistency and consensus
    summary: CAP and PACELC, consistency models, quorums, Raft and leader election.
    minutes: 240
  - id: m-messaging
    title: Messaging and queues
    summary: Queues versus logs, RabbitMQ, delivery guarantees, dead letters and the outbox pattern.
    minutes: 210
  - id: m-kafka
    title: Kafka in depth
    summary: Topics, partitions, consumer groups, offsets, ordering, retention, exactly-once and schemas.
    minutes: 270
  - id: m-resilience
    title: Resilience patterns
    summary: Sagas, circuit breakers, bulkheads, rate limiting, backpressure and graceful degradation.
    minutes: 210
  - id: m-cloud-patterns
    title: Patterns for services in the cloud
    summary: Sidecars, strangler fig, anti-corruption layers, backends for frontends, queue-based load levelling and the twelve-factor app.
    minutes: 180
  - id: m-system-design
    title: System design, step by step
    summary: 'A method for designing systems, worked through real designs: a URL shortener, a feed, chat, payments.'
    minutes: 300
- name: Infrastructure and operations
  blurb: Linux, containers, Kubernetes, cloud, delivery, observability and reliability
  chapters:
  - id: m-linux
    title: Linux for engineers
    summary: Processes, permissions, the file system, networking tools and debugging a live machine.
    minutes: 180
  - id: m-containers
    title: Containers and Docker in depth
    summary: Images and layers, good Dockerfiles, Compose, and what a container really is.
    minutes: 240
  - id: m-kubernetes
    title: Kubernetes
    summary: Pods, deployments, services, configuration, scaling and health checks.
    minutes: 240
  - id: m-cloud-iac
    title: Cloud and infrastructure as code
    summary: Compute, storage, networks and identity in the cloud, and Terraform.
    minutes: 210
  - id: m-delivery
    title: Continuous delivery
    summary: Pipelines, trunk-based development, feature flags, blue-green and canary releases, and rollbacks.
    minutes: 180
  - id: m-observability
    title: 'Observability: logs, metrics and traces'
    summary: Structured logging, metrics (RED and USE), distributed tracing, OpenTelemetry, dashboards and alerts.
    minutes: 240
  - id: m-reliability
    title: Reliability engineering
    summary: SLIs, SLOs and error budgets, on-call, incident response and blameless postmortems.
    minutes: 180
- name: Security
  blurb: Building software attackers cannot easily break
  chapters:
  - id: m-appsec
    title: Application security and the OWASP Top 10
    summary: The OWASP Top 10 (2025 edition), including supply-chain failures, how each is exploited and prevented, and threat modelling.
    minutes: 240
  - id: m-identity
    title: Authentication and authorisation in depth
    summary: Sessions, tokens, OAuth 2.0, OpenID Connect, JWTs, and role- and attribute-based access control.
    minutes: 240
  - id: m-crypto
    title: Cryptography for engineers
    summary: Hashing, password storage, encryption, signatures, TLS and managing secrets.
    minutes: 180
- name: The engineer
  blurb: How great engineers work, grow and lead
  chapters:
  - git-teamwork
  - id: m-working-well
    title: How great engineers work
    summary: Breaking work down, estimating, communicating, writing, and working with product and design.
    minutes: 150
  - id: m-growth
    title: Growing from junior to senior and beyond
    summary: What changes at each level, learning new technology fast, reading source code, mentoring.
    minutes: 120
  - id: m-ethics
    title: Privacy, ethics and the law for engineers
    summary: Personal data, privacy law basics, accessibility duties, licences, and saying no.
    minutes: 90
  - ai-tools
  - id: m-projects
    title: The mastery projects
    summary: 'Build-it-yourself projects that prove each part: a key-value store, a message queue, a rate limiter, a full service.'
    minutes: 120
- name: Reference
  blurb: Checked books, courses and a glossary
  chapters:
  - id: m-library
    title: 'The library: the books and courses the best engineers recommend'
    summary: Each opened and checked.
    minutes: 30
  - id: m-glossary
    title: Glossary
    summary: Every term in this course, one sentence each.
    minutes: 15
