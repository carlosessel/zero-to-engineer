# Outline for Zero to Web Developer, approved 12 November 2026 (JavaScript back end).
# Parts are created one at a time with the add-course skill, so unfinished
# drafts never appear on the site. Created so far: parts 1 and 2.
# Lines that are only an id reuse an existing chapter unchanged.
course: web
title: "Zero to Web Developer"
tagline: "Read, build in the browser, do the exercises, pass the quiz."
description: "From your first web page to building, testing and deploying full web applications with HTML, CSS, JavaScript, React, Node and a database. No experience needed."
order: 3
parts:
  - name: "Start here"
    blurb: "What the job is, how the web works, and your tools"
    chapters:
      - id: web-the-map
        title: "What a web developer actually does"
        summary: "Front end, back end and full stack, what you will build in this course, and how to study it."
        minutes: 45
      - how-computers-work
      - terminal-files
      - id: web-setup
        title: "Set up your tools"
        summary: "A code editor, a browser's developer tools, Node.js and Git, installed and checked."
        minutes: 90
      - id: git-basics
        title: "Git from zero: saving your work"
        summary: "Commits, history, undoing mistakes and putting your work on GitHub."
        minutes: 150
      - internet
  - name: "HTML and CSS"
    blurb: "Building and styling pages that work for everyone, on any screen"
    chapters:
      - id: html-from-zero
        title: "HTML from zero: structure and meaning"
        summary: "Elements, headings, text, lists, links and images, and why the right tag matters."
        minutes: 180
      - id: html-forms-tables
        title: "Forms and tables"
        summary: "Collecting input from people and showing data in rows and columns."
        minutes: 150
      - id: web-accessibility
        title: "Accessibility: pages everyone can use"
        summary: "Screen readers, keyboards, alt text, contrast and labels, and how to test them."
        minutes: 150
      - id: css-from-zero
        title: "CSS from zero: selectors, colours and text"
        summary: "How CSS chooses elements, the cascade, colours, fonts and units."
        minutes: 180
      - id: css-box-model
        title: "The box model and positioning"
        summary: "Margins, borders, padding, sizing, and placing things where you want them."
        minutes: 150
      - id: css-layout
        title: "Layout with Flexbox and Grid"
        summary: "Rows, columns and whole page layouts without fighting the browser."
        minutes: 240
      - id: responsive-design
        title: "Responsive design"
        summary: "One page that works from a phone to a wide screen: media queries and flexible sizes."
        minutes: 150
      - id: design-basics
        title: "Design basics for developers"
        summary: "Spacing, alignment, type and colour choices that make a page look deliberate."
        minutes: 120
  - name: "JavaScript from zero"
    blurb: "Making pages respond: your first programming language"
    chapters:
      - id: js-values-variables
        title: "JavaScript from zero: values and variables"
        summary: "Numbers, text, true and false, storing values, and running code in the console."
        minutes: 210
      - id: js-logic-functions
        title: "JavaScript from zero: decisions, loops and functions"
        summary: "Making choices, repeating work, and naming pieces of work as functions."
        minutes: 240
      - id: js-arrays-objects
        title: "JavaScript from zero: arrays and objects"
        summary: "Lists and records of data, and the array methods you will use every day."
        minutes: 240
      - id: js-dom-events
        title: "Changing the page: the DOM and events"
        summary: "Finding elements, changing them, and responding to clicks and typing."
        minutes: 240
      - id: js-debugging
        title: "Debugging JavaScript"
        summary: "Reading errors, using the browser's debugger, and a method for finding bugs."
        minutes: 120
      - id: js-async-fetch
        title: "Waiting for things: promises, async and fetch"
        summary: "Getting data from other servers without freezing the page."
        minutes: 210
      - id: js-modules-tooling
        title: "Modules, npm and build tools"
        summary: "Splitting code into files, installing packages, and running a project with Vite."
        minutes: 150
  - name: "Front-end applications"
    blurb: "Building interfaces with React, and making them reliable"
    chapters:
      - id: react-basics
        title: "React from zero: components and props"
        summary: "Building an interface from small reusable pieces with JSX."
        minutes: 240
      - id: react-state-forms
        title: "State, events and forms in React"
        summary: "Keeping the screen in step with data, and handling what people type."
        minutes: 240
      - id: react-data-routing
        title: "Data, effects and pages in React"
        summary: "Loading data, loading and error states, and several pages in one app."
        minutes: 240
      - id: typescript-basics
        title: "TypeScript basics"
        summary: "Adding types to JavaScript so many mistakes are caught before the code runs."
        minutes: 180
      - id: js-testing
        title: "Testing JavaScript and React"
        summary: "Unit tests with Vitest, testing components, and what to test."
        minutes: 180
      - id: web-performance
        title: "Fast pages: web performance"
        summary: "Measuring load time, images, caching, and what makes a site feel fast."
        minutes: 120
  - name: "Back end and data"
    blurb: "Servers, APIs, databases and logging in, all in JavaScript"
    chapters:
      - id: node-basics
        title: "Node.js: JavaScript outside the browser"
        summary: "Running scripts, reading files, and how a server program differs from a page."
        minutes: 150
      - id: express-apis
        title: "Building an API with Express"
        summary: "Routes, JSON, status codes, validation, middleware and errors."
        minutes: 240
      - sql
      - data-modeling
      - id: node-postgres
        title: "Using a database from Node"
        summary: "PostgreSQL from your API: queries, parameters, migrations and transactions."
        minutes: 210
      - id: web-auth
        title: "Accounts and logging in"
        summary: "Sign-up, password hashing, sessions and cookies, and checking permissions on every request."
        minutes: 240
      - security
  - name: "Shipping"
    blurb: "Putting your work online and keeping it running"
    chapters:
      - id: web-deploy
        title: "Deploying a web application"
        summary: "Static hosting, hosting an API and database, environment variables, domains and HTTPS, and automatic deploys."
        minutes: 210
      - observability
  - name: "The job"
    blurb: "Working with others, the projects, and getting hired"
    chapters:
      - git-teamwork
      - teamwork
      - ai-tools
      - id: web-projects
        title: "The project ladder"
        summary: "Projects from a single page to a deployed full-stack application, each with a specification and a checklist."
        minutes: 60
      - career
  - name: "Reference"
    blurb: "Checked free materials and a glossary"
    chapters:
      - id: web-library
        title: "The library: checked free materials"
        summary: "The best free courses, documentation and books for each stage, each opened and checked."
        minutes: 30
      - id: web-glossary
        title: "Glossary"
        summary: "Every term in this course, one sentence each."
        minutes: 15
