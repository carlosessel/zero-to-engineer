# Outline approved 12 November 2026. Written in the order: claude, then mastery, then backend.
# Parts are created one at a time with the add-course skill. Created so far: parts 1 and 2.
course: claude
title: Mastering Claude and Claude Code
tagline: Use Claude like the people who build it.
description: How Claude works, prompting and the Claude apps, Claude Code from first session to skills, subagents, hooks, MCP and automation, and building on the Claude API.
order: 6
parts:
- name: How Claude works
  blurb: What is going on inside, and what follows from it
  chapters:
  - id: cl-the-map
    title: What mastering Claude means
    summary: The apps, Claude Code and the API, what each is for, and how this course is organised.
    minutes: 30
  - id: cl-how-it-works
    title: How Claude works, for people who use it
    summary: Tokens, the context window, training, why answers vary, and why it can be confidently wrong.
    minutes: 120
  - id: cl-models
    title: Choosing a model
    summary: 'Fable, Opus, Sonnet and Haiku: capability, speed, cost, effort settings, and picking one per task.'
    minutes: 60
- name: Using Claude well
  blurb: Prompting and the Claude apps
  chapters:
  - id: cl-prompting
    title: Prompting, properly
    summary: Clear instructions, context, examples, structure, asking for reasoning, and iterating on a prompt.
    minutes: 180
  - id: cl-apps
    title: The Claude apps in depth
    summary: Projects, files, artifacts (including Docs, Slides and Design), memory, connectors, skills, plugins and research.
    minutes: 120
  - id: cl-learning-with-claude
    title: Learning, writing and thinking with Claude
    summary: Using Claude as a tutor, editor and reviewer, and checking what it tells you.
    minutes: 90
- name: Claude Code
  blurb: From your first session to running a team of agents
  chapters:
  - id: cc-first-session
    title: Claude Code from zero
    summary: Installing it, your first session, how the agent loop and its tools work, and permissions.
    minutes: 120
  - id: cc-surfaces
    title: Claude Code everywhere
    summary: The terminal, VS Code and JetBrains, the desktop app, the web, your phone and Slack, and when to use each.
    minutes: 90
  - id: cc-context
    title: 'Context: CLAUDE.md, memory and long sessions'
    summary: Giving Claude Code the right context, project memory files, and managing a long conversation.
    minutes: 120
  - id: cc-workflows
    title: Workflows that work
    summary: Explore, plan, code, commit; plan mode; test-driven work; reviewing diffs; Git, branches and pull requests.
    minutes: 180
  - id: cc-settings
    title: Settings, permissions and commands
    summary: Settings files, permission rules and modes (including auto mode), sandboxing, slash commands, model and effort choice, and output styles.
    minutes: 120
  - id: cc-extending
    title: 'Extending Claude Code: skills, hooks and plugins'
    summary: Writing skills, running hooks on events, and packaging and sharing them as plugins through marketplaces.
    minutes: 240
  - id: cc-mcp
    title: Connecting tools with MCP
    summary: What the Model Context Protocol is, adding MCP servers, and writing your own.
    minutes: 180
  - id: cc-parallel
    title: Many agents at once
    summary: Subagents, agent teams, worktrees and parallel sessions, and dynamic workflows.
    minutes: 180
  - id: cc-automation
    title: Claude Code without you watching
    summary: Headless mode, GitHub Actions and GitLab CI, scheduled tasks and routines, and the Agent SDK.
    minutes: 180
  - id: cc-teams-safety
    title: 'Claude Code on a team: security and cost'
    summary: Shared and managed settings, AI code review and security scans, secrets, prompt injection, and watching cost and usage.
    minutes: 120
- name: Building on the Claude API
  blurb: Putting Claude inside your own software
  chapters:
  - first-call
  - id: cl-api-deep
    title: The Messages API in depth
    summary: Conversations, streaming, prompt caching, thinking and effort, batches, files, citations and vision.
    minutes: 240
  - tools
  - structured-output
  - id: cl-agents
    title: Building agents
    summary: Agent loops, workflows versus agents, when not to build one, the Agent SDK, and multi-agent patterns.
    minutes: 240
  - id: cl-context-engineering
    title: Context engineering for long-running agents
    summary: Compaction, context editing, memory, writing good tools, and harnesses that keep agents on track.
    minutes: 180
  - id: cl-managed-agents
    title: Managed Agents and Agent Skills
    summary: Running agents on Anthropic's hosted harness, and giving them skills through the API.
    minutes: 150
  - evals
- name: Mastery
  blurb: Judgement, safety and projects
  chapters:
  - id: cl-judgement
    title: 'Judgement: when to trust, check or not use Claude'
    summary: Verifying output, security of generated code, prompt injection, privacy, and keeping your own skills sharp.
    minutes: 120
  - id: cl-projects
    title: The mastery projects
    summary: Build a skill, an MCP server, a GitHub automation and an agent, each with a checklist.
    minutes: 60
- name: Reference
  blurb: Official material and a glossary
  chapters:
  - id: cl-library
    title: 'The library: Anthropic''s courses and guides'
    summary: Each opened and checked.
    minutes: 20
  - id: cl-glossary
    title: Glossary
    summary: Every term in this course, one sentence each.
    minutes: 10
