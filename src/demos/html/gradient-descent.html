<div class="widget">
<h3>Try it: one weight, one loss curve</h3>
<p class="hint">The curve is the loss for each value of the weight. The dot is your model. Press Step and watch it roll downhill. Then raise the learning rate past 1.0 and see what goes wrong.</p>
<canvas id="gdC" width="680" height="300" role="img" aria-label="Loss curve with the current weight shown as a dot"></canvas>
<div class="row">
<label>Learning rate <input type="range" id="gdLr" min="0.01" max="1.1" step="0.01" value="0.1"> <span class="read" id="gdLrV">0.10</span></label>
<button class="btn" id="gdStep">Step</button>
<button class="btn ghost" id="gdRun">Run 20 steps</button>
<button class="btn ghost" id="gdReset">Reset</button>
</div>
<p class="read" id="gdRead" style="margin:10px 0 0"></p>
</div>
