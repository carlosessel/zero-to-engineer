<div class="widget">
<h3>Try it: one line, two numbers</h3>
<p class="hint">Change the slope and the starting height. These two numbers are the “weights” of the simplest possible model.</p>
<canvas id="lnC" width="680" height="320" role="img" aria-label="Graph of a straight line"></canvas>
<div class="row">
<label>Slope m <input type="range" id="lnM" min="-3" max="3" step="0.1" value="1"></label>
<label>Height b <input type="range" id="lnB" min="-6" max="6" step="0.5" value="0"></label>
</div>
<p class="read" id="lnRead" style="margin:10px 0 0"></p>
</div>
