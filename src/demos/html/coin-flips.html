<div class="widget">
<h3>Try it: flip a coin many times</h3>
<p class="hint">Ten flips can easily give 70% heads. What happens after thousands? This is why small test sets give unreliable scores.</p>
<div class="bars" id="cnBars"></div>
<div class="row">
<button class="btn" data-flip="10">Flip 10</button>
<button class="btn ghost" data-flip="100">Flip 100</button>
<button class="btn ghost" data-flip="1000">Flip 1,000</button>
<button class="btn ghost" id="cnReset">Reset</button>
</div>
<p class="read" id="cnRead" style="margin:10px 0 0"></p>
</div>
