<div class="widget">
<h3>Try it: what will this cost?</h3>
<p class="hint">Enter your model’s real prices from the provider’s pricing page. The defaults are placeholders.</p>
<div class="row">
<label>Requests per day <input type="number" id="ccR" value="2000" min="0" style="width:110px"></label>
<label>Input tokens each <input type="number" id="ccI" value="3000" min="0" style="width:110px"></label>
<label>Output tokens each <input type="number" id="ccO" value="400" min="0" style="width:110px"></label>
</div>
<div class="row">
<label>Price per million input tokens ($) <input type="number" id="ccPI" value="3" min="0" step="0.01" style="width:90px"></label>
<label>Price per million output tokens ($) <input type="number" id="ccPO" value="15" min="0" step="0.01" style="width:90px"></label>
</div>
<p class="read" id="ccRead" style="margin:12px 0 0"></p>
</div>
