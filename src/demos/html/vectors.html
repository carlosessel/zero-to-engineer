<div class="widget">
<h3>Try it: two arrows</h3>
<p class="hint">Rotate arrow B. Watch the dot product reach its peak when the arrows line up, hit zero at a right angle, and go negative past it.</p>
<canvas id="vcC" width="680" height="320" role="img" aria-label="Two vectors and their dot product"></canvas>
<div class="row">
<label>Direction of B <input type="range" id="vcA" min="0" max="360" step="5" value="75"></label>
<label>Length of B <input type="range" id="vcL" min="1" max="4" step="0.5" value="3"></label>
</div>
<p class="read" id="vcRead" style="margin:10px 0 0"></p>
</div>
